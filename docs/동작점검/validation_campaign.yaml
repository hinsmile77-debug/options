# 검증 캠페인 — 표본이 찰 때까지 판정을 미루는 자리 (2026-08-18 신설)
#
# `hypotheses.yaml`과 **경계가 다르다**:
#
#     하루 뒤 판정할 수 있으면      -> hypotheses.yaml (구현일 -> 검증예정일 -> 상태)
#     표본이 며칠~몇 주 걸리면      -> 여기 (개시일 -> min_samples 도달 -> 판정)
#
# 두 축이 같은 질문을 다루면 서로 다른 사실을 말하게 된다(규약 A). 채널이 판정되면 결과를
# 가설로 이관하고 채널은 `상태: closed`로 닫는다.
#
# ## 규약 (`mahdi/ops/campaign.py`가 기계적으로 강제한다)
#
#   * **주장 규칙은 `비율` 또는 `관측`만.** 누적 건수에 임계를 걸면 그 지표는 «며칠 지났는가»를
#     재게 된다 — 규약 F가 하루 지표에 대해 막는 함정이 누적에서는 더 크다.
#   * **시장 상태 의존 지표는 `관측`으로만.** 누적해도 «오늘 시장이 어땠는가»의 함수라는 성질은
#     사라지지 않는다(규약 G).
#   * **경로가 없는 날은 표본에 안 넣는다.** 0으로 채우면 「못 쟀다」와 「쟀는데 0이다」가
#     뭉개진다(규약 C). 그래서 채널 개시일 이후에 생긴 지표도 안전하게 쓸 수 있다.
#   * 지표 경로는 일별 지표 json(`docs/동작점검/auto/*_지표.json`)에 실제로 있어야 한다 —
#     `tests/test_ops_campaign.py`가 막는다.
#   * **레버가 켜지는 날, 그 레버가 움직이는 지표를 주장으로 쓰는 채널은 닫고 새로 연다.**
#     (2026-08-19 신설 — 아래 C1이 그 첫 사례다.) 개시일 이후 코드가 바뀌면 그 이전 표본은
#     **다른 질문의 답**이다. 섞으면 `min_days`를 채워도 그 숫자가 무엇을 재는지 알 수 없다.
#     닫을 때는 `상태: closed` + `결과`를 반드시 남긴다 — `campaign.validate()`가 강제한다.
#   * **열린 채널 둘이 같은 주장 지표를 쓰지 않는다.** v1을 닫지 않은 채 v2를 열면 리포트가
#     같은 질문에 두 판정을 내고, 그때부터 어느 쪽이 유효한지 사람이 기억해야 한다.
#
# ## 운영 모드 — 상시(standing)
#
# 기한이 없다. 채널별로 `min_samples`에 도달한 시점에 개별 판정한다. 미륵이(futures)가 4주
# 캠페인을 상시로 전환한 이유가 그대로 적용된다 — `min_samples`짜리 채널 다수가 실측 도달속도
# 기준 수 주 스케일이라 "4주 뒤 확정한다"는 전제가 표본 현실과 맞지 않는다.
#
# ⚠ **Phase 1은 채널 2개로 시작한다.** 미륵이는 67개를 운영하는데 다수가 몇 달째 표본 미달이다.
# 표본 기아 경보(Phase 3) 전에는 5개를 넘기지 않는다.

channels:
  # ── C1 ─────────────────────────────────────────────────────────────────────
  # 2026-08-17-p1 반증의 후속. **이 채널이 이 제도를 도입한 직접 계기다.**
  - id: "strangle-delta-band-reach"
    개시일: 2026-08-18
    질문: "small_strangle_buy가 요구하는 |델타| 0.20~0.30이 구독 창(ATM±N) 안에 얼마나 들어오는가"
    배경: |
      2026-08-18 종일 실측: ENTER 345분 중 후보가 나온 것은 127분(36.8%)뿐이고, 후보 없음 218건
      중 **216건이 `small_strangle_buy`의 `delta_band[0.2,0.3]`** 실패였다. 선택기가 쓴 08-20 북의
      분당 실측은 설계 10레그 대비 4.2레그였고, 0.20~0.30 밴드 보유율은 콜 16.5% / **풋 4.8%**.
      (최초 등재는 반나절 집계였고 08-19에 종일 값으로 정정했다. 후보율은 19.5%->36.8%로 올랐는데
      밴드 보유율은 오히려 내렸다 — 둘이 반대로 움직인 것은 «어느 팔레트 셀이 열리는가»가
      후보율을 지배하기 때문이고, 그것이 이 채널이 걷어내야 할 교란변수다.)
      이 전략은 양 날개가 다 필요하므로 둘이 동시에 있어야 한다.

      후속이 셋으로 갈렸고 **하루치로 고를 수 없다**:
        (a) 구독 창을 넓힌다        — REST 예산 실비용(08-18 예산 컷 71건)
        (b) 밴드를 관측 가능 범위로 — 그 숫자가 곧 전략의 정의가 된다
        (c) 계측 불가로 기록하고 둔다
      이 채널은 그 셋 중 하나를 고를 **근거를 쌓는다**. 고르는 것은 사람의 일이고, 확정하면
      `decisions:`에 등재한다.
    표본:
      # 표본 = 진입 후보가 있었던 분. 그 분들에서만 선택기가 실제로 돌았다.
      metric: db.decisions.selected_instruments.enter_minutes
      min_samples: 1000
      # 단일일 쏠림 방지. 08-18 하루가 345분이므로 10일이면 대략 3,000분 규모가 된다 —
      # min_samples(1000)보다 넉넉해 «며칠 만에 우연히 찬 표본»으로 판정하지 않는다.
      min_days: 10
    판정:
      # 주장: 행사가를 못 찾아 후보가 비는 분의 비율. 08-18 종일 실측은 218/345 = 0.632였다.
      # 임계 0.30은 **숫자를 보기 전이 아니라 본 뒤에** 정한 값이 아니다 — 08-18 하루치를 이미
      # 봤으므로 그 사실을 밝힌다. 0.30은 "지금의 4/5에서 1/3 아래로 내려와야 창 문제가
      # 해소됐다고 본다"는 뜻이고, (a)를 적용했을 때의 성공 기준으로도 그대로 쓴다.
      - metric: db.decisions.selected_instruments.reason.no_strike_match
        rule: "비율 < 0.30"
        역할: 주장
      # 참고: 단축코드를 못 찾은 것과 행사가를 못 찾은 것은 다른 사건이다. 둘을 함께 봐야
      # "선택기가 못 골랐다"와 "마스터 조회가 실패했다"가 갈린다.
      - metric: db.decisions.selected_instruments.leg_count
        rule: "관측"
        역할: 참고
    상태: closed
    결정: null
    결과: |
      2026-08-19 종결 — **표본 2일로 닫는다. 사유는 둘이고, 둘째가 더 중요하다.**

      ① 체제가 갈렸다. 08-19에 계열 로테이션(`target_series`)이 켜지면서 목표 북이 규칙으로
         정해지기 시작했다. 개시일(08-18) 표본과 그 이후 표본은 다른 코드의 산물이다.

      ② **주장 지표가 교란돼 있었다 — 이쪽이 진짜 이유다.**
         `no_strike_match / enter_minutes`(주변 비율)는 «밴드가 창 안에 있는가»와 «팔레트가
         그 셀을 열었는가»를 **곱해서** 잰다. 실측:

             날짜    small_strangle_buy 시도  실패   조건부   주변비율
             08-18            216            216   100.0%    63.2%
             08-19             20             20   100.0%    22.5%

         주변 비율은 63.2% -> 22.5%로 급락했는데 **조건부는 두 날 다 100.0%로 미동도 없다.**
         움직인 것은 팔레트 구성뿐이었다. 같은 기간 08-20 북의 밴드 보유율은 오히려 나빠졌다
         (콜 16.5% -> **0.0%**, 풋 4.8% -> 13.2%) — 주변 비율이 좋아 보인 것과 정반대다.

      **그래서 질문은 이미 답이 나왔다**: `small_strangle_buy`는 현재 구독 창으로
      **236시도 중 236번 전부** 후보를 만들지 못했다(2거래일, 조건부 실패율 1.000).
      「표본 미달」이 아니라 **만장일치**다. 10거래일을 기다릴 이유가 없다.

      후속은 `strangle-delta-band-reach-v2`가 조건부 지표로 이어받는다. (a)/(b)/(c) 결정의
      근거는 이제 «밴드가 닿는가»가 아니라 «닿게 만들 값이 있는가»로 좁혀졌다.

  # ── C1-v2 ──────────────────────────────────────────────────────────────────
  # C1의 후속. **주변 비율을 조건부 비율로 바꾼 것이 유일하고 결정적인 차이다.**
  - id: "strangle-delta-band-reach-v2"
    개시일: 2026-08-19
    질문: "small_strangle_buy가 열린 분 중, 요구 델타 밴드(|δ| 0.20~0.30)를 못 찾는 비율은 얼마인가"
    배경: |
      C1(2026-08-19 종결)의 후속. C1은 분모를 ENTER 전체로 잡아 팔레트 구성이 지표를
      지배했다 — 여기서는 **그 전략이 실제로 열린 분**만 분모로 쓴다. 팔레트 구성이 약분된다.

      개시일을 08-19로 두는 이유는 두 가지가 겹친다: 계열 로테이션 체제가 그날 시작됐고,
      분모 지표(`strategy_attempts`)가 그날 EOD부터 일별 json에 실린다. 08-18 json에는
      그 경로가 없으므로 규약 C에 따라 자동으로 표본에서 빠진다 — 소급을 손으로 막을 필요가 없다.

      선등재 시점 기지 사실: 08-18·08-19 조건부 실패율은 **둘 다 1.000**이었다(216/216, 20/20).
    표본:
      # 분모 = 그 전략이 진입 후보로 열린 분. **이것이 C1과의 유일한 구조적 차이다.**
      metric: db.decisions.selected_instruments.strategy_attempts.small_strangle_buy
      # 로테이션 체제에서 시도는 하루 20건 안팎이다(08-19 실측). 150이면 대략 7~8거래일.
      min_samples: 150
      min_days: 5
    판정:
      - metric: db.decisions.selected_instruments.strategy_rejected.small_strangle_buy
        rule: "비율 < 0.30"
        역할: 주장
    상태: open
    결정: null

  # ── C2 ─────────────────────────────────────────────────────────────────────
  - id: "symbol-resolution-rate"
    개시일: 2026-08-18
    질문: "고른 (만기, 행사가, 콜풋)을 단축상품번호로 옮기는 비율의 정상 분포는 얼마인가"
    배경: |
      08-18 첫 실측은 100.0%(다리 312개 전부 해결)였다. 그러나 **하루치로는 정상 분포를 모른다** —
      종목 마스터의 만기 표기가 YYYYMM/YYMMW#이라 달력상 만기일과 대조할 수 없고, 북이
      롤오버되는 날 얼마나 빗나가는지가 아직 관측되지 않았다. 만기 주간을 최소 한 번은 넘겨야
      의미가 생긴다.
    표본:
      metric: db.decisions.selected_instruments.leg_count
      min_samples: 500
      min_days: 10
    판정:
      # **임계를 걸지 않는다(규약 G).** 정상 분포를 모르는 상태에서 하한을 걸면 그 하한이 곧
      # 결론이 된다. 롤오버 주간을 넘긴 분포를 보고 나서 임계를 정하거나, 정하지 않기로 한다.
      - metric: db.decisions.selected_instruments.leg_count
        rule: "관측"
        역할: 참고
    상태: open
    결정: null

# 확정 결정 레지스트리 — **판정(verdict)과 결정(decision)은 별개다.**
#
# 판정은 조치 여부와 무관하게 매일 재계산된다. 따라서 "불합격이 계속 뜬다"가 "미조치"를 뜻하지
# 않는다. 미륵이는 이 혼동으로 양방향 사고를 **둘 다 실제로 겪었다**:
#   ① 이미 이행된 권고를 신규 안건으로 오인해 결산 초안에 "승인 1순위"로 올림
#   ② 일부러 적용하지 않기로 한 불합격이 기록되지 않아 다음 세션이 적용을 재시도할 뻔함
#
# 결정을 여기 적으면 리포트가 그 채널 행에 📌를 붙인다.
# ⚠ 결정을 바꾸면 **여기와 `dev_memory/DECISION_LOG.md` 둘 다** 갱신할 것 — 미륵이는 이
# 레지스트리를 갱신하지 않아 **무효화된 수치가 3일간 사이징 축을 봉쇄**한 사고가 있었다(431차).
decisions: []
