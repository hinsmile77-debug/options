- id: "2026-08-04-p3-cycle-budget"
  구현일: 2026-08-04
  검증예정일: 2026-08-05
  가설: "read 타임아웃 4초 + 사이클 수집 예산 50초로 밀림과 미회수 결손이 준다 (대가로 얇은 사이클이 생긴다)"
  근거: "08-04 §2-6 — 느린 호출 362건의 총 2,278초 중 HTTP가 2,050초(90%)이고 페이서는 229초(10%).
        08-03 대비 페이서는 1,661→229초(-86%)로 무너졌는데 HTTP는 1,979→2,050초로 불변이다.
        밀린 사이클 48건의 REST수집 평균은 78.3초(레그당 3.9초, 정상 1.7초)였고,
        느린 호출 상위 5건이 전부 read 천장(10.0초)에 닿은 inquire-price였다."
  예측:
    - metric: overrun.count
      expect: "<= 25"
    - metric: cycles.missing.unrecovered_count
      expect: "<= 2"
  주의: "**이것은 교환이지 순수 개선이 아니다.** rows 20 미만 사이클이 새로 생겨야 정상이고
        (하나도 없으면 예산이 안 걸린 것이다), qualitative.read_timeout도 3건에서 늘어난다 —
        둘 다 회귀가 아니다. 반대로 rows<20이 사이클의 절반을 넘으면 임계가 너무 낮은 것이다."
  상태: pending

- id: "2026-08-04-p4-atm-hysteresis"
  구현일: 2026-08-04
  검증예정일: 2026-08-05
  가설: "ATM 히스테리시스(0.75칸)로 롤링 왕복이 사라지고, 신선도 창 5분으로 체인 스냅샷이 설계값에 가까워진다"
  근거: "08-04 §2-2 — 롤링 194회 중 70회(36%)가 즉시 왕복이었고, 사람이 읽는 7,539줄 중
        6,206줄(82%)이 그 churn이었다. **구현 후 08-04 스팟 시계열로 리플레이해 예측치를 정정했다**:
        히스테리시스는 롤링 182→131회 / 왕복 36→10회로 줄이지만 10분 창 안 행사가 수는
        전혀 안 바뀐다(오염 원인이 왕복이 아니라 스팟의 실제 이동거리였다).
        그래서 신선도 창을 10→5분으로 함께 조였다 — 먼슬리 단독 중앙 레그 14→12(설계값 10)."
  예측:
    - metric: db.signal_reach.chain_age_seconds_max
      expect: "<= 450"
    - metric: log_volume.human_lines
      expect: "<= 6500"
  주의: "**보고서 §5의 최초 예측(롤링 ≤60회, 로그 ≤2,800줄)은 리플레이로 반증돼 폐기했다** —
        숫자를 보기 전에 적는다는 규약은 지키되, 배포 전에 검증할 수 있으면 검증하고 정정한다.
        롤링 횟수 자체는 자동 지표에 없으므로 로그의 `ATM 롤링` 건수를 손으로 셀 것(예측 130±20회)."
  상태: pending

- id: "2026-08-04-p5-kis-latency-rule"
  구현일: 2026-08-04
  검증예정일: 2026-08-06
  가설: "KIS 응답시간 p95를 시간대별로 재면 매일 반복되는 혼잡 구간이 드러난다"
  근거: "08-04 §2-6 — 느린 호출 362건의 총 2,278초 중 HTTP가 2,050초(90%)이고, 08-03 대비
        페이서는 1,661→229초(-86%)로 무너졌는데 HTTP는 1,979→2,050초로 불변이다. 즉 남은 밀림은
        우리 스케줄이 아니라 KIS 응답 지연에서 온다. 그런데 지금 리포트는 그 지연을 우리 지표
        (밀림 건수)로만 본다 — slow_calls는 임계(5초) 위 꼬리만 보므로 p50을 알 수 없다.
        08-04 시간대 분포: 느린 호출 362건 중 13~15시가 280건(77%), 밀림 48건 중 36건(75%)."
  예측:
    - metric: rest_latency.endpoints.inquire-price.p95
      expect: "수기 판정"
    - metric: rest_latency.warnings
      expect: "수기 판정"
  주의: |
    **이 가설은 하루로 판정하지 않는다** — "매일 반복되는가"가 가설의 내용이므로 최소 이틀이
    필요하다(그래서 검증예정일이 08-06이다).

    **사전 대응 규칙(숫자를 보기 전에 확정한다)**:
      `inquire-price`의 p95가 2.5초를 넘는 시간대가 **이틀 연속 같은 시간대에** 나타나면,
      그 시간대에 한해 위클리 폴링을 2분 → 4분 격분으로 늘린다.
      **먼슬리는 건드리지 않는다** — 판단 입력이다(07-31에 ATM±2→±1을 "판단 입력을 훼손하는
      안"이라며 보류한 것과 같은 원칙: 총량 축소보다 손실이 작은 순서로 간다).

    2.5초 근거: 정상 호출은 페이서 포함 ~1.2초다. p95가 2.5초면 스무 번에 한 번꼴로 정상의
    두 배 넘게 걸린다는 뜻이고, 그 구간에서는 20레그 x 2.5초 = 50초로 Fix#8의 사이클 예산을
    전부 써버린다.

    **자동 적응은 의도적으로 구현하지 않았다.** 지연을 보고 폴링을 줄이면 폴링이 줄어 지연이
    낮아지고 다시 폴링이 느는 되먹임이 생긴다 — 2026-07-08에 페이서를 나눴다가 500 폭주로
    203분을 잃은 전례가 있다. 규칙의 발동은 사람이 한다.
  상태: pending
