    ⚠ **한 분이라도 회복되면 구간은 끊긴다.** 08-14의 사람 보고서는 14:00~15:23을 「84분」으로
    적었지만(14:32 한 분만 행이 남았다) 이 지표는 같은 날을 **32분 + 51분**으로 가른다.
    엄격해 보이는 쪽이 맞다 — 신선도 창이 5분이라 14:32의 행은 그 뒤 5분간 판단에 실제로 실린다.
    이 값이 재는 것은 「0행이 이어진 길이」가 아니라 **「판단이 체인을 못 본 길이」**다.
    ⚠ 이 값은 **KIS 상태에 비례한다.** 부등식을 걸지 않는다(규약 F) — 존재와 인쇄만 예측한다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-18에서 사흘 지남, 소급 적용 금지).**

    **주장 자체는 08-21에 충족됐다**: `db.chain_minute_coverage.zero_row_longest_run` =
    **26분(15:05~15:30)**으로 임계 20분을 당일 처음 넘겼다. 이 축이 없었다면 같은 하루가
    「0행 118분이 흩어져 있다」로만 보였을 것이다(총합 118분 / 494분).
    예정일이 지났으므로 소급 확정하지 않는다. 재등재는 새 id로.
