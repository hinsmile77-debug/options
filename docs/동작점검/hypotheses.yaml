  #
  # 08-25는 개시 주간이 끝난 다음 거래일이다. 그때 켜려면 그 전에 **CONFIRM 모드로 체결이
  # 실측돼 있어야** 한다(`recent_slippage_elevated`가 처음으로 사실을 갖는 시점이기도 하다).
