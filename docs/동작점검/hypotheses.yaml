- id: "2026-08-26-p1-3-preemptive-rule-fires-at-premarket"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    사전 대응 규칙(`2026-08-04-p5-kis-latency-rule`)의 **발동 시점이 규약 문구 안에 박힌다** —
    「조건이 성립한 **다음 거래일 장전(07:30 기동 전)**에 발동한다. 장중 발동은 하지 않는다」.
    조건 성립 다음 거래일 **장전** 보고서가 그 시간대를 인용한다.
  대가: |
    레버가 실제로 채워진 날 **그 시간대의 `weekly_*` 커버리지가 떨어진다.** 위클리 폴링을
    2분 → 4분으로 늘리는 것이 이 규칙의 조치이므로 커버리지 하락은 **회귀가 아니라 대가**다.
    2026-08-26 기준선 — `weekly_mon` **45.9%** · `weekly_thu` **46.4%**.
  근거: |
    08-26 §1-8 — **오늘이 네 번째로 조건이 성립한 날이고, 네 번 다 발동하지 않았다.**
    미룬 것이 아니라 **그 결정을 내릴 수 있는 시각이 하루에 한 순간도 없었다**: 조건은
    「이틀 연속 같은 시간대」이고 그 판정이 나오는 시각은 장후 지표(15:46)인데, 그때 그
    시간대는 **언제나 과거**다. 규칙은 08-04에 만들어진 뒤 3주째 한 번도 발동한 적이 없다.

    가설 `2026-08-25-p5-rule-holds-for-one-more-day`가 「08-26에도 성립하면 그날 발동한다」를
    숫자 보기 전에 적어 뒀고 **오늘 그 조건이 찼다**(이틀 연속 11구간). 발동 의무는 발생했고,
    발동이 불가능한 것은 규칙의 문법 문제다 — 그래서 고치는 것은 임계가 아니라 **발동 창**이다.

    ⚠ **「예열 89분」을 근거로 복사하지 않았다** — 1-19로 정정됐다. 그 숫자는 기동 시각의
    함수이고(08-26은 07:44 기동 → 89분, 08-25는 07:30 기동 → 103분, **둘 다 09:15:00에 끝났다**),
    **장중 재기동의 예열 대가는 봉 30개(약 30분)다.** 틀린 근거가 규약 안에 굳는 것을 막는다.
  예측:
    - metric: rest_latency.warnings
      expect: "수기 판정 — 조건이 성립한 **다음 거래일 장전** 보고서가 그 시간대를 인용하고, 발동 여부를 그 자리에서 정하는가"
      역할: 주장
    - metric: db.book_coverage
      expect: "수기 판정(대가) — 레버가 채워진 날 그 시간대의 `weekly_*` 커버리지 하락폭. 08-26 기준선 weekly_mon 45.9% · weekly_thu 46.4%"
      역할: 대가
  주의: |
    ⚠ **이 항목이 바꾸는 것은 「언제 물어보는가」이지 「누가 누르는가」가 아니다.**
    자동 발동은 여전히 하지 않는다 — 2026-07-08에 페이서를 나눴다가 500 폭주로 203분을 잃었다.
    ⚠ **레버를 채우는 것은 별건이다.** 이 커밋은 규약 문서(`hypotheses.yaml` 주의 절 ·
    `tools/phases.md` A절 · `mahdi/main.py` 상수 주석) 셋만 고친다. `OPTION_CHAIN_SLOW_SERIES_
    CONGESTED_HOURS`는 `{}` 그대로다 — 채울지는 **다음 거래일 장전이 정한다**(사용자 조치 10).
    ⚠ 조건이 성립하지 않은 날은 이 항목이 판정 불가다(규약 C) — **반증이 아니다.**
  상태: pending

- id: "2026-08-26-p1-4-latency-pressure-is-logged-live"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    창 집계가 `p50 ÷ read timeout`을 **그 자리에서** 판정해 로그에 남긴다 — `>= 0.8`이면
    WARNING, `>= 1.0`이면 ERROR. **다음에 0.8을 넘는 날, 그 회차 보고서가 「프로그램이
    HH:MM에 먼저 경고했다」를 인용한다.**
  대가: |
    그날 추가되는 줄이 **하루 30줄을 넘지 않는다**(`qualitative.rest_latency_pressure`).
    30줄을 넘으면 억제가 안 듣는 것이다 — 오늘처럼 18창 연속인 날에 18줄이 아니라
    「등급 전환 시 1줄 + 5분마다 1줄」이어야 한다.
    ⚠ **전용 축으로 잰다.** `log_volume.by_level.WARNING`은 여러 fix가 공유하는 축이라
    어느 쪽도 검정하지 못한다(규약 E — 08-25 §6-6이 정확히 그 자리에서 걸렸다).
  근거: |
    08-26 §1-12 — `p50 ÷ timeout`이 **13:34 0.74 → 13:44 0.89(경고선) → 14:04 1.01(제한시간
    추월) → 14:34 1.18**로 갔고, 14:01~15:25는 **85분 연속 rows=0**이었다.
    **프로그램은 이 값을 창마다 계산하면서 문턱을 갖고 있지 않았다.** 로그 어디에도 그
    사실이 없어, 사람이 15:46 TSV로 표를 만들어야만 보였다 — 예고(13:44)에서 확정(15:46)까지
    **122분**이 걸렸다. **13:44:45에 이 줄이 찍혔다면 회복까지 102분을 예고로 갖고 있었을 것이다.**

    임계는 새로 정하지 않는다 — `REST_LATENCY_P50_TIMEOUT_RATIO_WARN = 0.8`이 08-14 §2-2에서
    이미 정해져 `report._render_p50_timeout_cross`와 증거 수집기가 쓰고 있다. **없던 것은
    계측도 임계도 아니라 「장중에 그 값을 보는 자리」다**(08-25 P1-1과 같은 형태).
  예측:
    - metric: qualitative.rest_latency_pressure
      expect: "0 ~ 30"
      역할: 대가
    - metric: qualitative.rest_latency_pressure
      expect: "수기 판정 — 0.8을 넘는 창이 있던 날, 그 줄이 **그 창 시각에** 찍히고 회차 보고서가 그것을 인용하는가"
      역할: 주장
  주의: |
    ⚠ **돌파가 0건인 날은 주장 축이 판정 불가다**(규약 C) — 넘을 것이 없었던 날을 「막았다」로
    세지 않는다. **대가 축은 그런 날에도 성립한다**(0 <= 30). 두 축의 판정 조건이 다르다.
    ⚠ **0이 인쇄돼야 한다** — `_QUALITATIVE_ALWAYS_PRESENT`에 등록한다(규약 C).
    ⚠ **레벨을 계측의 정체성으로 쓰지 않는다.** 이 줄은 등급에 따라 WARNING/ERROR로 갈리므로
    파서는 문구(`지연 경고선 돌파`)로만 센다 — 08-04에 WARNING→INFO 강등으로 362건이 0건이
    된 그 자리다.
    ⚠ **호출수를 같은 줄에 싣는다.** 08-26에 창당 호출이 90건대 → 45건으로 반토막 났고,
    그것 없이는 「검열률 71%」가 무엇의 71%인지 모른다.
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-08-31 확정(08-31 장후 §3-6 판정 제안 그대로) — **오늘이 이 fix가 기다리던 날이다.**
    0.8을 넘는 창이 실제로 났고(`14:10` 창 **0.86배**), 프로그램이 **그 창 시각에** WARNING을,
    15:05에 ERROR를 남겼다. 그리고 **14:30 회차 보고서가 `14:10`을 실제로 인용했다** —
    주장의 검정 조건("다음에 0.8을 넘는 날, 그 회차 보고서가 「프로그램이 HH:MM에 먼저
    경고했다」를 인용한다") 그대로다(→ 08-31 §3-2).
    대가 축도 성립 — 억제가 들어 하루 30줄을 넘지 않았다.
    ⚠ 검증예정일(08-27)에서 4일 밀렸다. 밀린 원인은 이 fix가 아니라 **08-27~08-28 점검 회차
    6개 결번**(08-31 §1-1)이다.
  상태: confirmed

- id: "2026-08-26-p1-5-a-dropped-alert-leaves-a-line"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    Slack 토글이 꺼져 있어 **버려지는 경보가 로그에 한 줄을 남긴다.**
    토글이 꺼진 날 워치독이 DEGRADED로 경보를 낸 회차 수와 `qualitative.alert_suppressed_toggle_off`
    건수가 **같다**(2026-08-26 기준선 **8건**).
  대가: |
    전용 축으로 잰다 — `qualitative.alert_suppressed_toggle_off`가 **하루 30줄을 넘지 않는다.**
    ⛔ `log_volume.by_level.INFO`로 재지 **않는다**. 공유 축은 이 fix를 검정하지 못한다(규약 E).
  근거: |
    08-26 §1-17 — `watchdog_observation_loop.py:454`가 `notify.notify_sync(…, level="CRITICAL")`을
    호출했고 `liveness.ALERT_COOLDOWN_SECONDS=600`으로 DEGRADED 77분 동안 **8회 발동**했다
    (`.watchdog_state.json`의 `last_alert_at`이 14:30:02 → 15:23:02으로 움직인 것이 증거다).
    `mahdi/notify.py`의 `if not enabled: return`이 **로그 한 줄도 안 남기고** 그 8건을 버렸다.

    ⛔ **Slack 토글을 켜는 것이 아니다.** `NEXT_TODO.md`의 「Slack 알림 — 2026-08-01 결정,
    보류 유지. **매 점검 보고서에서 다시 올리지 말 것**」은 그대로다. 14:30 회차의 P0-1이
    그 항목을 되살렸고(08-19 장후 §4 Fix#1에 이어 **두 번째**) 장후 회차가 그것을 폐기했다.
    **이 fix는 「안 울린 것」을 「안 울린 채 기록되는 것」으로 바꿀 뿐이다.**

    ⚠ 리포트가 지목한 줄 번호(57행·94행)는 실제로 **58행·91행**이었다. 착수 전 코드 확인으로
    바로잡았다 — 자리는 같다(`notify()`와 `notify_sync()`의 토글 분기).
  예측:
    - metric: qualitative.alert_suppressed_toggle_off
      expect: "0 ~ 30"
      역할: 대가
    - metric: qualitative.alert_suppressed_toggle_off
      expect: "수기 판정 — 토글이 꺼진 날 이 값이 그날 경보 발동 회차 수와 같은가(08-26 기준선 8건)"
      역할: 주장
    - metric: db.slack_alerts.enabled
      expect: "수기 판정(참고) — `false`여야 한다. `true`가 되면 2026-08-01 보류 결정이 깨진 것이다"
      역할: 참고
  주의: |
    ⚠ **경보가 0건인 날은 주장 축이 판정 불가다**(규약 C). 그런 날에도 **키는 0으로 인쇄된다** —
    `_QUALITATIVE_ALWAYS_PRESENT`에 등록하는 이유가 그것이다. 「안 울렸다」와 「안 셌다」를 가른다.
    ⚠ **폭주 시 소음이 되지 않게 level별 5분 억제를 함께 건다.** 억제된 건수는 그 줄에 함께
    싣는다 — 억제가 지표를 먹으면 이 fix가 스스로를 눈멀게 한다(08-06 Fix#4의 형태).
    ⚠ **`is_configured`가 거짓인 환경에서는 이 줄이 아예 안 찍힌다** — 그때는 토글 이전에
    `.env`가 비어 있는 것이고 다른 사건이다. 2026-08-26 기준 이 PC는 `is_configured=True` ·
    `slack_alert_settings.enabled=false`라 **토글 분기가 실제로 도는 자리가 맞다**(착수 전 확인).
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-08-31 — **`untested`. 경로가 안 돌았다**(08-31 장후 §3-6 판정 제안 그대로).
    `qualitative.alert_suppressed_toggle_off = 0`이다. 그런데 **오늘 워치독이 DEGRADED를 낸
    회차가 0회**다(08-31 지표 §11-1). **울릴 것이 없어서 0이지 안 남겨서 0이 아니다** —
    08-26 기준선 8건은 그날 경보가 8회 났기 때문이다.
    ⛔ **`refuted`가 아니다**(규약 C). 이 fix는 **경보가 나는 날에만** 검정된다.
    갈리는 날: 워치독이 다시 DEGRADED를 내는 날.
  상태: untested

- id: "2026-08-26-p1-6-report-checks-subscribed"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    자동 리포트 §16-3의 조기 반환이 `subscribed`를 함께 본다 —
    **`subscribed > 0`인 날의 §16-3이 구독 성립 횟수를 인쇄한다.**
  대가: |
    `subscribed = 0 · not_configured = 1`인 날의 §16-3 문자열이 **08-25 것과 완전히 동일하다.**
    **그것이 이 fix의 회귀 판정선이다** — 한 글자도 바뀌면 안 된다.
  근거: |
    08-26 §1-16 — `mahdi/ops/report.py:2232`의 `if not_configured and total == 0:`이
    `subscribed`(=9)를 **2221행에서 읽어 놓고 안 썼다.** 그래서 오늘 **아홉 번 구독에
    성공한** 체결통보 통로를 「**구독하지 않았다**」로 정반대로 인쇄했다.
    같은 함수의 독스트링이 *"로그의 구독 성립 줄이 그 구분이다"* 라고 적혀 있는데
    **코드가 그 지시를 안 따랐다.**

    08-24·08-25까지는 `subscribed = 0`이라 **분기가 우연히 옳았고**, 오늘 07:44 재기동으로
    처음 「둘 다 참」인 날이 되면서 드러났다. 오늘은 기동 중 설정이 바뀐 날이라 경고 1건과
    구독 9회가 **같은 날에 공존한다** — 경고 줄은 재기동 **이전**의 사실이다.

    이것이 고도화 3이 말하는 형태의 **네 번째 사례**다(조건 A만 보고 판정하는데 진짜 조건은 A AND B).
  예측:
    - metric: qualitative.order_notice_subscribed
      expect: ">= 1"
      역할: 참고
    - metric: db.order_notices.notices
      expect: "수기 판정 — `subscribed > 0`인 날 §16-3이 「구독하지 않았다」를 인쇄하지 **않는가**"
      역할: 주장
    - metric: db.order_notices.notices
      expect: "수기 판정(대가) — `subscribed = 0 · not_configured = 1`인 날의 §16-3 문자열이 08-25와 **완전히 동일한가**"
      역할: 대가
  주의: |
    ⚠ **대가 축이 이 fix의 본체다.** 회귀 테스트(`tests/test_ops_report_order_notices.py`)가
    두 케이스를 함께 고정한다 — `(not_configured=1, subscribed=0, total=0)`에서 옛 문자열이
    그대로 나오고, `(not_configured=1, subscribed=9, total=0)`에서 「구독하지 않았다」가
    나오지 않는다. **오늘이 후자의 첫 실물이다.**
    ⚠ **경고 줄을 지우지 않는다.** `not_configured`가 1인 것은 그날 첫 기동의 사실이고,
    지우면 「기동 중 설정이 바뀌었다」를 다음 사람이 못 읽는다.
    ⚠ 이 fix는 **재기동이 필요 없다** — 리포트 렌더링은 장후에 따로 돈다.
  검정: |
    2026-08-31 확정(08-31 장후 §3-6 판정 제안 그대로) — `qualitative.order_notice_subscribed = 9`
    이고 지표 §16-3이 **`통보 0건 · 구독 성립 9회 · 스트림 끊김 8회`**를 인쇄했다.
    「구독하지 않았다」로 **조기 반환하지 않았다** — 주장 그대로다.
    ⚠ 대가 축(`subscribed = 0 · not_configured = 1`인 날의 문자열 동일성)은 오늘 그 조합이
    안 나와 **이 날짜로는 검정되지 않았다.** 그 자리는 회귀 테스트
    `tests/test_ops_report_order_notices.py`가 대신 고정하고 있다.
  상태: confirmed

- id: "2026-08-26-p2-1-lever-warning-needs-both-conditions"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    증거 §7의 레버 경고가 「무조건발동일이 지났다」**AND**「레버가 아직 꺼져 있다」 둘 다일
    때만 `⚠`를 단다. **레버가 이미 켜져 있으면 `⚠`가 아니라 `(발동 완료 · 날짜 정리 필요)`**다.
  대가: |
    **경고를 없애는 것이 아니라 등급을 내리는 것이다.** 레버가 **꺼져 있고** 날짜가 지난
    항목의 `⚠`는 그대로 남는다 — 그 경우까지 조용해지면 이 fix가 진짜 미발동을 덮는다.
  근거: |
    08-26 §1-3 — **다섯 회차 연속** 같은 오탐이 떴다. `use_effective_member_count`는
    **이미 `true`로 켜져 있는데**(수집기가 그 값을 파싱까지 하고 있다) 무조건발동일만 보고
    「발동 안 됨 ⚠」을 낸다. 고도화 3이 정리한 네 사례 중 **2번**이 이것이다.

    ⚠ **예측치 줄은 리포트가 따로 두지 않았다** — 위 「가설」·「대가」는 리포트 P2-1 본문의
    문장(*"켜져 있으면 `⚠` 대신 `(발동 완료 · 날짜 정리 필요)`. **경고를 없애는 것이 아니라
    등급을 내리는 것이다**"*)을 그대로 옮긴 것이다. 새로 지어낸 것이 아니다.
  예측:
    - metric: levers.levers
      expect: "수기 판정 — 켜진 레버의 무조건발동일 경과 항목이 `⚠`가 아니라 `(발동 완료 · 날짜 정리 필요)`로 인쇄되는가"
      역할: 주장
    - metric: levers.levers
      expect: "수기 판정(대가) — **꺼진** 레버의 날짜 경과 항목은 `⚠`가 그대로 남는가"
      역할: 대가
  주의: |
    ⚠ **레버 값 표기가 섞여 있다** — yaml 불리언(`true`)과 파이썬 상수(`None` = OFF)를
    **같은 판정 함수로 읽지 않는다.** `None`은 「꺼짐」이고 `false`도 「꺼짐」이지만
    `{}`(빈 dict)와 `0`은 레버마다 뜻이 다르다.
    ⚠ 켜진 레버가 하나도 없는 날은 주장 축이 판정 불가다(규약 C).
  검정: |
    2026-08-31 확정(08-31 장후 §3-6 판정 제안 그대로) — 증거 §7이 **켜진** 레버
    `use_effective_member_count`에 `⚠`가 아니라 **`(발동 완료 · 날짜 정리 필요)`**를 달았고,
    **꺼진** 레버 E에는 무조건발동일 `2026-09-01 (D+1)`을 그대로 남겼다.
    두 축이 함께 성립했다 — **다섯 회차 연속이던 오탐이 멎었다**(08-26 §1-3).
  상태: confirmed

- id: "2026-08-26-p2-2-watchdog-state-says-what-it-holds"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    `.watchdog_state.json`이 **자기가 무엇을 담는지 스스로 말한다** — `note` 키 하나로
    「이상(DEGRADED/RESTART)이 있었던 마지막 회차의 상태다」를 파일 안에 적는다.
  대가: |
    **정상일 때도 쓰지는 않는다**(권고 (나) 유지). 쓰기 빈도가 늘지 않는다 —
    파일 크기만 `note` 한 줄만큼 는다.
  근거: |
    08-26 §1-5 — 두 회차가 이 파일의 날짜를 「오늘 워치독이 돌았는가」로 읽어 오독했다.
    **문제는 파일이 아니라 읽는 쪽이 그 뜻을 몰랐다는 것**이다: 오늘 그 파일은 필요할 때
    정확히 갱신됐다(14:10 첫 DEGRADED). 「오늘 돌았는가」는 `.watchdog_last_check.json`이 답한다.
    고도화 3이 정리한 네 사례 중 **3번**이 이것이다.

    ⚠ **예측치 줄은 리포트가 따로 두지 않았다** — 위 문장은 리포트 P2-2 본문의 `note` 문구와
    「**권고는 (나) 유지 — 정상일 때도 쓰지 않는다**」를 그대로 옮긴 것이다.
  예측:
    - metric: watchdog.checks
      expect: "수기 판정 — `.watchdog_state.json`에 `note` 키가 실리고, `tools/evidence_map.md`가 두 파일의 차이를 한 줄로 적는가"
      역할: 주장
    - metric: watchdog.silence_over_cadence_ratio
      expect: "<= 1.5"
      역할: 대가
  주의: |
    ⚠ **DEGRADED가 0건인 날은 파일이 안 갱신된다** — 그날 `note`가 없다고 반증이 아니다(규약 C).
    ⚠ 대가 축 `silence_over_cadence_ratio`는 「워치독 자신이 느려지지 않았는가」다 —
    `2026-08-25-fix8-v2`가 쓰는 축과 같고, 그 항목이 이 축의 상한 1.5를 이미 근거지었다.
  검정: |
    2026-08-31 — **`untested`. 경로가 안 돌았다**(08-31 장후 §3-6 판정 제안 그대로).
    `note` 키는 코드에 **이미 있다**(`scripts/watchdog_observation_loop.py:232`). 그런데
    `.watchdog_state.json`은 최종수정이 **2026-08-26 15:26**이고 `note`가 없다 — 이 파일은
    **이상(DEGRADED/RESTART)이 있을 때만 다시 쓰이는데** 08-27 이후 이상이 0건이다.
    ⛔ **`refuted`가 아니다** — 위 「주의」가 미리 적어 둔 그 경우다(규약 C·H와 같은 논리).
    갈리는 날: 워치독이 처음 DEGRADED나 RESTART를 내는 날.
  상태: untested

- id: "2026-08-26-p2-3-tick-rule-fallback-is-counted"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    「체결 분류가 추정치였던 분」이 **세어진다** — `qualitative.tick_rule_fallback`이 매일 실리고,
    증거 §5-3 「계측 부재」 표에 한 줄로 올라온다.
  대가: |
    **이상점으로 올리지 않는다.** 이 값은 만성이므로 0이 아니어도 적신호가 아니다 —
    기준선은 **08-25 56건 · 08-26 46건**이고, **어제가 더 많다.**
  근거: |
    08-26 §1-7 — `mahdi/main.py:1817`의 「체결 분류: … **틱 룰 추정으로 폴백**(거래소 누적
    필드 없음 또는 자기검증 실패)」가 하루 46건 났는데 **어느 지표에도 그 수가 없었다.**
    장후 회차가 이틀치 로그를 손으로 훑어 08-25 56건을 확인했고, **그 확인은 오늘이 아니면
    영영 못 했다**(로그는 이틀치만 남는다). 만성으로 확정됐으니 **계측만 붙인다.**

    ⚠ **예측치 줄은 리포트가 따로 두지 않았다** — 위 「대가」는 리포트 P2-3 본문의
    「⛔ **이상점으로 올리지 않는다. 만성이다**」와 기준선 두 수를 그대로 옮긴 것이다.
  예측:
    - metric: qualitative.tick_rule_fallback
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.tick_rule_fallback
      expect: "수기 판정(대가) — 이 값이 08-25 56건 · 08-26 46건 언저리에 머무는가. 급증하면 그때는 계측이 아니라 체결 분류를 봐야 한다"
      역할: 대가
  주의: |
    ⚠ **`>= 0`은 경로 생존 확인이다**(규약 F가 통과시키는 형태) — 건수 자체는 그날 KIS 응답
    형태에 비례한다(규약 G). **0인 날에도 키가 인쇄돼야** 「폴백이 없던 하루」와 「그 줄이
    없던 버전」이 갈린다(규약 C) → `_QUALITATIVE_ALWAYS_PRESENT`에 등록한다.
    ⚠ 이 줄은 `mahdi.main`이 WARNING으로 낸다 — **레벨을 파서에 고정하지 않는다**(08-04의 교훈).
  검정: |
    2026-08-31 확정(08-31 장후 §3-6 판정 제안 그대로) — `qualitative.tick_rule_fallback = 92`가
    실렸고 증거 §5-3 표에 한 줄로 올라왔다. 주장(계측이 붙었다) 그대로다.
    **대가 축은 「관측 계속」으로 단다** — 08-25 56 · 08-26 46 대비 **92는 약 2배**지만,
    급증이라 보기엔 그날 체결 분포에 비례한다(규약 G). 이 축이 임계를 갖지 않는 이유가 그것이다.
    ⚠ 92가 다시 두 배가 되는 날에는 계측이 아니라 **체결 분류 자체**를 본다.
  상태: confirmed

- id: "2026-08-26-p2-4-stream-down-counter-splits-streak-and-day"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    체결통보 끊김 줄이 `(연속 N회 · 오늘 M회)`를 싣는다 — 재연결 성공에 리셋되는 것은
    **연속만**이다. **하루 마지막 끊김 줄의 `오늘 M회`가 당일 끊김 줄 수와 같다**
    (2026-08-26 기준선 **8**).
  대가: |
    **기존 파서가 안 깨진다** — `qualitative.order_notice_stream_down`은 부분문자열
    「체결통보 스트림 끊김」으로 세므로 **그 문구는 그대로 두고 괄호 안만 바꾼다.**
    옛 이틀치 줄과 새 줄이 같은 축에 쌓인다.
  근거: |
    08-26 §1-9 — 오늘 끊김 8건이 전부 `누적 N회`만 실었고, 그 값이 **연속인지 누적인지
    줄만 봐서는 몰랐다.** 오늘은 재연결이 8/8 매번 2초에 성립했으므로 「연속」은 언제나 1인데
    「누적」은 8까지 갔다 — **두 수가 한 이름을 쓰고 있었다.**

    ⚠ **이것은 임계 완화가 아니다.** 대가 임계(하루 5건)는 그대로 두고 **「무엇을 재는가」를
    나눈다** — 리포트 결정 14가 *"바꾸는 것은 임계값이 아니라 「무엇을 재는가」여야 한다"*로
    권고한 (A)의 재료를 만드는 것이 이 항목이다. 임계 재정의 자체는 사람의 결정이다.

    P1-1(재연결 사건의 시작·끝 로깅)이 **같은 로그 줄을 건드리므로 한 커밋으로 묶는다** —
    따로 하면 같은 줄을 두 번 고친다.
  예측:
    - metric: qualitative.order_notice_stream_down
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.order_notice_stream_down
      expect: "수기 판정 — 하루 마지막 끊김 줄의 `오늘 M회`가 그날 끊김 줄 수와 같은가(08-26 기준선 8)"
      역할: 주장
    - metric: qualitative.order_notice_stream_down
      expect: "수기 판정(대가) — 꼬리표가 바뀐 날에도 옛 줄과 같은 축으로 세어지는가"
      역할: 대가
  주의: |
    ⚠ **끊김이 0건인 날은 주장 축이 판정 불가다**(규약 C) — 그날은 볼 줄 자체가 없다.
    ⚠ **`오늘 M회`는 프로세스 생애 기준이다.** 재기동하면 0으로 돌아간다 — 그 사실을
    로그 문구가 아니라 이 주의 절에 적어 둔다(로그 줄을 길게 만들지 않는다).
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-08-31 확정(08-31 장후 §3-6 판정 제안 그대로) — 하루 마지막 끊김 줄이
    `15:00:01 … (연속 1회 · 오늘 8회)`이고 **당일 끊김 줄 수도 8**로 일치했다.
    「연속만 리셋된다」는 주장 그대로다. 대가 축(옛 문구와 같은 축에 쌓인다)도 성립 —
    `qualitative.order_notice_stream_down = 8`이 부분문자열 파서로 그대로 세어졌다.
    ⚠ 이 fix가 **오늘 새 사실 하나를 만들었다**: 8회가 전부 **매시 정각 1회 · 정각 외 0회**임이
    이 꼬리표로 갈렸다(08-31 §1-7). 그것이 `2026-08-26-wiring2-v2`의 대가 축 교체 근거다.
  상태: confirmed

- id: "2026-08-26-p2-5-latency-window-tsv-carries-p95"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    `auto/{날짜}_지연창.tsv`에 **`p95초`·`p95/timeout` 두 열이 실린다** —
    `2026-08-25-fix-p95-reaches-the-intraday-round`의 **②**다(①·③은 커밋 `c71574d`로 완료).
  대가: |
    ⚠ **「p95 없음」과 「p95 = 0」을 다른 문구로 인쇄한다**(규약 C).
    그 창의 p95 표본이 없으면 `-`이고, 0.00초는 `0.00`이다. **이 한 칸이 틀리면 이 fix는
    헛경보 생성기가 된다** — 원 가설이 같은 주의를 이미 적어 뒀다.
  근거: |
    08-26 §1-10 — **이 회차가 그 대가를 세 번째로 치렀다.** 절벽이 풀린 시각(15:26)을
    p95로는 **창 단위로 못 짚었다.** `LATENCY_ITEM_RE`는 p50/p95/p99/max 네 값을 다 잡고
    `latency_p95`에 시간대별로 이미 보관하고 있다 — **열만 추가하면 된다.**

    ⚠ **예측치 줄은 리포트가 따로 두지 않았다** — 위 「가설」·「대가」는 리포트 P2-5 본문
    (*"`latency_p50` 옆에 p95가 이미 보관돼 있으므로 열만 추가하면 된다"* · *"⚠ 「p95 없음」과
    「p95=0」을 다른 문구로(규약 C)"*)을 그대로 옮긴 것이다.
  예측:
    - metric: rest_latency.p95_by_hour
      expect: "수기 판정 — 다음 거래일 `_지연창.tsv`에 `p95초`·`p95/timeout` 열이 실리고, 그 값이 같은 날 사이드카의 `p95_by_hour`와 어긋나지 않는가"
      역할: 주장
    - metric: rest_latency.p95_by_hour
      expect: "수기 판정(대가) — p95 표본이 없는 창은 `-`이고 0.00초는 `0.00`인가. 「없음」과 「0」이 같은 글자로 찍히면 이 fix는 헛경보 생성기가 된다"
      역할: 대가
    - metric: rest_latency.p95_warn_threshold
      expect: "== 2.5"
      역할: 참고
  주의: |
    ⚠ **p95의 기준 timeout은 p50과 같은 값을 쓴다** — 그날 실제로 걸려 있던 read timeout
    (`effective_read_timeout()`)이고, 레버가 켜진 날은 전역값과 다르다.
    ⚠ **p95도 검열된다.** p50이 타임아웃 벽에 눌리는 것과 같은 이유로 p95는 더 자주 눌린다 —
    `>=` 표기는 p50 열이 이미 쓰는 규약(`P50_CENSORED_FLOOR_RATIO`)을 그대로 따른다.
    ⚠ 이 fix는 **재기동이 필요 없다** — 수집기는 장중·장후에 따로 돈다.
  검정: |
    2026-08-31 확정(08-31 장후 §3-6 판정 제안 그대로) — `auto/2026-08-31_지연창.tsv` 헤더에
    `p95초`·`p95/timeout` 두 열이 실렸고, 그 값이 같은 날 사이드카의
    `rest_latency.p95_by_hour`와 어긋나지 않는다.
    **대가 조건도 만족했다** — 잘린 창은 `>=4.0`으로, 진짜 0은 `0.02`로 **다르게** 찍힌다.
    「없음」과 「0」이 안 섞였다(규약 C).
  상태: confirmed

- id: "2026-08-26-p2-7-monthly-revival-failure-is-day-over-day"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    「먼슬리 되살리기 실패」가 **전일 대비로** 인쇄된다 —
    `실패 9건(전일 2건 ▲7) · 회복률 83.8%(전일 97.9% ▼14.1pt)`.
    **전일 사이드카가 있는 날 그 줄에 전일값이 실린다.**
  대가: |
    사이드카가 없는 날은 `—(전일 없음)`으로 인쇄되고 **오경보를 안 낸다** —
    08-24 Fix#1이 만든 「가장 가까운 날, 최대 5일」 규칙(`previous_metric_sidecar()`)을 재사용한다.
  근거: |
    08-26 §1-20 — 적신호 14가 「먼슬리 되살리기 실패 9건」이라고만 적었다. **전일값이 없어
    9가 큰지 작은지 아무도 몰랐다.** 오늘 사람이 어제 사이드카를 열어 보고서야 2건 → 9건
    (**▲7**)이고 회복률이 97.9% → 83.8%(**▼14.1pt**)임을 알았다.

    **이 이상점은 `2026-08-25-p2-1`(0을 0으로 인쇄한다)이 만들어 준 것이다** — 어제 `0`이
    `—`가 아니라 `0`으로 찍혔기에 날짜 간 비교가 처음 성립했다.

    ⚠ **`recovery_pct`만 보면 안 된다** — 시도 수가 줄면 비율이 좋아 보인다.
    **실패 사이클 수와 회복률을 반드시 같이 낸다.**
  예측:
    - metric: priority_retry.failed_cycles
      expect: "수기 판정 — 전일 사이드카가 있는 날 그 줄에 전일값과 증감이 실리는가"
      역할: 주장
    - metric: priority_retry.recovery_pct
      expect: "수기 판정(대가) — 사이드카가 없는 날 `—(전일 없음)`으로 인쇄되고 오경보를 내지 **않는가**"
      역할: 대가
  주의: |
    ⚠ **전일 = 달력의 어제가 아니다.** 월요일에는 토요일 사이드카를 기대하면 안 된다 —
    `previous_metric_sidecar()`가 그 자리를 이미 지킨다(08-24 Fix#1).
    ⚠ **증감 화살표를 판정으로 읽지 않는다.** 이 축은 그날 KIS 상태에 비례한다(규약 G) —
    ▲7이 곧 회귀가 아니다. 이 fix가 하는 일은 **사람 앞에 두 수를 나란히 놓는 것까지**다.
  검정: |
    2026-08-31 확정(08-31 장후 §3-6 판정 제안 그대로) — 증거 §5-1-1이
    **`실패 8건 · 전일(2026-08-28) 6건 ▲2 · 전일 회복률 76.5%`**를 인쇄했다.
    **전일 사이드카가 있는 날 전일값이 실렸다** — 주장 그대로다.
    ⚠ 「전일」이 달력의 어제(08-30 일요일)가 아니라 **08-28**로 잡힌 것이 `previous_metric_sidecar()`
    (08-24 Fix#1)가 제 일을 한 증거다. 주말을 낀 날에 이 축이 처음 시험됐다.
  상태: confirmed

- id: "2026-08-26-adv3-a-warning-checks-every-condition-it-implies"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    규약 한 줄이 문서에 못 박힌다 — **「경고를 내는 코드는 그 경고가 참이기 위한 조건을
    전부 검사하거나, 검사하지 않는 조건을 경고 문구 안에 적는다.」**
    그리고 `tools/evidence_map.md`에 **「이 지표가 못 보는 것」 열**이 생긴다.
  대가: |
    **일반론이 아니라 나흘간 실측 네 건에서 나온 것이다.** 규약 줄 옆에 그 네 사례를
    표로 함께 적는다 — 근거 없는 규약은 다음 사람이 지킬 이유를 모른다.
  근거: |
    08-26 제5부 고도화 3 — 08:00 회차가 세 사례로 제안했고 **오늘 넷째가 나왔다**(1-16).

    | # | 자리 | 검사한 조건 | 빠뜨린 조건 | 결과 |
    |---|---|---|---|---|
    | 1 | 08-25 §1-12 | 감마플립 적재분 | 기각 로그 | 「감시하고 있다」로 오독 |
    | 2 | 1-3 | 무조건발동일이 지났다 | **레버가 켜졌다** | 다섯 회차 연속 오탐 |
    | 3 | 1-5 | 파일 날짜 | **그날 이상이 있었는가** | 두 회차 오독 |
    | 4 | 1-16 | 설정 미비 경고 + 통보 0건 | **구독 성립 9회** | 「통로가 닫혔다」로 정반대 인쇄 |

    ⚠ **예측치 줄은 리포트가 따로 두지 않았다** — 위 문장은 고도화 3 본문의 제안
    (*"`docs/동작점검/README.md`에 규약 한 줄로 못 박고, `tools/evidence_map.md`에
    「이 지표가 못 보는 것」 열을 만든다"*)을 그대로 옮긴 것이다.
  예측:
    - metric: qualitative.order_notice_subscribed
      expect: "수기 판정 — 다음에 이 형태의 오탐이 나올 때, 그 자리가 규약과 `evidence_map.md`의 「못 보는 것」 열에 이미 적혀 있었는가"
      역할: 주장
    - metric: qualitative.order_notice_subscribed
      expect: "수기 판정(대가) — 규약 줄 옆에 나흘간 실측 네 사례 표가 **함께** 실려 있는가. 근거 없는 규약은 다음 사람이 지킬 이유를 모른다"
      역할: 대가
  주의: |
    ⚠ **기계 강제는 이 항목에 넣지 않았다.** 고도화 3이 함께 제안한 린트(「조기 반환 분기가
    읽어 놓고 안 쓴 지역 변수」)는 별건이고 오탐 여지가 크다 → `NEXT_TODO.md`로 이월했다.
    ⚠ 이 항목은 **문서만 바꾼다.** 회귀 위험 0이고, 그래서 검정도 다음 사례가 나올 때
    수기로만 성립한다 — 그 사실을 숨기지 않는다.
  검정: |
    2026-08-31 — **`untested`. 검정할 사건이 안 났다**(08-31 장후 §3-6 판정 제안 그대로).
    검정 조건은 *「다음에 이 형태의 오탐이 나올 때 그 자리가 규약에 이미 적혀 있었는가」*인데
    **오늘 그 형태의 오탐이 한 건도 안 났다.** 사건이 없으면 검정도 없다.
    ⛔ **`refuted`가 아니다**(규약 C) — 위 「주의」가 이 경우를 미리 적어 두었다.
    대가 축(네 사례 표가 규약 줄 옆에 함께 실려 있는가)은 문서 실물로 이미 성립해 있다.
  상태: untested

- id: "2026-08-26-adv5-the-collector-bumps-into-the-discard-list"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    수집기가 `--verify-report {보고서}` 모드를 갖는다 —
    (나) 보고서의 Fix 절을 **폐기 목록 키워드**와 대조하고,
    (다) 보고서가 백틱 안에 지목한 `*.py` 경로가 **리포에 실재하는지** 확인한다.
    **§8-2가 「목록을 눈앞에 두는 것」까지였다면 이것은 「부딪히면 소리를 내는 것」이다.**
  대가: |
    ⚠ **판정하지 않고 목록만 낸다**(§8-2·§8-3과 같은 규약). 걸린 줄을 자동으로 지우지 않는다 —
    **자동으로 지우면 그것이 새로운 조용한 실패가 된다.**
    그리고 오탐이 나와도 **회차를 막지 않는다** — 종료 코드는 언제나 0이다.
  근거: |
    08-26 제5부 고도화 5 — **오늘 이 체제가 저지른 실수 셋은 전부 「증거를 안 본 것」이 아니라
    「눈앞의 증거를 잘못 읽은 것」이다.**
      ① 14:30이 `.watchdog_state.json`을 `2026-08-21`로 인용했다 — **그 회차의 증거 파일에는
         `2026-08-26`이라 적혀 있었다.**
      ② 14:30 P0-1이 **폐기 목록의 Slack 항목**을 되살렸다 — 증거 §8-2가 그 줄을 같은 파일
         안에 놓았는데도. **08-19에 이어 두 번째다.**
      ③ 14:30 P0-1이 **존재하지 않는 파일**(`mahdi/ops/alerting.py`)을 지목했다.

    **(가) 인용 대조는 이번에 넣지 않았다** — 상태 파일 값 추출이 보고서 문법에 의존해
    오탐 여지가 가장 크다. (나)·(다)는 각각 키워드 대조와 경로 존재 확인이라 오탐 형태가
    단순하고 사람이 즉시 가려낸다. **못 잡는 판정기를 실으면 「검사했는데 안 걸렸다」는
    거짓 안심이 남는다**(08-19 Fix#5가 같은 이유로 기계 판정을 뺐다) — 그래서 잡을 수 있는
    둘만 먼저 싣는다.
  예측:
    - metric: qualitative.alert_suppressed_toggle_off
      expect: "수기 판정 — 08-26 리포트를 `--verify-report`로 돌리면 14:30 P0-1의 Slack 항목과 `mahdi/ops/alerting.py`가 **둘 다 걸리는가**"
      역할: 주장
    - metric: qualitative.alert_suppressed_toggle_off
      expect: "수기 판정(대가) — 정상 회차 보고서에서 걸리는 줄이 사람이 훑어 낼 수 있는 분량(하루 10줄 이하)인가"
      역할: 대가
  주의: |
    ⚠ **키워드 대조는 낱말 겹침이 아니다.** 08-19 Fix#5가 실측으로 확인했듯 낱말 겹침
    판정기는 알려진 두 사례를 **둘 다 놓쳤다**. 그래서 **폐기 목록 제목에서 뽑은 고정
    키워드**(`Slack` · `광폭 체인` · `페이서 분리` · `httpx INFO`)로만 맞춘다 —
    적게 잡지만 **잡는 것은 확실히 잡는다.**
    ⚠ **경로 확인은 백틱 안의 `*.py`만 본다.** 산문 속 파일명은 안 본다 — 오탐이 폭증한다.
    ⚠ **이 모드는 회차가 스스로 부르는 것이 전제다.** 부르지 않으면 아무 일도 안 일어난다 —
    그 사실을 `phases.md`에 체크 한 줄로 적는다.
  검정: |
    2026-08-31 — **`untested`. 구현돼 있는데 안 돌았다.**
    08-31 장후 §3-6이 「`refuted` 또는 미구현 — **구현 여부부터 사람이 확인할 것**」으로 갈라
    두었고, 그 확인을 이 회차가 했다: **구현돼 있다** —
    `docs/동작점검/tools/collect_evidence.py:2769` `def verify_report(...)` ·
    `:2859` `ap.add_argument("--verify-report", …)` · `:2874` 호출부.
    §3-6이 정한 갈림 그대로 **미구현이 아니므로 `pending` 유지가 아니고, 안 돌았으므로
    `refuted`도 아니다 → `untested`**다. 오늘 회차가 수집기를 이 모드로 부르지 않았을 뿐이다.
    ⚠ 갈리는 날: 회차가 `--verify-report`를 실제로 부르는 날. 위 「주의」가 적어 둔
    *「이 모드는 회차가 스스로 부르는 것이 전제다」*가 정확히 오늘 실현된 실패 모드다 —
    **부르는 것을 `phases.md` 체크로 못 박은 것만으로는 안 불렸다.**
  상태: untested

- id: "2026-08-26-adv7-cliff-episodes-accumulate"
  구현일: 2026-08-26
  검증예정일: 2026-09-01
  가설: |
    「장 마감으로 풀린 고장」이 **표본으로 쌓인다** — `docs/동작점검/cliff_episodes.md`에
    에피소드마다 같은 축(전멸 시작 · 최장 연속 rows=0 · 경고선 돌파 · 회복 · 우리 쪽 조치)으로 append된다.
  대가: |
    ⛔ **두 건으로는 규칙을 못 만든다 — 그래서 지금 임계를 걸지 않는다.**
    이 파일은 **표본을 모으는 자리이지 판정하는 자리가 아니다.**
  근거: |
    08-26 §1-11 · 관측 15 — 오늘 절벽은 **08-14 이후 두 번째 표본**이고, 오늘 것은
    **회복 시각까지 관측된 첫 표본**이다(08-14는 그 전에 하루가 끝났다).

    | | 2026-08-14 | 2026-08-26 |
    |---|---|---|
    | 전멸 시작 | 14시대 | **13:40:53** |
    | 최장 연속 rows=0 | 약 84분 | **85분**(14:01~15:25) |
    | 경고선(0.8배) 돌파 | 13시 0.77 → 24분 뒤 | **13:44:45 (0.89) → 20분 뒤 위험선** |
    | 회복 | 관측 못 함 | **15:26 · 마감(15:20)에서 6분 뒤** |
    | 우리 쪽 조치 | 없음 | **없음** |

    ⚠ **예측치 줄은 리포트가 따로 두지 않았다** — 위 「대가」는 고도화 7 본문의
    「⛔ **오늘 두 건으로 「KIS는 장 마감에 풀린다」를 결론으로 쓰지 않는다**」를 옮긴 것이다.
  예측:
    - metric: rest_latency.p50_timeout_ratio_warn
      expect: "수기 판정 — **세 번째 에피소드가 나오는 날**, 그 파일에 두 건이 이미 같은 축으로 적혀 있어 비교가 바로 되는가"
      역할: 주장
    - metric: rest_latency.p50_timeout_ratio_warn
      expect: "수기 판정(대가) — 이 파일이 임계·자동 판정을 **한 줄도** 만들지 않았는가. 두 건으로 규칙을 만들면 그것이 이 항목이 막으려는 것이다"
      역할: 대가
  주의: |
    ⚠ **검증예정일 2026-09-01은 잠정이다** — 날짜가 아니라 **사건이 조건**이다
    (`2026-08-21-p1` · `2026-08-25-fix8-v2`와 같은 형태). 세 번째 절벽이 안 오면 그날
    다시 미룬다. **오지 않는 것이 좋은 일이므로 「반증」이 아니다.**
    ⚠ **세 번째가 나오면 물을 것 둘**: ① 언제나 마감과 함께 풀리는가(그렇다면 오후 특정
    시간대의 KIS 혼잡이 원인이고, **P1-3의 규칙이 정확히 그 자리를 겨눈다**)
    ② 경고선 → 위험선 간격이 20분 안팎으로 일정한가(그렇다면 **P1-4의 경고가 실용적인
    선행 시간을 준다**).
    ⚠ **자동 생성하지 않는다.** 에피소드 판정(「이것이 절벽인가」)은 사람이 한다 —
    자동화하면 임계가 생기고, 임계를 지금 거는 것이 이 항목이 막으려는 것이다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표) — **확인.**
    오늘 4번째 표본을 적으면서 `cliff_episodes.md`에 이미 있던 08-26·09-01 두 열과 **같은 축으로
    즉시 대조**가 됐고, 그 대조가 「회복 시각 3연속 일치」를 실제로 찾아냈다(09-03 §1-9).
    대가 축(임계·자동 판정을 안 만들었는가)도 유지 — 넷이 쌓인 지금도 **판정은 사람이 한다.**
  상태: confirmed

