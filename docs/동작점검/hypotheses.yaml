- id: "2026-08-16-p1-uncensored-latency-leads-the-cliff"
  가설: |
    KIS 지연의 조기경보는 **천장이 없는 통로**에서 나온다. `inquire-balance`(read timeout 10초,
    300초당 1콜)의 지연은 옵션체인 전멸을 **한 시간 이상 앞서** 오르고, 같은 시각 검열된
    `inquire-price` p50은 타임아웃에 눌려 그 상승을 보여주지 못한다.
  검증예정일: 2026-08-18
  근거: |
    **08-14 판단의 근거가 우측 검열(right-censoring)된 데이터였다.** 그날 §2-2는 14:36 창의
    `inquire-price` p50 = 4.05초를 보고 *"전역 read timeout 4.0초를 추월했다"* 고 옳게 진단했지만,
    이어서 §6-C가 *"6.0초로 올리면 흡수한다"* 고 적은 것은 **진짜 지연을 4.1초 근처로 가정한
    것**이다. 4.0초를 넘는 호출은 전부 4.0~4.06으로 기록되므로 그 통로로는 상한을 알 수 없다.

    같은 로그의 미검열 통로(10초 타임아웃)를 300초 창 전수로 다시 읽으면 답이 나온다
    (창당 1콜이므로 p50 = 그 호출의 실측 지연):

        12:31  4.19    12:56  6.95    13:31  8.16    13:56  5.02
        14:06 10.02    14:21 12.72    14:26 12.03    14:36 10.03
        14:41 10.39    14:51 10.53    15:01 10.89    15:21 10.05
        15:26  8.39    15:31  2.11    15:36  0.08   ← 정규장 마감 후 회복

    **전멸 84분 동안 실제 지연은 10초 이상이었다.** 그러므로 (a) 6.0초 상향은 그 호출들을
    구제하지 못하고 실패 1건의 비용만 4초→6초로 늘려 레그 예산을 10개→7개로 깎았을 것이고,
    (b) 상승은 12:31(4.19초)부터 이미 시작돼 **절벽을 95분 앞서 예고**하고 있었다.

    같은 날 `inquire-asking-price`(역시 10초 통로)는 14시에 **호출 0건**이다 — 그 자체가 신호다.
  예측:
    - metric: rest_latency.p95_by_hour
      expect: |
        수기 판정(주장) — **`inquire-balance` 행과 `inquire-price` 행을 같은 표에서 읽는다.**
        주장: 오후에 두 행이 갈린다(balance는 계속 오르고 price는 4.0 근처에서 평평해진다).
        08-14 재집계 기준선: 14시 balance 9.71 / price 5.84. 08-13(정상일) 13시 balance 3.64.
      역할: 주장
    - metric: rest_latency.endpoints
      expect: "수기 판정(주장) — `inquire-balance`의 max가 그 통로의 타임아웃(10.0초)에 닿는가. 08-14 실측 12.72초(닿았다) / 08-13 10.06초"
      역할: 주장
    - metric: db.chain_minute_coverage.zero_row_longest_run
      expect: "수기 판정(참고) — 선행성을 재려면 「언제 올랐나」와 「언제 비었나」를 나란히 놓아야 한다. 08-14 기준선 51분"
      역할: 참고
  주의: |
    ⚠ **이 가설은 「어느 지표가 더 잘 예고하나」를 겨눈다** — `2026-08-14-fix6-p50-over-read-timeout`
    (검열된 p50/타임아웃 비율)의 **경쟁 가설**이다. 둘을 같은 날 나란히 읽는 것이 요점이고,
    fix6이 틀렸다는 뜻은 아니다(fix6의 비율도 14시에 1.05로 넘었다). 다른 것은 **예고 시점**이다:
    fix6은 13:36에 0.77, 이 통로는 **12:31에 이미 4.19초**였다.
    ⚠ **`inquire-balance`는 300초당 1콜이라 표본이 얇다**(시간당 약 12건). 하루 p95는 사실상
    그 시간대 최댓값이다 — 백분위로 읽지 말고 **시계열로** 읽는다. 얇은 것이 이 통로의 대가이고,
    천장이 없는 것이 이득이다.
    ⚠ 이 통로의 지연이 오르는 것은 **KIS 귀속**이다. 우리 폴링을 줄여도 안 내려간다
    (08-14에 REST 수요가 전일의 80%였는데 무너졌다).
    ⚠ **정상일에는 아무 일도 안 일어난다.** 그런 날의 「갈리지 않음」은 반증이 아니다 —
    갈릴 조건(오후 지연 상승) 자체가 없었던 날이다(규약 C).
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-18에서 사흘 지남).**

    08-21에 절벽은 있었지만(11:10 위험선 → 15:31 회복) **이 가설이 요구하는 대조**,
    즉 `inquire-balance`(10초 통로)와 `inquire-price`(4초 통로)를 같은 표에서 시계열로
    읽는 일이 그날 산출물에서 이뤄지지 않았다. 게다가 그날 계좌 잔고 폴러는 사이클을
    **15회 통째로 건너뛰었다**(08-21 §1-16) — 미검열 통로의 표본 자체가 얇았다.
    이 가설이 겨눈 축은 §5 고도화#1(검열 비율 표기)과 고도화#3(폴러별 사이클 실패)이
    받는다. 재등재는 새 id로.
  상태: inconclusive

- id: "2026-08-16-fix1-chain-famine-safety-is-locked-by-test"
  가설: |
    체인 전멸 분에 `options_flow`가 미가용이 되고 그 사유가 이름으로 남는 것은 **이미 성립하는
    동작**이다(5분 신선도 창이 그 일을 한다). 회귀 테스트로 못박아 두면 주문이 배선된 뒤에도
    그 성질이 조용히 사라지지 않는다.
  검증예정일: 2026-08-18
  근거: |
    08-14 보고서 Fix#1은 *"신선도 창 밖에서도 계속 쓴다"* 를 전제로 `chain_input_source =
    expired` 표기와 멤버 미가용 처리를 제안했다. **그 전제는 사실이 아니다.**
    `db._chain_snapshot()`이 `oldest = as_of - CHAIN_SNAPSHOT_MAX_AGE_MINUTES`로 SQL 경계를
    걸고 있고(`tests/test_data_db.py::test_chain_snapshot_bounds_freshness_and_expiry`가 그 파라미터를
    검사한다), 그래서 6분째부터 스냅샷은 **빈 목록**이 된다 → `gex`/`gamma_flip`/`gamma_wall`이
    전부 None → `options_flow`가 None.

    08-14 실측이 그것과 정합한다: 전멸 84분에서 앞 5분을 뺀 **78분이 `chain_input_source = none`**
    이고, `options_flow` 비구조적 미가용도 **73분**으로 같은 구간이다. 14:04:10 로그에 가용멤버가
    4/6 → **3/6**으로 떨어진 것이 그 순간이다. **판단 경로는 이미 정직했다.**

    따라서 이 세션은 `expired` 라벨을 새로 만들지 않았다 — `none`과 같은 상태에 이름을 하나 더
    붙이는 일이고, 라벨이 늘면 규약 N(라벨 변경 3종 세트)의 비용만 생긴다.

    **대신 진짜 위험을 테스트의 docstring에 적었다**: 체인이 비어도 **판단은 계속 나온다**
    (다른 멤버가 살아 있으므로). 08-14에 84분 내내 `signal_decisions`가 적재되고 ENTER가 297건
    나온 이유가 이것이다. 확신도의 분모가 **가용 멤버 수**라서 정보가 줄면 확신도가 오히려
    오를 수 있다(`2026-08-11-eF`의 2026-08-16 정정 참고) — 그래서 개시일 모드는 CONFIRM이다.
  예측:
    # 2026-08-19 장후 경로 정정 — `db.signal_reach.member_availability`는 **부모는 있고 잎이 영원히 없는** 경로였다
    # (`hypotheses.leaf_absent()`가 그날 처음 기계로 잡았다). 그 절에는 멤버별 가용률이 없다 — 실재 경로는 `db.member_availability.members.<멤버>`다
    # (08-19 실측 369분 · 구조적 미가용 110분).
    # **소급이 아니다**: `expect`의 부등식은 한 글자도 안 바꿨고, 정정 전 실측이 `None`이라
    # 어떤 판정도 이 수정으로 뒤집히지 않는다.
    - metric: db.member_availability.members.options_flow.available_minutes
      expect: |
        수기 판정(주장) — 전멸이 있는 날 `options_flow`의 미가용 분이 **`chain_input_source.none`
        분과 같은 크기인가**(08-14: 73분 vs 78분). 두 값이 크게 갈리면 창이 의도대로 안 도는 것이다.
      역할: 주장
    - metric: db.signal_reach.chain_input_source
      expect: "수기 판정(주장) — `none` 키가 존재하고 `expired`라는 값은 **생기지 않아야** 한다(이 세션은 라벨을 늘리지 않았다)"
      역할: 주장
  주의: |
    ⚠ **전멸이 없는 날에는 검정되지 않는다** — 그날의 「미가용 0분」은 확인도 반증도 아니다.
      정상일에 이 항목이 말할 수 있는 것은 `tests/test_main.py::test_empty_chain_kills_options_flow_and_is_recorded_as_such`
      가 통과한다는 것뿐이고, 그것은 매 실행 보장된다.
    ⚠ **이 항목은 「고쳤다」가 아니라 「이미 맞았고 그것을 고정했다」다.** 08-14 보고서의 Fix#1을
      P0로 남겨 두면 다음 세션이 없는 버그를 고치려고 판단 경로를 건드린다 — 그 위험을 닫는 것이
      이 등재의 목적이다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-18에서 사흘 지남).**

    08-19~08-21 사흘 동안 이 축을 직접 겨냥한 실측을 남기지 않았다. 판정하지 못한 것이지
    틀렸거나 맞았다는 뜻이 아니다.
  상태: inconclusive

- id: "2026-08-16-b1-position-side-must-not-fail-silently"
  가설: |
    브로커 잔고의 방향 구분값을 정규화하고(한글·코드값 포함) 못 알아본 값을 세어 경고하면,
    동일방향 한도와 물타기 금지가 **입력이 없어서 무력한 상태**에서 벗어난다.
  대가: |
    미인식 종목을 후보 방향에 더하므로(모르면 안전한 쪽) 그런 날에는 진입이 **덜** 나온다.
    `unknown_side_count == 0`인 날은 종전과 한 비트도 다르지 않다 — 대가가 발생하는 날 자체가
    이상이 있는 날이다.
  검증예정일: 2026-08-18
  근거: |
    종전 구현은 `sll_buy_dvsn_name == "BUY"` / `== "SLL"` 두 리터럴만 봤다. 그런데 공식 문서
    (`docs/efriend` xlsx "선물옵션 잔고현황" 시트, `CTFO6118R`/`VTFO6118R`)는 이렇게 적는다:

        매수잔고인 경우, "매수" 혹은 "BUY"로 출력

    **한글이 올 수 있고, 이 값은 이 저장소에서 한 번도 실측된 적이 없다** — 주문이 나간 적이
    없어(`execution_logs` 0행) `output1`에 보유 종목이 담긴 응답을 받아본 적이 없다.
    `tests/`의 "BUY"/"SLL" 픽스처는 문서에서 옮겨 적은 값이다.

    못 알아보면 카운트가 **조용히 0**이 되고, 그 결과 둘이 동시에 죽는다:
      1. `risk/limits.py`의 `same_direction_positions >= max_same_direction_positions`(3)이
         영원히 성립하지 않는다.
      2. `execution/entry.py`의 `forbid_averaging_down()`이 항상 False를 받는다.
    「없는데 있는 척」이 아니라 **「있는데 없는 척」**이라 로그에도 흔적이 없다(계명 12).

    2026-07-06에 `output1.gama`(gamma가 아니라 gama)를 실측으로 잡아낸 것과 같은 자리다 —
    `DECISION_LOG`가 그날 *"KIS 응답 필드를 추정하지 말고 실제로 한 번 호출해서 찍어보라"*고
    적어 두었다.
  예측:
    - metric: db.positions.unknown_side_count_max
      expect: |
        수기 판정(주장) — **이 키가 존재하고 `None`이 아닌가**(존재부터). 그리고 첫 포지션이
        생긴 날 `position_snapshots`에 행이 생기고 그 `raw`에 KIS 원본이 들어 있는가.
        개시 전 기준선: 표 자체가 빈 상태(행 0).
      역할: 주장
    - metric: db.positions.side_distribution
      expect: |
        수기 판정(주장) — **KIS가 실제로 보낸 값이 무엇인지 이 날 확정된다.** BUY/SELL만
        나오면 정규화가 일한 것이고, UNKNOWN이 나오면 로그의 `sll_buy_dvsn_name=%r`이
        실측값을 알려준다 — 그때 `_BUY_SIDE_TOKENS`를 실측 기준으로 좁히고 R8 범위표를 쓴다.
      역할: 주장
    - metric: db.decisions.decision.ENTER
      expect: |
        수기 판정(대가) — 미인식이 있는 날은 진입이 덜 나온다(후보 방향에 더해지므로).
        `unknown_side_count == 0`이면 이 값은 이 변경과 **무관**하다 — 그때 ENTER 변화를
        이 항목에 귀속시키지 말 것.
      역할: 대가
  주의: |
    ⚠ **포지션이 없는 날에는 검정되지 않는다.** 개시일에 CONFIRM 게이트가 아무 주문도 통과시키지
      않으면 `output1`은 여전히 비어 있고, 그날의 「UNKNOWN 0」은 확인도 반증도 아니다(규약 C) —
      「실측할 기회가 없었다」다. 이 항목은 **첫 체결이 난 날**에만 판정한다.
    ⚠ **`positions_as_of()`로 라이브 판단을 하지 말 것.** 포지션의 권위는 브로커다(L12/R12).
      이 표는 사후 재구성과 필드 실측의 원재료이고, 미러가 진실원천을 대신하기 시작하면
      재시작 복원 순서(브로커 재조회 → 대사)가 무의미해진다.
    ⚠ **코드값(01=매도/02=매수) 매핑도 미실측이다.** 그래서 이름값을 먼저 보고 코드값은 보조로만
      쓴다(둘이 어긋나면 이름값이 이긴다). 8/18에 둘을 함께 로그로 확인할 것.
    ⚠ `idx_clpr`(지수종가)가 **옵션 보유 시 옵션 가격인지 기초자산 지수인지 확인되지 않았다** —
      이름은 "지수"종가다. 청산 로직이 이 값을 현재가로 쓰기 전에 실측이 필요하다
      (마이그레이션 030 주석에 같은 경고를 남겼다).
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-18에서 사흘 지남).**

    개시 주간(08-18~08-21) 내내 **주문이 0건**이라 이 경로가 한 번도 안 돌았다.
    「경로가 죽었다」와 「부를 일이 없었다」를 이 나흘 숫자로는 못 가른다(규약 C).
    주문이 실제로 나가는 날 **새 id**로 재등재한다.
  상태: inconclusive

- id: "2026-08-16-c1-order-roundtrip-is-measurable"
  가설: |
    취소·조회 API와 체결통보 복호화를 구현하면, 2026-08-18 장중에 **1계약 지정가 제출 → 조회 →
    취소 왕복**이 성립하고 그 왕복이 `execution_logs`와 원문 로그에 증거를 남긴다.
  대가: |
    실주문이 한 번 나간다. 원거리 지정가(현재가 ±30%)라 체결 가능성은 낮지만 0이 아니다 —
    체결되면 포지션이 생기고 그때는 `position_snapshots`가 그것을 받는다(Block B).
  검증예정일: 2026-08-18
  근거: |
    조사 결과 Block C는 「배선」이 아니라 **신규 구현**이었다. `main.py`에 실행 계층 호출이
    0건인 것은 알려져 있었지만, **배선할 대상 자체가 절반 없었다**:

      - 주문 **취소·정정 API가 없었다.** 경로 상수와 TR(`VTTO1103U`)만 있고 호출 코드가 없었다.
        그런데 CONFIRM 모드의 핵심이 「60초 미확인 → 자동 취소」다 — **주문은 낼 수 있고 취소는
        못 하는 상태**였다. 15:10 Forced Flat도 같은 이유로 반쪽이었다.
      - 주문·체결 **조회 API가 아예 정의돼 있지 않았다.** `order_manager.BrokerClient` 프로토콜이
        요구하는 `get_order_fill_status()`를 만들 수단이 없었고, 그래서 v6 §13.2의
        「체결통보-REST 이중 확인」이 **REST 쪽 절반이 성립하지 않는 상태**였다.
        공식 문서에는 있었다(`TTTO5201R`/`VTTO5201R`, `inquire-ccnl`).
      - **체결통보는 암호화 스트림이다.** 구독 ACK의 `body.output`에 iv(16B)/key(32B)가 실려
        오고 데이터는 `1|H0IFCNI0|001|<base64>` 형태다. `parse_subscription_ack()`이 그 두 필드를
        **버리고 있었다** — 키를 받는 유일한 창을 놓치고 있었다. AES 라이브러리도 없었다.
      - `execution_logs` **적재 함수가 없었다**(테이블은 001부터 있었고 조회만 있었다).

    구현 중 테스트가 잡아낸 결함 하나를 특히 남긴다: `str(0.0)`은 `"0.0"`인데 문서는 취소 시
    `UNIT_PRICE`에 **"0"** 을 요구한다. 한 글자짜리 차이가 8/18 실측을 통째로 실패시킬 수
    있었다 — 잔고 조회가 필수 파라미터 누락으로 넉 달간 항상 실패했던 것과 같은 급이다.
  예측:
    - metric: db.tables
      expect: |
        수기 판정(주장) — `execution_logs` 행이 **1 이상**인가(개시 전 기준선 **0행**).
        왕복이 성립하면 주문 1건이 `CANCELLED`로 남는다. 0행이면 왕복 자체가 안 된 것이다.
      역할: 주장
    - metric: db.positions.rows
      expect: |
        수기 판정(대가) — **0이어야 한다.** 원거리 지정가가 체결되지 않았다는 뜻이다.
        0이 아니면 체결된 것이고, 그때는 즉시 청산 여부를 사람이 판단한다.
      역할: 대가
  주의: |
    ⚠ **이 항목은 REST 왕복만 겨눈다.** 체결통보 WS는 **체결이 나야** 통보가 오므로, 취소로
      끝나는 왕복에서는 검정되지 않는다. 그 경로는 `2026-08-16-c2`가 따로 겨눈다.
    ⚠ **토큰 발급 403을 실패로 오해하지 말 것.** `TokenDaemon`의 캐시는 프로세스 메모리
      전용이라 이 스크립트는 자기 토큰을 새로 발급받고, KIS는 발급을 분당 1회로 제한한다
      (개발 중 실제로 403을 받았고 1분 뒤 200이었다). 스크립트가 65초 간격으로 3회까지 재시도한다.
    ⚠ **주문 응답의 `output`은 array이고 필드가 대문자(`ODNO`)다.** 조회 응답은 소문자(`odno`)다.
      한쪽을 보고 다른 쪽을 추측하면 조용히 None이 된다(`tr_codes.ORDER_*_ORDER_NO_FIELD`).
    ⚠ 실측 스크립트의 장 시간 가드는 **주말만** 막는다 — 마흐디에 휴장일 달력이 없어
      공휴일은 KIS 거부에 의존한다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-18에서 사흘 지남).**

    08-21 `execution_logs` **0행** — 그런데 그날 주문이 **0건**이라 왕복 경로가 한 번도
    안 돌았다. `refuted`가 아니라 판정 불가다(규약 C). 후속은
    `2026-08-19-fix2-roundtrip-leaves-db-evidence`가 「주문이 나가는 날」로 들고 있다.
  상태: inconclusive

- id: "2026-08-16-c2-fill-notice-decrypts"
  가설: |
    체결통보 구독 ACK에서 iv/key를 보관하고 AES-256-CBC로 복호하면, 체결이 났을 때 그 통보를
    **읽을 수 있다**(종전에는 키를 버려 영구히 읽을 수 없었다).
  검증예정일: 2026-08-18
  근거: |
    복호 경로는 문서 예시로 왕복 검증했다 — key 32바이트/iv 16바이트를 ASCII 그대로 쓰고,
    문서의 「복호화 후」 예시 22개 필드를 그대로 재구성해 암호화→복호화→파싱이 원문과 일치했다.

    **그러나 라이브 미검증이다.** 확정되지 않은 것이 셋이다:
      1. `tr_key`가 HTS ID인지 종목코드인지 — 같은 시트의 Request Body 표와 Response Example이
         **서로 어긋난다**(표는 "예:101S12", 예시는 `"tr_key": "HTS ID"`).
      2. 필드 **순서와 개수** — 문서 예시에서 옮긴 것이다. `parse_notice()`가 개수 불일치를
         경고로 낸다.
      3. 데이터 건수가 2 이상일 때(`1|H0IFCNI0|002|...`) 복호문에 여러 건이 이어 붙는지.
  예측:
    - metric: db.tables
      expect: |
        수기 판정(주장) — **존재부터**: `KIS_HTS_ID`가 채워지고 체결통보 구독 ACK이 `rt_cd=0`으로
        돌아오는가(로그의 `SUBSCRIBE SUCCESS`). 그 ACK이 iv/key를 실어 오는가.
        **체결이 없는 날에는 여기까지가 검정 범위다.**
      역할: 주장
  주의: |
    ⚠ **체결이 나지 않으면 복호 경로 자체는 검정되지 않는다.** 8/18 왕복은 취소로 끝나므로
      통보가 안 올 수 있다 — 그때 「UNKNOWN 0건」은 확인도 반증도 아니다(규약 C).
      복호는 첫 체결이 나는 날 확정된다.
    ⚠ **`KIS_HTS_ID`가 비면 구독을 건너뛴다.** 예외를 던지지 않는 이유는 체결통보가 없다고
      관측 루프가 안 뜨면 안 되기 때문이고, 조용히 넘기지 않는 이유는 **「주문은 나가는데 체결
      알림이 없는」 상태가 가장 위험**하기 때문이다. 이 값은 **사용자가 채워야 한다.**
    ⚠ 체결통보는 **별도 도메인**(모의 :31000)이라 두 번째 WS 연결이 필요하다 —
      `main.py` 배선은 이 커밋에 없다(복호·파싱 계층까지만이다).
  판정근거: |

    ⚠ **2026-08-23 종결 — `untested`(예정일 08-18에서 사흘 지남).**

    `inconclusive`가 아니라 `untested`다: 08-21 WS 구독 32건에 **체결통보 채널 `H0IOCNI`가
    없다**(`H0IFCNT0`×1 · `H0IOCNT0`×30 · `H0UNMKO0`×1). 즉 그 코드는 한 번도 안 실렸다 —
    **검증 자체가 성립하지 않는다.** 이것은 관측으로 갈릴 일이 아니라 **코드 배선 문제**이고,
    배선하는 날 새 id로 등재한다(08-21 §3-7 ③).
  상태: untested

- id: "2026-08-17-p1-instrument-selection"
  구현일: 2026-08-17
  검증예정일: 2026-08-18
  가설: "§11.5 선택기가 라이브에서 돌면, ENTER 계열 분의 90% 이상에서 제안 종목이 비어있지 않다"
  근거: |
    선택기는 REST를 부르지 않고 GEX와 **같은 체인 스냅샷**을 나눠 쓴다. 그 스냅샷이 비지 않은
    분이라면 ATM 최근접 행사가는 항상 존재한다. 유동성 임계는 전부 null(OFF)이라 후보를 거르지
    않는다. 90% 미만이면 (a) 체인 스냅샷이 비었거나 (b) 팔레트가 규칙 미정의 전략(long_gamma /
    프리미엄 매도 계열)만 열었다는 뜻이고, **그 둘은 `reason` 코드로 갈린다**.
  예측:
    - metric: db.decisions.selected_instruments.enter_minutes_with_candidate_pct
      expect: ">= 90"
      역할: 주장
    - metric: db.decisions.selected_instruments.symbol_resolved_pct
      expect: "수기 판정"
      역할: 참고
  주의: |
    이 가설은 «좋은 행사가를 골랐는가»를 재지 않는다 — 체결 0건인 동안 그것은 정의상 관측
    불가이고, 재려 들면 선택기가 아니라 우리의 상상을 재게 된다. 재는 것은 «선택기가 돌았고
    결과를 남겼는가» 하나뿐이다.
    `symbol_resolved_pct`에 **임계를 두지 않는다**(규약 G) — 정상 분포를 모른다. 종목 마스터의
    만기 표기가 YYYYMM/YYMMW#이라 달력상 만기일과 대조할 수 없어, 북이 롤오버되는 날 얼마나
    빗나가는지가 아직 실측되지 않았다.
  결과: |
    2026-08-18 확정 — **반증.** 주장 지표 `enter_minutes_with_candidate_pct` = **36.8%**
    (ENTER 345분 중 후보 있음 127분). 예측 >= 90에서 크게 미달.

    ⚠ **2026-08-19 수치 정정.** 최초 확정은 08-18 12:25 시점의 **반나절** 집계(19.5% /
    ENTER 205분)로 썼다. 장 마감 후 EOD가 종일 값을 냈고 **후보율이 19.5% -> 36.8%로 올랐다**
    — 오후에 팔레트가 ATM 계열 셀을 더 자주 열었기 때문이다. **판정은 안 바뀐다**(36.8% << 90%).
    다만 «어느 셀이 열리는가»가 이 지표를 크게 움직인다는 사실 자체가 아래 예측 오류의 내용과
    같은 것이라, 정정하지 않으면 근거가 스스로를 약화시킨다.
    교훈: **장 끝나기 전에 상태를 확정하지 않는다** — 확정하면 그날 §0-1 표에서도 빠진다.

    **코드 결함이 아니라 예측 오류다.** 후보 없음 218건 중 **216건이 `small_strangle_buy`의
    `delta_band[0.2,0.3]`** 실패이고, 원인은 구독 창(ATM±N)이 그 델타에 닿지 않는 것이다.
    선택기가 쓴 08-20 북 실측(분당 평균 4.2레그, 설계 10):

        콜  0.20~0.30 밴드 보유    16.5%   (평균 최소 |델타| 0.440)
        풋  0.20~0.30 밴드 보유     4.8%   (평균 최소 |델타| 0.458)

    이 전략은 **양 날개 다** 필요해서 둘이 동시에 있어야 하고, 그 확률은 훨씬 낮다.
    옵션체인 예산 컷 71건(weekly_mon/thu)이 그 창을 더 좁혔다.

    예측의 근거는 *"스냅샷이 비지 않은 분이라면 ATM 최근접 행사가는 항상 존재한다"* 였는데,
    그날 팔레트가 연 셀이 ATM 전략이 아니라 **양 날개 전략**이었다. 구조 변수(어느 셀이
    열리는가 x 창이 어느 델타까지 닿는가)를 빼먹은, 규약 F가 경계하는 그 형태다.

    참고 지표 `symbol_resolved_pct` = **100.0%** (다리 312개 전부 단축코드 해결).
    실제로 고른 것은 `straddle_accumulate` ATM 스트래들 / 08-20 북 / B09FAWA37·C09FAWA37 등.

    **되돌리지 않는다** — 선택기는 설계대로 동작했고, 못 고른 사유를 정확히 남겼다.
    후속은 «구독 창을 넓힐 것인가 / 그 전략의 밴드를 관측 가능 범위로 볼 것인가»의 결정이고,
    그것은 코드가 아니라 사람의 판단이다(NEXT_TODO 등재).
  상태: refuted

- id: "2026-08-17-p2-expiry-day-excluded"
  구현일: 2026-08-17
  검증예정일: 2026-08-18
  가설: "제안 종목의 만기가 당일 만기인 다리 수는 0이다"
  근거: |
    `select_book()`이 today보다 **큰** 만기만 후보로 둔다 — 만기 당일 북은 0DTE 플레이북
    전용이다(§11.4/§11.5). 잔존만기 0일에는 감마플립이 정의되지 않고 핀 리스크만 의미를 갖는다.
  예측:
    - metric: db.decisions.selected_instruments.expiry_day_leg_count
      expect: "0"
      역할: 주장
  주의: |
    **불변식이다.** 0이 아니면 시장이 특이한 것이 아니라 코드가 깨진 것이다.
    건수로 세는 것이 규약 F 위반이 아닌 이유: F는 **비례하는** 값에 대한 규칙이고, 0이어야 하는
    값을 비율로 만들면 1건이 0.2%로 묻힌다(`gex_input_missing_minutes`가 같은 이유로 건수다).
  결과: |
    2026-08-18 확정 — **확인.** `expiry_day_leg_count` = **0**.

    **오늘이 실제 만기일이라 의미 있는 검정이었다.** 체인에 2026-08-18 만기 레그가 콜/풋
    각각 27행사가씩 들어와 있었는데(`option_analysis_1m` 실측) 후보에는 **한 다리도** 들어가지
    않았다. 선택기는 08-20(위클리 목)을 골랐다. 0이 «만기 북이 없어서 나온 0»이 아니다.
  상태: confirmed

- id: "2026-08-17-p3-no-order-submitted"
  구현일: 2026-08-17
  검증예정일: 2026-08-18
  가설: "ExecutionEngine 그림자 배선은 주문을 한 건도 내지 않는다"
  근거: |
    `main.py`에 `order_manager.submit()` 호출부가 **없다**. 그리고 `_ORDER_PATH_WIRED=False`인
    동안 `effective_mode()`가 설정 모드를 ADVISORY로 낮추고, `gate_entry(ADVISORY)`는
    ADVISORY_ONLY를 돌려주므로 `EntryPlan` 자체가 만들어지지 않는다.
  예측:
    - metric: db.decisions.selected_instruments.order_submitted_true_count
      expect: "0"
      역할: 주장
    - metric: db.decisions.selected_instruments.recorded_minutes
      expect: ">= 1"
      역할: 참고
  주의: |
    첫 지표는 **불변식**이다 — 0이 아니면 즉시 관측 루프를 세운다. 계좌에 실제로 닿는 경로가
    의도치 않게 열렸다는 뜻이기 때문이다.
    둘째 지표는 **배선 생존 신호**다. 0이면 선택기가 하루 종일 한 번도 안 돌았다는 뜻이고,
    그 경우 첫 지표의 0은 «주문을 안 냈다»가 아니라 «아무것도 안 했다»여서 증명이 아니다
    (규약 C — 라벨 0이면 count 0은 증명이 아니다).
  결과: |
    2026-08-18 확정 — **확인.** `order_submitted_true_count` = **0**,
    `recorded_minutes` = **293**(>= 1).

    배선 생존 신호가 490분이므로 그 0은 «아무것도 안 했다»가 아니라 «했는데 주문은 안 냈다»다
    (규약 C). `exec_mode`도 293행 전부 ADVISORY 단일값이었다.
  상태: confirmed

- id: "2026-08-17-p4-selection-cycle-cost"
  구현일: 2026-08-17
  검증예정일: 2026-08-18
  가설: "선택기는 사이클 시간을 늘리지 않는다"
  근거: |
    선택기는 REST를 부르지 않는다 — 체인은 `_build_signal_inputs()`가 이미 읽은 것을
    `chain_inputs`로 넘겨받아 나눠 쓴다(같은 사이클에 두 번 조회하면 GEX를 낸 체인과 종목을
    고른 체인이 갈리므로 의도적으로 한 번만 읽는다). 남는 비용은 수십 레그에 대한 순수 파이썬
    순회뿐이다.
  예측:
    - metric: overrun.count
      expect: "0"
      역할: 주장
    - metric: rest.total_calls
      expect: "수기 판정"
      역할: 참고
  주의: |
    `rest.total_calls`는 선택기와 무관한 힘(옵션체인 폴링 레버들)이 이미 움직이는 값이라
    **수기 판정**으로 둔다. 이 가설이 말하는 것은 «선택기가 REST를 늘리지 않았다»뿐이고,
    총계가 움직여도 선택기를 반증하지 않는다 — 귀속은 레버 표(§0)로 한다.
  결과: |
    2026-08-18 확정 — **확인.** `overrun.count` = **0**
    (사이클 로그 299건 전부 `밀림=0.0초`). 선택기는 REST를 부르지 않고 이미 읽은 체인을
    나눠 쓰므로 사이클 시간에 기여하지 않는다는 예측 그대로다.

    참고 `rest.total_calls`는 수기 판정 — 옵션체인 예산 컷 71건이 같은 축을 반대로 당기므로
    총계로 선택기를 판정하지 않는다.
  상태: confirmed

# ===== 2026-08-19 착수분 — 08-18 운영점검보고서 P1 5건 =====
#
# **숫자를 보기 전에 적는다.** 08-18 보고서 §1-4가 지적한 「가설 3건이 5일째 미등재」를 여기서
# 반복하면 08-19 관측이 또 어느 가설에도 귀속되지 않는다.
#
# ⚠ 보고서 Fix#1(데드라인 컷 경로에 우선순위 보호 배선)은 **등재하지 않는다.** 착수 전 코드
# 검증에서 그 진단이 틀린 것으로 확인됐다 — `books[0]`이 이미 먼슬리이고(`main.py:4478`),
# 위클리는 언제나 뒤에 있으므로 벽시계 데드라인이 먼슬리 구간에서 끝나면 `non_priority_ahead`는
# **구조적으로 항상 True**다. 그 세 사이클에서 위클리 레그는 한 건도 호출되지 않았다(먼슬리가
# 예산 100%를 썼다 = 우선순위가 지켜진 결과다). `tests/test_main.py`의
# `test_priority_violation_label_fires_when_the_monthly_is_cut_with_weeklies_pending`이
# *"예산은 시계이지 스코프가 아니다 — 그래서 라벨이 필요하다"* 로 이 동작을 이미 못 박고 있다.
# 원안대로 고치면 라벨이 영구히 `아니오`가 되고 **동작은 하나도 안 바뀐다**(데드라인이 지난 뒤에는
# 위클리를 «먼저 소거»하든 말든 호출이 0건이다). 그래서 코드가 아니라 **라벨 이름**을 고친다(fix5).

- id: "2026-08-19-fix2-roundtrip-leaves-db-evidence"
  구현일: 2026-08-19
  검증예정일: 2026-09-01
  가설: "왕복 실측이 `execution_logs`에 행을 남기고, 일일 지표가 그 테이블을 센다"
  근거: |
    08-18 14:03 왕복 4단계가 전부 `rt_cd=0`으로 성립했는데 `execution_logs`는 0행이었고,
    그 가설(`2026-08-16-c1`)의 주장 지표 `db.tables`는 그 테이블을 **애초에 세지 않았다**
    (`db_metrics._DAILY_TABLES` 14개 항목에 없다). 두 결함이 겹쳐 있다:
      (1) `scripts/measure_order_roundtrip.py`가 DB 커넥션 자체를 안 연다(`db.local_now()` 한 곳).
      (2) `_DAILY_TABLES`에 `execution_logs`가 없다.
    하나만 고치면 여전히 0행이거나 여전히 안 보인다.
  예측:
    - metric: db.tables.execution_logs.rows
      expect: ">= 0"
      역할: 주장
    - metric: db.tables.execution_logs.minutes
      expect: "수기 판정"
      역할: 참고
  주의: |
    **주장은 「경로 생존」이지 「행이 쌓였다」가 아니다.** `>= 0`은 키가 존재할 때만 참이고
    키가 없으면 「실측 없음」으로 떨어진다 — 08-06 Fix#3의 `underlying_spot_1m.rows >= 0`과
    같은 형태다. 행 수 자체에 하한을 걸 수 없는 이유는 **사람이 왕복을 돌린 날에만 늘어나기
    때문**이다(규약 C — 라벨 0이면 count 0은 증명이 아니다). 「그날 왕복을 돌렸는가」는
    `logs/order_roundtrip_*.json`으로 사람이 확인하고, 돌린 날의 `rows >= 1`을 수기로 읽는다.
  판정근거: |

    ⚠ **2026-08-23: 미실행 — 주문이 0건이라 경로가 안 돌았다.** 08-21 `execution_logs`
    **0행**인데 그날 **주문도 0건**이다. 「경로가 죽었다」와 「부를 일이 없었다」를 이 숫자로는
    못 가른다(규약 C) — `refuted`가 아니라 **판정 불가**다.

    **`inconclusive`로 닫지 않는다**: 주문이 나가는 날 이 항목이 없으면 그날 왕복 증거를
    검정할 것이 없어진다. 예정일만 옮긴다(잠정 2026-09-01). **판정이 갈리는 것은 날짜가
    아니라 사건이다** — 다음에 주문이 나가는 날 즉시, `execution_logs` 행 수와
    `logs/order_roundtrip_*.json` 파일 수를 나란히 센다(08-21 §3-7 ②).
  상태: pending

- id: "2026-08-19-fix3-delta-baseline-is-a-trading-day"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "전일 대비 델타의 기준일은 언제나 **거래일**이다"
  근거: |
    08-18 §1의 붉은 ⚠ 4개가 전부 거짓이었다 — 기준일 08-17이 광복절 대체휴일이다.
    `log_metrics.previous_business_day()`는 주말만 건너뛰고, docstring이 *"공휴일은 파일 존재
    여부로 걸러진다"* 고 가정했다. **그 가정이 깨졌다**: 휴장일에도 루프가 돌아
    `auto/2026-08-17_지표.json`이 실제로 생성됐고, 08-17이 월요일이라 주말 스킵도 안 걸렸다.
    `mahdi/market_calendar.is_trading_day()`가 08-17에 이미 순수 함수로 있었는데 이 경로가
    그것을 안 불렀다.
  예측:
    - metric: delta_baseline.baseline_is_trading_day
      expect: "1"
      역할: 주장
    - metric: delta_baseline.date
      expect: "수기 판정"
      역할: 참고
    - metric: delta_baseline.skipped_non_trading_days
      expect: "수기 판정"
      역할: 참고
  주의: |
    **불변식이다.** 기준일이 무엇이든 그날은 거래일이어야 한다 — 시장 상태에 의존하지 않으므로
    규약 G의 대상이 아니다. 반대로 `skipped_non_trading_days`는 **그날이 연휴 다음날인가**에
    비례하므로 주장으로 걸면 안 된다(08-19는 0, 화요일 연휴 다음날은 1 이상).
    달력 `covered_through`를 넘어가면 기준일을 `null`로 내고 이 지표도 `null`이다 —
    **「모름」을 0으로 접지 않는다.** 그때 이 가설은 반증이 아니라 「실측 없음」이어야 한다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    08-21 사이드카에 `delta_baseline` 절은 살아 있었으나, 그 값이 「거래일 기준인가」를
    직접 겨냥한 대조를 그날 산출물이 남기지 않았다. 판정하지 못한 것이다.
  상태: inconclusive

- id: "2026-08-19-fix6-censored-calls-are-counted"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "read timeout에 잘린 호출(검열)을 따로 세면 `:00`/`:30` 위상이 지표에 드러난다"
  근거: |
    08-18 §2-5 — `감마플립 산출 불가` 4건이 전부 `:01`이었고, 정규장 `HTTP >= 4.0초` 333건 중
    103건(31%)이 `:00~:03`·`:30~:33` 여덟 분에 몰렸다(균등이면 13.3%). 그 분들의 페이서 대기는
    1.0~1.8초로 평범했다 — 우리 백오프가 아니라 KIS 응답이다.
    **그런데 그 333건을 세는 지표가 어디에도 없다.** `4.02`·`4.05`는 실제 응답시간이 아니라
    타임아웃에 잘린 값이라 `p50`은 이 축을 **구조적으로 못 본다**(우측 검열). 14:30 회차가
    「p50÷timeout 최대 0.74로 경고선 아래」로 옳게 닫았는데, 그 게이지가 못 보는 축에서 넉 분이
    죽었다.
  예측:
    - metric: slow_calls.censored.count
      expect: ">= 0"
      역할: 주장
    - metric: slow_calls.censored.phase_concentration
      expect: "수기 판정"
      역할: 참고
    - metric: slow_calls.censored.by_endpoint
      expect: "수기 판정"
      역할: 참고
  주의: |
    **이 항목은 「고친다」가 아니라 「원인을 특정한다」가 목표다** — `2026-08-01-p3`와 같은
    성격이다. 검열 건수가 줄기를 예측하지 않는다(우리가 콜을 줄여도 KIS의 그 분은 안 바뀐다).
    주장은 경로 생존뿐이고, **§7-1의 질문에 답하는 것은 사람이 읽는 `phase_concentration`이다**:
    여덟 분 점유율이 균등선(13.3%)을 크게 넘으면 위상 문제가 재확인되고, 그때 레버 E는
    이 문제에 듣지 않는다(레버 E는 우리 레그 수 축이다).
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    경로는 살아 있다(`slow_calls.censored`). 다만 이 항목이 물은 것은 **위상**(`:00`/`:30`
    몰림)이고, 08-21은 절벽이 하루 전체를 덮은 날이라 위상 축이 묻혔다. 그리고 그날
    새로 드러난 것은 위상이 아니라 **검열이 p50 표기 자체를 거짓말로 만든다**는 사실이다
    (08-21 §1-14). 그 축은 `2026-08-21-fix3-censored-p50-is-printed-as-a-floor`가 받는다.
  상태: inconclusive

- id: "2026-08-19-fix4-missing-check-alert"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "점검 예약이 안 떴다는 사실을 워치독이 **그날 안에** 알아챈다"
  근거: |
    08-18 장전 회차가 08:30 예정에 **13:28:36**(298분 지연)에 떴고, 같은 날 14:30 회차는
    10분 만에 떴다 — 결함은 예약 자체가 아니라 **Claude 앱 기동 시각에 예약이 종속된 것**이다.
    그 사실은 같은 날 대조 실험으로 확정됐다. 08-17 보고서가 남긴
    `[P1] 그날 안에 알아챌 경로가 없다`가 **사흘 연속 미이행**이다.
    **예약이 안 뜬 것을 예약으로 감시할 수 없다** — 10분마다 도는 유일한 상시 프로세스가
    `scripts/watchdog_observation_loop.py`이므로 거기에 건다.
  대가: "워치독 판정 횟수가 줄지 않아야 한다 — 새 조회가 판정 경로를 막으면 감시가 얇아진다"
  예측:
    - metric: watchdog.missing_check_alerts
      expect: ">= 0"
      역할: 주장
    - metric: watchdog.checks
      expect: "수기 판정"
      역할: 대가
    - metric: watchdog.max_silence_minutes
      expect: "수기 판정"
      역할: 대가
  주의: |
    주장은 **경로 생존**이다(키가 없으면 「실측 없음」). 알림이 실제로 울리려면 그날 장전 회차가
    09:00까지 안 떠야 하는데, 그것은 **우리가 못 정하는 조건**이다 — 건수에 하한을 걸면
    「예약이 정상이었던 날」이 반증으로 찍힌다(규약 G).
    대가 지표를 둘 둔 이유: 파일 존재 확인 한 번이 판정 경로를 느리게 만들면 `checks`가 줄거나
    `max_silence_minutes`가 늘어난다. 08-18 기준선은 `checks = 49` · `max_silence = 10.0`이다.
