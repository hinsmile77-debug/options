    # 선언한 대가(테이블이 하나 는다)를 §12 적재 표에서 그대로 잰다.
    - metric: db.tables.decision_outcomes.rows
      expect: ">= 0"
      역할: 대가
  주의: |
    **적중률 자체에는 임계를 걸지 않는다.** 하루치로 좋고 나쁨을 말할 수 없고, 정상 범위를
    모르는 채 임계를 먼저 정하면 그 임계가 곧 결론이 된다(§16 괴리율에서 배운 것).
    며칠 쌓고 사람이 정한다.

    **표본 수를 반드시 함께 읽는다** — 진입 3건인 날의 100%는 아무 뜻이 없다.
    그리고 **무변동은 적중도 실패도 아니라 분모에서 빠진다**(0을 실패로 세면 조용한 장에서
    적중률이 구조적으로 낮아진다).

    이 값으로 **가중치를 바꾸지 않는다** — 평가이지 되먹임이 아니다. 성과 기반 배분은
    Thompson Sampling(v6 §11.3, Phase 3)의 몫이고, 그 전에 "무엇을 성과로 볼 것인가"부터
    정해야 한다.

    ENTER가 0건인 날에는 `available: False`가 정상이다(그날은 검정이 성립하지 않는다).
    08-06 이후 진입 컷오프(Fix#1)가 14:50 이후를 막으므로 08-07 진입 건수는 08-06의 62건보다
    적을 것이다 — 그것은 이 항목이 아니라 `2026-08-06-fix1-entry-cutoff`가 볼 일이다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 사후평가 281건 적재, 지평별 적중률 산출(5m 48.2% / 15m 43.3% / 30m 57.0%).
  상태: confirmed
