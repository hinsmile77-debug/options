    08-10 사고의 구조였다. 검증예정일을 08-19로 늦게 잡은 이유가 그것이다.
    ⚠ 이 항목은 `전제레버: REGIME_RESTORE_SESSION_WINDOW`를 달아 두었으므로, 켜기 전까지
    §0-1이 **「미실행」**으로 낸다(규약 H의 첫 실사용).
  전제레버: REGIME_RESTORE_SESSION_WINDOW
  판정근거: |

    ⚠ **2026-08-23: 다섯 번째 미실행 — 규약 H.** 전제 레버 `REGIME_RESTORE_SESSION_WINDOW`가
    08-21에도 **OFF**였다(지표 §0). 그날 `warmup_restart_minutes` 29분은 사실이지만
    **이 항목의 코드는 한 번도 안 돌았다** — 그 29분은 이 fix가 없는 상태의 값이고,
