- id: "2026-08-12-fix6-lever-state-convention-h"
  가설: |
    자동 지표가 레버 상태를 인쇄하고 가설이 `전제레버`를 선언하면, 레버가 꺼진 날의 숫자로
    그 레버의 가설이 판정되는 일이 사라진다(규약 H).
  검증예정일: 2026-08-13
  근거: |
    08-12의 「켤 것 — 오늘 단 하나만」은 `use_effective_member_count`였다. **안 켜졌다** —
    키가 `strategy_params.yaml`에 없었고(`engine.py`가 기본값 `False`로 읽는다) 커밋도 0건이었다.
    그런데 §0은 `2026-08-11-eF`를 켜진 전제로 판정해 「HIGH_CONVICTION이 34건보다 줄어야 한다」
    옆에 실측 **91건**을 찍었다. 표만 보면 분모 전환이 반대로 작동한 것처럼 보인다.
    규약 F/G와 같은 병이다 — 예측을 쓰는 순간 상수처럼 느껴지는 변수가 원인이고, 결과도 같다
    (**멀쩡한 fix가 반증으로 찍히고, 그것을 믿으면 고칠 필요 없는 것을 고친다**).
  예측:
    - metric: levers.git_head
      expect: "수기 판정(주장) — §0 레버 표가 **존재하고** 오늘 HEAD를 인쇄하는가(존재부터 예측한다)"
      역할: 주장
    - metric: levers.levers
      expect: "수기 판정(주장) — 모든 레버의 `on`이 `None`이 아닌가. `None`은 「꺼져 있었다」가 아니라 「못 읽었다」이고, 그때는 `mahdi/ops/levers.py`를 고쳐야 한다"
      역할: 주장
  주의: |
    ⚠ **F/G와 검사 시점이 다르다.** F/G는 예측을 *쓸 때* 형태를 보고 막지만, H는 막을 것이 없다 —
    예측 자체는 옳았고 그날 실행되지 않았을 뿐이다. 그래서 H는 *읽을 때* 거는 조건이고
    검사 대상이 yaml 문법이 아니라 **그날의 코드 상태**다.
    ⚠ 오타 난 레버 이름을 「미실행」으로 덮지 않는다 — 그것은 「모른다」이고 별도 경고로 뜬다.
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: §0 레버 표 존재 · git HEAD `b9fa6c9` 인쇄 · 레버 6종 `on` 값 전부 non-None.
    **그날 §0-1이 eF를 「미실행」으로 낸 것 자체가 이 fix가 일한 증거다.**
  상태: confirmed

- id: "2026-08-12-fix7-regime-session-window-restore"
  가설: |
    재기동 시 오늘 `feature_store` 행으로 세션 창을 복원하면, 재기동이 레짐을 WARMUP으로
    되돌리지 않는다.
  대가: |
    재기동 직후 **얇은 `feature_builder`** 위에서 predict가 돈다 — 그 분들의 레짐이 연속 실행과
    다를 수 있다. 감시는 `db.regime` 전이 횟수(채터링 회귀 = 08-10의 병).
  검증예정일: 2026-09-01
  근거: |
