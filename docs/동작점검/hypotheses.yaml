# 마흐디 가설 검정 파일 — "예측 → 실측" 대조를 자동화한다 (운영점검보고서 2026-07-31 §5-1).
#
# 규약: **fix를 구현하는 세션은 그 자리에서 여기에 예측치를 적는다.**
#       다음 거래일 `scripts/daily_ops_report.py`가 자동으로 실측과 대조해 리포트 §0에 낸다.
#       예측치를 못 적겠으면 그 fix는 아직 근거가 부족한 것이다 — 07-30의 "밀린 데이터는
#       어차피 유실"이라는 추론이 예측치 형태로 강제됐다면 그날 바로 걸렀을 것이다.
#
# 필드:
#   id            고유 식별자(날짜-항목)
#   구현일/검증예정일  검증예정일이 지난 pending 항목은 확정될 때까지 계속 표에 남는다
#   가설          한 문장
#   예측[].metric 지표 경로. 로그 지표는 그대로, DB 지표는 `db.` 접두사
#                 (사용 가능한 경로는 docs/동작점검/auto/YYYY-MM-DD_지표.json 참고)
#   예측[].expect "<= 5" / ">= 95" / "0 ~ 10" 만 자동 판정한다. 그 외는 "수기 판정"으로 남는다
#   상태          pending | confirmed | refuted | inconclusive
#                 **자동으로 바뀌지 않는다** — 사람이 보고서를 쓰면서 손으로 확정한다
#                 (자동 판정이 틀렸을 때 조용히 덮이는 것을 막기 위함)

- id: "2026-08-01-p1-expiry-burst"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "만기유동성 30레그 버스트를 북별 홀수분 슬롯(1/3/5)으로 나누면 mod10=2 충돌이 사라진다"
  근거: "07-31 실측 — 버스트 점유 중앙 55.5초(최대 109초)가 2분대 짝수분 사이클을 덮어 밀림 17건"
  예측:
    - metric: bursts.만기유동성.occupancy_seconds.median
      expect: "<= 20"
    - metric: bursts.만기유동성.calls_per_burst_median
      expect: "<= 12"
  검정: |
    2026-08-03 확정 — 점유 중앙 55.5 → 11.47초, 콜/버스트 중앙 10. 북별 timestamp도 1/3/5분대로 갈렸다(regular 08:31 / weekly_mon 08:33 / weekly_thu 08:35). mod10=2 밀림 17 → 4건.
  상태: confirmed

- id: "2026-08-01-p2-catchup"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "밀린 분을 먼슬리 10레그로 회수하면 먼슬리 커버리지가 95% 이상으로 돌아온다"
  근거: "07-31 실측 — Fix#3(격자 스냅) 이후 밀림 1회 = 결손 1분 확정, 커버리지 95.0%→90.3%"
  예측:
    - metric: db.monthly_coverage.coverage_pct
      expect: ">= 95"
    - metric: rest.calls_per_second
      expect: "<= 0.46"
  주의: "회수 로그가 적게 나오는 건 실패가 아니라 성공 신호다(우선순위 1이 밀림 자체를 줄이면
        발동 횟수도 준다) — 밀림 건수와 회수 건수를 함께 읽을 것."
  검정: |
    2026-08-03 확정 — 먼슬리 커버리지 90.5 → 98.8%, 초당 0.451건. 다만 회수 35회 × 10레그 = +350건이 총수요 증가분(12,947 → 13,364)의 대부분이며, 밀린 직후 페이서가 붐빌 때 10콜을 더 밀어넣는 구조라 EGW00201 비율 악화(0.49 → 0.65%)에 기여했을 가능성이 있다(보고서 §2-5).
  상태: confirmed

- id: "2026-08-01-p3-slow-call-attribution"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "느린 호출을 페이서대기/HTTP로 나눠 재면 mod10=0 구간의 8~9초 정체 원인이 특정된다"
  근거: "07-31 실측 — 연속 지연 에피소드 7건이 전부 mod10=0, 페이서 배율(최대 1.82배)로 설명 불가"
  예측:
    - metric: slow_calls.count
      expect: ">= 1"
  주의: "이 항목은 '고친다'가 아니라 '원인을 특정한다'가 목표다. 페이서대기 우세면 예약 큐 경합,
        HTTP 우세면 KIS 서버/커넥션 풀, 둘 다 작으면 이벤트 루프·스레드풀 블로킹.
        RemoteProtocolError 8건(07-31)이 같은 시각대에 있었던 것도 함께 볼 것."
  검정: |
    2026-08-03 확정 — 933건 수집. 우세 분류는 페이서 450 / HTTP 483으로 반반이나 극단값은 전부 HTTP 쪽이고, 최대 10.00초는 httpx.Client(timeout=10.0) 천장이다(read_timeout 1건). RemoteProtocolError 8건과 함께 원인을 커넥션 풀 재사용 실패로 특정했다(보고서 §2-0 p3 → §4 우선순위 3).
  상태: confirmed

- id: "2026-08-01-p4-cb-heartbeat"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "하트비트를 메시지 핸들러에서 분리하면 updated_at이 장마감까지 300초마다 갱신된다"
  근거: "07-31 실측 — H0UNMKO0은 세션 전이 시에만 오고(하루 2건) updated_at이 09:00:05에 멈췄다"
  예측:
    - metric: db.market_halt.updated_at
      expect: "15:4x (수기 확인)"
  주의: "last_message_at은 09:00 부근에서 멈춰 있어도 정상이다 — 여기에 임계를 두면 상시 오경보."
  검정: |
    2026-08-03 확정 — updated_at 15:41:06(장마감 4분 전)까지 300초 주기 갱신. 단 오늘 H0UNMKO0 수신이 0건이었고(last_message_at NULL) 하트비트가 그 사실을 가렸다 — 예측 자체는 맞았으나 새 문제가 드러났다(보고서 §2-4 → §4 우선순위 4).
  상태: confirmed

- id: "2026-08-01-p5-wall-clock-phase"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "폴러 위상을 벽시계 자정 격자에 앵커하면 설계 표대로 실현된다"
  근거: "07-31 실측 — 설계 35/155/275초가 실측 95/198/305초로 어긋나 있었다(기동 시각 앵커)"
  예측:
    - metric: poller_phase.만기유동성.mode_second
      expect: "13 ~ 17"
    - metric: poller_phase.투자자수급.mode_second
      expect: "38 ~ 42"
    - metric: poller_phase.매크로.mode_second
      expect: "46 ~ 50"
    - metric: poller_phase.계좌잔고.mode_second
      expect: "46 ~ 50"
  검정: |
    2026-08-03 확정 — 만기유동성 16초 / 투자자수급 42초 / 매크로 48초 / 계좌잔고 48초, 4개 전부 예측 구간 안.
  상태: confirmed

- id: "2026-08-01-overall"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "Fix 5종 합산으로 밀림과 결손이 함께 줄고 총수요는 예산 안에 머문다"
  예측:
    - metric: overrun.count
      expect: "<= 30"
    - metric: cycles.missing.unrecovered_count
      expect: "<= 25"
    - metric: rest.capacity_pct
      expect: "<= 50"
  검정: |
    2026-08-03 확정 — 결손(6분 ≤ 25)과 총수요(45.1% ≤ 50)는 확인, 그러나 밀림 39건 > 30으로 반증. 원인은 예측이 틀린 것이 아니라 밀림의 원인이 하나 더 남아 있었기 때문이다: 위클리 2북이 모두 짝수분에 실려 짝수분 사이클이 30레그로 부풀고, 밀림 39건 100%가 짝수 mod10, 결손 41분 중 39분이 홀수분이다(보고서 §2-3 → §4 우선순위 2).
  상태: refuted

# ==========================================================================================
# 2026-08-03 구현분 — 운영점검보고서 2026-08-03 §4(Fix 6종) / §5(고도화 6종).
#
# 이번 회차에 규약이 한 줄 늘었다(README "예측은 '좋아진다'가 아니라 '존재한다'에서 시작한다") —
# 08-03에 예측 13개 중 12개가 확인됐는데도 §2-1의 버그(감마플립 전 이력 미산출)는 **어떤 가설로도
# 잡히지 않았을 것**이다. 아무도 "그 값이 생산되고 있는가"를 적지 않았기 때문이다. 그래서 아래
# p1은 "좋아진다"가 아니라 **"존재한다"** 를 먼저 예측한다.
# ==========================================================================================

- id: "2026-08-03-p1-gamma-flip-exists"
  구현일: 2026-08-03
  검증예정일: 2026-08-04
  가설: "NaN 오염 제거 + 체인 신선도 경계 + ATM 재롤링으로 감마플립이 '존재'하기 시작한다"
  근거: "08-03 실측 — find_gamma_flip()이 41개 그리드 전 구간 NaN(iv=0 레그 1개가 합계를 오염),
        latest_option_chain()이 246레그 중 오늘 수집분 10개(만기 지난 것 156개, 최고령 4주),
        roll_to_spot()이 WS 연결당 1회만 호출돼 행사가가 07:31 값 1042.5~1052.5에 하루 종일 고정
        (그날 시장은 983~1015). 셋 다 고쳤다."
  예측:
    - metric: db.signal_reach.member_count_max
      expect: ">= 3"
    - metric: db.signal_reach.gamma_flip_pct
      expect: ">= 80"
    - metric: db.signal_reach.chain_age_seconds_max
      expect: "<= 900"
  주의: "**감마플립 산출률이 세 지표 중 가장 약하다** — ATM±2(북당 5행사가)라 GEX(S) 부호가
        탐색 범위(±5%) 안에서 안 바뀔 수 있다. 80% 미달이면 그건 코드 실패가 아니라 '행사가 창이
        좁다'는 뜻이며, 보고서 §4 '사용자 결정 대기 #1'(GEX 전용 광폭 체인)로 넘긴다.
        반대로 member_count_max가 3 미만이면 그건 진짜 실패다."
  상태: pending

- id: "2026-08-03-p2-flat-minute-load"
  구현일: 2026-08-03
  검증예정일: 2026-08-04
  가설: "위클리 월/목을 짝/홀 분으로 나눠 태우면 밀림과 결손이 함께 준다(총 REST 수요는 불변)"
  근거: "08-03 실측 — 밀림 39건의 100%가 짝수 mod10, 결손 41분 중 39분이 홀수분. 짝수분 30레그 /
        홀수분 10레그의 3:1 쏠림이 원인이고, 나눠 태우면 매 분 20레그로 평탄해진다.
        분당 호출 수 14~36 → 23~34, 평균 26.8건/분은 그대로."
  예측:
    - metric: overrun.count
      expect: "<= 15"
    - metric: cycles.missing.count
      expect: "<= 15"
    - metric: rest.calls_per_second
      expect: "0.42 ~ 0.46"
    - metric: db.monthly_coverage.coverage_pct
      expect: ">= 98"
  주의: "폴러 위상도 함께 옮겼다(만기유동성 15→30초, 투자자수급 40→50초, 매크로 168→150초,
        계좌잔고 288→270초). mod10별 REST평균의 최대-최소가 39.3초에서 20초 이하로 좁혀지는지를
        자동 리포트 §3에서 함께 볼 것 — 밀림 건수만 보면 '왜 줄었는지'를 알 수 없다."
  상태: pending

- id: "2026-08-03-p3-connection-pool"
  구현일: 2026-08-03
  검증예정일: 2026-08-04
  가설: "커넥션 풀을 좁히고 keep-alive를 늘리면 RemoteProtocolError와 타임아웃이 준다"
  근거: "08-03 §2-0 p3 — 느린 호출 933건의 극단값이 전부 HTTP 쪽이고 최대 10.00초가
        httpx.Client(timeout=10.0) 천장이었다. RemoteProtocolError 8건(07-31도 8건)은 KIS가 먼저
        닫은 keep-alive 커넥션 재사용 패턴이다. 호출이 페이서로 직렬화되므로 풀이 넓을 이유가 없다."
  예측:
    - metric: qualitative.remote_protocol_error
      expect: "<= 2"
    - metric: qualitative.read_timeout
      expect: "0"
    - metric: backoff.max_multiplier
      expect: "<= 2.3"
    - metric: log_volume.human_lines
      expect: "<= 2500"
  주의: "느린 호출 계측을 WARNING→INFO, 임계 3.0→5.0초로 바꿨으므로 slow_calls.count는 정의가
        달라져 전일 비교가 무의미하다 — 건수 자체가 아니라 remote_protocol_error/read_timeout을
        본다. human_lines 감소분은 해외시세 트레이스백 제거(약 306줄)와 WARNING 강등이 섞여 있다."
  상태: pending

- id: "2026-08-03-p4-market-op-subscription"
  구현일: 2026-08-03
  검증예정일: 2026-08-04
  가설: "구독 ACK을 기록하면 '구독이 안 걸린 것'과 '이벤트가 없었던 것'이 구분된다"
  근거: "08-03 실측 — H0UNMKO0 수신 0건(07-31은 1건)인데 하트비트가 정상이라 배지가 초록이었다.
        last_message_at에는 임계를 걸 수 없다(정상일에도 하루 0~2건)."
