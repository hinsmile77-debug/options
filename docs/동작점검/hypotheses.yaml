- id: "2026-08-06-fix6-downtime-axis"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "결손을 미가동/인프라로 가르면 결손 증가가 인프라 회귀로 오독되지 않는다"
  근거: |
