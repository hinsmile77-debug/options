- id: "2026-08-12-g2-retention-pool-rebind"
  가설: |
    재연결 시 유지 풀이 쥔 클라이언트까지 교체하면, 단 한 번의 네트워크 리셋이 재연결 폭주로
    번지지 않는다.
  검증예정일: 2026-08-13
  근거: |
    **08-12 §7-1의 답이다. 그날 31회의 재연결은 KIS도 네트워크도 아니라 우리가 만든 것이었다.**

    `RollingSubscriptionManager.rebind()`는 매니저의 `_ws`만 새 클라이언트로 바꾸고 풀에는
    `clear()`만 불렀다. 풀은 `main.py`에서 **기동 시 한 번** 생성되므로(`SubscriptionRetentionPool(ws_client)`)
    그 뒤로 영원히 **첫** 클라이언트를 쥔다.

    유지된 구독은 슬롯을 그대로 먹으므로 장중 활성은 상한 근처까지 찬다(08-12 실측 축출 51건 =
    실제로 상한에 닿았다는 증거). 그 상태에서 재연결하면:

        free = 41 - len(죽은 클라의 active) = 41 - 39 = 2      ← 얼어붙은 값
        ensure_free(needed) → 2 < needed + 2 → 축출 루프 진입
        await self._ws.unsubscribe(sub)   ← **죽은 커넥션에 send** → ConnectionClosedError

    그 예외가 `listen()`을 뚫고 올라가면 **WS 단절로 처리되어 또 재연결**된다. 새 연결은
    멀쩡한데 풀은 여전히 첫 클라이언트를 쥐고 있으므로 다음 ATM 롤에서 같은 일이 반복된다.

    관측된 사실이 전부 이 설명과 맞는다:
      · 끊김이 **ATM 롤이 있는 분에만** 몰렸다(창이 안 움직이면 `ensure_free`가 안 불린다) —
        09:29~09:35, 09:38~10:01의 조용한 구간이 그것이다.
      · 10:14 재기동 뒤 **0회**다(새 프로세스 = 새 풀 + 새 클라이언트).
      · 08-04·08-11은 각 1회였다 — 그날은 첫 단절 뒤 이 경로를 다시 밟지 않았다.

    같은 객체로 재현했고(`tests/test_data_subscription_manager.py`) 되돌리면 그 테스트가 깨진다.
  예측:
    - metric: ws_disconnect.count
      expect: "수기 판정(주장) — **한 번 끊긴 날에 그 뒤로 연쇄가 안 붙는가**. 08-12는 1 → 31이었다. 조용한 날의 0으로 반증하지 말 것(경로가 안 돈다)"
      역할: 주장
    - metric: ws_disconnect.busiest_hour_count
      expect: |
        수기 판정(주장) — **한 시간대에 단절이 몰려 있는가**(연쇄) 아니면 흩어져 있는가(산발).
        08-12는 09시 22회 / 10시 9회로 극단적 연쇄였다. **부등식을 걸지 않는다**: 이 값은 그날
        네트워크·KIS 상태에 비례하고(규약 F), 진짜 장애가 긴 날에는 고쳐도 커질 수 있다.
        판정은 §11-2의 시간대 분포를 사람이 읽어서 한다.
      역할: 주장
    - metric: db.ws_status.atm_roll_dropped_subs_today
      expect: "수기 판정(대가) — 축출은 **계속 일어나야 한다**(08-12 실측 51건). 0이 되면 풀이 새 클라이언트의 슬롯을 못 보고 있다는 뜻이라 반대쪽 고장이다"
      역할: 대가
  주의: |
    ⚠ **재연결이 애초에 0인 날에는 이 fix를 검정할 수 없다.** 그날은 이 경로가 한 번도 안 돈다 —
    `ws_disconnect.count == 0`은 「고쳤다」가 아니라 「일할 일이 없었다」이다.
    ⚠ `busiest_hour_count <= 3`은 **연쇄가 아닌 산발**을 뜻한다. 진짜 네트워크 장애가 긴 날에는
    이 값이 커질 수 있고 그때는 §11-2의 시간대 분포를 사람이 읽는다.
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: WS 단절 **0회** · 축출 292건.
    단절이 0인 날로 이 가설을 반증하지 않는다(가설 본문 명시). 축출 292 > 0이므로
    **반대쪽 고장(풀이 아무것도 안 비움)은 아니다**는 것까지가 이 날 말할 수 있는 전부다.
  상태: inconclusive

- id: "2026-08-12-g1-reconnect-as-cost"
  가설: |
    재연결 횟수를 시간대별로 세고 「봉은 있는데 레짐이 없는 분」을 나란히 인쇄하면, 재연결의
    비용이 처음으로 지표가 된다.
  검증예정일: 2026-08-13
  근거: |
    08-12에 31회가 레짐 30분을 먹었는데 **둘 다 지표로는 안 보였다.** 단절은
    `qualitative.ws_reconnect`(최초 1건)와 `failures`(재연결 후 재단절)로 나뉘어 세어졌고
    시각이 없어 편중을 물을 수 없었다. 레짐 결손은 어디에도 없었다 — 봉은 멀쩡히 적재됐고
    레짐만 조용히 빠졌으며, 그 사실은 DB 두 테이블을 손으로 대조해야 보였다.

    §11-2를 08-12 로그로 재집계하니 단절 31회(09시 22 / 10시 9)와 결손 30분이 그대로 나왔다.
  예측:
    - metric: ws_disconnect.count
      expect: ">= 0"
      역할: 주장
    - metric: db.regime_vs_futures_bars.gap
      expect: "== 0"
      역할: 주장
    - metric: db.regime_vs_futures_bars.futures_bar_minutes
      expect: "수기 판정(참고) — 레짐 분 수와 **나란히** 읽는다. 08-12는 406 vs 376(−30)이었다"
      역할: 참고
  주의: |
    ⚠ **`gap == 0`은 구조 불변식이다** — `regime_state`는 선물봉 완성 시에만 쓰이므로 우리 코드가
    보장한다. 08-12에 x1x3이 데인 「바라는 결과를 불변식처럼 적는 것」과 **다른 종류**다
    (그쪽은 KIS가 정하는 값이었다). 이 구분은 `2026-08-10-x1x3`의 `판정근거`에 사례로 남겼다.
    ⚠ **재연결이 0인 날에는 `gap == 0`이 Fix#3을 검정하지 못한다**(경로가 안 돈다).
    판정은 `ws_disconnect.count`와 함께 한다.
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: `ws_disconnect.count` 0 · `regime_vs_futures_bars.gap` 0.
    **존재·계측 축의 확인이다** — 「비용이 지표가 됐는가」는 충족됐고, 값 자체는 조용한 날의 0이다.
  상태: confirmed

- id: "2026-08-12-g5-outcome-by-chain-input"
  가설: |
    사후 평가를 체인 입력 출처로 가르면, **위상 레버(Fix#10)를 켤 가치가 있는지**를 그 축이 답한다.
  검증예정일: 2026-08-13
  근거: |
    08-12에 정규장 판단의 96%가 stale이었고(짝수분 188분 전량, 홀수분도 current 18분뿐)
    그 발견이 Fix#10으로 이어졌다. **그런데 늙은 체인을 본 판단이 실제로 못 맞혔는지는
    아무도 재지 않았다.**

    08-12 첫 실측(표본이 심하게 불균형이라 **판정하지 않는다**):
      current  진입 11건 · 5m 54.5%(11) · 15m 70.0%(10) · 30m 70.0%(10)
      stale    진입 258건 · 5m 54.8%(250) · 15m 62.0%(250) · 30m 59.4%(249)
  예측:
    - metric: db.decision_outcomes.by_chain_input.available
      expect: "수기 판정(주장) — 이 키가 **존재하고 True인가**(존재부터 예측한다 — README 규약)"
      역할: 주장
    - metric: db.decision_outcomes.by_chain_input
      expect: "수기 판정(참고) — 각 출처의 **표본 수**를 함께 읽는다. 08-12는 current 11 / stale 258로 20배 차이라 비교가 성립하지 않는다"
      역할: 참고
  주의: |
    ⚠ **이 가설은 순환에 갇혀 있다(2026-08-14 §5 고도화 3에서 확인).**
    08-14 실측은 `current` **0분** / `stale` 493분이었다. 대조군이 아예 없어 검정 불가였고,
    같은 일이 08-12·08-13에도 있었다 — **세 번째 검정 불가**다.
    `current`가 희소한 것은 우연이 아니라 **구조**다: 옵션체인 폴링이 19~50초 걸리는데
    판단 위상은 `SIGNAL_FUSION_PHASE_OFFSET_SECONDS = 10.0`초다. 판단이 그 분의 체인을
    보려면 폴링이 끝난 **뒤에** 나야 하는데, 위상이 10초면 거의 항상 먼저 난다.
    즉 대조군을 만들려면 위상 레버를 올려야 하는데 — **그 레버의 가치를 재는 것이 바로
    이 가설이다.** 순환이다.
    ⛔ **끊는 방법은 하나뿐이다: 위상 레버를 하루 켜서 대조군을 강제로 만든다.**
    그날의 `current` 표본이 이 가설의 첫 분모가 된다. 켜지 않는 한 이 항목은 매일
    「검정 불가」로 되풀이되고, 그 되풀이가 곧 「위상 레버는 검토된 적 없다」는 뜻이다.
    켜는 날에는 **그날 다른 수집량 레버(E·read timeout)를 함께 켜지 않는다** — 셋 다
    `current` 비율을 움직이므로 축이 섞인다.
    ⚠ **하루로 결론 내지 않는다. 임계도 안 건다.** 두 그룹은 시간대 분포가 다를 수 있다 —
    `current`는 폴링이 빨랐던 분, 즉 **그날 KIS가 한가했던 분**에 몰린다. `_reject_control_group`이
    08-07에 겪은 것과 같은 교란이고, 그쪽은 시간대를 맞춘 뒤에야 읽을 수 있었다.
    ⚠ **stale이 current보다 낮지 않다면 Fix#10의 가치는 우리가 생각한 것보다 작다** —
    그때는 켜는 대가(다른 폴러와의 위상 충돌)를 다시 저울질한다. 며칠 쌓아 부호가 고착되는지부터 본다.
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: `available: True` · 체인 입력 출처 **stale 단독 297건, current 0건**.
    **대조군이 아예 없어 검정 불가다.** 자동 판정은 「확인」을 냈지만 그것은 *키가 존재하는가*
    만 답한 것이고, 이 가설이 재려는 축(current vs stale 성과 차이)은 갈리지 않았다.
    세 번째 검정 불가이며, 순환의 원인은 **폴링 19~50초 > 판단 위상 10초**라는 구조다
    (08-14 §5 고도화 3이 그 순환을 기록했다).
  상태: inconclusive

- id: "2026-08-12-eE-on-congested-hours"
  가설: |
    혼잡 시간대(10~14시)에 위클리 폴링을 2분 → 4분으로 늘리면, 예산 컷이 줄고 **판단이 그 분
    체인을 보는 비율이 오른다**.
  대가: |
    위클리 커버리지가 50% → 약 25%로 반토막 난다. 위클리 만기일에는 그 시간대가 핀 리스크의
    유일한 관측 창이므로, 만기일 판정은 이 값과 함께 읽어야 한다.
  검증예정일: 2026-09-02
  전제레버: OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS
  # 2026-08-13 §5 고도화 5가 권고한 날짜를 **숫자로 박는다**. 이 날이 지났는데 레버가 꺼져
  # 있으면 `tests/test_ops_hypotheses.py::test_repo_levers_have_not_blown_their_unconditional_deadline`
  # 이 실패한다 — 유예를 계속하려면 **날짜를 옮기고 사유를 적는 수밖에 없다**(그것이 요지다).
  # ===== 2026-08-16 — 여덟 번째 유예. **사유를 적는다**(이것이 규약이 요구하는 유일한 대가) =====
  #
  # 사유: **2026-08-18이 모의투자 개시일로 확정됐다.** 그날 바뀌는 것은 주문 경로 배선
  #       (ExecutionEngine ⑨~⑫ + CONFIRM 게이트)이고, 그것이 그날의 **단일 변수**다.
  #       E는 폴링 총량과 판단 신선도를 동시에 움직이므로(위 08-12 근거), 개시일에 함께 켜면
  #       그날 진입/체결 지표의 변화를 주문 배선과 폴링 변경 중 무엇이 만들었는지 영영 못 가른다.
  #       「하루에 변수 하나」는 이 저장소가 08-04 p4에서 배운 것이고, 개시일만큼 그 원칙이
  #       중요한 날이 없다.
  #
  # 이것은 **결정된 유예이지 잊힌 유예가 아니다** — 앞선 일곱 번은 사유가 적힌 적이 없었다.
  # 새 날짜는 개시 주간(08-18~08-21)이 끝난 다음 거래일이다. 그때는 주문 경로가 이미 며칠치
  # 기준선을 갖고 있으므로 E의 효과가 분리돼 보인다.
  # ===== 2026-09-02 (09-02 §1-3 / 제4부 P2-1-a) — **실제 켠 날로 옮긴다** =====
  #
  # 09-01은 「이때까지는 켜라」였고, 실제로 켜진 날은 **2026-08-31 저녁**(사용자 승인,
  # 무조건발동일보다 하루 앞섬 — 아래 검정의 「2026-08-31 저녁」 절 참고)이다.
  # 레버 F(`use_effective_member_count`)를 08-31에 같은 이유로 정리한 것과 같은 처분이다.
  #
  # ⚠ **유예 이력을 지우지 않는다.** 위 아홉 차례 유예 주석과 `유예횟수: 9`는 그대로 둔다 —
  # 「아홉 번 미뤘고 열 번째에 사람이 켰다」가 이 레버의 사실이다.
  발동일: 2026-08-31
  무조건발동일: 2026-08-31
  유예횟수: 9
  근거: |
    **발동 조건이 네 번 성립했고 네 번 미뤘다**(08-06 / 08-07 / 08-10 / 08-11). `2026-08-11-eE`가
    *"08-13에 새 유예 사유가 없으면 켠다"* 로 못 박았고, 08-12에도 이틀 연속 14구간이 성립했다
    (`inquire-price` 10·11·12·13·14시 포함).

    **08-12에 이 레버의 성격이 하나 더 밝혀졌다(고도화 4).** 어제까지 E는 「호출 총량을 줄이는」
    레버였는데, §2-5가 그것이 **판단 신선도 레버이기도 하다**는 것을 보여 줬다: 짝수분이
    20레그라서 늦는 것이므로(폴링 19.3초 > 판단 위상 10초) 짝수분을 10레그로 만들면 위상을
    안 건드려도 `current`가 나올 수 있다. **즉 E는 Fix#10의 대체재일 수 있다.**

    켤 값은 08-10 실측으로 정해져 있다:
      OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS = {10: 4, 11: 4, 12: 4, 13: 4, 14: 4}
    절감 규모(08-10 실측): 혼잡 5시간의 위클리 행 1,435 → 약 700콜/일(옵션체인의 9.5%).
    **먼슬리는 어느 시간대에도 안 건드린다 — 판단 입력이다.**
  예측:
    - metric: budget_exceeded.count
      expect: "수기 판정(주장) — 08-12 기준선 **74건**. 줄어야 한다. 건수라 규약 F에 걸리므로 수기로 읽는다(그날 KIS 상태에 비례한다)"
      역할: 주장
    - metric: db.signal_reach.chain_input_source.stale_pct
      expect: "<= 70.0"
      역할: 주장
    - metric: db.book_coverage
      expect: "수기 판정(대가) — 위클리 커버리지가 50% → **약 25%**로 내려가야 한다. 안 내려갔으면 레버가 실제로 안 켜진 것이다"
      역할: 대가
    - metric: db.signal_reach.gex_input_missing_minutes
      expect: "수기 판정(대가) — 08-12 기준선 4분. 위클리를 덜 봐도 **먼슬리(GEX 입력)는 그대로여야 한다**"
      역할: 대가
  주의: |
    ⚠ **`rest_latency` p95를 주장 지표로 쓰지 않는다.** §17 교차점검이 이 지연을 **KIS 귀속**으로
    판정했다 — 우리가 콜을 줄여도 그들의 p95는 안 바뀐다. 줄어드는 것은 **우리의 노출**이다.
    ⚠ **`stale_pct <= 70`의 근거**: 08-12 실측 84.7%(정규장 96%)에서 짝수분 폴링이 20 → 10레그로
    반이 되면 짝수분의 상당수가 `current`로 넘어와야 한다. 정확한 값은 모르므로 **여유 있게** 잡았다 —
    이 값이 거의 안 내려가면 그것이 곧 「E는 신선도 레버가 아니다」의 답이고, 그때 Fix#10을 켠다.
    ⚠ **Fix#4(조기 포기 북 우선순위)와 같은 날 실린다.** 둘 다 위클리 레그 수를 움직이므로
    귀속을 위해 각자의 지표를 따로 읽는다: E는 위 넷, Fix#4는 `timeout_abort.priority_before_others_minutes`.
    ⚠ **08-13은 먼슬리 만기일이다.** 만기 당일 북은 잔존만기 0이라 감마플립이 정의되지 않는다 —
    `gamma_flip_pct`로 이 레버를 판정하지 말 것.
  판정근거: |
    ⚠ **2026-08-14: 여덟 번째 미실행.** `OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS`가 `{}`로
    꺼진 채였다. 규약 H에 따라 「미실행」이다.

    **`pending`을 유지하고 검증예정일을 옮긴다**(08-12 선례) — 닫으면 레버를 켜는 날
    검정할 항목이 없어진다. 유예 사유는 위 `발동일` 주석에 문자로 적었다(개시일의 단일
    변수는 주문 경로여야 한다). 새 예정일은 발동일(08-25)의 다음 거래일이다.

    ⚠ 08-14는 이 레버의 판정에 **최악의 날**이었다 — KIS 지연으로 옵션체인이 84분 연속
    0행이었으므로, 설령 켜져 있었어도 `budget_exceeded` 감소를 이 레버에 귀속시킬 수 없었다.


    ===== 2026-08-23 — **아홉 번째 유예. 사유를 적는다(선택지 B)** =====

    08-21 장후 보고서 「사용자 조치 6」에서 사람이 **B**를 골랐다. 사유는 08-16의 것과 다르다 —
    이번에는 **레버가 겨냥한 현상 자체가 사라졌다**:

      · 이 레버는 「혼잡 시간대(10~14시)에 위클리를 덜 불러 예산 컷을 줄인다」였고, 그 전제는
        `:00`/`:30` 호출 몰림이었다. **그 위상 집중이 사흘 추이에서 사라졌다**(08-20 §6-1:
        08-18 2.54배 → 08-19 1.68배 → 그 뒤 균등선 근처).
      · 08-21의 절벽은 위상이 아니라 **하루 전체를 덮은 KIS 응답 지연**이었고(11:10~15:31),
        그 지연은 **장이 끝나자 저절로 끝났다**(§1-14). 우리 레그 수를 줄이는 이 레버는
        그런 하루에 듣지 않는다 — 총 REST 수요가 이미 전일의 84%였는데 무너졌다.

    **즉 지금 켜면 「효과 없는 변경」을 켜는 것이고, 그날 숫자로는 효과 유무도 판정할 수 없다.**
    그래서 켜지 않는다. 새 기한은 **2026-09-01**이다 — 그때까지 위상 집중이 이틀 연속으로
    다시 서면(`slow_calls.censored.phase_ratio` 2배 이상) 그것이 발동 조건이고,
    안 서면 그날 **기각을 검토한다**(유예를 열 번째로 넘기지 않는다).

    이것은 **결정된 유예다** — 앞선 일곱 번은 사유가 아예 없었고, 08-16과 오늘 둘만 사유가 있다.

    ===== 2026-08-31 저녁 — **켰다.** 무조건발동일(09-01)을 하루 앞두고 사용자 승인 =====

    08-26 이후 「위상 집중이 이틀 연속으로 다시 서는가」를 이 항목이 스스로 확인하지는
    않았다 — **사용자가 대화에서 직접 발동을 지시했다.** 08-31 장후 자동조치 §3-3(가)의
    권고(A: 켠다 — 유예 9회 사유 0회, 그날 예산 컷 234건 중 233건이 이미 위클리를
    잘라내고 있었다)를 그 자리에서 받아들인 것이다. 조건부 기각 검토(위 문단)는 **일어나지
    않았다** — 그래서 이 활성화는 「위상 집중 재발」의 확인이 아니라 **사람의 결정**으로
    닫힌다.

    `mahdi/main.py`의 값을 `{10: 4, 11: 4, 12: 4, 13: 4, 14: 4}`로 바꿨다. 마흐디 프로세스가
    안 떠 있는 상태(장 마감 후)에서 값만 바꿨으므로 **효력은 다음 07:30(2026-09-01) 기동부터**다
    — 지금 재기동을 강제하지 않았다(봉 30개 대가를 피한다).

    예측치는 새로 적지 않는다 — 위 `예측:` 넷이 그대로 검정 축이다. **09-01 장후 회차가
    첫 실측으로 판정한다.**
  상태: pending

