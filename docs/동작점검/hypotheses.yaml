    - metric: watchdog.checks
      expect: "수기 판정(대가) — 08-14 실측 49건 근처를 유지하는가. **DB 조회가 워치독 자신을 느리게 만들면 여기가 먼저 준다** — 그때는 이 fix가 08-12의 실패를 재현한 것이다"
      역할: 대가
    - metric: watchdog.max_silence_minutes
      expect: "수기 판정(대가) — 08-14 실측 10분. 적재 조회(상한 2초)가 판정 주기를 밀지 않았는가"
      역할: 대가
  주의: |
