        6,206줄(82%)이 그 churn이었다. **구현 후 08-04 스팟 시계열로 리플레이해 예측치를 정정했다**:
        히스테리시스는 롤링 182→131회 / 왕복 36→10회로 줄이지만 10분 창 안 행사가 수는
