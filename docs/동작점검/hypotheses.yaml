- id: "2026-08-31-wiring2-v3-stream-down-is-off-the-hour"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    체결통보 스트림 끊김을 재는 축이 「하루 N회」가 아니라 **「정각 외 끊김이 있는가」**다 —
    매시 정각 1회는 KIS 쪽 세션 경계이고 **폭주가 아니다.**
    `2026-08-26-wiring2-v2`의 대가 축 교체판이다(그 항목은 대가 반증으로 닫혔다).
  대가: |
    ⛔ **상한을 올려서 통과시키는 것이 아니다.** 옛 축의 `<= 5`는 그대로 두고 **세는 대상**을
    바꾼다. 새 축에서 **정각 외 끊김이 1건이라도 나오면 그날은 조사 대상**이다 —
    08-12 밤의 재연결 폭주(레이트리밋 소진)를 잡으려던 원래 목적은 새 축이 그대로 잇는다.
  근거: |
    08-31 §1-7 · §3-6 — 08-31 끊김 8건이 **전부 매시 정각 1회**였고(08~15시) **정각 외 0회**,
    매번 **2초에 재연결**됐다. 옛 축(`<= 5`)에서는 이 정상 동작이 매일 반증으로 찍힌다.
    08-31 dev_memory 초안 3이 *「임계는 「하루 N회」가 아니라 「정각 외 끊김이 있는가」로 세는
    것이 맞고, 그에 따라 대가 예측을 새 축으로 재등재한다」*로 지시했고 그 문장을 옮겼다.

    ⚠ **이 재등재가 성립하는 이유는 `2026-08-26-p2-4` 덕분이다** — 끊김 줄에
    `(연속 N회 · 오늘 M회)` 꼬리표가 붙어 있어야 정각/정각 외를 시각으로 가를 수 있다.
    그 fix가 오늘 `confirmed`로 닫혔고, 이 항목이 그 위에 선다.
  예측:
    - metric: qualitative.order_notice_stream_down
      expect: "수기 판정 — 그날 끊김 줄의 시각을 훑어 **정각(:00:0x) 외 끊김이 0건인가.** 0이 아니면 그날은 반증이 아니라 조사 대상이다"
      역할: 주장
    - metric: qualitative.order_notice_stream_down
      expect: "수기 판정(대가) — 옛 축의 상한 `<= 5`를 **손대지 않았는가.** 숫자를 보고 임계를 올린 흔적이 있으면 이 재등재는 실패다"
      역할: 대가
  주의: |
    ⚠ **끊김이 0건인 날은 주장 축이 판정 불가다**(규약 C) — 그날은 볼 줄 자체가 없다.
    ⚠ **이 축은 그날 KIS 상태에 비례한다**(규약 G) — 정각 끊김 횟수 자체는 관측 시간대 길이의
    함수다(08~15시면 8회가 정상값이다). 세는 것은 **횟수가 아니라 시각의 규칙성**이다.
    ⚠ **자동 판정 축이 아직 없다.** 「정각 외인가」를 세는 카운터는 이 회차가 만들지 않았다 —
    만들려면 로그 시각을 분류하는 새 계측이 필요하고, 그것은 표본 하루로 착수할 일이 아니다.
    표본이 사흘 쌓이면 그때 축을 기계화한다.
  검정: |
    2026-09-02 장후 자동조치 — **확정.** 스트림 끊김 8건이 **전부 정각**(`:00:0x`)이고
    **정각 외 끊김은 0건**이다(08:00:01 · 09:00:02 · … · 15:00:02 — 09-02 회차가 로그를
    직접 훑어 예외 없음을 확인). 새 축이 물은 그대로 답이 나왔다.
    **대가 축도 통과** — 옛 축의 상한 `<= 5`는 손대지 않았다(숫자를 보고 임계를 올린 흔적 없음).
  상태: confirmed

- id: "2026-08-31-p1-1-uncomputable-flip-says-what-it-was-fed"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    「감마플립 산출 불가」 줄이 **그 판단이 무엇을 먹었는지 같은 줄에서 말한다** —
    뒤에 `· 직전 분 적재 {rows}행({분})`이 붙는다.
    **다음에 rows<6인 분이 나오는 날, 그 줄 하나만 인용해 1-10형 이상점을 쓸 수 있다.**
  대가: |
    ⛔ **동작은 한 글자도 안 바뀐다.** 문구만 길어진다. 기존 파서가 부분문자열
    「감마플립 산출 불가」로 세므로 **그 문구는 그대로 두고 뒤에만 덧붙인다** —
    08-04에 문구가 움직이며 정규식이 눈이 멀어 362건이 0건으로 보고된 전례가 있다.
  근거: |
    08-31 §1-10 · 제4부 P1-1 — 오늘 이 인과(감마플립 산출 불가 ← 직전 분 적재 6레그 미만)를
    잇는 데 **사람이 로그 두 종류를 시각으로 맞춰 붙여야 했다.** 한 줄 안에 있으면
    **다음 사람은 안 붙여도 된다.** 리포트 P1-1 본문의 「바꿀 것」·「왜」를 그대로 옮겼다.

    ⚠ **계획을 현재 코드 기준으로 다시 세웠다**(함정 게이트). 리포트는 *"`rows`는
    `mahdi/main.py`의 「옵션체인 사이클 소요 분해」가 이미 들고 있는 값이므로 전달만 한다"*고
    적었는데, 그 값은 **수집 폴러의 지역 변수**이고 `find_gamma_flip` 호출부
    (`main.py:3999` `build_signal_inputs`)와 다른 코루틴에 있다. 모듈 사이로 새 전역 상태를
    끌고 가는 대신, **호출부가 이미 손에 쥔 같은 사실**을 넘긴다 — `chain_rows`(그 판단이
    실제로 읽은 스냅샷)의 행 수와 그 스냅샷의 분이다. **재는 값은 같고 배선만 짧다.**
  예측:
    - metric: qualitative.gamma_flip_uncomputable
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.gamma_flip_uncomputable
      expect: "수기 판정 — 산출 불가 줄에 `직전 분 적재 N행(HH:MM)`이 실리고, 그 값이 같은 분의 체인 적재와 어긋나지 않는가"
      역할: 주장
    - metric: qualitative.gamma_flip_out_of_leg_range
      expect: ">= 0"
      역할: 대가
  주의: |
    ⚠ **주장 `>= 0`은 경로 생존 확인이다**(규약 F) — 건수는 그날 KIS 응답 형태에 비례한다(규약 G).
    ⚠ **산출 불가가 0건인 날은 수기 축이 판정 불가다**(규약 C) — 볼 줄이 없다. 그런 날에도
    키는 0으로 인쇄된다(`_QUALITATIVE_ALWAYS_PRESENT` 등록 — 고도화 4가 같은 커밋에서 한다).
    ⚠ **대가 축이 「기각」인 이유**: 이 줄과 「감마플립 기각(레그 범위 밖)」은 **다른 사건**이고,
    한쪽을 건드리다 다른 쪽 카운터가 흔들리면 08-19형 사고(폐기된 진단을 되살림)의 입구가 된다.
    두 축이 **각자 따로** 세어지는가를 대가로 잡는다(고도화 4가 그 분리를 만든다).
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-09-02 장후 자동조치 — **확정.** 「산출 불가」 줄에 `직전 분 적재 N행(HH:MM)` 형식이
    그대로 실렸다(15:01 · 15:16 등 확인). 형식이 **이틀째 안정적으로 유지**된다.
  상태: confirmed

- id: "2026-08-31-p1-2-censoring-and-p95-reach-the-red-flags"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    §12 자동 적신호가 **p50만 보던 눈을 둘 더 뜬다** —
    ① 같은 창의 **검열률이 30% 이상**이면 p50과 **별개의 줄**로 올라온다,
    ② **`p95/timeout >= 1.0`인 창**도 같은 절에 올라온다(08-27 미완료 P2-E).
  대가: |
    **적신호가 하루 몇 줄 느는가**가 대가다. 두 줄이 p50 줄과 **겹쳐 뜨는 날**이 있고 그것은
    중복이 아니라 **다른 축이 같은 시각을 가리키는 것**이다. 사람이 훑어 낼 수 있는 분량
    (합쳐 하루 5줄 이하)을 넘으면 임계가 아니라 **요약 방식**을 고친다.
  근거: |
    08-31 §1-11 · 제4부 P1-2 — 오늘 **두 축이 다른 속도로 움직였다**:
    `14:05` 창 검열 **27%** → `14:10` 창 **40%** 인데 같은 구간 p50 비율은 **0.72 → 0.86**이었다.
    **p50만 보는 눈은 그 급등을 못 본다.**
    그리고 오늘 `p95/timeout`은 **98창 중 대부분이 1.00~1.01**이었는데 적신호에 **한 줄도**
    안 올라왔다 — 08-27이 P2-E로 지시한 자리가 나흘째 비어 있었다.
  예측:
    - metric: rest_latency.censored_window_count
      expect: ">= 0"
      역할: 주장
    - metric: rest_latency.p95_by_hour
      expect: "수기 판정 — 검열률 30% 이상인 창이 있는 날, §12가 그것을 **p50과 별개의 줄로** 내는가. 그리고 `p95/timeout >= 1.0` 창이 한 줄로 올라오는가"
      역할: 주장
    - metric: rest_latency.p95_by_hour
      expect: "수기 판정(대가) — 두 줄이 합쳐 하루 5줄을 넘지 않는가. 넘으면 고칠 것은 임계가 아니라 요약 방식이다"
      역할: 대가
  주의: |
    ⚠ **검열률 30%는 임계 완화가 아니라 새 축의 첫 잠정선이다.** 정상 분포를 모르므로
    며칠 쌓고 사람이 정한다(08-05 스팟 괴리율에서 한 실수를 반복하지 않는다).
    ⚠ **검열을 못 센 날(`censored_measured = false`)은 이 줄을 내지 않는다** — 「0%」와
    「안 셌다」를 같은 글자로 찍으면 이 fix가 헛경보 생성기가 된다(규약 C).
    ⚠ 이 fix는 **재기동이 필요 없다** — 수집기는 장중·장후에 따로 돈다.
  검정: |
    2026-09-02 장후 자동조치 — **확정.** 검열 창 **49/98** · p95 위험선 창 **14/98**이
    증거 §5-1에 **매 회차 별개의 두 줄로** 분리돼 인쇄된다 — p50 줄과 겹치는 날에도 그렇다.
    **대가 축도 통과** — 두 줄이 합쳐 하루 5줄을 넘지 않았다(요약 방식을 고칠 필요 없음).
  상태: confirmed

- id: "2026-08-31-p1-3-a-missing-round-is-reconstructed-not-erased"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    결번된 회차가 **지워지지 않고 사후 재구성으로 남는다** — 08-27 파일이 종합 완성본으로
    닫히고, 08-28 파일이 `⏰ 사후 작성` 표식과 함께 생긴다.
    **다음 거래일 장전의 증거 §8-1이 「전일 보고서를 못 찾았다」를 내지 않는다.**
  대가: |
    ⛔ **없는 국면을 있었던 척하지 않는다.** 08-28은 관측이 없던 국면을 「관측 없음」이라고
    쓴다. 그리고 **08-27의 앞 절은 한 글자도 고치지 않는다** — 끝에 붙이기만 한다.
    사후 재구성이 원본을 덮으면 그것이 이 항목이 막으려는 것이다.
  근거: |
    08-31 §1-1 · 제4부 P1-3 · 사용자 조치 16 — 08-27이 장중 ①에서 끊겼고 08-28은 아예 없다
    (회차 6개 결번). ⚠ **오늘 저녁이 사실상 마지막 기회다**: `observation_loop.log.1`의
    최종수정이 **08-28 08:36**이고 로그는 10MB×10 롤링이라 **다음 롤링에 그날 원본이 사라진다.**
    지표 사이드카(`auto/2026-08-27_지표.json` · `auto/2026-08-28_지표.json`)는 남지만
    **원본 인용은 못 하게 된다.**
  예측:
    - metric: qualitative.rest_latency_pressure
      expect: "수기 판정 — 다음 거래일 장전 증거 §8-1이 **직전 보고서를 찾고**(「못 찾았다」가 아니고), 그 지시 이행 표가 빈칸이 아닌가"
      역할: 주장
    - metric: qualitative.rest_latency_pressure
      expect: "수기 판정(대가) — 08-27 파일의 장전·장중 ① 본문이 **한 글자도 안 바뀌었는가**(git diff로 확인). 08-28 파일에 없는 국면이 「관측 없음」으로 적혀 있는가"
      역할: 대가
  주의: |
    ⚠ **이 항목의 주장 지표는 문서 존재이지 로그 축이 아니다** — `metric` 경로는 자동 판정을
    받으려고 적은 것이 아니라 규약상 자리를 채운 것이고, **판정은 전부 수기다.** 그 사실을
    숨기지 않는다(`2026-08-26-adv3`와 같은 형태).
    ⚠ **사후 재구성은 관측을 만들어 내지 않는다.** 08-28 파일이 답할 수 있는 것은 사이드카가
    담은 것까지이고, 그 밖은 영영 빈칸이다 — 그 빈칸이 결번의 진짜 대가다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표) — **확인.**
    오늘 장전 증거 §8-1이 직전(09-02) 보고서를 정상적으로 찾아 미완료 체크박스 0건으로 확인했다.
    ⚠ 결번 회차가 오늘 발생하지 않아 「사후 재구성」 자체는 검정 대상이 없었다 —
    **탐지 메커니즘이 정상 작동한 것**까지가 오늘 확인된 범위다.
  상태: confirmed

- id: "2026-08-31-p1-4-a-denominator-of-one-says-so"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    확신도의 **분모가 1일 때 로그가 그렇다고 말한다** — `use_effective_member_count`가 켜져
    있고 `effective_member_count <= 1`이면 「판단 형태 전이」 줄 끝에
    `· ⚠ 분모 1 — 합의비율 구조적 1.00`이 붙는다.
  대가: |
    ⛔ **동작은 바꾸지 않는다. 임계도 걸지 않는다 — 계측이 먼저다**(08-21 사용자 조치 7의 원칙).
    며칠 쌓아 「분모 1이 하루에 몇 번, 몇 시에 나는가」를 안 뒤에 사람이 정한다.
    기존 파서(`collect_evidence.MEMBER_RE`)가 이 줄을 계속 읽는가가 대가 축이다.
  근거: |
    08-31 §1-15 · 제4부 P1-4 — **레버 F(`use_effective_member_count`)의 극단이 처음 관측됐다.**
    분모가 1이면 합의비율이 구조적으로 1.00(최댓값)이 되고, 오늘 그 상황에서
    `HIGH_CONVICTION`이 **3건**(14:51 · 14:54 · 15:36) 났다.
    `strategy_params.yaml:72-77`이 「확신도는 오른다」까지는 예고했으나 **이 극단은 안 적혀 있다.**

    ⚠ **왜 지금 동작을 안 바꾸는가**(리포트 P1-4 본문 그대로): 레버 F는 08-23에 다섯 번 만에
    켠 것이고 그 파일이 「확신도는 오른다」를 **예측으로 적어 뒀다.** 그 예측이 맞는 중인데
    되돌리면 **무엇이 무엇을 만들었는지 영영 못 가른다.**
  예측:
    - metric: qualitative.member_axis_exit
      expect: ">= 0"
      역할: 참고
    - metric: db.decisions.member_count.effective_min
      expect: "수기 판정 — `비영 1`이 나는 분에 이 꼬리표가 붙는가. 그리고 **14:50 이전**에 붙는 날이 오는가(08-31 3건은 전부 컷오프 뒤였다)"
      역할: 주장
    - metric: qualitative.member_axis_exit
      expect: "수기 판정(대가) — 문구가 길어진 뒤에도 `collect_evidence`의 멤버 파서가 같은 값을 계속 내는가. 08-04에 문구가 움직여 362건이 0건이 된 자리다"
      역할: 대가
  주의: |
    ⚠ **분모 1이 0건인 날은 주장 축이 판정 불가다**(규약 C) — 붙을 줄이 없다.
    ⚠ **꼬리표는 「판단 형태 전이」 줄의 끝에만 붙는다** — 그 줄은 전이 때만 찍히므로
    분모 1이 여러 분 이어져도 **줄은 전이 시점에 하나**다. 그것이 억제이고, 하루 30줄을
    넘길 구조가 아니다(08-31 실측 3건).
    ⚠ **레버가 꺼진 날은 이 항목이 판정 불가다**(규약 H) — 꼬리표 자체가 안 붙는다.
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-09-02 장후 자동조치 — **주장 축 확정(로그 정확성).** 오늘 분모 1이 2건
    (07:31 · 15:36)이고 **둘 다 꼬리표가 정상**으로 붙었다. 대가 축(문구가 길어진 뒤에도
    멤버 파서가 같은 값을 내는가)도 통과.
    ⚠ **한 칸은 열린 채로 둔다** — 「**14:50 이전** 발생」은 오늘도 **미관측**이다.
    08-31 3건도 전부 컷오프 뒤였고 오늘 2건도 그렇다 — **사흘째 같은 패턴**이라
    「컷오프 뒤에만 난다」가 오히려 관측되는 중이다. 이 칸은 다음 날들로 계속 이월한다.
  상태: confirmed

- id: "2026-08-31-p2-3-a-silent-cap-leaves-a-reason"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    전략 상한 컷이 **조용히 잘라내지 않는다** — `enforce_daily_strategy_cap`이 실제로 무언가를
    잘라낸 사이클에 `reject_reasons`에 `strategy_daily_cap`이 남는다.
    **다음에 상한이 걸리는 날 `signal_decisions.risk_gate_state`에 그 사유가 남는다.**
  대가: |
    ⛔ **판정은 한 글자도 안 바뀐다.** `allowed`의 내용도, 진입 여부도, 확신도도 그대로다 —
    **사유 목록에 한 항목이 느는 것뿐**이다. 바로 아래 `enforce_reentry_cooldown`이
    **이미 그렇게 하고 있고**(`engine.py:192-195`, 08-05에 같은 이유로 추가된 줄),
    이 항목은 **같은 패턴을 옆 줄에 맞추는 것**이다.
  근거: |
    08-31 제4부 P2-3 — 오늘 「레짐일당 상한 2」를 지켰는지 **로그로 확인할 수 없었다**
    (절대원칙 판정 불가 항목). `enforce_daily_strategy_cap()`은 상한을 넘은 전략을
    조용히 잘라내고 아무 흔적도 남기지 않는다.

    ⚠ **예측치 줄은 리포트가 따로 두지 않았다** — 위 「가설」·「대가」는 P2-3 본문
    (*"잘렸을 때 `reject_reasons.append("strategy_daily_cap")` — 바로 아래
    `enforce_reentry_cooldown`이 이미 그렇게 하고 있다"*)을 그대로 옮긴 것이다.
  예측:
    # 2026-09-02 (09-01 §1-10 / 제4부 P2-B) — **등재 당시 복붙 실수를 정정한다.**
    # 이 두 줄은 `db.signal_reach.gamma_flip_out_of_range_count`(감마플립)를 가리키고 있었다.
    # 가설 본문과 아무 관계가 없는 축이라 자동 판정기는 **틀린 지표로 「확인」을 냈을 것**이다.
    # 실제로 세는 축은 이미 있었다 — `db.decisions.reject_reason.strategy_daily_cap`
    # (09-02 실측 14건). 신규 집계를 만들 필요가 없었다.
    - metric: db.decisions.reject_reason.strategy_daily_cap
      expect: "수기 판정 — 상한이 실제로 거는 날 `signal_decisions.risk_gate_state`에 `strategy_daily_cap`이 남는가"
      역할: 주장
    - metric: db.decisions.reject_reason.strategy_daily_cap
      expect: "수기 판정(대가) — **판정 무변경.** 잘린 것이 없는 사이클에는 이 사유가 붙지 않고, 붙는 사이클의 `allowed`·허가·확신도가 종전과 같은가"
      역할: 대가
  주의: |
    ⚠ **B등급 항목이다 — 「판정 무변경」 회귀 테스트 없이는 커밋하지 않는다.**
    이 줄은 판정에 닿는 자리(`reject_reasons`가 `FusionDecision`에 들어간다)이므로,
    **아무것도 안 잘린 사이클에서 사유가 늘지 않는가**를 테스트가 고정한다.
    ⚠ **상한 값(`max_priority_strategies_per_regime_day: 2`)은 손대지 않는다** — 이 항목은
    「무엇을 재는가」만 바꾼다.
    ⚠ **상한이 한 번도 안 걸리는 날은 주장 축이 판정 불가다**(규약 C) — 08-31이 그런 날이었고,
    그래서 이 fix가 필요해졌다.
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-09-02 장후 자동조치 — **확정. 오늘이 첫 실측 확인 사례다.**
    15:26 · 15:36 두 사이클에서 `strategy_daily_cap`이 `reject_reasons`에 **실제로 남았다**
    (09-02 §1-12). 둘 다 14:50 신규 진입 컷오프 이후라 **거래 영향은 없다.**
    08-31에는 상한이 한 번도 안 걸려 주장 축이 판정 불가였는데(규약 C), 그 칸이 오늘 채워졌다.
    ⚠ 위 `예측`의 metric 경로는 **09-02에 정정한 것**이다 — 등재 당시 복붙 실수로
    감마플립 지표를 가리키고 있었다(09-01 §1-10 / 제4부 P2-B). 이 검정은 정정된 축으로 읽는다.
  상태: confirmed

- id: "2026-08-31-adv1-the-close-does-our-ab-test-every-day"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    「마감 전후 응답시간 비」가 **매일 자동으로 재어진다** —
    `마감 후 p50(15:30~15:45) ÷ 마감 전 p50(14:50~15:20)`이 각 구간 호출 수와 함께 실린다.
    **이 비가 곧 「그날 느렸던 것이 우리 탓인가 KIS 탓인가」의 답이다** —
    1에 가까우면 우리 쪽, 0에 가까우면 KIS 부하.
  대가: |
    ⛔ **임계는 걸지 않는다 — 정상 분포를 모른다.** 며칠 쌓고 사람이 정한다
    (08-05 스팟 괴리율에서 「숫자를 보고 임계를 거는」 실수를 반복하지 않는다).
    그리고 **두 구간 중 하나라도 창이 없으면 값을 지어내지 않고 `null`이다**(규약 C) —
    「비를 못 쟀다」와 「비가 0이다」는 다른 사실이다.
  근거: |
    08-31 §1-14 · 제5부 고도화 1 ★ — **오늘 하루가 실험 하나를 공짜로 해 줬다.**
    15:20 마감 전후로 **우리 코드와 호출량은 그대로인데 응답시간만 100배 바뀌었다**:
    `15:20:46` 창 p50 **2.42초 / 77건** → `15:30:46` 창 **0.02초 / 101건**.
    호출 수는 오히려 **늘었다.** 오늘 값 `0.02 ÷ 2.42 = 0.008배`.
    08-04 §2-6이 만든 귀속 판정표를 **매일 자동으로 채우는 축**이 된다 —
    지표 §17이 「모순」으로 남겨 둔 자리의 첫 실측 결론이다.

    ⚠ **계획을 현재 코드 기준으로 다시 세웠다**(함정 게이트). 리포트는 `scripts/daily_ops_report.py`
    §9-1에 「새 줄 하나」로 적었는데, 그러면 **값이 사이드카에 안 남아 다음 날 대조할 수 없다.**
    창 단위 표본은 `mahdi/ops/log_metrics._rest_latency_metrics()`가 이미 손에 쥐고 있으므로
    **계산을 거기에 두고 리포트는 인쇄만 한다** — 이 저장소가 「이 모듈은 판정하지 않는다,
    값만 만든다」로 지켜 온 경계 그대로다.
  예측:
    - metric: rest_latency.close_transition.ratio
      expect: ">= 0"
      역할: 주장
    - metric: rest_latency.close_transition.ratio
      expect: "수기 판정 — 08-31 로그를 다시 집계하면 이 값이 **0.008 언저리**로 나오는가(재현 확인). 그리고 다음 거래일에 값이 실제로 실리는가"
      역할: 주장
    - metric: rest_latency.close_transition.after_calls
      expect: ">= 0"
      역할: 대가
  주의: |
    ⚠ **이 축은 그날 KIS 상태에 비례한다**(규약 G) — 비가 작다고 우리 코드가 좋아진 것이
    아니고, 1에 가깝다고 KIS가 좋아진 것도 아니다. **읽는 법은 「귀속」이지 「성적」이 아니다.**
    ⚠ **마감 뒤 창이 없는 날이 있다**(장 마감 후 폴링이 일찍 끝나는 날). 그날은 `null`이고
    **반증이 아니다**(규약 C).
    ⚠ **두 구간의 경계는 15:20(정규장 마감)이다.** 이 값을 바꾸면 이전 날들과 비교가 끊긴다 —
    바꿔야 할 근거가 생기면 새 축으로 재등재한다.
    ⚠ 이 fix는 **재기동이 필요 없다** — 리포트·파서는 장후에 따로 돈다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표) — **확인. 오늘이 강한 표본이다.**
    `rest_latency.close_transition.ratio` = **0.0208**(0에 가까움 → KIS 부하 쪽 판정).
    마감 직전(14:50~15:20)이 절벽 한복판이라 「마감 전」이 극단적으로 느렸는데
    「마감 후」(15:30~15:45, 회복 이후)는 정상이었고, **이 비율이 정확히 그 대비를 잡아냈다.**
    오늘의 독립 결론(원인은 KIS 쪽)과도 정합적이다.
  상태: confirmed

- id: "2026-08-31-adv4-uncomputable-and-rejected-are-counted-apart"
  구현일: 2026-08-31
  검증예정일: 2026-09-01
  가설: |
    「감마플립 **산출 불가**」와 「감마플립 **기각**(레그 범위 밖)」이 **따로 세어진다** —
    `qualitative.gamma_flip_uncomputable`이 신설되고, 증거 §5-3 표에 두 문구가 **각각 한 줄**로
    올라온다. 0건인 날에도 키가 실린다(`_QUALITATIVE_ALWAYS_PRESENT` 등록 — 규약 C).
  대가: |
    ⛔ **기존 축을 건드리지 않는다.** `qualitative.gamma_flip_out_of_leg_range`의 값도 마커
    문구도 그대로다 — 그 축은 08-25 P2-2가 §14의 분모로 쓰고 있어 흔들리면 그쪽이 깨진다.
  근거: |
    08-31 §1-8 · §1-10 · 제5부 고도화 4 — **오늘 처음 두 사건이 같은 시간대에 겹쳤다**(14시대).
    그런데 둘은 뿌리가 다르다: **기각**은 08-04 폐기 목록의 「GEX 광폭 체인」이 다루는 축이고,
    **산출 불가**는 레그 수 부족이라 그 결정과 **무관하다.**
    두 문구를 하나의 「감마플립 문제」로 묶어 세면 **폐기된 진단을 되살리는 08-19형 사고**가 난다.

    ⚠ **이것이 폐기 목록을 지키기 위한 계측이다.** 「GEX 광폭 체인」은 08-04 폐기 상태 그대로이고,
    이 항목은 그 안건을 여는 것이 아니라 **그 안건과 무관한 사건이 그 안건으로 오독되는 것을
    막는다.** 08-31 §1-17이 그 재개 조건 성립을 보고했으므로 이 분리가 지금 특히 필요하다.
  예측:
    - metric: qualitative.gamma_flip_uncomputable
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.gamma_flip_out_of_leg_range
      expect: ">= 0"
      역할: 대가
    - metric: qualitative.gamma_flip_uncomputable
      expect: "수기 판정 — 증거 §5-3에 두 문구가 **각각 한 줄**로 올라오고, 둘의 합이 아니라 각각이 읽히는가"
      역할: 주장
  주의: |
    ⚠ **`>= 0`은 경로 생존 확인이다**(규약 F) — 건수는 그날 KIS 응답 형태에 비례한다(규약 G).
    ⚠ **엄격 마커는 「감마플립 산출 불가」다.** P1-1이 그 줄 **뒤에** 꼬리를 붙이므로
    앞머리 문구를 바꾸면 두 fix가 서로를 눈멀게 한다 — 그래서 P1-1과 **같은 커밋으로 묶는다.**
    ⚠ **이 값이 0이라고 안심하지 말 것**: 0은 「산출 불가가 없었다」이지 「감마플립이 잘 나온다」가
    아니다. `db.signal_reach`의 감마플립 산출률과 나란히 읽는다.

