    허수 감마플립과 같은 종류의 결함이 된다. 이 fix가 바꾸는 것은 **사유 문자열 하나**이고,
    그것으로 §14-1이 "구조적" 열을 분리해 낼 수 있게 된다.

    구조적 분이 12를 크게 넘으면 **단일가 밖에서도 체결이 끊긴 것**이다(그때는 진짜 이상).
    5분 미만이면 경계(15:35)가 실제와 다른지 확인한다 — 08-05 실측은 15:36부터였다.
  상태: pending

- id: "2026-08-05-p13-spot-source-divergence"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "스팟의 두 독립 소스를 매일 대조하면 지수가 얼어붙은 채 선물만 움직인 구간이 드러난다"
  근거: |
    08-05 §2-3 — 07:31~09:00에 `underlying_spot_1m`이 전일 종가 1000.03에 **75분간 고정**돼
    있는 동안 선물은 1048까지 가 있었다. 두 값이 **48포인트(4.8%) 어긋난 채 15분을 갔는데
    아무도 비교하지 않았다.** ATM 롤링은 선물을 보고 08:46에 옳게 움직였고, 신호 층은 지수를
    써서 GEX를 스팟 1000.03 / 행사가 1042.5~1052.5로 계산했다.

    그리고 §14-2 「ATM 정합률」이 이 사고를 **88.1%로 통과시켰다** — 지표가 ATM을 계산할 때
    쓰는 스팟이 그 얼어붙은 값이기 때문이다. 앞 75분은 스팟도 행사가도 틀렸는데 **둘이 서로
    일치해서** 정합으로 세어졌다. 관측 지표가 감시 대상과 같은 오염된 입력을 쓰면 사고를 못 잡는다.

    **구현 중 새로 찾은 것**: 지수 정지는 장전만의 일이 아니다. 08-04·08-05 **양일 모두
    15:21~15:29에 지수가 9분간 얼어붙어** 있었고(선물은 계속 움직였다), 08-04는 15:31~15:34도
    그랬다. 08-04의 마지막 정지값 1000.03이 곧 08-05 장전의 stale 값이다 — **같은 현상의 앞뒤**다.
  예측:
    - metric: db.spot_source_divergence.index_frozen_max_run
      expect: "<= 11"
      역할: 주장
    - metric: db.spot_source_divergence.median_pct
      expect: "0 ~ 0.6"
      역할: 참고
  주의: |
    **괴리율에 임계를 걸지 않는다.** 보고서 초안은 "0.5% 초과가 2분 연속이면 WARNING"이라고
    적었는데, 08-05 실측에서 정규장 중 괴리 중앙값이 **0.252%**이고 09:01·09:02·09:22·10:32가
    0.5%를 넘는다 — 선물 베이시스는 실재하는 경제량이라 그 규칙은 오경보를 냈을 것이다.
    **정상 범위를 모르는 상태에서 임계를 먼저 정하면 그 임계가 곧 결론이 된다.**
