    # 08-19 실측 총합 87분 / 재기동분 **58분**(보고서가 손으로 구한 값과 일치) / 08-18 0분.
    # **소급이 아니다**: `expect`의 부등식은 한 글자도 안 바꿨고, 정정 전 실측이 `None`이라
