  가설: "수기 이벤트 캘린더를 배선하면 만기 15분 전 구간에서 확신도가 절반으로 떨어진다"
  근거: "08-05 §2 이상점 2 후속 — `classify()`는 다음 이벤트까지 남은 시간이 15분 미만이면
