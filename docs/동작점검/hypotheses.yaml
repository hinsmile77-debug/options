  # 일어나지 않았고 아무도 사유를 적지 않았다. 그래서 이번엔 날짜를 박는다.
  #
  # 사유(둘이고, 둘째가 새로 밝혀진 것이다):
  #   1. **2026-08-18이 모의투자 개시일이다.** 그날의 단일 변수는 주문 경로 배선이어야 한다
  #      (같은 이유로 레버 E도 08-25로 옮겼다 — 그 항목의 유예 사유 참고).
  #   2. **이 레버는 보수적 레버가 아니라 위험을 늘리는 레버다.** 위 「대가」의 정정을 보라 —
