  근거: |
    `2026-08-04-p5`의 사전 대응 규칙("p95 2.5초 초과가 이틀 연속이면 그 시간대 위클리를
    2분 → 4분")이 08-06에 **발동 조건을 충족했다**(10·11·12·13·14시 다섯 구간).
    그러나 같은 날 고도화#1이 들어갔고 **그것만으로 먼슬리 두께가 회복되면 감축은 불필요하다**.
    위클리 커버리지를 50% → 25%로 반토막 내는 것은 되돌리기 쉬운 결정이 아니고, 08-06이
    위클리 만기일이었으며 핀 집중도 59.6%가 실제로 관측됐다.

    그럼에도 구현하는 이유: **"발동은 사람이 한다"가 코드로 표현돼야 하기 때문이다.**
    규칙만 문서에 있으면 발동하려는 날에 그 자리에서 코드를 짜게 되고, 그때 처음 짜는 코드는
    그날 처음 깨진다(워치독을 장전 기동 스크립트로 재사용한 것과 같은 이유).
  대가: "쓰이지 않는 코드 경로가 하나 생긴다 — 테스트가 그 경로를 매일 돈다"
  예측:
