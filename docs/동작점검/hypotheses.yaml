- id: "2026-08-07-fix1-chain-window"
  구현일: 2026-08-07
  검증예정일: 2026-08-10
  가설: "체인 스냅샷을 그 북의 최신 사이클 행사가 범위로 자르면, GEX가 한 개의 ATM 창에서만 계산된다"
  근거: |
    08-07 §B-2 — 5분 신선도 창(`db.CHAIN_SNAPSHOT_MAX_AGE_MINUTES`) 안에 ATM 롤로 생긴 **다른
    행사가 창**이 겹쳐 쌓이고 있었다. `DISTINCT ON`이 창 밖으로 빠져 더 이상 폴링되지 않는
    행사가의 마지막 값을 창 만료까지 붙들기 때문이다.

      스냅샷 레그   분(장중)   최고령 평균
         10(설계)      45        62초
         12            88       185초
         14            45       191초
         16            20       229초
         18             3       250초

    **장중 202분 중 157분(78%)이 두 개 이상의 창을 섞어 GEX를 냈다.** GEX는 OI 가중 합이라
    행사가가 늘면 |GEX|가 부풀고, 그 값이 v6 §11.4 프리미엄 매도 게이트의 입력이다.
    08-07 GEX는 전 구간 음수(평균 -1.4e10)였고 `short_gamma_requires_not_met` 49건이 거기서 나왔다.

    후보 3안을 08-07 실데이터 327분으로 리플레이해 **범위안**을 골랐다(집합안은 그 사이클에서
    ReadTimeout으로 빠진 레그를 이월로 못 살려 327분 중 1분이 설계 미만으로 떨어졌다):

      후보                     중앙 레그  최대  설계 미만 분  최고령 중앙/최대
      현행(5분 창 전체)            12      20      0분        120초 / 300초
      최신 사이클의 행사가 집합     10      10    **1분**       0초 /   0초
      최신 사이클의 행사가 범위     10      10      0분          0초 /  60초   ← 채택
  예측:
    - metric: db.signal_reach.chain_leg_over_design_minutes
      expect: "== 0"
      역할: 주장
    - metric: db.signal_reach.chain_leg_median
      expect: "== 10"
      역할: 주장
    - metric: db.signal_reach.chain_age_seconds_max
      expect: "<= 150"
      역할: 주장
    # 창 길이(시간축)는 안 건드렸으므로 결손 이월 능력은 그대로여야 한다.
    - metric: db.monthly_leg_completeness.below_design_pct
      expect: "<= 5"
      역할: 대가
    - metric: db.signal_reach.gamma_flip_out_of_range_count
      expect: "== 0"
      역할: 대가
  주의: |
    **|GEX|가 줄어드는 것은 이 fix의 성공이지 회귀가 아니다.** 08-07까지의 GEX 시계열과
    08-10 이후는 **모집단이 다르므로 직접 비교하지 말 것** — 전자는 여러 창의 합이었다.
    그 여파로 `short_gamma_requires_not_met` 건수와 §15 핀 행사가/집중도가 바뀔 수 있고,
    그 변화는 **이 fix가 만든 것**이지 시장이 만든 것이 아니다.

    반대로 `chain_leg_over_design_minutes`가 0이 아니면 창 자르기가 뚫린 것이다. 그때 의심할
    것은 두 가지: (a) 한 사이클의 행이 두 분에 걸쳐 적재됐다(Fix#3이 막으려는 것)
    (b) 가장자리 레그가 실패해 범위가 좁아진 뒤 다음 분에 되돌아왔다(자기 복구 — 1~2분이면 정상).
  판정근거: |
    (2026-08-11 확정) 주장 셋 중 둘 확인(`chain_leg_over_design_minutes` 0 = 불변식 / `chain_leg_median` 10), `chain_age_seconds_max` 반증(252초). **그런데 그 반증의 원인이 이 fix가 아니다** — 08-11에 `poll_signal_fusion_cycle` 위상(:10)이 20레그 사이클(19.3초)보다 앞서 짝수분마다 직전 분 스냅샷을 읽는 것이 실측됐다(홀수분 28초 / 짝수분 70초). 그 귀속은 Fix#10이 다룬다 — 이 fix로는 판정할 수 없다.
  상태: inconclusive
- id: "2026-08-07-fix3-grid-poll-minute"
  구현일: 2026-08-07
  검증예정일: 2026-08-10
  가설: "사이클 시작 시각을 분 경계 직전에서 올려 자르면 로그축과 DB축의 결손이 일치한다"
  근거: |
    08-07 §A-1 — `option_analysis_1m`의 07:30이 20행, **07:31이 0행**, 07:32가 20행이었다.
    로그축은 결손 0분(07:31:19에 rows=20으로 완주). 고정 틱 스케줄러가 깨우는 시각은 격자점
    (:00)이지만 `asyncio.sleep`은 일찍 깨는 것을 금지하지 않으므로, 07:30:59.9x에 깬 사이클이
    `replace(second=0)`로 07:30에 적재됐다. 그 분은 다음 사이클이 07:32를 쓰므로 영영 빈다.
  예측:
    - metric: db.chain_minute_coverage.zero_row_count
      expect: "== 0"
      역할: 주장
  주의: |
    **경로가 살아 있는지부터 확인할 것** — 위 지표 경로가 「경로 없음」으로 뜨면 이 가설은
    검정되지 않은 것이다(08-06에 이 구분이 없어 6건이 「실측 없음」에 묻혔다). 실측 경로는
    `docs/동작점검/auto/2026-08-07_지표.json`에서 확인하고, 다르면 **이 파일을 고친다**.

    하루 1분짜리 결함이라 통계로는 안 보인다 — 판정은 §4의 「0행 분」 목록에 07:31 같은
    **기동 첫 분**이 남아 있는지로 한다. 남아 있으면 스냅 폭(2초)이 부족한 것이다.
  판정근거: |
    (2026-08-11 확정) `zero_row_count` 27분으로 불변식 반증인데, **원인 분해가 그 fix와 무관함을 보인다** — 27분 전부 「수집 전멸」이고 「이웃 분 적재」·「사이클 없음」은 0이다(911a7af가 만든 축). 분 경계 스냅이 막으려던 형태는 0건이다.
  상태: inconclusive
- id: "2026-08-07-e1-subscription-retention"
  구현일: 2026-08-07
  검증예정일: 2026-08-10
  가설: "슬롯이 남는 동안 창 밖 구독을 유지하면, ATM 롤은 그대로여도 1분봉이 안 끊긴다"
  근거: |
    08-07 §B-1 — 롤 76회 / 287분(3.8분마다), 즉시 왕복 24회(31.6%), WS 구독 요청 410건 /
    해제 388건. `BAFBRW980`은 11:35:00 해제 → 11:36:59 재구독 → 11:42:59 또 해제였고,
    COCKPIT Flow Radar의 「봉 없음 8분」이 정확히 그 구간이다 — **유동성 공백이 아니라
    우리가 끊은 것**이다.

    **히스테리시스를 넓히는 것으로는 못 고친다**: 롤 76회를 전수 검산하면 전부 임계
    (2.5 x 0.75 = 1.875p)를 정당하게 넘었다. 그날 지수가 1004~964~982(40p)를 오갔고 격자가
    2.5p인 이상 어떤 임계값을 써도 이 왕복은 남는다(08-04 리플레이도 같은 결론).

    **공짜에 가깝다**: WS 구독은 REST 페이서 예산을 1건도 안 쓰고, REST 폴링 대상은
    `desired_strikes`(창)에서 나오므로 유지된 구독이 체인 수집을 1콜도 늘리지 않는다.
    08-07 실측 활성 슬롯은 21~22/41이었다.
  예측:
    # 08-07 커밋 직후 실데이터 리플레이로 **예측을 고쳤다**(숫자를 보기 전이다 — 라이브 실측은
    # 08-10에 처음 나온다). 처음엔 "<= 4"였는데, 오늘 선물 1분봉 300개(스팟 41.75p = 행사가
    # 17칸)를 실제 풀에 흘려보니 2북 97건 / 3북 469건이었다. 절대 건수는 스팟 이동거리의
    # 함수라 예측 대상이 아니다 — 롤·북당으로 정규화한 값이 이 fix가 실제로 주장하는 것이다.
    #   풀 OFF   롤·북당 2.42 (북 수 무관, 구조적)
    #   풀 ON    롤·북당 0.51(2북) / 1.63(3북)
    - metric: db.ws_status.atm_roll_dropped_subs_today
      expect: "수기 판정 — `dropped / (atm_roll_count_today x 북 수)`가 **2.0 미만**이어야 한다
        (풀이 없을 때의 값 2.42보다 낮은가). 절대 건수로 읽지 말 것"
      역할: 주장
    # **규약 F가 잡은 예측이다**(2026-08-07 Fix#5). 처음엔 `>= 900`이었는데, 이 값은
    # 구독 심볼 수와 그날 옵션 체결량에 비례하므로 절대 건수로 걸면 안 된다 — 08-07에
    # 같은 형태로 세 번 틀렸다(p4/e1/p2). 사람이 심볼 수로 나눠 읽는다.
    - metric: db.tables.market_raw_1m.rows
      expect: |
        수기 판정 — **옵션 심볼당 적재 분**으로 나눠 읽는다(08-07 종일 1,073행 / 선물 A01609
        410분을 뺀 663행 / 옵션 심볼 20개 = 심볼당 33분). 유지 풀이 일했다면 이 값이 늘어야
        한다. 늘지 않으면 옵션 자체에 체결이 없는 것이므로 fix 실패가 아니라 시장 사실이다
      역할: 주장
    - metric: rest.by_group.옵션체인
      expect: "<= 9500"
      역할: 대가
  주의: |
    **`atm_roll_count_today`가 안 줄어드는 것이 정상이다** — 이 고도화는 롤을 줄이는 게 아니라
    롤의 대가를 없앤다. 롤 횟수가 줄었다면 그건 그날 변동성이 낮았던 것이지 이 fix의 효과가 아니다.

    `market_raw_1m` 예측 900의 근거: 08-07 반나절 532행(212분), 종일 환산 약 1,050행. 유지 풀이
    없던 08-06 종일은 확인이 필요하다 — **이 값이 안 늘면 옵션 자체에 체결이 없는 것**이므로
    (08-07 심볼별 최대가 `BAFBRW980` 66분이었다) 이 fix의 실패가 아니라 시장 사실이다.
    그 구분은 §14-1 `orderflow_ofi_vpin` 가용률과 함께 읽는다.

    `rest.by_group.옵션체인`이 대가인 이유: 유지 구독이 REST를 늘리지 **않는다**는 것이 이
    설계의 전제다. 늘었다면 폴링 대상이 `active_subscriptions`로 새어 나간 것이므로 즉시 되돌린다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — `atm_roll_dropped_subs_today` **0건**(롤 86회). 유지 풀이 왕복분을 전부 흡수했다. `market_raw_1m` 1,989행/410분.
  상태: confirmed
- id: "2026-08-07-e2-roll-cost-not-count"
  구현일: 2026-08-07
  검증예정일: 2026-08-10
  가설: "ATM 롤 배지의 판정 축을 횟수에서 끊긴 구독 수로 옮기면 상시 경고가 사라진다"
  근거: |
    08-05에 잠정치로 정한 임계 20회를 08-05(77회)·08-07(76회) 이틀 연속 4배 가까이 넘겼는데,
    08-07 전수 검산 결과 그 76회는 **전부 정당한 롤**이었다. 롤 횟수는 시장 변동성의 함수라
    통제할 수 없고, 통제 못 하는 값에 걸린 임계는 곧 안 읽는 경고가 된다.
    026 마이그레이션 주석이 정확히 말했듯 우리가 걱정하는 것은 롤이 아니라
    **"창을 벗어난 종목의 구독이 해제돼 1분봉이 끊기는 것"** 이다 — 그것을 직접 센다.
  예측:
    - metric: db.ws_status.atm_roll_count_today
      expect: ">= 20"
      역할: 대가
    - metric: db.signal_reach.chain_leg_over_design_minutes
      expect: "== 0"
      역할: 주장
  주의: |
    **롤 횟수가 임계를 넘는데 배지가 초록인 것이 이 고도화의 성공 모습이다.** 08-10에 배지가
    "76회 · 그 때문에 실제로 끊긴 WS 구독 0건"으로 뜨면 맞은 것이다.
    `_ATM_ROLL_DROPPED_WARNING = 4`는 **잠정치**다 — 08-05에 20을 잠정치로 두고 이틀 만에
    근거가 틀린 것으로 드러난 전례가 바로 이 항목이므로, 며칠 실측 전에는 이 값으로 결론을
    내리지 않는다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — ATM 롤 86회인데 끊긴 구독 0건(롤·북당 0.00). **롤 횟수가 많은데 대가가 0인 것이 목표 상태**였고 그대로 나왔다.
  상태: confirmed
- id: "2026-08-07-e4-hmm-nonconvergence-guard"
  구현일: 2026-08-07
  검증예정일: 2026-08-10
  가설: "수렴하지 않은 HMM은 저장을 거부하는 것이 저장하는 것보다 안전하다"
  근거: |
    08-07 드라이런(7,682샘플) 실측 — hmmlearn이 `Model is not converging`을 여러 건 냈다
    (로그우도 델타가 음수). `RegimeEngine.fit()`은 이 경우 예외를 던지지 않으므로,
    **08-10에 그대로 저장했으면 수렴하지 않은 모델이 조용히 라이브에 올라갔을 것**이고
    그 뒤의 모든 레짐 판단이 그 모델에서 나온다.

    같은 드라이런의 좋은 소식: **잠재상태 방문 8/8개**. 08-03 드라이런의 경고
    (「1~2개면 데이터가 아니라 모델 구성을 의심」)는 해소됐다 — 재학습하면 레짐이 실제로
    여러 상태로 갈릴 가능성이 높다.
  예측:
    # 이 항목의 자동 검정 가능한 주장: 08-10에 임계에 **도달한다**(그래야 재학습이 성립한다).
    # 08-07 12:20 기준 7,634행, 하루 약 380행 → 08-10(월) 도달.
    - metric: db.feature_store.total
      expect: ">= 8000"
      역할: 주장
    # 가드 자체는 자동으로 못 잰다 — 재학습은 사람이 손으로 돌리는 배치이기 때문이다.
    - metric: qualitative
      expect: |
        수기 판정 — 08-10 재학습 시 (a) monitor_.converged가 False면 저장이 거부되고 종료 코드
        없이 ERROR 로그만 남는가 (b) 그 경우 data/models/regime_engine.pkl이 **안 생기는가**
        (c) 라이브가 다음날 WARMUP 폴백을 유지하는가(regime_state.is_warmup=true)
      역할: 주장
  주의: |
    **저장 거부는 손실이 아니다** — 안 저장하면 WARMUP 폴백이 하루 더 이어질 뿐이고
    (08-06까지 24영업일 그랬다), 나쁜 모델을 저장하면 그날부터 판단이 그것을 믿는다.
    수렴 실패가 08-10에도 재현되면 `n_iter`를 늘리거나 피처 분산을 먼저 본다
    (`rv_ratio` 고유값이 08-07 기준 1,208로 08-03의 1종에서는 풀렸다).

    **재학습과 확신도 분모 전환(고도화#3)을 같은 날 하지 않는다** — 확신도가 바뀌었을 때
    둘 중 무엇이 만든 변화인지 영영 못 가른다. 분모 레버(`use_effective_member_count`)는
    재학습 성공을 확인한 **다음 영업일**에 올리고, 그때 이 파일에 예측을 먼저 적는다.
  확정: |
    2026-08-10 — **inconclusive.** 예측 (a)(b)(c)는 **검정되지 않았다**: 그날 저장된 모델은
    실제로 수렴했으므로(iter 92/200, delta +0.0085 < tol 0.01) 거부 경로가 아예 안 탔다.

    그리고 검정할 기회가 있었어도 이 가드는 **자기가 재겠다고 한 것을 재지 못했다.**
    hmmlearn(0.3.3)의 `monitor_.converged`는 수렴을 재지 않는다:

        return (self.iter == self.n_iter or
                (len(self.history) >= 2 and self.history[-1] - self.history[-2] < self.tol))

    `iter == n_iter`는 반복을 다 쓰고도 못 멈춘 것(**비수렴**)인데 True이고, `delta < tol`은
    **음수 delta**(로그우도가 줄어드는 발산)도 True다. hmmlearn 소스에도
    `XXX we might want to check that log_prob is non-decreasing` 주석이 달려 있다.
    그날 `Model is not converging` 경고를 낸 후보 둘(delta −0.064 / −0.050)이 정확히 그 경우이고,
    **그것들이 restart 경쟁의 패자였기에 저장물이 우연히 멀쩡했다.** 승자가 그중 하나였다면
    이 가드는 통과시켰다.

    **소급해서 예측을 고치지 않는다**(규약) — 새 게이트는 `2026-08-10-r4`로 따로 등재한다.
    가설의 방향("수렴 안 한 모델은 저장 안 하는 게 낫다")은 여전히 옳다. 틀린 것은 **판정
    수단**이었다.
  상태: inconclusive

