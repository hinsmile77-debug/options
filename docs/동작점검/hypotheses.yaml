      역할: 주장
    - metric: cycles.missing.unrecovered_count
      expect: "수기 판정 — 미가동 0인 날에는 infra_count와 같아야 한다"
      역할: 참고
  주의: |
    **정지가 없는 날에는 이 fix가 눈에 안 보인다**(미가동 0, 인프라 결손이 종전 값 그대로).
    그것이 정상이고, 그때 확인할 것은 *"두 축이 존재하는가"* 이지 *"값이 좋아졌는가"* 가 아니다
    (README 규약 — 예측은 "좋아진다"가 아니라 **"존재한다"** 에서 시작한다).

    기동 표식(`직전 정상 기동`)이 없는 구버전 로그에서는 전부 인프라 결손으로 집계된다 —
