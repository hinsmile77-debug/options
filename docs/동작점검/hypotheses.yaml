    08-06 Fix#2가 「죽은 것을 아무도 몰랐다」를 고쳤다면 이번은 「살아서 못 가져오는 것을
    아무도 몰랐다」이다 — 같은 파일(`mahdi/liveness.py`)의 다른 결함이다.

