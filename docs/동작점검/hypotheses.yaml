- id: "2026-08-14-fix3-longest-empty-run"
  가설: |
    0행 분을 **연속 길이**로도 인쇄하면, 하루에 흩어진 N분과 한 구간에 붙어 있는 N분이 갈린다.
  # 2026-08-16 정정 — 08-17은 **광복절 대체휴일(휴장)** 이다. 그날은 프로세스가 안 뜨므로
  # 검증이 성립하지 않는다(그대로 두면 다음 거래일에 「예정일 경과」로 잘못 뜬다).
  검증예정일: 2026-08-18
  근거: |
    08-14의 0행 분은 86분이고 그중 84분이 14:00~15:23에 붙어 있었다(정규장 마지막 80분 —
    옵션에서 감마가 가장 중요한 구간이다). 그날 자동 적신호가 낸 문장은 **"ERROR 86건 / 2종"**
    하나뿐이었고, 84분이 연속이라는 사실은 사람이 0행 분 목록을 눈으로 훑어서 알았다.
    같은 숫자가 두 사건을 가린다.

    임계 20분의 근거: 체인 신선도 창이 5분이라(`db.CHAIN_SNAPSHOT_MAX_AGE_MINUTES`) 6분째부터
    그 분의 판단은 체인을 아예 못 본다(`chain_input_source = none` — 08-14에 78분이 그랬다).
    20분이면 그런 분이 15분 가까이 쌓였다는 뜻이고, 우연한 KIS 딸꾹질로는 잘 안 나온다
    (08-13 최장은 2분이었다).
  예측:
    - metric: db.chain_minute_coverage.zero_row_longest_run
      expect: "수기 판정(주장) — 이 키가 **존재하고 `length`가 `None`이 아닌가**(존재부터). 08-14 재집계 기준선: 51분(14:33~15:23)"
      역할: 주장
    - metric: db.chain_minute_coverage.zero_row_count
      expect: "수기 판정(참고) — 08-14 실측 86분. **두 값을 나란히 읽는 것이 이 fix의 전부다**(86 vs 51)"
      역할: 참고
