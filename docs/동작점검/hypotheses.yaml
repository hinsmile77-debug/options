        숫자를 보기 전에 적는다는 규약은 지키되, 배포 전에 검증할 수 있으면 검증하고 정정한다.
        롤링 횟수 자체는 자동 지표에 없으므로 로그의 `ATM 롤링` 건수를 손으로 셀 것(예측 130±20회)."
