    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: 키 존재 · `priority_cut_minutes` 38 · `우선순위위반=예` **0건**. 존재 예측은 충족.

    ⚠ **그러나 이 재정의가 사각을 만들었다.** 같은 날 `컷당한북`에 `regular`(먼슬리)가
