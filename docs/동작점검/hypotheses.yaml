    반대로 `chain_leg_over_design_minutes`가 0이 아니면 창 자르기가 뚫린 것이다. 그때 의심할
    것은 두 가지: (a) 한 사이클의 행이 두 분에 걸쳐 적재됐다(Fix#3이 막으려는 것)
