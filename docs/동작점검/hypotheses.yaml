    아무것도 안 고치고 관측만 12~14초 끊는다 — 알림 전용으로 둔 이유다(`DECISION_LOG` 결정 7).

    Slack 배관은 이미 있었다(`should_alert` → `notify.notify_sync`). 없던 것은 **울릴 조건**뿐이다.
  예측:
    - metric: watchdog.degraded_checks
      expect: "수기 판정(주장) — 이 키가 **존재하고 `None`이 아닌가**(존재부터 예측한다 — README 규약). 08-14 재집계 기준선 0건(그날 이 판정 자체가 없었다)"
