- id: "2026-08-04-p5-kis-latency-rule"
  구현일: 2026-08-04
  검증예정일: 2026-08-06
  가설: "KIS 응답시간 p95를 시간대별로 재면 매일 반복되는 혼잡 구간이 드러난다"
  근거: "08-04 §2-6 — 느린 호출 362건의 총 2,278초 중 HTTP가 2,050초(90%)이고, 08-03 대비
        페이서는 1,661→229초(-86%)로 무너졌는데 HTTP는 1,979→2,050초로 불변이다. 즉 남은 밀림은
        우리 스케줄이 아니라 KIS 응답 지연에서 온다. 그런데 지금 리포트는 그 지연을 우리 지표
        (밀림 건수)로만 본다 — slow_calls는 임계(5초) 위 꼬리만 보므로 p50을 알 수 없다.
        08-04 시간대 분포: 느린 호출 362건 중 13~15시가 280건(77%), 밀림 48건 중 36건(75%)."
  예측:
    - metric: rest_latency.endpoints.inquire-price.p95
      expect: "수기 판정"
      역할: 주장
    - metric: rest_latency.warnings
      expect: "수기 판정"
  주의: |
    **이 가설은 하루로 판정하지 않는다** — "매일 반복되는가"가 가설의 내용이므로 최소 이틀이
    필요하다(그래서 검증예정일이 08-06이다).

    **사전 대응 규칙(숫자를 보기 전에 확정한다)**:
      `inquire-price`의 p95가 2.5초를 넘는 시간대가 **이틀 연속 같은 시간대에** 나타나면,
      그 시간대에 한해 위클리 폴링을 2분 → 4분 격분으로 늘린다.
      **먼슬리는 건드리지 않는다** — 판단 입력이다(07-31에 ATM±2→±1을 "판단 입력을 훼손하는
      안"이라며 보류한 것과 같은 원칙: 총량 축소보다 손실이 작은 순서로 간다).

    2.5초 근거: 정상 호출은 페이서 포함 ~1.2초다. p95가 2.5초면 스무 번에 한 번꼴로 정상의
    두 배 넘게 걸린다는 뜻이고, 그 구간에서는 20레그 x 2.5초 = 50초로 Fix#8의 사이클 예산을
    전부 써버린다.

    **자동 적응은 의도적으로 구현하지 않았다.** 지연을 보고 폴링을 줄이면 폴링이 줄어 지연이
    낮아지고 다시 폴링이 느는 되먹임이 생긴다 — 2026-07-08에 페이서를 나눴다가 500 폭주로
    203분을 잃은 전례가 있다. 규칙의 발동은 사람이 한다.
  상태: pending

- id: "2026-08-05-p1-vrp-wiring"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "팔레트에 VRP를 실제로 넘기면 `strategy_palette:wait_only`가 급감하고
        `short_gamma_requires_not_met`이 그 자리를 대신한다"
  근거: "08-05 §2 이상점 1 — `poll_signal_fusion_cycle()`이 `evaluate(signal_inputs,
        MetaLabelContext())`로 호출해 `vrp`가 **한 번도 전달된 적이 없었다**(기본값 0.0).
        `_vrp_state(0.0, 0.02)`는 항상 'fair'라 v6 §11.4 매트릭스 3열 중 2열이 전 이력 도달
        불가였고, 레짐도 RANGE_BALANCED 고정이라 9칸 중 도달 가능한 칸이 `wait_and_see`
        하나뿐이었다. 그 결과 08-05 HIGH_CONVICTION 6건(방향 ±0.692, 동조 3, 확신도 0.75)이
        전부 `wait_only`로 버려졌다.
        08-05 하루치(09:47 시점)를 배선 후 규칙으로 리플레이한 결과:
          overpriced 111분 / fair 31분 / underpriced 3분(전부 아티팩트, 아래 주의 참고).
        RANGE_TIGHT x overpriced = ['limited_premium_sell']는 프리미엄 매도라
        `short_gamma_requires`(최고신뢰 + positive GEX + 안정레짐) 게이트에 걸리는데,
        `stability_flag`가 08-05 내내 False였으므로 게이트는 확정적으로 불통과한다."
  대가: "팔레트 3열이 열리면 관망만 하던 날에 진입 후보가 생긴다 — 07-30에 팔레트 오독으로 하루 419건이 찍힌 전례가 있다"
  예측:
    # 주장 지표 — 이 가설이 실제로 주장하는 것(08-05 p4의 실패를 반복하지 않기 위해 맨 앞에 둔다)
    - metric: db.decisions.reject_reason.strategy_palette:wait_only
      expect: "< 0.5 x 전일"
      역할: 주장
    - metric: db.decisions.reject_reason.strategy_palette:short_gamma_requires_not_met
      expect: ">= 1"
      역할: 주장
    # 배선 자체가 살아 있는가 — NULL만 나오면 계산 경로가 죽은 것이다
    - metric: db.decisions.vrp.non_null_ratio
      expect: ">= 0.7"
      역할: 참고
    # 안전 — 07-30에 팔레트 오독으로 하루 419건 ENTER가 찍힌 전례가 있다
    - metric: db.decisions.decision.ENTER
      expect: "<= 5"
      역할: 대가
  주의: |
    **판정은 위 4개 지표 전부로 한다.** 08-04 p4는 "왕복이 사라진다"고 주장하면서 등록 지표는
    `chain_age_seconds_max`와 `log_volume.human_lines`였다 — 자기 주장을 검정하지 않는 지표로
    "확인" 판정이 났고, 실제 왕복률은 36.1% → 42.9%로 **악화**해 있었다. 그 실패를 반복하지
    않으려고 주장 지표를 맨 앞에 명시한다.

    **ENTER가 나오면 그 자체로 실패가 아니다** — 확인할 것은 "몇 건인가"가 아니라 "그 분의
    `vrp`가 아티팩트가 아닌가"다. 08-05 리플레이의 underpriced 3분은 전부 아티팩트였다:
      09:18  ATM(1047.5)에 **콜만** iv>0이었고 그 IV가 0.5423 → VRP −0.24
             → `atm_straddle_vrp()`가 콜·풋 양쪽을 요구하도록 만든 직접 근거.
      08:45/08:46  `underlying_spot_1m`이 장 개시 전 stale 스팟(1000.03, 실제 1048.50)이었다.
             콜·풋이 둘 다 있어 새 가드로도 통과한다 — **이것은 VRP가 아니라 스팟 신선도
             문제이므로 이번 fix의 범위 밖이다.** 08-46에 STANDARD 확신도가 겹치면 ENTER 1건이
             날 수 있다. 그 1건이 나오면 정상이고, 5건을 넘으면 다른 원인이 있는 것이다.

    KIS `hts_ints_vltl`이 행사가 격자에 따라 계통적으로 튄다(08-05 먼슬리 실측: 2.5의 홀수배
    행사가 콜 IV 0.57~0.63 vs 5의 배수 0.87~0.89, 같은 분·같은 북). ATM 콜·풋 평균은 이
    아티팩트와 풋 스큐를 함께 상쇄하는 교과서적 ATM IV 추정이라 택했다 — **단일 레그로는
    행사가가 한 칸 옮겨가는 것만으로 VRP 부호가 뒤집힌다.**

    되돌리려면: `main.py`의 `evaluate(..., vrp=...)` 인자만 빼면 08-05 이전과 완전히 같아진다.
  상태: pending

- id: "2026-08-05-p2-endpoint-timeout"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "read 타임아웃을 엔드포인트별로 나누면 계좌잔고/만기유동성 실패가 사라지고
        옵션체인 사이클 예산은 그대로 지켜진다"
  근거: "08-05 §2 이상점 3 — 08-04 Fix#8이 read를 10→4초로 낮췄는데 그 값이 `httpx.Client`
        전역이라 **잔고 폴러까지 함께 조였다.** §9-1 실측: inquire-price p50 0.02초인데
        inquire-balance는 p50 **0.70초**(35배), 9시 p95 1.77초, 최대 4.34초 — 원래 느린
        엔드포인트다(계좌·증거금·보유종목 집계 API). 09:19/09:24/09:34 세 사이클이
        `httpx.ReadTimeout`으로 통째로 날아갔다(개장 후 8사이클 중 3건, 08-04 이전 실패 0건).
        만기유동성(inquire-asking-price)도 최대 4.00초로 천장에 닿아 2건 실패했다.
        Fix#8의 근거('60초에 20레그를 도는 사이클에서 한 레그가 10초를 먹으면 밀린다')는
        호출 1건이 곧 사이클 전체인 폴러에는 성립하지 않는다 — 되돌림이 아니라 범위 축소다."
  대가: "잔고/만기유동성 read를 10초로 되돌리므로 그 폴러가 느린 날 사이클 예산을 더 먹는다(밀림·미회수 결손이 대가다)"
  예측:
    # 주장 지표
    - metric: log.failures.계좌 잔고 폴링 사이클 실패
      expect: "0"
      역할: 주장
    - metric: log.failures.만기 유동성 폴링 실패
      expect: "<= 1"
      역할: 주장
    # 옵션체인 쪽은 4초를 유지하므로 08-05와 같은 수준이어야 한다(악화하면 범위 축소가 샜다는 뜻)
    - metric: overrun.count
      expect: "<= 25"
      역할: 대가
    - metric: cycles.missing.unrecovered_count
      expect: "<= 2"
      역할: 대가
  주의: |
    **`qualitative.read_timeout`은 줄되 0이 되지는 않는다** — 옵션체인(2,800건/일)은 여전히
    4초 천장을 쓰기 때문이다. 08-05는 21건이었고, 그중 잔고 3건 + 만기유동성 2건이 빠지므로
    16건 근처가 정상 모양이다. **0건이면 오히려 옵션체인 쪽 타임아웃까지 풀린 것**이니
    `timeout_for_url()`의 매칭이 너무 넓게 잡혔는지 확인할 것.

    부수 효과 주의: 잔고 조회가 성공하기 시작하면 `risk_gate_state.risk_engine`이
    "account_tracker_not_ready"에서 실제 평가 결과로 바뀌는 분이 늘어난다 — 그것은 이 fix의
    의도된 결과이지 새 결함이 아니다.
  상태: pending

- id: "2026-08-05-p3-meta-label-inputs"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "`gamma_regime_stable`을 실데이터로 채우면 HIGH_CONVICTION이 사라지고 그만큼 STANDARD가 는다"
  근거: "08-05 §2 이상점 2 — `MetaLabelContext()`를 인자 없이 생성해 `classify()`의 곱셈 페널티
        4종이 하나도 안 걸렸다. 특히 `gamma_regime_stable=True`는 낙관적 하드코딩이다.
        08-05 HIGH_CONVICTION 6건의 `conviction_score`는 정확히 0.75(= regime_confidence 1.0 x
        동조비 3/4, 페널티 0회)였는데, 먼슬리 GEX는 −9.9bn(음수)이고 `stability_flag`는 하루 종일
        False였으므로 감마 레짐 페널티(x0.85)가 걸렸어야 한다 → 0.6375 < standard_max(0.65).
        08-05 판단 185건 전수 재계산: HIGH_CONVICTION 13 → **0**, STANDARD 169 → 182."
  예측:
    # 주장 지표
    - metric: db.decisions.conviction.HIGH_CONVICTION
      expect: "0"
      역할: 주장
    - metric: db.decisions.conviction.STANDARD
      expect: "> 전일"
      역할: 참고
  주의: |
    **HIGH_CONVICTION 0건은 회귀가 아니라 정정이다.** GEX가 음수이고 레짐이 불안정한 날에
    최고 등급이 나오던 것이 결함이었다. GEX가 양수로 돌아서고 `stability_flag`가 True가 되는
    날에는 다시 나와야 하며, **그날에도 0이면** 그때는 배선이 과하게 조인 것이니 재검토한다.

    **Fix#1과의 상호작용(같은 날 배포라 반드시 함께 읽을 것)**: `short_gamma_requires` 게이트는
    `highest_confidence`(=HIGH_CONVICTION)를 요구한다. Fix#3으로 HIGH_CONVICTION이 사라지면
    VRP가 'overpriced'인 분의 `limited_premium_sell`은 **확정적으로** 게이트에 걸린다 —
    즉 p1이 예측한 `short_gamma_requires_not_met` 증가는 Fix#3 때문에 오히려 강해진다.
    두 fix의 효과를 분리하려면 `signal_decisions.vrp`(어느 열이었나)와 conviction(어느 등급이었나)을
    나눠 봐야 한다.

    **안 고친 것(의도적)**: `event_proximity_minutes`는 여전히 None이다 — 매크로 이벤트 캘린더
    소스가 프로젝트에 없다. 이것만은 "사실"이 아니라 **미지**이며, 값을 지어내면 x0.5 페널티가
    무작위로 걸린다. `recent_slippage_elevated=False`와 `recent_same_setup_win_rate=None`은
    `trade_history`/`execution_logs`가 둘 다 0행이라 **사실로서 옳다**.
  상태: pending

- id: "2026-08-05-p4-slow-call-threshold"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "임계를 read 타임아웃 아래(3.0초)로 내리고 타임아웃을 무조건 남기면 §9 귀속 표가 되살아난다"
  근거: "08-05 §2 이상점 4 — 08-04 Fix#8이 read를 4.0초로 낮춘 순간 HTTP 소요는 구조적으로
        4.0초를 넘을 수 없게 됐는데 임계는 5.0초였다. **임계가 물리적 상한 위에 놓였다.**
        08-05 실측: `httpx.ReadTimeout` 21건이 실재하는데 §9는 '임계(5초) 초과 호출 없음',
        §0은 `slow_calls 0건`을 반증으로 판정. 계측 감사는 통과했다 — 로그에 실재하지도
        않으므로 '파서 정상'이 맞았다. 즉 **감사 규칙의 사각지대**다.
        §2-6이 '밀림의 90%는 KIS 지연'이라고 귀속시킨 바로 그 표가 침묵했다."
  예측:
    # 주장 지표 — 되살아났는가
    - metric: slow_calls.count
      expect: ">= 15"
      역할: 주장
    - metric: qualitative.read_timeout
      expect: "<= slow_calls.count"
      역할: 참고
  주의: |
    **`slow_calls.count >= qualitative.read_timeout`이 새 불변식이다.** 타임아웃은 이제 임계와
    무관하게 반드시 느린 호출 줄을 남기므로(`_log_if_slow(timed_out=True)`), 타임아웃 건수가
    느린 호출 건수를 넘으면 그 배선이 깨진 것이다.

    로그 볼륨: 08-03에 임계 3.0초가 933건을 만든 것은 read가 10초여서 꼬리가 길었기 때문이다.
    지금은 4.0초에서 잘리고 페이서도 정리됐다(08-05 밀림 0건). 08-05 §9-1 기준 3초 초과는
    혼잡 시간대에 집중된 소수라 **하루 100~300줄**을 예상한다(사람이 읽는 줄 2,833줄의 4~10%).
    **1,000줄을 넘으면 임계를 3.5초로 올린다** — 다만 4.0초 미만은 유지해야 한다(아래 불변식).

    `tests/test_broker_rest_client.py::test_slow_call_threshold_must_stay_below_every_read_timeout`이
    `SLOW_CALL_LOG_THRESHOLD_SECONDS < min(모든 read 타임아웃)`을 기계적으로 강제한다 —
    임계와 타임아웃 중 어느 쪽을 바꿔도 테스트가 깨진다. 08-04의 실수는 **둘을 각각 옳게 바꾸고
    그 사이의 관계를 아무도 안 본 것**이었다(2026-08-05 고도화#3의 국소 적용).
  상태: pending

- id: "2026-08-05-p5-daily-strategy-cap"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "하루에 진입한 distinct 전략 수가 상한(2)을 넘지 않는다"
  근거: "08-05 §2 이상점 6 — `evaluate()`의 `already_used_strategies_today`가 한 번도 전달된
        적이 없어 항상 frozenset()이었고, v6 §11.4 '하루 우선 전략군 2개 이하' 상한이 전 이력
        무력이었다. 게다가 `enforce_daily_strategy_cap` 자체가 `(continuing+fresh)[:cap]`으로
        **이번 호출의 목록 길이**만 잘랐는데, §11.4 매트릭스 셀은 전부 원소 1개짜리라
        `[:2]`가 자를 일이 한 번도 없었다 — 오늘 이미 A·B를 썼어도 세 번째 C가 통과했다."
  예측:
    - metric: db.decisions.distinct_entry_strategies
      expect: "<= 2 (수기 판정)"
      역할: 주장
  주의: |
    **이 가설은 ENTER가 나기 전까지 공허하게 참이다.** 08-05은 ENTER 0건이었고 p1이 예측하는
    08-06 ENTER도 0~5건이라, 상한이 실제로 걸리려면 **서로 다른 전략으로 3번째 진입**이
    나와야 한다. 즉 08-06에 "확인"이 떠도 그것이 상한이 동작한다는 증거는 아니다 —
    회귀를 막는 불변식으로 등재해 두는 것이고, 판정 근거는 단위테스트
    (`test_daily_cap_blocks_a_third_fresh_strategy_once_the_cap_is_reached`)에 있다.

    **알려진 한계**: `already_used_today`의 출처가 `signal_decisions`(권고된 진입)이지
    체결이 아니다. `trade_history`가 0행이라 그것 말고 셀 것이 없다 — 실주문 경로가 배선되면
    출처를 `trade_history`로 옮겨야 하고, 그 전까지 권고와 체결이 갈리는 순간 이 집합은
    사실과 달라진다.
  상태: pending

- id: "2026-08-05-p6-preopen-spot"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "장전 스팟 적재를 막으면 `underlying_spot_1m` 행이 약 90행 줄고, 장전 판단에서
        options_flow가 미가용으로 바뀐다"
  근거: "08-05 §2 이상점 8 — KOSPI200 지수는 09:00 이전에 체결되지 않는데
        `output3.bstp_nmix_prpr`는 장전에도 **전일 종가**를 돌려준다. 그것을 매분 새 행으로
        적재해 07:31~09:00 약 90분치가 '지금 시장'인 것처럼 쌓였다. 행 자체는 1분 전 것이라
        **신선도로는 절대 걸러낼 수 없다**(값이 낡았지 행이 낡은 게 아니다).
        08-05 실측: 07:31~09:00 내내 정확히 1000.0300(= 08-04 종가), 09:01에 1042.91로 점프.
        오버나이트 갭 +4.29%를 장전 90분 동안 못 본 채 GEX/감마플립/VRP를 계산했고,
        08:45~09:00 구간 판단(앙상블 4멤버)이 전부 그 위에서 내려졌다."
  대가: "09:00 이전 스팟을 안 쌓으므로 장전 90분 동안 options_flow가 미가용이 된다(틀린 값 대신 미가용을 택한 것이다)"
  예측:
    # 주장 지표
    - metric: db.tables.underlying_spot_1m.rows
      expect: "전일 대비 약 -90행 (감소가 정상)"
      역할: 주장
    - metric: db.signal_reach.member_availability.options_flow
      expect: "< 전일 (장전 구간이 미가용으로 바뀐다)"
      역할: 대가
  주의: |
    **행 수 감소를 데이터 유실로 읽지 말 것.** 없어지는 것은 전일 종가의 복제본이고,
    그 값은 전일 마지막 행에 이미 있다. §12 표에서 `underlying_spot_1m`만 줄고
    `option_analysis_1m`은 그대로여야 정상이다 — 둘 다 줄면 그건 진짜 결손이다.

    **`options_flow` 가용률 하락도 회귀가 아니다.** 장전에는 스팟이 없으므로 GEX/감마플립/
    감마월/VRP가 **틀린 값 대신 미가용**이 된다. `member_unavailable`에
    "입력 없음: gex, 기준선(flip/wall)"이 장전 구간에만 찍혀야 한다.
    09:00 이후에도 계속 미가용이면 그건 진짜 회귀다.

    **부수 확인 — `compute_gap_zscore`**: v6 §16.1 WARMUP ②의 갭 z-score는
    `(오늘 첫 스팟 − 전일 마지막 스팟)`인데 **'오늘 첫 스팟'이 곧 전일 종가**라 분자가 항상
    0이었다. DB 전수 확인 결과 **개시 이래 모든 거래일의 갭이 정확히 0.0000**이다
    (07-27~08-05 8일 전수, 라이브 호출도 0.0). 2026-07-10에 이 함수를 하드코딩 0.0에서
    실데이터로 배선했는데 **배선은 됐고 데이터가 그것을 상수로 만들고 있었다** — 08-05에 찾은
    VRP 미전달·MetaLabelContext 기본값과 정확히 같은 형태다.

    이번 fix로 '오늘 첫 스팟'이 09:00 이후 값이 되므로 갭이 살아날 **가능성**이 생긴다.
    다만 **09:00 정각 폴링이 지수 첫 체결보다 앞서면 그 1분은 여전히 전일 종가**일 수 있다
    (08-05가 그랬고, 08-04는 09:00에 이미 실값이었다). 그래서 `compute_gap_zscore()` 자체는
    이번에 손대지 않았다 — **08-06에 갭이 0인지 아닌지를 보고** 09:00 행을 더 걸러야 할지
    판단한다. 숫자를 보기 전에 규칙을 더 얹지 않는다.
  상태: pending

