- id: "2026-08-04-p5-kis-latency-rule"
  구현일: 2026-08-04
  검증예정일: 2026-08-06
  가설: "KIS 응답시간 p95를 시간대별로 재면 매일 반복되는 혼잡 구간이 드러난다"
  근거: "08-04 §2-6 — 느린 호출 362건의 총 2,278초 중 HTTP가 2,050초(90%)이고, 08-03 대비
        페이서는 1,661→229초(-86%)로 무너졌는데 HTTP는 1,979→2,050초로 불변이다. 즉 남은 밀림은
        우리 스케줄이 아니라 KIS 응답 지연에서 온다. 그런데 지금 리포트는 그 지연을 우리 지표
        (밀림 건수)로만 본다 — slow_calls는 임계(5초) 위 꼬리만 보므로 p50을 알 수 없다.
        08-04 시간대 분포: 느린 호출 362건 중 13~15시가 280건(77%), 밀림 48건 중 36건(75%)."
  예측:
    - metric: rest_latency.endpoints.inquire-price.p95
      expect: "수기 판정"
      역할: 주장
    - metric: rest_latency.warnings
      expect: "수기 판정"
  주의: |
    **이 가설은 하루로 판정하지 않는다** — "매일 반복되는가"가 가설의 내용이므로 최소 이틀이
    필요하다(그래서 검증예정일이 08-06이다).

    **사전 대응 규칙(숫자를 보기 전에 확정한다)**:
      `inquire-price`의 p95가 2.5초를 넘는 시간대가 **이틀 연속 같은 시간대에** 나타나면,
      그 시간대에 한해 위클리 폴링을 2분 → 4분 격분으로 늘린다.
      **먼슬리는 건드리지 않는다** — 판단 입력이다(07-31에 ATM±2→±1을 "판단 입력을 훼손하는
      안"이라며 보류한 것과 같은 원칙: 총량 축소보다 손실이 작은 순서로 간다).

    2.5초 근거: 정상 호출은 페이서 포함 ~1.2초다. p95가 2.5초면 스무 번에 한 번꼴로 정상의
    두 배 넘게 걸린다는 뜻이고, 그 구간에서는 20레그 x 2.5초 = 50초로 Fix#8의 사이클 예산을
    전부 써버린다.

    **자동 적응은 의도적으로 구현하지 않았다.** 지연을 보고 폴링을 줄이면 폴링이 줄어 지연이
    낮아지고 다시 폴링이 느는 되먹임이 생긴다 — 2026-07-08에 페이서를 나눴다가 500 폭주로
    203분을 잃은 전례가 있다. 규칙의 발동은 사람이 한다.
  검정: |
    2026-08-06 확정 — 시간대별 p95가 실제로 반복 구간을 드러냈다. `inquire-price` p95가 2.5초를 넘은 구간이 10·11·12·13·14시 다섯 개이고, **08-05와 같은 다섯 시간대가 이틀 연속** 초과해 사전 대응 규칙의 발동 조건이 성립했다(자동 리포트 §9-1). 가설이 주장한 것은 '드러난다'까지이고 그것은 달성됐다 — **발동 여부는 별건**이며 보고서 §5-4에서 '고도화 1(북 우선순위)을 먼저 넣고 1~2거래일 관측한 뒤 결정'을 권고했다.
  상태: confirmed

- id: "2026-08-05-p1-vrp-wiring"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "팔레트에 VRP를 실제로 넘기면 `strategy_palette:wait_only`가 급감하고
        `short_gamma_requires_not_met`이 그 자리를 대신한다"
  근거: "08-05 §2 이상점 1 — `poll_signal_fusion_cycle()`이 `evaluate(signal_inputs,
        MetaLabelContext())`로 호출해 `vrp`가 **한 번도 전달된 적이 없었다**(기본값 0.0).
        `_vrp_state(0.0, 0.02)`는 항상 'fair'라 v6 §11.4 매트릭스 3열 중 2열이 전 이력 도달
        불가였고, 레짐도 RANGE_BALANCED 고정이라 9칸 중 도달 가능한 칸이 `wait_and_see`
        하나뿐이었다. 그 결과 08-05 HIGH_CONVICTION 6건(방향 ±0.692, 동조 3, 확신도 0.75)이
        전부 `wait_only`로 버려졌다.
        08-05 하루치(09:47 시점)를 배선 후 규칙으로 리플레이한 결과:
          overpriced 111분 / fair 31분 / underpriced 3분(전부 아티팩트, 아래 주의 참고).
        RANGE_TIGHT x overpriced = ['limited_premium_sell']는 프리미엄 매도라
        `short_gamma_requires`(최고신뢰 + positive GEX + 안정레짐) 게이트에 걸리는데,
        `stability_flag`가 08-05 내내 False였으므로 게이트는 확정적으로 불통과한다."
  대가: "팔레트 3열이 열리면 관망만 하던 날에 진입 후보가 생긴다 — 07-30에 팔레트 오독으로 하루 419건이 찍힌 전례가 있다"
  예측:
    # 주장 지표 — 이 가설이 실제로 주장하는 것(08-05 p4의 실패를 반복하지 않기 위해 맨 앞에 둔다)
    - metric: db.decisions.reject_reason.strategy_palette:wait_only
      expect: "< 0.5 x 전일"
      역할: 주장
    - metric: db.decisions.reject_reason.strategy_palette:short_gamma_requires_not_met
      expect: ">= 1"
      역할: 주장
    # 배선 자체가 살아 있는가 — NULL만 나오면 계산 경로가 죽은 것이다
    - metric: db.decisions.vrp.non_null_ratio
      expect: ">= 0.7"
      역할: 참고
    # 안전 — 07-30에 팔레트 오독으로 하루 419건 ENTER가 찍힌 전례가 있다
    - metric: db.decisions.decision.ENTER
      expect: "<= 5"
      역할: 대가
  주의: |
    **판정은 위 4개 지표 전부로 한다.** 08-04 p4는 "왕복이 사라진다"고 주장하면서 등록 지표는
    `chain_age_seconds_max`와 `log_volume.human_lines`였다 — 자기 주장을 검정하지 않는 지표로
    "확인" 판정이 났고, 실제 왕복률은 36.1% → 42.9%로 **악화**해 있었다. 그 실패를 반복하지
    않으려고 주장 지표를 맨 앞에 명시한다.

    **ENTER가 나오면 그 자체로 실패가 아니다** — 확인할 것은 "몇 건인가"가 아니라 "그 분의
    `vrp`가 아티팩트가 아닌가"다. 08-05 리플레이의 underpriced 3분은 전부 아티팩트였다:
      09:18  ATM(1047.5)에 **콜만** iv>0이었고 그 IV가 0.5423 → VRP −0.24
             → `atm_straddle_vrp()`가 콜·풋 양쪽을 요구하도록 만든 직접 근거.
      08:45/08:46  `underlying_spot_1m`이 장 개시 전 stale 스팟(1000.03, 실제 1048.50)이었다.
             콜·풋이 둘 다 있어 새 가드로도 통과한다 — **이것은 VRP가 아니라 스팟 신선도
             문제이므로 이번 fix의 범위 밖이다.** 08-46에 STANDARD 확신도가 겹치면 ENTER 1건이
             날 수 있다. 그 1건이 나오면 정상이고, 5건을 넘으면 다른 원인이 있는 것이다.

    KIS `hts_ints_vltl`이 행사가 격자에 따라 계통적으로 튄다(08-05 먼슬리 실측: 2.5의 홀수배
    행사가 콜 IV 0.57~0.63 vs 5의 배수 0.87~0.89, 같은 분·같은 북). ATM 콜·풋 평균은 이
    아티팩트와 풋 스큐를 함께 상쇄하는 교과서적 ATM IV 추정이라 택했다 — **단일 레그로는
    행사가가 한 칸 옮겨가는 것만으로 VRP 부호가 뒤집힌다.**

    되돌리려면: `main.py`의 `evaluate(..., vrp=...)` 인자만 빼면 08-05 이전과 완전히 같아진다.
  검정: |
    2026-08-06 확정(수기) — 주장 지표 둘 다 맞았다: `wait_only` 378 → **59건**(예측 '< 0.5 x 전일' = 189 이하), `short_gamma_requires_not_met` 0 → **264건**. 배선도 살아 있다(`vrp` non-null 80.8%, 예측 >= 0.7).
    **그러나 대가 지표가 12배 초과했다 — ENTER 예측 <= 5건에 실측 62건이다.** 그리고 그 62건 중 **21건이 v6 §4.2의 14:50 신규 진입 컷오프 이후, 18건이 15:10 강제 평탄화 이후**에 나왔다. 팔레트가 열리면서 '진입 시각 컷오프가 코드에 아예 없다'는 것이 처음 드러난 것이다(보고서 §2-2, fix 우선순위 1).
    **자동 대조는 이 사실을 한 줄도 내지 못했다** — 등록된 네 경로가 전부 `db.decisions.*`인데 리포트에 그런 절이 없어 §0이 전부 '실측 없음'으로 냈다. 위 숫자는 사람이 DB를 직접 조회해 만든 것이다(보고서 §3-1, fix 우선순위 3).
  상태: confirmed

- id: "2026-08-05-p2-endpoint-timeout"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "read 타임아웃을 엔드포인트별로 나누면 계좌잔고/만기유동성 실패가 사라지고
        옵션체인 사이클 예산은 그대로 지켜진다"
  근거: "08-05 §2 이상점 3 — 08-04 Fix#8이 read를 10→4초로 낮췄는데 그 값이 `httpx.Client`
        전역이라 **잔고 폴러까지 함께 조였다.** §9-1 실측: inquire-price p50 0.02초인데
        inquire-balance는 p50 **0.70초**(35배), 9시 p95 1.77초, 최대 4.34초 — 원래 느린
        엔드포인트다(계좌·증거금·보유종목 집계 API). 09:19/09:24/09:34 세 사이클이
        `httpx.ReadTimeout`으로 통째로 날아갔다(개장 후 8사이클 중 3건, 08-04 이전 실패 0건).
        만기유동성(inquire-asking-price)도 최대 4.00초로 천장에 닿아 2건 실패했다.
        Fix#8의 근거('60초에 20레그를 도는 사이클에서 한 레그가 10초를 먹으면 밀린다')는
        호출 1건이 곧 사이클 전체인 폴러에는 성립하지 않는다 — 되돌림이 아니라 범위 축소다."
  대가: "잔고/만기유동성 read를 10초로 되돌리므로 그 폴러가 느린 날 사이클 예산을 더 먹는다(밀림·미회수 결손이 대가다)"
  예측:
    # 주장 지표
    - metric: failures.계좌 잔고 폴링 사이클 실패
      expect: "0"
      역할: 주장
    - metric: failures.만기 유동성 폴링 실패
      expect: "<= 1"
      역할: 주장
    # 옵션체인 쪽은 4초를 유지하므로 08-05와 같은 수준이어야 한다(악화하면 범위 축소가 샜다는 뜻)
    - metric: overrun.count
      expect: "<= 25"
      역할: 대가
    - metric: cycles.missing.unrecovered_count
      expect: "<= 2"
      역할: 대가
  주의: |
    **`qualitative.read_timeout`은 줄되 0이 되지는 않는다** — 옵션체인(2,800건/일)은 여전히
    4초 천장을 쓰기 때문이다. 08-05는 21건이었고, 그중 잔고 3건 + 만기유동성 2건이 빠지므로
    16건 근처가 정상 모양이다. **0건이면 오히려 옵션체인 쪽 타임아웃까지 풀린 것**이니
    `timeout_for_url()`의 매칭이 너무 넓게 잡혔는지 확인할 것.

    부수 효과 주의: 잔고 조회가 성공하기 시작하면 `risk_gate_state.risk_engine`이
    "account_tracker_not_ready"에서 실제 평가 결과로 바뀌는 분이 늘어난다 — 그것은 이 fix의
    의도된 결과이지 새 결함이 아니다.
  검정: |
    2026-08-06 — **지표가 주장을 검정하지 못해 판정 불가로 닫는다.**
    실측: `계좌 잔고 폴링 사이클 실패` **0건**(예측 0 — 로그 전수 확인, 자동 대조는 경로가 `failures.…`로 고쳐지기 전이라 '실측 없음'이었다). `만기 유동성 폴링 실패` **7건**(예측 <= 1) → 자동 판정 반증.
    그러나 **7건의 원인이 전부 EGW00201(레이트리밋)이고 ReadTimeout 기인은 0건이다**(07:31·07:41·07:51은 08-06 Fix#2 적용 이전 프로세스, 나머지 09:05·09:31·09:43·14:23). 이 가설이 주장한 것은 'read 타임아웃 기인 실패가 사라진다'인데 등록 지표는 **원인을 가르지 않는 총 실패 건수**다 — 주장과 다른 축으로 잘린 지표로는 확인도 반증도 할 수 없다.
    대가 지표: `overrun.count` 0(예측 <= 25) 확인. `cycles.missing.unrecovered_count` 21(예측 <= 2) → 반증으로 나왔으나 **21분 중 20분이 10:04~10:23 프로세스 정지 구간**이라 이 fix와 인과가 없다(보고서 §3-5).
    → 보고서 fix 우선순위 5에서 `failures.<유형>.<원인>` 분해를 계획했다. 소급 수정이 아니라 **원인별 지표를 건 새 가설로 다시 세운다**(README 규약).
  상태: inconclusive

- id: "2026-08-05-p3-meta-label-inputs"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "`gamma_regime_stable`을 실데이터로 채우면 HIGH_CONVICTION이 사라지고 그만큼 STANDARD가 는다"
  근거: "08-05 §2 이상점 2 — `MetaLabelContext()`를 인자 없이 생성해 `classify()`의 곱셈 페널티
        4종이 하나도 안 걸렸다. 특히 `gamma_regime_stable=True`는 낙관적 하드코딩이다.
        08-05 HIGH_CONVICTION 6건의 `conviction_score`는 정확히 0.75(= regime_confidence 1.0 x
        동조비 3/4, 페널티 0회)였는데, 먼슬리 GEX는 −9.9bn(음수)이고 `stability_flag`는 하루 종일
        False였으므로 감마 레짐 페널티(x0.85)가 걸렸어야 한다 → 0.6375 < standard_max(0.65).
        08-05 판단 185건 전수 재계산: HIGH_CONVICTION 13 → **0**, STANDARD 169 → 182."
  예측:
    # 주장 지표
    - metric: db.decisions.conviction.HIGH_CONVICTION
      expect: "0"
      역할: 주장
    - metric: db.decisions.conviction.STANDARD
      expect: "> 전일"
      역할: 참고
  주의: |
    **HIGH_CONVICTION 0건은 회귀가 아니라 정정이다.** GEX가 음수이고 레짐이 불안정한 날에
    최고 등급이 나오던 것이 결함이었다. GEX가 양수로 돌아서고 `stability_flag`가 True가 되는
    날에는 다시 나와야 하며, **그날에도 0이면** 그때는 배선이 과하게 조인 것이니 재검토한다.

    **Fix#1과의 상호작용(같은 날 배포라 반드시 함께 읽을 것)**: `short_gamma_requires` 게이트는
    `highest_confidence`(=HIGH_CONVICTION)를 요구한다. Fix#3으로 HIGH_CONVICTION이 사라지면
    VRP가 'overpriced'인 분의 `limited_premium_sell`은 **확정적으로** 게이트에 걸린다 —
    즉 p1이 예측한 `short_gamma_requires_not_met` 증가는 Fix#3 때문에 오히려 강해진다.
    두 fix의 효과를 분리하려면 `signal_decisions.vrp`(어느 열이었나)와 conviction(어느 등급이었나)을
    나눠 봐야 한다.

    **안 고친 것(의도적)**: `event_proximity_minutes`는 여전히 None이다 — 매크로 이벤트 캘린더
    소스가 프로젝트에 없다. 이것만은 "사실"이 아니라 **미지**이며, 값을 지어내면 x0.5 페널티가
    무작위로 걸린다. `recent_slippage_elevated=False`와 `recent_same_setup_win_rate=None`은
    `trade_history`/`execution_logs`가 둘 다 0행이라 **사실로서 옳다**.
  검정: |
    2026-08-06 확정(수기) — 주장 지표 확인: `HIGH_CONVICTION` 28 → **0건**(예측 0). 참고 지표 `STANDARD`는 349 → **319건**으로 오히려 줄어 예측('> 전일')을 빗나갔다 — 다만 그날 총 판단이 494 → 474건(프로세스 정지 19분)이라 분모가 다르고, 같은 날 p1이 팔레트를 열어 62건이 ENTER로 빠져나간 것이 겹친다. **주장은 맞았고 참고 지표의 어긋남은 다른 fix의 간섭으로 설명된다.** 자동 대조는 `db.decisions.*` 경로가 죽어 전부 '실측 없음'이었다(§3-1).
  상태: confirmed

- id: "2026-08-05-p4-slow-call-threshold"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "임계를 read 타임아웃 아래(3.0초)로 내리고 타임아웃을 무조건 남기면 §9 귀속 표가 되살아난다"
  근거: "08-05 §2 이상점 4 — 08-04 Fix#8이 read를 4.0초로 낮춘 순간 HTTP 소요는 구조적으로
        4.0초를 넘을 수 없게 됐는데 임계는 5.0초였다. **임계가 물리적 상한 위에 놓였다.**
        08-05 실측: `httpx.ReadTimeout` 21건이 실재하는데 §9는 '임계(5초) 초과 호출 없음',
        §0은 `slow_calls 0건`을 반증으로 판정. 계측 감사는 통과했다 — 로그에 실재하지도
        않으므로 '파서 정상'이 맞았다. 즉 **감사 규칙의 사각지대**다.
        §2-6이 '밀림의 90%는 KIS 지연'이라고 귀속시킨 바로 그 표가 침묵했다."
  예측:
    # 주장 지표 — 되살아났는가
    - metric: slow_calls.count
      expect: ">= 15"
      역할: 주장
    - metric: qualitative.read_timeout
      expect: "<= slow_calls.count"
      역할: 참고
  주의: |
    **`slow_calls.count >= qualitative.read_timeout`이 새 불변식이다.** 타임아웃은 이제 임계와
    무관하게 반드시 느린 호출 줄을 남기므로(`_log_if_slow(timed_out=True)`), 타임아웃 건수가
    느린 호출 건수를 넘으면 그 배선이 깨진 것이다.

    로그 볼륨: 08-03에 임계 3.0초가 933건을 만든 것은 read가 10초여서 꼬리가 길었기 때문이다.
    지금은 4.0초에서 잘리고 페이서도 정리됐다(08-05 밀림 0건). 08-05 §9-1 기준 3초 초과는
    혼잡 시간대에 집중된 소수라 **하루 100~300줄**을 예상한다(사람이 읽는 줄 2,833줄의 4~10%).
    **1,000줄을 넘으면 임계를 3.5초로 올린다** — 다만 4.0초 미만은 유지해야 한다(아래 불변식).

    `tests/test_broker_rest_client.py::test_slow_call_threshold_must_stay_below_every_read_timeout`이
    `SLOW_CALL_LOG_THRESHOLD_SECONDS < min(모든 read 타임아웃)`을 기계적으로 강제한다 —
    임계와 타임아웃 중 어느 쪽을 바꿔도 테스트가 깨진다. 08-04의 실수는 **둘을 각각 옳게 바꾸고
    그 사이의 관계를 아무도 안 본 것**이었다(2026-08-05 고도화#3의 국소 적용).
  검정: |
    2026-08-06 확정 — `slow_calls.count` **1,073건**(예측 >= 15, 08-05는 44건). §9 귀속 표가 되살아났고 페이서 우세 76 / HTTP 우세 997로 **극단값이 전부 HTTP 쪽**이라는 그림이 다시 보인다(§17이 이 조합을 KIS 귀속으로 판정했다). 참고 지표 `qualitative.read_timeout` 126건은 `slow_calls.count` 이하라는 관계도 성립한다 — **다만 그 126이라는 값 자체가 실제(205건)의 61%다**(보고서 §3-2, fix 우선순위 4).
  상태: confirmed

- id: "2026-08-05-p5-daily-strategy-cap"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "하루에 진입한 distinct 전략 수가 상한(2)을 넘지 않는다"
  근거: "08-05 §2 이상점 6 — `evaluate()`의 `already_used_strategies_today`가 한 번도 전달된
        적이 없어 항상 frozenset()이었고, v6 §11.4 '하루 우선 전략군 2개 이하' 상한이 전 이력
        무력이었다. 게다가 `enforce_daily_strategy_cap` 자체가 `(continuing+fresh)[:cap]`으로
        **이번 호출의 목록 길이**만 잘랐는데, §11.4 매트릭스 셀은 전부 원소 1개짜리라
        `[:2]`가 자를 일이 한 번도 없었다 — 오늘 이미 A·B를 썼어도 세 번째 C가 통과했다."
  예측:
    - metric: db.decisions.distinct_entry_strategies
      expect: "<= 2 (수기 판정)"
      역할: 주장
  주의: |
    **이 가설은 ENTER가 나기 전까지 공허하게 참이다.** 08-05은 ENTER 0건이었고 p1이 예측하는
    08-06 ENTER도 0~5건이라, 상한이 실제로 걸리려면 **서로 다른 전략으로 3번째 진입**이
    나와야 한다. 즉 08-06에 "확인"이 떠도 그것이 상한이 동작한다는 증거는 아니다 —
    회귀를 막는 불변식으로 등재해 두는 것이고, 판정 근거는 단위테스트
    (`test_daily_cap_blocks_a_third_fresh_strategy_once_the_cap_is_reached`)에 있다.

    **알려진 한계**: `already_used_today`의 출처가 `signal_decisions`(권고된 진입)이지
    체결이 아니다. `trade_history`가 0행이라 그것 말고 셀 것이 없다 — 실주문 경로가 배선되면
    출처를 `trade_history`로 옮겨야 하고, 그 전까지 권고와 체결이 갈리는 순간 이 집합은
    사실과 달라진다.
  검정: |
    2026-08-06 확정(수기) — 진입 distinct 전략 **1종**(`small_strangle_buy`, 62건 전부) ≤ 2. 상한은 지켰다. **다만 이 값이 1이라는 것은 '상한이 잘 걸렸다'가 아니라 '앙상블 4멤버가 하루 종일 한 전략만 가리켰다'는 뜻이기도 하다** — §14-3에서 `regime_hmm`이 399분 전량 0점인 것과 함께 읽어야 한다(보고서 §2-6, 고도화 2). 자동 대조는 경로(`db.decisions.distinct_entry_strategies`)가 죽어 '실측 없음'이었다.
  상태: confirmed

- id: "2026-08-05-p6-preopen-spot"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "장전 스팟 적재를 막으면 `underlying_spot_1m` 행이 약 90행 줄고, 장전 판단에서
        options_flow가 미가용으로 바뀐다"
  근거: "08-05 §2 이상점 8 — KOSPI200 지수는 09:00 이전에 체결되지 않는데
        `output3.bstp_nmix_prpr`는 장전에도 **전일 종가**를 돌려준다. 그것을 매분 새 행으로
        적재해 07:31~09:00 약 90분치가 '지금 시장'인 것처럼 쌓였다. 행 자체는 1분 전 것이라
        **신선도로는 절대 걸러낼 수 없다**(값이 낡았지 행이 낡은 게 아니다).
        08-05 실측: 07:31~09:00 내내 정확히 1000.0300(= 08-04 종가), 09:01에 1042.91로 점프.
        오버나이트 갭 +4.29%를 장전 90분 동안 못 본 채 GEX/감마플립/VRP를 계산했고,
        08:45~09:00 구간 판단(앙상블 4멤버)이 전부 그 위에서 내려졌다."
  대가: "09:00 이전 스팟을 안 쌓으므로 장전 90분 동안 options_flow가 미가용이 된다(틀린 값 대신 미가용을 택한 것이다)"
  예측:
    # 주장 지표
    - metric: db.tables.underlying_spot_1m.rows
      expect: "전일 대비 약 -90행 (감소가 정상)"
      역할: 주장
    - metric: db.signal_reach.member_availability.options_flow
      expect: "< 전일 (장전 구간이 미가용으로 바뀐다)"
      역할: 대가
  주의: |
    **행 수 감소를 데이터 유실로 읽지 말 것.** 없어지는 것은 전일 종가의 복제본이고,
    그 값은 전일 마지막 행에 이미 있다. §12 표에서 `underlying_spot_1m`만 줄고
    `option_analysis_1m`은 그대로여야 정상이다 — 둘 다 줄면 그건 진짜 결손이다.

    **`options_flow` 가용률 하락도 회귀가 아니다.** 장전에는 스팟이 없으므로 GEX/감마플립/
    감마월/VRP가 **틀린 값 대신 미가용**이 된다. `member_unavailable`에
    "입력 없음: gex, 기준선(flip/wall)"이 장전 구간에만 찍혀야 한다.
    09:00 이후에도 계속 미가용이면 그건 진짜 회귀다.

    **부수 확인 — `compute_gap_zscore`**: v6 §16.1 WARMUP ②의 갭 z-score는
    `(오늘 첫 스팟 − 전일 마지막 스팟)`인데 **'오늘 첫 스팟'이 곧 전일 종가**라 분자가 항상
    0이었다. DB 전수 확인 결과 **개시 이래 모든 거래일의 갭이 정확히 0.0000**이다
    (07-27~08-05 8일 전수, 라이브 호출도 0.0). 2026-07-10에 이 함수를 하드코딩 0.0에서
    실데이터로 배선했는데 **배선은 됐고 데이터가 그것을 상수로 만들고 있었다** — 08-05에 찾은
    VRP 미전달·MetaLabelContext 기본값과 정확히 같은 형태다.

    이번 fix로 '오늘 첫 스팟'이 09:00 이후 값이 되므로 갭이 살아날 **가능성**이 생긴다.
    다만 **09:00 정각 폴링이 지수 첫 체결보다 앞서면 그 1분은 여전히 전일 종가**일 수 있다
    (08-05가 그랬고, 08-04는 09:00에 이미 실값이었다). 그래서 `compute_gap_zscore()` 자체는
    이번에 손대지 않았다 — **08-06에 갭이 0인지 아닌지를 보고** 09:00 행을 더 걸러야 할지
    판단한다. 숫자를 보기 전에 규칙을 더 얹지 않는다.
  검정: |
    2026-08-06 확정(수기) — `underlying_spot_1m` 490 → **384행**(-106). 예측은 약 -90행이었고, 10:04~10:23 프로세스 정지 19분을 보정하면 **-87행**으로 예측과 거의 일치한다. 대가 지표도 예측대로다: `options_flow` 가용률 99.6% → **80.8%**(장전 구간이 미가용으로 바뀌었고, 그중 36분이 구조적으로 기록됐다 — 08-06 Fix#5의 효과).
    자동 대조 불가: `db.tables.underlying_spot_1m.rows`는 `db.tables`가 **리스트**라 키 접근이 성립하지 않고, `db.signal_reach.member_availability.*`는 실제로 `db.member_availability.members`(리스트)다(§3-1).
  상태: confirmed

- id: "2026-08-05-p7-event-calendar"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "수기 이벤트 캘린더를 배선하면 만기 15분 전 구간에서 확신도가 절반으로 떨어진다"
  근거: "08-05 §2 이상점 2 후속 — `classify()`는 다음 이벤트까지 남은 시간이 15분 미만이면
        확신도에 x0.5 페널티를 거는데, 캘린더 소스가 프로젝트에 없어 `event_proximity_minutes`가
        **전 이력 None**이었다. FOMC·옵션만기 직전에도 페널티가 한 번도 걸린 적이 없다.
        사용자 결정으로 (a) 수기 YAML을 채택했다(외부 API는 운영 신뢰도 문제를 하나 더 만들고,
        만기일만 자동 배선하면 커버리지 착시가 생긴다).
        **2026-08-06은 위클리(목) 만기일이다** — 배포된 캘린더에 15:35로 등재돼 있으므로
        15:20~15:34 구간이 페널티 대상이 된다(관측 루프는 15:45에 종료된다)."
  예측:
    # 주장 지표 — 페널티가 실제로 걸리는가
    - metric: db.decisions.conviction_score.15시20분이후_평균
      expect: "직전 구간의 약 0.5배 (수기 판정)"
      역할: 주장
    - metric: qualitative.event_calendar_not_covered
      expect: "0 (covered_through=2026-08-13이라 아직 범위 안 — 0이 정상)"
      역할: 참고
  주의: |
    **`event_calendar_not_covered` 0건을 "기계가 죽었다"로도 "살았다"로도 읽지 말 것.**
    `covered_through`가 2026-08-13이라 08-14 전까지는 경고가 안 나는 것이 정상이다.
    이 계측이 살아 있는지는 계측 감사(`_PARSER_AUDIT_TOKENS`)가 지키고, **기계가 배선됐는지는
    위의 페널티(15:20~15:34)로 확인**한다 — 0건짜리 지표로 배선을 판정하려 들면 08-04에
    `slow_calls 0건`을 개선으로 읽은 것과 같은 실수가 된다.

    **2026-08-14부터는 경고가 매일 뜬다.** 그때 할 일은 경고를 끄는 게 아니라
    `mahdi/config/event_calendar.yaml`에 다음 만기·매크로 일정을 채우고 `covered_through`를
    옮기는 것이다. **경고가 뜨는 것이 이 방식의 설계 의도다** — 수기 테이블의 실패 모드는
    "안 채우는 것"이 아니라 "안 채운 걸 모르는 것"이고, 그 하나를 막으려고 (a)를 택했다.

    **알려진 한계(의도적)**: `event_proximity_minutes`는 v6 정의대로 "다음 이벤트까지 남은 분"
    이라 **이벤트 직후**(변동성이 가장 큰 구간일 때가 많다)에는 페널티가 걸리지 않는다.
    08-06 15:35~15:45가 그 구간이다 — 필드 의미를 바꿔야 덮을 수 있어 별건으로 남겼다.

    되돌리려면: `event_calendar.yaml`의 `events`를 비우면 페널티가 사라진다(경고는 계속 뜬다).
  검정: |
    2026-08-06 확정(수기) — **오늘이 위클리 목요일 만기일이었고 캘린더가 정확히 발동했다.** `conviction_score`가 15:20까지 0.638 → **15:21~15:35 구간 0.213**으로 떨어졌다(0.33배). 예측은 '약 0.5배'였으므로 방향은 맞고 크기는 예측보다 크다. 15:36에 0.567로 복귀해 페널티 구간의 경계도 명확하다.
    **주의**: 확신도를 3분의 1로 깎았는데도 15:21~15:30에 SMALL_TEST ENTER가 10분 연속 나왔다 — 확신도 페널티만으로는 만기 직전 진입을 막지 못한다는 뜻이고, 그것이 fix 우선순위 1(시각 컷오프)이 필요한 두 번째 이유다.
    참고 지표 `qualitative.event_calendar_not_covered`는 파서가 만들지 않는 키라 '실측 없음'이었다.
  상태: confirmed

# ===== 2026-08-05 저녁 — 운영점검보고서 Fix#1~#6 =====
#
# 규약(08-05 고도화#2): **주장 지표를 맨 앞에** 둔다. 08-04 `p4`는 "왕복이 사라진다"고 주장하면서
# 등록 지표가 `chain_age_seconds_max`/`log_volume.human_lines`였고, 자기 주장을 검정하지 않는
# 지표로 "확인" 판정이 났다.

- id: "2026-08-05-p8-gamma-flip-leg-range"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "감마플립을 수집 행사가 범위(±1 행사가 간격) 안으로 가두면 허수 flip이 사라진다"
  근거: |
    08-05 §2-5 — flip이 처음으로 0%를 벗어나 22분(4.5%) 산출됐는데 **21건이 수집 행사가 창 밖**
    이었고, 그 21건의 `flip / spot`이 전부 0.95~0.99에 몰려 있었다(= 탐색 그리드 왼쪽 끝).
    원인은 그리드와 레그의 폭이 10배 차이난다는 것이다 — 그리드는 스팟 ±5%(104포인트)인데
    수집 레그는 ATM±2 = 폭 10포인트다. 레그가 없는 90% 구간에서 GEX(S)는 부동소수 잔여이고,
    부호가 이유 없이 바뀐다. 08-04에 고친 허수 flip(`v_prev == 0` → 그리드 왼쪽 끝)과
    **같은 자리에서 다른 경로로 재발**한 것이다.

    자동 리포트 §14는 이것을 "산출률 4.5% — 행사가 창이 스팟을 따라가는지 확인"이라는
    **정반대 방향의 경고**로 냈다. 그리고 §15의 「광폭 감마플립」은 같은 날 세 북 모두 '없음'
    이었다 — **한 문서 안에서 두 절이 모순된 답을 내는데 아무도 나란히 읽지 않았다.**
  대가: "레그 범위 밖 flip을 전부 기각하므로 **범위 바로 밖의 진짜 flip도 함께 버린다**(산출률이 0%로 돌아갈 수 있다)"
  예측:
    - metric: db.signal_reach.gamma_flip_out_of_range_count
      expect: "0"
      역할: 주장
    - metric: db.signal_reach.gamma_flip_pct
      expect: "<= 1"
      역할: 대가
  주의: |
    **`gamma_flip_pct`가 0%로 돌아가는 것은 실패가 아니다.** 08-04 §2-3이 확정했듯 이 북은
    전 구간에서 GEX 부호가 안 바뀌므로 0%가 정상이고, 08-05의 4.5%는 개선이 아니라 결함이었다.
    실패 신호는 `gamma_flip_out_of_range_count > 0`(fix가 뚫림) 하나다.

    허용치를 행사가 간격 단위로 잡은 근거(분리도): 기존 테스트 구성(행사가 340/350/360,
    진짜 flip 338.25)은 **0.18간격**이라 통과하고, 08-05 실측 21건은 **4.5~34.5간격**이라 기각된다.
    경계를 [min, max]로 딱 자르면 그 정당한 flip이 사라진다 — 최외곽 행사가 바로 바깥에도
    그 레그의 감마는 실재한다.
  검정: |
    2026-08-06 확정 — 주장 지표(불변식) `gamma_flip_out_of_range_count` **0건**. 대가 지표 `gamma_flip_pct` **0.0%**(예측 <= 1, 08-05는 4.5%).
    **0%를 '감마플립이 죽었다'로 읽지 않는 근거**: §15의 광폭 OI 지형에서 세 북 모두 「광폭 감마플립 없음」이다 — 방문한 전 행사가 구간에서 GEX 부호가 안 바뀐다(딜러 포지션이 한 방향). 08-04에 ±3% 25행사가로 실측 확인한 것과 같은 결론이며, 행사가 창을 넓혀도 해결되지 않는다. 즉 08-05의 21~22건이 허수였다는 이 fix의 전제가 유지된다.
  상태: confirmed

- id: "2026-08-05-p9-zero-row-minutes"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "결손을 DB 축으로 이중화하면 rows=0으로 끝난 분이 리포트에 드러난다"
  근거: |
    08-05 §2-6 — DB 기준 옵션체인 0행 분이 **4분**(10:04 / 10:54 / 12:57 / 14:31)인데 리포트 §4는
    결손 **1분**만 보고했다. 14:31은 KIS가 53초간 전 레그를 타임아웃시켜 `rows=0`으로 마감한
    분인데, 결손 지표는 *"사이클이 돌았는가"* 를 세므로 **구조적으로 못 본다**.
    반대쪽 증거도 있다: 10:03(24행)·12:56(22행)이 설계 상한 20을 넘고, **두 분 모두 0행 분
    바로 직전**이다 — 한 사이클의 행이 이웃 분 라벨로 들어갔다는 뜻이다.
  예측:
    - metric: db.chain_minute_coverage.zero_row_count
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.chain_cycle_empty
      expect: ">= 0"
      역할: 주장
  주의: |
    **0건을 성공으로 읽지 말 것.** 이 fix는 손실을 줄이는 게 아니라 **보이게** 하는 것이다.
    08-06에 KIS가 안 멈추면 0이 나오는 게 맞고, 그때 확인할 것은 "키가 존재하는가"다 —
    키 자체가 없으면 지표가 안 붙은 것이다(08-04에 `slow_calls 0건`을 개선으로 읽은 실수).
    두 축이 어긋나면 리포트 §4가 자동으로 경고를 낸다.
  검정: |
    2026-08-06 확정 — DB 축이 실제로 붙었고 값이 나왔다: `zero_row_count` **21분**, 로그 축 결손과 정확히 같은 21분(10:04~10:23 + 1분). 두 축이 일치하므로 §4 교차 경고도 안 떴다.
    **다만 첫 실측이 오염됐다** — 21분 중 20분이 관측 루프 정지 구간이라 이 지표가 재려던 것('사이클은 돌았는데 행이 0인 분')은 실질 1분(13:19)뿐이다. 리포트에 「관측 루프 미가동 분」 축이 없어 '인프라 결손 ▲20 ⚠'으로 표시됐다(보고서 §3-5, fix 우선순위 6).
  상태: confirmed

- id: "2026-08-05-p10-monthly-leg-completeness"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "먼슬리 레그 완전성을 재면 커버리지가 가리고 있던 판단 주입력의 두께가 드러난다"
  근거: |
    08-05 §2-7 — 먼슬리 커버리지는 98.8%인데 **레그 10개 미만인 분이 489분 중 187분(38.2%)**,
    BS 최소(6) 미달이 18분, 0개인 분이 2개(14:31 / 14:46)였다. 커버리지는 *"그 분에 먼슬리
    행이 있는가"* 만 보고 몇 개인지는 안 본다. 먼슬리는 GEX/감마플립의 유일한 입력이다.

    **보고서 초안의 전제는 틀렸다.** 초안은 "수집 순서에 만기 우선순위가 없다"고 적었는데,
    `books`는 이미 먼슬리 우선이고 `_books_due_this_cycle`이 그 순서를 보존한다.
    14:31/14:46에 먼슬리가 0레그였던 것은 **순서가 아니라 먼슬리 레그가 전부 타임아웃**했기
    때문이다(14:31 로그: 53초간 성공 0건, 14:46: 첫 성공 응답이 14:46:47).
    **KIS가 멈춘 분은 순서를 바꿔도 잃는다.** 그래서 우선순위 변경 대신 (a) 순서를 **불변식
    테스트로 고정**하고 (b) 두께를 **계측**한다.
  예측:
    - metric: db.monthly_leg_completeness.below_design_pct
      expect: ">= 0"
      역할: 주장
    - metric: db.monthly_leg_completeness.below_flip_minimum_count
      expect: ">= 0"
      역할: 주장
  주의: |
    **이 fix는 값을 좋게 만들지 않는다 — 재기만 한다.** 08-06의 38.2%가 그대로여도 반증이 아니다.
    개선하려면 read 타임아웃/예산/폴링 폭 중 하나를 건드려야 하고, 그것은 08-05 실측이
    "밀림 0건·미회수 1분"으로 좋았던 균형을 다시 흔드는 일이라 **며칠 값을 쌓고 결정한다.**
  검정: |
    2026-08-06 확정 — 커버리지가 가리고 있던 두께가 드러났다: 먼슬리 절대 커버리지 **95.5%**인데 설계 10레그 미만이 **128분 / 472분(27.1%)**, 중앙 10레그·최소 6레그, BS 최소(6) 미달 **0분**. §17이 이 모순을 자동으로 잡아냈다.
    원인은 08-04 Fix#8의 예산 컷이다 — 오늘 43회 컷 / **169레그 포기**(08-05 34회 / 117레그). 이 fix는 '재기만 한다'가 목표였고 그것을 달성했다. **줄이는 것은 별건**이며, 보고서 고도화 1(북 우선순위 큐 — 버려야 한다면 위클리부터)로 계획했다.
  상태: confirmed

- id: "2026-08-05-p11-traceback-budget"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "예외 유형당 트레이스백을 하루 3건으로 제한하면 로그의 절반을 차지하던 트레이스백이 사라지고 human_lines가 진짜 사람 로그를 가리킨다"
  근거: |
    08-05 §2-4 — 로그 33,737줄 중 **16,577줄(49%)이 트레이스백**이었다(ReadTimeout 210건 x 78.9줄).
    `human_lines`가 httpx가 아닌 **모든 줄**을 세고 있어 그 16,577줄이 "사람이 읽는 줄"로 집계됐고,
    자동 리포트 §0은 그 값(21,176)으로 가설 `2026-08-04-p4`를 **반증 판정했다.**
    **실측 사람 로그는 4,599줄로 예측치(<=6,500)를 통과한다** — 08-04 Fix#6(ATM 히스테리시스)의
    성공이 트레이스백에 묻혀 실패로 보고된 것이다(08-04 7,539줄 → 4,599줄, -39%).

    원인은 두 전제가 겹친 것이다: (1) `_log_kis_call_failure()`가 HTTPStatusError가 아닌 예외에
    항상 트레이스백을 붙인다(08-03 §2-8의 결정, "예외는 드물다"는 전제 위에 있었다).
    (2) 08-04 Fix#8이 read를 10 → 4초로 낮춰 ReadTimeout을 **일상**으로 만들었다(3건 → 210건, 70배).
    **fix 하나가 다른 fix의 전제를 무너뜨렸는데 그 fix가 전제를 재검토하지 않았다.**
  대가: "예외 유형당 트레이스백을 3건으로 줄이므로 4번째 이후의 스택은 영영 못 본다(유형·메시지만 남는다)"
  예측:
    - metric: log_volume.traceback_lines
      expect: "<= 1500"
      역할: 주장
    - metric: log_volume.human_lines
      expect: "<= 6000"
      역할: 주장
    - metric: qualitative.read_timeout
      expect: ">= 1"
      역할: 대가
  주의: |
    **`read_timeout`이 0이 되면 그것이 실패다.** 트레이스백을 생략한 줄에도
    `트레이스백 생략 — httpx.ReadTimeout` 마커를 실어 같은 키에 합산하도록 했고, 계약 테스트가
    그 마커가 emit 포맷에서 실제로 나오는지 지킨다 — 08-04 §2-1(로그를 바꾼 커밋이 자기 계측을
    껐다)과 **같은 함정 위를 지나는 fix**라 그 방어를 먼저 깔았다.

    같은 날 `e02fae8`(엔드포인트별 read 타임아웃)도 ReadTimeout 건수를 줄이므로 두 효과가 섞인다.
    **분리 판정은 트레이스백/타임아웃 비율(08-05 실측 78.9줄/건)로 한다** — 이 값이 3건 상한
    부근으로 떨어지면 예산이 작동한 것이고, 78.9 근처면 예산이 안 걸린 것이다.
  검정: |
    2026-08-06 확정 — 주장 지표 둘 다 확인: `traceback_lines` **158줄**(예측 <= 1500, 08-05는 16,577줄), `human_lines` **5,918줄**(예측 <= 6000, 08-05는 21,176줄). 트레이스백/타임아웃 비율은 158 / 205 ≈ 0.77줄/건으로 78.9줄/건에서 완전히 떨어졌다 — 예산이 작동했다.
    **대가 지표에 결함이 발견됐다**: `qualitative.read_timeout` 126건은 실제 **205건**의 61%다. `_log_kis_call_failure()`가 `TracebackBudget.take()`로 카운터를 먼저 올린 뒤 `WarningThrottle`이 60초 창으로 줄을 통째로 삼키기 때문이다(81건 소실). 억제 요약 줄('최근 60초간 M건 추가 억제됨', 오늘 53건)에 M이 남아 있으나 파서가 안 읽는다. 또한 `오늘 N번째` 카운터가 프로세스 단위라 오늘처럼 세 번 뜬 날은 두 번 되감긴다(보고서 §3-2·§3-3, fix 우선순위 4).
  상태: confirmed

- id: "2026-08-05-p12-closing-auction-member"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "종가 단일가 구간을 판단 경로가 인지하면 orderflow_ofi_vpin의 미가용이 장애가 아니라 시장 구조로 기록된다"
  근거: |
    08-05 §2-8 — 15:36~15:44에 `orderflow_ofi_vpin`이 죽어 앙상블이 **4 → 3**으로 얇아졌는데
    사유가 `ofi/queue_imbalance 없음`으로만 남아 장애와 구분되지 않았다. 원인은 결함이 아니라
    시장 구조다(15:35~15:45는 종가 단일가라 연속 체결이 없어 WS 1분봉이 안 만들어진다).

    **이 사실을 아는 코드가 프로젝트에 딱 하나 있었고 그게 화면이었다**
    (`dashboard/data_source._CLOSING_AUCTION_START`, 08-03에 배지 오경보를 고치며 생김).
    08-04 §2-10은 이 시간대를 *"종가 형성 구간이라 가치가 높다"* 고 적었다 — 가치가 높다고
    판정한 구간에서 판단이 조용히 얇아지고 있었다.
  예측:
    - metric: db.member_availability.orderflow_ofi_vpin.structural_minutes
      expect: "5 ~ 12"
      역할: 주장
    - metric: db.member_availability.orderflow_ofi_vpin.available_pct
      expect: ">= 80"
      역할: 참고
  주의: |
    **멤버를 살리지 않는다.** 단일가 구간에도 OFI는 여전히 없고, 없는 값을 지어내면 08-03의
    허수 감마플립과 같은 종류의 결함이 된다. 이 fix가 바꾸는 것은 **사유 문자열 하나**이고,
    그것으로 §14-1이 "구조적" 열을 분리해 낼 수 있게 된다.

    구조적 분이 12를 크게 넘으면 **단일가 밖에서도 체결이 끊긴 것**이다(그때는 진짜 이상).
    5분 미만이면 경계(15:35)가 실제와 다른지 확인한다 — 08-05 실측은 15:36부터였다.
  검정: |
    2026-08-06 확정(수기) — 주장 지표 `structural_minutes` **9분**(예측 5~12), 참고 지표 `available_pct` **82.3%**(예측 >= 80). 종가 단일가 구간의 `orderflow_ofi_vpin` 미가용이 장애가 아니라 시장 구조로 기록되기 시작했고, 08-05에 가용률에 녹아들던 9분이 이제 분리돼 보인다.
    자동 대조 불가: `db.member_availability.<멤버>.*`는 멤버가 키가 아니라 `db.member_availability.members` 리스트의 원소다(§3-1).
  상태: confirmed

- id: "2026-08-05-p13-spot-source-divergence"
  구현일: 2026-08-05
  검증예정일: 2026-08-06
  가설: "스팟의 두 독립 소스를 매일 대조하면 지수가 얼어붙은 채 선물만 움직인 구간이 드러난다"
  근거: |
    08-05 §2-3 — 07:31~09:00에 `underlying_spot_1m`이 전일 종가 1000.03에 **75분간 고정**돼
    있는 동안 선물은 1048까지 가 있었다. 두 값이 **48포인트(4.8%) 어긋난 채 15분을 갔는데
    아무도 비교하지 않았다.** ATM 롤링은 선물을 보고 08:46에 옳게 움직였고, 신호 층은 지수를
    써서 GEX를 스팟 1000.03 / 행사가 1042.5~1052.5로 계산했다.

    그리고 §14-2 「ATM 정합률」이 이 사고를 **88.1%로 통과시켰다** — 지표가 ATM을 계산할 때
    쓰는 스팟이 그 얼어붙은 값이기 때문이다. 앞 75분은 스팟도 행사가도 틀렸는데 **둘이 서로
    일치해서** 정합으로 세어졌다. 관측 지표가 감시 대상과 같은 오염된 입력을 쓰면 사고를 못 잡는다.

    **구현 중 새로 찾은 것**: 지수 정지는 장전만의 일이 아니다. 08-04·08-05 **양일 모두
    15:21~15:29에 지수가 9분간 얼어붙어** 있었고(선물은 계속 움직였다), 08-04는 15:31~15:34도
    그랬다. 08-04의 마지막 정지값 1000.03이 곧 08-05 장전의 stale 값이다 — **같은 현상의 앞뒤**다.
  예측:
    - metric: db.spot_source_divergence.index_frozen_max_run
      expect: "<= 11"
      역할: 주장
    - metric: db.spot_source_divergence.median_pct
      expect: "0 ~ 0.6"
      역할: 참고
  주의: |
    **괴리율에 임계를 걸지 않는다.** 보고서 초안은 "0.5% 초과가 2분 연속이면 WARNING"이라고
    적었는데, 08-05 실측에서 정규장 중 괴리 중앙값이 **0.252%**이고 09:01·09:02·09:22·10:32가
    0.5%를 넘는다 — 선물 베이시스는 실재하는 경제량이라 그 규칙은 오경보를 냈을 것이다.
    **정상 범위를 모르는 상태에서 임계를 먼저 정하면 그 임계가 곧 결론이 된다.**
    며칠 값을 쌓아 사람이 정한다.

    `index_frozen_max_run` 예측치 11의 근거: 08-05 실측 15분(08:46~09:00 블록)에서 장전
    블록이 사라지면 남는 것은 15:21~15:29의 **9분**이다(08-04·08-05 공통). 여유 2분을 뒀다.
    **9분 근처로 떨어지면 확인**이고, 15분이 그대로면 장전 적재 중단이 안 걸린 것이다.
  검정: |
    2026-08-06 확정 — 주장 지표 `index_frozen_max_run` **9분**(예측 <= 11), 참고 지표 `median_pct` **0.242%**(예측 0 ~ 0.6). 예측치 11의 근거로 적어둔 '장전 블록이 사라지면 15:21~15:29의 9분이 남는다'가 **정확히 그대로 나왔다** — 장전 적재 중단(p6)이 걸렸다는 독립 증거이기도 하다.
    08-05에 지수가 75분간 얼어붙은 채 선물만 움직였던 사고는 재발하지 않았다(총 정지 11분). ATM 정합률의 소스 간 격차도 +9.4pt → **+4.3pt**로 좁혀졌다(§14-2).
  상태: confirmed

- id: "2026-08-06-p1-pacer-completion-based"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "페이서를 완료 시각 기준으로 바꾸면 EGW00201이 사라지고, 백오프가 걷히면서 REST가 오히려 빨라진다"
  근거: |
    08-06 §2-1 — `_RateLimiter.wait()`는 다음 슬롯을 **호출 시작 시각** 기준으로 예약하는데,
    KIS는 자기 처리 완료 기준으로 초당 건수를 센다. 앞 호출이 느리면 다음 호출이 정확히
    +min_interval에 나가도 KIS의 창 안으로 들어간다.

    08-05 전량(12,561콜) + 08-06 장전(752콜) 대조에서 **예외가 하나도 없었다**:
      직전 호출과의 완료 간격 < 1.00초 : 2,500건 중 EGW00201 **65건**(2.6%)
      직전 호출과의 완료 간격 >= 1.00초: **10,811건 중 0건(0.00%)**
    그리고 08-05 전체 호출의 **19.6%가 1.00초 미만**이었다 — 페이서가 한도를 지킨다고 믿는 동안
    다섯 중 하나가 밑으로 나가고 있었다.

    대가는 EGW00201 자체가 아니라 그것이 유발한 백오프다: 08-05 확대 84건, **시간가중 평균
    배율 1.214배** = 하루 종일 REST를 21% 느리게 썼다. 08-06 07:48에는 그 실패 1건이
    먼슬리 북을 10 → 9레그로 깎았다(C01608A21) — 판단 주입력 직격이다.
  예측:
    - metric: qualitative.egw00201
      expect: "== 0"
      역할: 주장
    - metric: backoff.max_multiplier
      expect: "<= 1.0"
      역할: 주장
    - metric: backoff.mean_multiplier
      expect: "<= 1.02"
      역할: 주장
    - metric: cycles.rest_seconds.mean
      expect: "<= 30"
      역할: 대가
    - metric: rest.calls_per_second
      expect: "0.33 ~ 0.44"
      역할: 대가
  주의: |
    **대가 지표를 반드시 함께 읽는다.** 호출당 실효 간격이 평균 rtt(~0.06초)만큼 늘어난다 —
    간격만 보면 순손해다. 이득은 배율이 1.214 → 1.00으로 돌아오는 쪽에 있으므로
    `cycles.rest_seconds.mean`(08-05 29.91초)이 **나빠지지 않아야** 이 fix가 정당화된다.
    나빠지면 min_interval을 1.0초 밑으로 내려 순이득을 회수할지 사람이 판단한다.

    `rest.calls_per_second` 하한을 0.33으로 넉넉히 둔 이유: 같은 날 Fix#2가 만기유동성
    장전 슬롯(~180콜)을 함께 걷어내므로 **두 fix의 효과가 이 지표에서 섞인다.** 그래서 이
    지표는 대가일 뿐 주장이 아니다 — 주장은 EGW00201 0건이다.

    **0건이 아니면 그 건들의 직전 호출 간격을 먼저 본다.** 1.00초 이상인데도 났다면 KIS의
    실제 한도가 바뀐 것이므로 min_interval 재교정 대상이고, 여전히 1.00초 미만이라면
    완료 시각을 못 밀고 있는 경로가 남아 있다는 뜻이다(예외 경로 등).
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — `egw00201` 7건(예측 0), 백오프 최대 2.25배(예측 <= 1.0). **3영업일 연속 0이 아니고 증가 추세다**(08-07 1 / 08-10 5 / 08-11 7) — 15시대 KIS 지연 하나로 설명되지 않는다. 완료 시각 기준 페이서만으로는 EGW00201이 안 사라진다.
  상태: refuted
- id: "2026-08-06-p2-preopen-liquidity-slots"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "장전 만기유동성 슬롯을 건너뛰어도 적재 행은 1행도 줄지 않는다 — 그 호출들은 원래 아무것도 남기지 않았다"
  근거: |
    08-06 §2-2 — 옵션 호가는 장전 동시호가(08:30)부터 나온다. 그 전에는 `_parse_asking_price_leg()`가
    스프레드를 못 구하고 `if not spread_values: continue`가 그 북을 통째로 버린다.
    DB가 그대로 증언한다 — `expiry_liquidity_1m`의 **첫 행이 08-04·08-05 모두 08:31:00**이고,
    08-06은 07:57까지 0행인데 그 사이 REST 7슬롯 70콜을 썼다.

    07:31~08:29 = 18슬롯 x 10콜 = **180콜/일이 구조적으로 0행을 낳는다.** 그 구간 REST의 11.8%다.
    게다가 그 버스트의 첫 레그(B01608A21)가 08-06 장전 EGW00201 8건 중 **3건**을 냈다.
  예측:
    - metric: rest.by_group.만기유동성
      expect: "<= 1150"
      역할: 주장
    - metric: db.tables.expiry_liquidity_1m.rows
      expect: ">= 100"
      역할: 대가
    - metric: failures.만기 유동성 폴링 실패
      expect: "<= 7"
      역할: 참고
  주의: |
    **대가 지표가 이 가설의 진짜 검정이다.** 08-05 적재는 111행(regular 36 + weekly_mon 41 +
    weekly_thu 34)이었다. 장전 호출이 아무것도 안 남겼다는 주장이 맞다면 이 값은 **줄지 않는다.**
    줄었다면 08:30 경계가 실제보다 늦은 것이므로 경계를 앞당긴다.

    `rest.by_group.만기유동성` 예측 1,150의 근거: 08-05 실측 1,280콜에서 180콜을 뺀 1,100에
    여유를 뒀다. **1,280 근처 그대로면 슬롯 스킵이 안 걸린 것**이고, 900 아래로 떨어졌다면
    장중 슬롯까지 잘린 것이니 둘 다 확인 대상이다.

    `failures` 예측이 참고인 이유: 08-05의 14건에는 장중 실패가 섞여 있어 이 fix만의 효과를
    분리하지 못한다. 장전 실패(EGW00201 3건)는 p1이 함께 없애므로 귀속도 갈리지 않는다.

    **2026-08-07 판정 보류(장중 12:20 시점)**: 대가 지표 `db.tables.expiry_liquidity_1m.rows`가
    45행으로 자동 판정에서 반증으로 찍혔으나, 그 집계는 **07:30~12:20 반나절**의 것이다
    (08-05/08-06은 종일). 시간당 적재율로 보면 0.196행/분 vs 08-06 0.269행/분으로 약 27% 낮아
    **그 자체로는 무시할 수 없는 차이**다. 장마감 자동 집계에서 종일 값으로 재판정한다 —
    100행 아래로 끝나면 08:30 경계가 실제보다 늦은 것이므로 경계를 앞당긴다.
    (일반 규약: 반나절 집계의 **건수** 지표는 종일 예측과 대조하지 않는다. 비율·중앙값만 본다.)
  검정: |
    2026-08-07 확정 — **fix는 맞았고 예측이 틀렸다.** 종일 85행으로 자동 판정은 반증이지만,
    북별로 쪼개면 회귀가 아니다:

      08-06  regular 41 + weekly_mon 41 + weekly_thu 35 = 117   (3북)
      08-07  regular 41 + weekly_mon 44               =  85   (2북)

    **북당 41행으로 동일**하고 첫 행 시각도 08:31로 같다(08-06/08-07 모두). 08-07은 위클리(목)
    만기가 먼슬리와 같은 2026-08-13이라 별도 북이 없었을 뿐이다. 즉 08:30 경계는 정확하고,
    이 가설이 실제로 주장한 것("장전 호출은 원래 아무것도 안 남긴다")은 확인됐다.

    틀린 것은 예측이다: `>= 100`이 **북 수가 날마다 다르다**는 것을 계산에 넣지 않았다.
    같은 계열의 예측 오류가 08-07 하루에만 세 번 났다 —

      p4  `chain_leg_median == 10`              5분 스냅샷 창을 안 넣음
      e1  `atm_roll_dropped_subs <= 4`          스팟 이동거리를 안 넣음
      p2  `expiry_liquidity_1m.rows >= 100`     북 수를 안 넣음

    **패턴: 절대 건수로 예측을 세우면 그 건수를 만드는 구조 변수를 빼먹는다.** 개인의 부주의가
    아니라 규약의 구멍이므로, `2026-08-07-fix5-normalized-claims`가 이것을 기계적으로 막는다.
  상태: confirmed

- id: "2026-08-06-p3-monthly-book-fallback"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "먼슬리 북을 판단이 쓴 것(gex_expiry)에서도 읽으면 장전에 눈이 멀던 지표 셋이 값을 낸다"
  근거: |
    08-06 §2-3 — `monthly_book_expiry()`가 `expiry_liquidity_1m` 하나에만 매달려 있었고,
    그 테이블은 08:31 전에 한 행도 없다(p2). 그 하나에 지표 **셋**이 걸려 있었다:
    §12 먼슬리 절대 커버리지 / §14-2 행사가 창 품질 / `monthly_leg_completeness()`.

    실제 피해가 08-06 07:48에 났다 — EGW00201 1건이 먼슬리 북을 10 → 9레그로 깎았는데
    **그것을 재라고 08-05 Fix#3이 만든 지표(monthly_leg_completeness)가 못 봤다.**
    그날 07:52 리포트가 `db.monthly_leg_completeness.below_design_pct`를 "실측 없음"으로 냈다.

    핵심은 판단 경로에 그 문제가 없었다는 것이다. `signal_book_legs()`는 max(expiry)로
    장전에도 매분 옳게 먼슬리를 고르고, 그 답을 `signal_decisions.gex_expiry`(마이그레이션 023)에
    **매분 기록까지 하고 있었다**(08-06 장전 20건 중 18건이 2026-08-13).

    > **지표의 입력은 감시 대상의 입력보다 약해서는 안 된다.** 2026-08-05 고도화#1이 세운
    > *"지표는 감시 대상과 독립한 입력을 써야 한다"* 의 반대쪽 실패다 — 독립성만으로는 부족하다.
  예측:
    - metric: db.monthly_leg_completeness.below_design_pct
      expect: ">= 0"
      역할: 주장
    - metric: db.monthly_coverage.coverage_pct
      expect: ">= 90"
      역할: 주장
    - metric: db.strike_window_quality.minutes
      expect: ">= 1"
      역할: 참고
  주의: |
    **"좋아진다"가 아니라 "존재한다"를 예측한다**(README 규약). 이 fix는 값을 개선하지 않고
    값이 **나오게** 만든다 — 08-06 07:52에는 셋 다 `—`였다.

    `db.monthly_coverage.expiry_source`를 함께 손으로 본다. 장마감 리포트에 그 값이
    `signal_decisions`로 남아 있으면 **만기유동성 폴러가 하루 종일 죽어 있었다는 뜻**이라
    폴백이 정상 동작한 것과 별개로 그 자체가 경보다(정상일 때는 `expiry_liquidity`여야 한다).

    폴백이 1순위를 덮지 않는 것도 확인 대상이다 — 월물 만기 주간에는 max(expiry) 규칙이
    뒤집힐 수 있어(`signal_book_legs()` 주석) series를 가진 1순위가 항상 우선이어야 한다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 먼슬리 커버리지 94.3% / 설계미만 12.4%. 장전에도 먼슬리 만기가 특정됐다(`expiry_liquidity` 없이 `signal_decisions.gex_expiry` 폴백이 실제로 탔다).
  상태: confirmed
- id: "2026-08-06-p4-chain-age-monthly-only"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "체인 나이를 판단이 쓴 북에서만 재면 고정값이 풀리고 실제 신선도가 드러난다"
  근거: |
    08-06 §2-4 — `chain_oldest_leg_age_seconds`가 min(전 북)이었다. 위클리는 2026-08-03 fix로
    월=짝수분/목=홀수분 격분이라 **항상 한 북이 정확히 2분 뒤처져 있다.** 그 뒤처진 북이 매분
    최솟값을 가져가므로 이 값은 신선도가 아니라 **격분 설계상수**를 재고 있었다:

      08-06 장전: 07:34~07:57 판단 전부 130.039~130.077초 (17분 연속, 편차 0.04초)
      08-05 전량: 250초 258분(52%) / 130초 170분 / 190초 64분 / 70초 1분 — 고유값 **4종**

    임계가 450초(창 x 1.5)라 250초로도 **울릴 수 없는 지표**였다. 바로 위 `chain_leg_count`는
    "판단에 실제로 쓴 북 기준"이라고 주석까지 달고 먼슬리만 세는데 나이만 전 북 기준이었다 —
    **한 dict 안에서 두 줄이 서로 다른 것을 쟀다.**
  예측:
    - metric: db.signal_reach.chain_age_seconds_max
      expect: "<= 180"
      역할: 주장
    - metric: db.signal_reach.chain_age_seconds_median
      expect: "60 ~ 140"
      역할: 주장
    - metric: db.signal_reach.chain_leg_median
      expect: "== 10"
      역할: 참고
  주의: |
    **고유값 수를 손으로 함께 본다** — 이 fix의 진짜 주장은 "값이 낮아진다"가 아니라
    **"값이 변하기 시작한다"** 이다. 08-05는 494분에 고유값이 4종뿐이었다.
    새 값도 고유값이 서너 종이면 여전히 상수를 재고 있는 것이므로 fix가 헛돈 것이다.

    임계를 450 → 180초로 내렸으므로 **경고가 새로 뜰 수 있다**(대가). 뜬 분이 20분을 넘으면
    임계가 너무 낮은 것이 아니라 먼슬리 폴링이 실제로 밀린 것이므로 예산 절단과 함께 읽는다.
  검정: |
    2026-08-07 확정 — **fix는 맞았고 예측이 틀렸다.** 자동 판정은 두 지표를 반증으로 냈지만
    (`chain_age_seconds_max` 250.139 > 180, `chain_leg_median` 12 ≠ 10) 그건 시스템 회귀가
    아니라 **예측이 설계 상수를 안 보고 세워진 것**이다.

    이 fix가 실제로 주장한 것 — "고정값이 풀리고 실제 신선도가 드러난다" — 은 확인됐다:
    `chain_age_seconds_median` 130.047초(예측 60~140 안), 고유값도 4종에서 풀렸다.

    예측이 틀린 지점: 08-07 실측을 레그 수로 층화하니 최고령이 **폴링 지연이 아니라 ATM 롤
    잔상**을 재고 있었다.

      스냅샷 레그   분(장중)   최고령 평균
         10(설계)      45        62초    ← 롤 없이 한 창. 임계 아래
         12            88       185초
         14            45       191초
         16            20       229초
         18             3       250초    ← 250초는 12레그 이상 분에서만 난다

    즉 250초는 5분 창(`db.CHAIN_SNAPSHOT_MAX_AGE_MINUTES`)에 붙어 고정된 값이고(08-06 250.086 /
    08-07 250.139), 예측 `<= 180`과 `== 10`은 그 창을 계산에 넣지 않은 것이다. 08-06 §2-4가
    고친 것(전 북 → 먼슬리)과 **같은 계열의 오류가 한 겹 더** 있었다.

    후속: 08-07 Fix#1(`db._restrict_to_latest_cycle_window`)이 그 잔상을 걷어냈다. 새 예측은
    `2026-08-07-fix1-chain-window`에 등재했고, 이 항목은 여기서 닫는다.
  상태: confirmed

- id: "2026-08-06-p5-preopen-structural-reason"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "장전 스팟 부재를 구조적 사유로 기록하면 매일 90분씩 나던 신호 도달률 오경보가 사라진다"
  근거: |
    08-06 §2-5 — 08-05 9ffcb9c가 장전 스팟 적재를 의도적으로 끊은 뒤로 07:31~09:00의
    `options_flow` 미가용은 **설계된 정상**이다(스팟이 없으면 GEX·감마플립·VRP를 틀린 값 대신
    미가용으로 남긴다). 그런데 사유가 "입력 없음: gex, spot, 기준선(flip/wall)"으로만 남아
    장애와 구분되지 않았고, 08-06 장전 내내 COCKPIT이 노란불로
    *"options_flow가 한 번도 활성화되지 않았다"* 를 냈다.

    **설계대로 동작한 것을 매일 90분씩 장애로 신고한 것이다.** 08-05 Fix#5가 종가 단일가
    9분에 대해 만든 「그중 구조적」 열이 이미 있는데, 그 열이 장전을 모르고 있었다.
  예측:
    - metric: db.member_availability.options_flow.structural_minutes
      expect: "75 ~ 95"
      역할: 주장
    - metric: db.signal_reach.member_count_max
      expect: ">= 4"
      역할: 참고
  주의: |
    **멤버를 살리지 않는다.** 장전에 스팟은 여전히 없고, 없는 값을 지어내면 08-03의 허수
    감마플립과 같은 종류의 결함이 된다. 이 fix가 바꾸는 것은 **사유 문자열 하나**다.

    75~95의 근거: 판단은 07:31부터 매분 나오고 개시는 09:00이므로 장전 판단은 약 89분이다.
    기동이 늦거나 09:00 직후 스팟이 늦게 붙으면 위아래로 몇 분 흔들린다.
    **95를 크게 넘으면 09:00 이후에도 스팟이 안 붙은 것**이므로 그때는 진짜 이상이다.

    `member_count_max`가 참고인 이유: 이 fix는 그 값을 바꾸지 않는다(사유만 가른다).
    08-05처럼 4가 나오면 정상이고, 4 미만이면 장중에 별개의 문제가 있다는 뜻이라 함께 본다.
  검정: |
    2026-08-07 확정 — `structural_minutes` **89분**(예측 75~95 안), `member_count_max` **4**.
    §14-1의 「그중 구조적」 열이 장전 89분을 가용률에서 분리해 냈고, 매일 90분씩 나던
    신호 도달률 오경보가 사라졌다.

    **여기서 닫는 이유(중요)**: 08-07 Fix#2가 같은 지표의 **모집단을 바꾼다.** 현물 연속거래
    종료(15:20) 이후 25분도 `options_flow`의 구조적 미가용으로 잡히므로, 08-10부터 이 값은
    89 → 약 114분이 된다. 예측 `75 ~ 95`를 그대로 두면 **내가 넣은 fix가 남의 fix를 반증으로
    만든다** — 08-06 §2가 "맞은 fix가 반증으로 나온다"고 적은 바로 그 형태다.
    새 구간의 예측은 `2026-08-07-fix2-equity-closed-member`에 따로 등재했다.
  상태: confirmed

- id: "2026-08-06-p6-eta-ceil"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "임계 도달 예정일을 올림으로 내면 배지와 보고서의 날짜가 어긋나지 않는다"
  근거: |
    08-06 §2-6 — `약 {remaining/avg:.0f}영업일`은 **반올림**이다. (8000-7032)/391 = 2.48이
    "약 2영업일"로 표시됐는데, 08-05 보고서 §9는 실제 도달일을 **08-10(월) = 3영업일 뒤**로
    이미 확정해 둔 뒤였다. 부분 영업일에는 임계에 도달하지 않으므로 올림이 맞다.
    08-04 보고서가 "08-08(금)"이라는 존재하지 않는 날짜를 적었던 것과 같은 계열이다 —
    **일정은 낙관적으로 반올림하면 안 된다.**
  예측:
    - metric: db.tables.feature_store.rows
      expect: "수기 판정 — 누적이 8,000 미만인 동안 배지가 08-10(월)에 해당하는 영업일 수를 내는지"
      역할: 주장
  주의: |
    자동 대조가 불가능한 항목이다(배지 **문구**가 대상이라 지표 하나로 환원되지 않는다).
    그래서 예측을 수기 판정으로 두되 **무엇을 볼지 여기 적어둔다**: 08-06 장마감 시점의
    누적 행수를 하루 평균으로 나눈 값이 올림되어 표시되는지, 그리고 그 결과가
    08-05 보고서 §9의 **08-10(월)** 과 일치하는지.

    어긋나면 둘 중 하나가 틀린 것이다 — 하루 평균(391행)이 실제와 다르거나, 영업일 계산이
    주말을 안 넘고 있거나. 08-06 적재분이 들어가면 평균이 391에서 움직이므로 그 값도 함께 적는다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — `feature_store` 410행/일로 예측 구간(>= 300) 안. ETA 계산이 과소추정하지 않는다.
  상태: confirmed
# ===== 2026-08-07 검증분 — 08-06 운영점검 §4 fix 6종 =====
#
# 이 6건은 08-06 보고서 §4의 우선순위 순서 그대로다. 그날의 두 최우선 항목(진입 컷오프,
# 생존 감시)은 **둘 다 v6가 명문으로 요구했거나 2026-07-21에 이미 제안됐던 것**이고,
# 나머지 넷은 08-06에 드러난 "지표가 자기 대상을 못 보는" 문제들이다.

- id: "2026-08-06-fix1-entry-cutoff"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "진입 시각 게이트를 넣으면 14:50 이후 ENTER가 0이 되고, 그 이전 진입은 그대로 남는다"
  근거: |
    08-06 §2-2 — v6 §4.2가 「신규 진입 컷오프 14:50」·「강제 평탄화 15:10(운영 헌법)」을 한 표에
    적어뒀는데 **진입 쪽은 코드 어디에도 없었다**(`RiskEngine.evaluate_entry()`에 시각 인자
    자체가 없었다). 그날 실측: 14:50 초과 ENTER **21건**, 그중 15:10 초과 **18건**(마지막 15:30).
    08-05까지 팔레트가 전량 `wait_only`라 ENTER가 0건이었고, 08-05 `p1`(VRP 배선)이 팔레트를
    연 **첫날 바로** 드러났다 — 막힌 경로 뒤의 게이트는 검정된 적이 없다.
    같은 날 이벤트 캘린더가 15:21~15:35 확신도를 0.638 → 0.213(0.33배)으로 깎았는데도 그
    구간에서 SMALL_TEST ENTER가 10분 연속 나왔다. **가중치를 낮추는 것과 금지하는 것은 다르다.**
  대가: "14:50~15:45의 진입 기회를 전부 포기한다 — 그 구간에 좋은 신호가 있어도 안 잡는다"
  예측:
    - metric: db.decisions.entry_cutoff.enter_after_cutoff
      expect: "0"
      역할: 주장
    - metric: db.decisions.entry_cutoff.enter_after_forced_flat
      expect: "0"
      역할: 주장
    - metric: db.decisions.entry_cutoff.blocked_count
      expect: ">= 0"
      역할: 대가
    - metric: db.decisions.decision.ENTER
      expect: "수기 판정 — 14:50 이전 건수가 08-06의 41건 수준에서 크게 안 줄어야 한다"
      역할: 참고
  주의: |
    **`blocked_count`와 `enter_after_cutoff`를 반드시 함께 읽는다.** 전자가 0이고 후자도 0이면
    그날은 검정이 성립하지 않은 날이다(그때는 pending 유지가 맞다 — confirmed로 닫으면
    08-04 `p4`처럼 "자기 주장을 검정하지 않은 합격"이 된다).

    위 두 주장 지표는 **불변식**이다 — 0이 아닌 날은 시장이 특이한 게 아니라 게이트가 빠진 날이다.

    되돌리려면: `main.poll_signal_fusion_cycle`의 `entry_cutoff_blocked` 블록과
    `RiskEngine.evaluate_entry`의 `now` 게이트 두 곳을 빼면 08-06 이전과 같아진다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 컷오프 이후 ENTER 0건 / 강제평탄화 이후 0건, 차단 8분. **차단이 0이 아니므로 「후보가 없어서 0」이 아니라 게이트가 실제로 일했다.**
  상태: confirmed
- id: "2026-08-06-fix2-loop-watchdog"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "관측 루프가 30초마다 생존 신호를 쓰면 정지가 3분 안에 드러난다"
  근거: |
    08-06 §2-1 — 10:04:00에 관측 루프와 COCKPIT이 **동시에, 흔적 없이** 사라졌다. 종료 로그도
    트레이스백도 알림도 없었고(`observation_loop_crash.log`는 2바이트, 최종 수정 07-19),
    **19분 동안 아무도 몰랐다**. 사람이 화면을 보고 안 것이 10:20이다. 그날 결손 21분의 95%가
    이 구간이다. 2026-07-21 보고서의 "PID 파일 기반 재설계" 제안이 그대로 남아 있었다.
  대가: "워치독이 자동 재기동까지 하므로, 살아 있는 루프를 잘못 죽이면 그 순간 진짜 공백이 생긴다"
  예측:
    - metric: cycles.missing.downtime_count
      expect: "0"
      역할: 주장
    - metric: process_starts
      expect: "수기 판정 — 길이 1(장전 기동 1회)이면 정지가 없었다"
      역할: 주장
    - metric: cycles.missing.count
      expect: "<= 5"
      역할: 대가
  주의: |
    **이 가설은 "정지가 안 일어난다"를 주장하지 않는다** — 그것은 이 fix가 할 수 있는 일이
    아니다. 주장하는 것은 *"정지가 나면 3분 안에 드러난다"* 이고, 정지가 없는 날에는
    **검정이 성립하지 않는다**(그때는 pending 유지).

    검정에 필요한 것은 `logs/watchdog.log`다. 그 파일이 아예 없으면 작업 스케줄러 등록이
    안 된 것이므로 **untested로 닫는다**(08-04 `p4`의 교훈 — 반증으로 적으면 멀쩡한 fix를
    되돌리게 된다). 등록 명령은 `scripts/watchdog_mahdi.bat` 상단에 있다.

    오경보 판별: 워치독이 재기동을 걸었는데 `cycles.missing.downtime_count`가 0이면
    그것은 **살아 있는 루프를 죽인 것**이다. 그때는 `HEARTBEAT_STALE_SECONDS`(180초)를
    올리는 게 아니라 왜 하트비트가 늦었는지를 먼저 본다(이벤트 루프 블로킹의 신호일 수 있다).
  판정근거: |
    (2026-08-11 확정) **워치독이 08-11 08:40까지 한 번도 실행된 적이 없다** — 미등록에 더해 배치파일이 `chcp 65001` + 한글 주석으로 cmd.exe 파싱이 깨져 있었다(08-11 §1-5). 즉 08-07~08-11의 어떤 실측도 이 fix를 검정하지 않았다. 재등재 대상.
  상태: inconclusive
- id: "2026-08-06-fix3-metric-path-validation"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "지표 경로를 부모 컨테이너까지 검사하면 죽은 경로가 「실측 없음」에 묻히지 않는다"
  근거: |
    08-06 §3-1 — 08-05에 세운 예측 13건 중 **6건이 주장 지표를 하나도 못 받았다**
    (`p1`·`p3`·`p5`·`p6`·`p7`·`p12`). `db.decisions.…`, `db.tables.<이름>.rows`,
    `db.member_availability.<멤버>.…` — 사람이 자연스럽게 적은 경로가 리포트 구조에 없었고
    전부 조용히 「실측 없음」으로 표시됐다. 그래서 **`p1`의 대가 지표가 12배 초과**
    (ENTER 예측 5건 이하에 실측 62건)한 것을 아무도 자동으로 알아채지 못했다.

    같은 날 아침 커밋(`b1b74ed`)이 이 위험을 정확히 인지하고 회귀 테스트까지 붙였는데,
    그 테스트가 `db.` 접두사를 **통째로 면제**했고 그날 죽어 있던 경로 12개는 전부 `db.`로
    시작했다.
  예측:
    - metric: db.decisions.decision.ENTER
      expect: ">= 0"
      역할: 주장
    - metric: db.tables.underlying_spot_1m.rows
      expect: ">= 0"
      역할: 주장
    - metric: db.member_availability.orderflow_ofi_vpin.available_pct
      expect: ">= 0"
      역할: 주장
    - metric: qualitative
      expect: "수기 판정 — 리포트 §0에 「경로 없음」 배너가 없어야 한다"
      역할: 참고
  주의: |
    **이 fix는 값을 좋게 만들지 않는다 — 볼 수 있게 만든다.** 위 세 지표가 어떤 값이든
    상관없고, None이 아니기만 하면 된다(그래서 `>= 0`이다). 셋 다 08-05에 실제로 죽어 있던
    경로이고, 이 셋이 살면 나머지도 산다.

    반대로 「경로 없음」 배너가 **뜨는** 것도 이 fix의 성공이다 — 그때는 그 경로를 고치면 된다.
    실패는 오직 하나뿐이다: 죽은 경로가 있는데 배너가 안 뜨는 것.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 세 경로 전부 해석됐다(ENTER 281 / underlying_spot_1m 356행 / orderflow 가용률 83.0%). 「경로 없음」이 「실측 없음」에 묻히지 않는다.
  상태: confirmed
- id: "2026-08-06-fix4-suppressed-exception-count"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "억제 요약의 건수를 합산하면 read_timeout이 실제 발생 건수와 일치한다"
  근거: |
    08-06 §3-2 — `qualitative.read_timeout` 126건으로 보고됐지만 **실제는 205건**이었다(61%).
    `main._log_kis_call_failure()`가 `TracebackBudget.take()`로 카운터를 먼저 올린 뒤
    `WarningThrottle`이 60초 창으로 줄을 통째로 삼키기 때문이다(81건 소실). 억제된 건수는
    `(최근 60초간 M건 추가 억제됨)`에 남아 있었고 **파서가 그것을 안 읽고 있었다**(그런 줄이
    그날 53건).
    §3-3 — 그리고 `오늘 N번째` 카운터는 프로세스 단위라 08-06처럼 세 번 뜬 날은 두 번 되감긴다.
  예측:
    - metric: qualitative_suppressed
      expect: "수기 판정 — 리포트 §11 「줄 + 억제」 열에 억제분이 나타나야 한다"
      역할: 주장
    - metric: qualitative.read_timeout
      expect: "수기 판정 — 로그의 `오늘 N번째` 최댓값(프로세스별 합)과 일치해야 한다"
      역할: 주장
    - metric: process_starts
      expect: "수기 판정"
      역할: 참고
  주의: |
    **억제분은 근사다.** 억제된 줄들의 예외 유형을 알 방법이 없어, 그 요약을 실은 줄의 유형에
    합산한다(창이 60초라 그 안에서 유형이 바뀌는 경우는 드물다). 그래서 `qualitative_suppressed`를
    따로 남긴다 — 근사가 섞였다는 사실이 안 보이면 그 근사가 곧 사실로 굳는다.

    대조 방법: 로그에서 `httpx.ReadTimeout, 오늘 N번째`의 **프로세스별 최댓값 합**과
    `qualitative.read_timeout`을 비교한다. 08-06 실측은 15 + 190 = 205였다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — read_timeout 770건 = 줄 251 + 억제 519. 억제분을 안 세면 실제의 33%만 보고했을 것이다(08-06 이전이 그랬다).
  상태: confirmed
- id: "2026-08-06-fix5-failure-cause-split"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "실패를 원인별로 쪼개면 맞은 fix가 반증으로 나오는 일이 사라진다"
  근거: |
    08-06 §3-4 — 08-05 `p2`는 *"read 타임아웃을 엔드포인트별로 나누면 실패가 사라진다"* 고
    주장하면서 `failures.만기 유동성 폴링 실패`를 주장 지표로 걸었다. 실측 7건 →
    자동 판정 **반증**. 그런데 그 7건은 **전부 EGW00201(레이트리밋)이고 ReadTimeout 기인은
    0건**이었다. 가설의 주장은 오히려 맞았고 지표가 원인을 안 갈라 그것을 볼 수 없었다.
    규약 E("한쪽만 재지 마라")의 다음 칸: **주장 지표는 주장과 같은 축으로 잘려야 한다.**
  대가: "분류가 못 잡는 몫(other)이 생긴다 — 트레이스백이 살아 있는 예외는 실패 줄에 유형이 안 실린다"
  예측:
    - metric: failures_by_cause
      expect: "수기 판정 — 리포트 §11 실패 표에 원인 열(egw00201/read_timeout/kis_error/other)이 나와야 한다"
      역할: 주장
    - metric: failures
      expect: "수기 판정 — 유형별 총계와 원인별 합이 일치해야 한다"
      역할: 주장
    - metric: failures_by_cause
      expect: "수기 판정 — other 합계가 10건 안쪽이어야 한다"
      역할: 대가
  주의: |
    총계(`failures`)를 그대로 둔 이유: 기존 가설이 그 경로를 지목하고 있고, **총계와 원인별
    합이 갈리면 그 자체가 파서 결함의 신호**다(테스트가 그 항등식을 강제한다).

    `other`가 10건을 크게 넘으면 분류를 늘릴 때다 — 그때 무엇이 거기 들어갔는지 직접 보고
    새 원인 키를 만든다. **분류를 안 늘린 채 other를 방치하면 이 fix가 08-05 `p2`와 같은
    상태로 되돌아간다.** 정상 범위가 10건인 근거: 트레이스백 예산이 유형당 프로세스당 3건이다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 실패 321건이 원인별로 갈렸다(read_timeout 262 / kis_error 15 / other 56). 총계만 봤으면 15시대 사건이 「폴링 실패 증가」로만 보였을 것이다.
  상태: confirmed
- id: "2026-08-06-fix6-downtime-axis"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "결손을 미가동/인프라로 가르면 결손 증가가 인프라 회귀로 오독되지 않는다"
  근거: |
    08-06 §3-5 — 리포트 §1이 `결손 분 21분 ▲20 ⚠`을 냈는데, **21분 중 20분이 10:04~10:23
    프로세스 정지 구간**이고 사이클이 돌면서 놓친 것은 13:19 **1분**뿐이었다. 가동 시간과
    결손을 같은 분모로 섞으면 "인프라가 나빠졌다"와 "시스템이 꺼져 있었다"가 구분되지 않는다.
    그 결과 08-05 `p2`의 대가 지표(`cycles.missing.unrecovered_count`)가 「반증」으로
    나왔는데 **그 fix와 인과가 없었다.**
  예측:
    - metric: cycles.missing.infra_count
      expect: ">= 0"
      역할: 주장
    - metric: cycles.missing.downtime_count
      expect: ">= 0"
      역할: 주장
    - metric: cycles.missing.unrecovered_count
      expect: "수기 판정 — 미가동 0인 날에는 infra_count와 같아야 한다"
      역할: 참고
  주의: |
    **정지가 없는 날에는 이 fix가 눈에 안 보인다**(미가동 0, 인프라 결손이 종전 값 그대로).
    그것이 정상이고, 그때 확인할 것은 *"두 축이 존재하는가"* 이지 *"값이 좋아졌는가"* 가 아니다
    (README 규약 — 예측은 "좋아진다"가 아니라 **"존재한다"** 에서 시작한다).

    기동 표식(`직전 정상 기동`)이 없는 구버전 로그에서는 전부 인프라 결손으로 집계된다 —
    지어내지 않기 위한 폴백이며, 그때 `downtime_count`는 0이다.
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 인프라 결손 0분 / 미가동 0분으로 두 축이 분리 집계됐다.
  상태: confirmed
