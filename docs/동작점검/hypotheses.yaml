    - metric: db.regime.warmup_restart_minutes
      expect: "수기 판정(주장) — 재기동이 있는 날의 warmup 재진입이 **29분 → 5분 이하**. 재기동이 없는 날에는 이 경로가 안 돌므로 판정 불가다"
