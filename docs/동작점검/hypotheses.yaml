- id: "2026-09-02-p1-3-shape-transition-names-the-zero-axes"
  구현일: 2026-09-02
  검증예정일: 2026-09-03
  가설: |
    「판단 형태 전이」 줄이 `비영 N`(합계)만이 아니라 **어느 축이 0점을 냈는지 이름**을 함께 싣는다.
  근거: |
    09-02 §1-8 — 14:06부터 비영 멤버가 3/6 → **2/6**으로 한 단 더 내려앉아 그 시간대 판단의
    **72%**가 2/6이었다. 그런데 로그는 「비영 2」라고만 적어 **어느 축이 빠졌는지는 DB를
    열어야만** 알 수 있었다. 값은 이미 그 자리에 있다(`member_scores`) — **로그에만 없다.**
    08-19 Fix#6이 「가용 4/6이 실질 2.36이었다」를 고친 것과 **정확히 같은 형태**의 결손이다.
  예측:
    - metric: db.decisions.member_count.dead_axis_by_member.regime_hmm
      expect: ">= 0"
      역할: 주장
    - metric: db.decisions.member_count.dead_axis_by_member.regime_hmm
      expect: "수기 판정 — 형태 전이 줄의 `0점축=[...]`에 실린 이름이 같은 날 DB의 `dead_axis_by_member` 상위 축과 어긋나지 않는가"
      역할: 주장
    - metric: qualitative.member_axis_exit
      expect: "수기 판정(대가) — **판정 무변경.** 꼬리표를 줄 끝에만 붙였으므로 `collect_evidence.MEMBER_RE`가 종전과 같은 값을 계속 내는가. 08-04에 문구가 움직여 362건이 0건으로 보고된 자리다"
      역할: 대가
  주의: |
    ⚠ **B등급이다 — 「판정 무변경」 회귀 테스트 없이는 커밋하지 않는다.**
    ⛔ **동작도 임계도 손대지 않는다.** 이 항목이 바꾸는 것은 「무엇을 재는가」조차 아니고
    **「무엇을 적는가」**다 — 세는 값(`effective_member_count`)은 그대로다.
    ⚠ **꼬리표는 줄 끝에만 붙인다** — 앞머리와 `비영 %d`의 자리를 건드리면 파서가 눈이 먼다
    (이 파일의 `2026-08-31-p1-4`가 같은 자리에서 같은 주의를 적어 뒀다).
    ⚠ 억제는 이 함수의 구조가 이미 한다 — **형태가 바뀔 때만** 찍히므로 줄 수는 안 는다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표 · 장중①에 이어 최종) — **확인.**
    07:30~15:45 전 구간의 「판단 형태 전이」 줄에 `0점축=[...]` 이름이 **빠짐없이** 붙었고
    증거 §14-1의 멤버별 표와 부합했다. 대가(판정 무변경)도 유지 — `MEMBER_RE`가 종전 값을
    계속 냈다(꼬리표를 줄 끝에만 붙인 결과다).
  상태: confirmed

- id: "2026-09-02-p1-4-red-flags-count-consecutive-p95-windows"
  구현일: 2026-09-02
  검증예정일: 2026-09-03
  가설: |
    §12 자동 적신호가 `p95/timeout >= 1.0`인 창을 **개수만이 아니라 「최장 연속 창 수」로도** 낸다 —
    **흩어진 14창과 내리 이어진 14창은 다른 사건이다.**
  근거: |
    09-02 §1-9 — `p95/timeout`이 **13:30부터 사실상 상시** 위험선 위였다(하루 **14/98창**).
    그런데 적신호는 「14개」와 「최악 창」만 적어서, **「13:30 이후로 내리 이어졌다」는 사실은
    사람이 `_지연창.tsv`를 손으로 훑어야만** 보였다. 08-31 P1-2가 이 줄을 만들 때 세운 축은
    맞았고, **모자란 것은 그 축의 분포(뭉쳐 있는가 흩어져 있는가)**다.
  예측:
    - metric: rest_latency.p95_by_hour
      expect: "수기 판정 — 위험선 초과 창이 있는 날 §12의 그 줄에 `최장 연속 N창`이 함께 실리고, 그 값이 `_지연창.tsv`를 손으로 센 것과 일치하는가"
      역할: 주장
    - metric: rest_latency.p95_by_hour
      expect: "수기 판정(대가) — **§12 줄 수가 늘지 않는가.** 이 항목은 기존 한 줄에 값을 더할 뿐 새 줄을 만들지 않는다. 줄이 늘었으면 고칠 것은 임계가 아니라 요약 방식이다"
      역할: 대가
  주의: |
    ⛔ **임계를 손대지 않는다** — 위험선 1.0배는 08-27 P2-E가 정한 그대로다.
    이 항목이 바꾸는 것은 **「무엇을 재는가」**(개수 → 개수 + 최장 연속)이지 임계가 아니다.
    ⚠ **p95 표본이 없는 창은 연속을 잇지도 끊지도 않는다** — 표본이 있는 창만 이어서 센다.
    「안 쟀다」와 「안 넘었다」를 같은 글자로 세면 규약 C 위반이다. 그래서 분모도
    `len(p95_by_window)`(잰 창 수)이지 전체 창 수가 아니다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표) — **확인. 장중①보다 강한 확증이다.**
    12:30에는 4/60창·최장연속 1창(평온한 표본)이었으나, 하루 끝 §12 적신호 4번이
    「`p95/timeout>=1.0`인 창 **21/98개**, **최장 연속 13창**(14:25~15:25)」으로 개수와 연속창
    수를 함께 냈다 — **스트레스 상황에서도 설계대로 작동했다.**
    대가(§12 줄 수)도 안 늘었다: 기존 한 줄에 값을 더했을 뿐이다.
  상태: confirmed

- id: "2026-09-02-fix10-phase-offset-55s"
  구현일: 2026-09-02
  # ===== 2026-09-03 — **판정 보류. 예정일을 미룬다**(09-03 「가설 판정 제안」 표) =====
  #
  # `stale_pct` 0.8%(직접지표, 규약 J)는 기준(<= 20.0)을 **크게** 통과했다. 그런데 초 단위
  # 축 `chain_newest_age_seconds.p50`이 **57.4초**로 기준(55.0)을 2.4초(4.4%) 넘겼고,
  # **같은 날 옵션체인 절벽(14:31~15:23, 53분)이 그 계산에 섞였다** — 이 레버의 대가로
  # 온전히 못 읽는다(규약 E). **절벽 없는 정상일에 재실측한다.**
  #
  # ⛔ **기준(55.0)을 숫자 보고 올리지 않는다.** 2.4초가 모자라니 57.0으로 하자는 것이
  # 이 체계가 가장 경계하는 형태다 — 55.0은 08-19 §5 고도화 4 (a)가 **숫자를 보기 전에**
  # 적어 둔 값이고, 그 값은 그대로 둔 채 **오염 없는 표본**을 기다린다.
  검증예정일: 2026-09-04
  전제레버: SIGNAL_FUSION_PHASE_OFFSET_SECONDS
  발동일: 2026-09-02
  무조건발동일: 2026-09-02
  가설: |
    판단 위상을 :10초 → **:55초**로 옮기면, 판단이 **그 분에 적재된 체인**으로 GEX를 낸다.
  근거: |
    ⚠ **이것은 08-11에 설계돼 3주 넘게 안 켜진 레버다.** `main.py`의 Fix#10 절이 08-11에
    *"오늘은 안 켠다"*(같은 날 Fix#1과 겹치면 귀속이 안 갈린다)라고 적었고, 그 뒤로 아무도
    다시 안 봤다. 레버 상태표의 「켜짐」은 **상수가 존재한다**는 뜻이었지 적용됐다는 뜻이
    아니었다 — 값은 09-02까지 `10.0` 그대로였다.

    **켜는 조건은 이 파일이 이미 적어 뒀다.** `2026-08-12-eE-on-congested-hours`의 근거가
    *"이 값이 거의 안 내려가면 그것이 곧 「E는 신선도 레버가 아니다」의 답이고, 그때 Fix#10을
    켠다"* 이고, 09-02에 그 조건이 **성립했다**(E를 이틀 켠 채 `stale_pct` 98.8% → 99.2%).
    08-19 §5 고도화 4가 *"레버 E 결정 이후에 착수"* 라고 단 조건도 같은 날 충족됐다.

    **08-11의 예측치 25.0초는 폐기한다.** 그 값의 근거는 「20레그 최악 19.3초」였는데,
    09-02에 `observation_loop.log`를 7거래일 전수 집계하니 사이클이 **분 안의 몇 초에
    끝나는가**(혼잡 10~14시, 매일 300사이클)는 다음과 같다:

        날짜     p50    p95    max     <=25초   <=50초   <=55초
        08-25   43.5   52.6   55.6      0.0%    66.3%    99.7%
        08-26   50.9   54.0   55.8      0.0%    32.3%    99.0%
        08-27   50.7   53.5   55.3      0.0%    32.3%    99.7%
        08-28   53.0   55.3   56.7      0.0%    15.7%    92.7%
        08-31   51.4   53.8   54.9      0.0%    19.7%   100.0%
        09-01   48.5   54.6   56.2      0.0%    52.7%    97.7%
        09-02   38.6   53.4   54.9      0.0%    65.0%   100.0%

    **25초에 판단하면 7일 전부 100% stale이다** — 08-11의 값을 그대로 켰다면 지표는 한 칸도
    안 움직였을 것이고 우리는 그것을 「Fix#10 실패」로 읽었을 것이다. 값이 낡은 것을 못 본 채로.

    **55.0은 오늘 고른 값이 아니다** — `docs/동작점검/2026-08-19_마흐디_운영점검보고서.md`
    §5 고도화 4 (a)가 **숫자를 보기 전에** 적어 둔 값이고, 위 표는 그 값을 고른 근거가 아니라
    **검산**이다. 57.0이 7일 모두 100%를 주지만 08-28 최댓값 56.7초와 0.3초 차이라 여유가 없다.
  예측:
    - metric: db.signal_reach.chain_input_source.stale_pct
      expect: "<= 20.0"
      역할: 주장
    - metric: db.signal_reach.chain_newest_age_seconds.p50
      expect: "<= 55.0"
      역할: 주장
    - metric: cycles.congested.ended_before_55s_pct
      expect: "수기 판정(주장) — 이 값이 `chain_input_source.current` 비율의 **상한**이다. 둘이 크게 갈리면 원인은 위상이 아니라 신선도 창(`option_chain_as_of`)이므로 그쪽을 본다"
      역할: 주장
    - metric: overrun_by_poller
      expect: "수기 판정(대가) — `Signal Fusion 폴링`이 늘지 않는가. :55에서 시작해도 60초 안에 끝나야 한다. 늘면 느린 것은 위상이 아니라 판단 계산 자체다"
      역할: 대가
    - metric: db.decisions.decision.ENTER
      expect: "수기 판정(대가) — 판단이 45초 늦어진다. 컷오프(14:50) 근처에서 한 분이 통째로 넘어가는지 `reject_reason`의 `entry_cutoff` 분포와 함께 읽는다(08-19 (a)가 지목한 대가)"
      역할: 대가
  주의: |
    **규약 J — 주장 지표는 이 레버에서 몇 단계인가: 「직접」.**
    `stale_pct`의 판정식은 「`newest`의 분 == `now`의 분」이고 **이 레버가 정하는 것이 그
    `now`다.** 같은 지표가 레버 E에 대해서는 2단계 간접이었고(레버는 위클리 폴링을 넓히는데
    지표는 먼슬리 분단위 일치를 잰다 — 09-02 §1-11), 그것이 09-02에 판정을 못 가른 이유다.
    **같은 지표라도 어느 레버에 대해 몇 단계인지가 다르다** — 규약 J가 「지표」가 아니라
    「레버-지표 쌍」에 붙는 이유다.
    ⚠ **하루에 변수 하나.** 09-03에는 이 레버만 움직인다 — `OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS`에
    09시를 더하는 건(09-02 P1-2) **같은 날 하지 않는다**. 둘 다 체인 신선도를 움직인다.
    ⚠ **`stale_pct`가 안 내려가면 그것이 곧 반증은 아니다** — `ended_before_55s_pct`가 먼저다.
    그 값이 높은데 `current`가 안 늘면 병목은 위상이 아니라 신선도 창이다.
  상태: pending

- id: "2026-09-02-p1-5-freshness-has-a-continuous-axis"
  구현일: 2026-09-02
  검증예정일: 2026-09-03
  가설: |
    신선도를 **이산 판정 옆에 연속값으로도** 남기면(마이그레이션 036), 「1분 늦은 체인」과
    「3분 늙은 체인」이 갈리고 레버가 초 단위로 움직인 것이 지표에 보인다.
  근거: |
    09-02 §1-11 / 제4부 P1-5. `chain_input_source`는 08-11에 옳은 지표였다 — 그때는 하루의
    절반이 stale이라 이진값으로도 갈렸다. 그런데 08-18 이후 **매일 98~100%**로 상한에 붙었고
    (08-18 100.0 / 08-19 98.8 / 08-20 95.3 / 08-21 88.4 / 09-01 98.8 / 09-02 99.2),
    그 구간에서는 **개선이 원리적으로 안 보인다**: 판정이 분 단위 완전 일치라 1초를 어긋나도
    stale이고 1분 늦은 체인과 3분 늙은 체인이 같은 칸에 들어간다.

    09-02가 레버 E를 이 축으로 읽다 **「레버가 실패했다」와 「지표가 그 레버를 못 잰다」를
    가르지 못하고 멈춘 자리**가 그것이다. 함께 낸 `cycles.congested`는 그 반대편이다 —
    레버 E가 **직접** 줄이는 값(그 시간대의 사이클 소요시간)이라 규약 J의 「직접」에 해당한다.
  예측:
    - metric: db.signal_reach.chain_newest_age_seconds.behind_minutes
      expect: "수기 판정(주장) — **존재부터.** 키가 실재하고 `available`이 True인가. 그리고 `stale_pct`가 100%인 날에도 이 히스토그램이 **한 칸이 아닌가**(그것이 이 항목의 요점이다)"
      역할: 주장
    - metric: cycles.congested.rest_p95
      expect: "수기 판정(주장) — 존재하고, 같은 날 `cycles.by_hour`의 10~14시 값과 어긋나지 않는가(같은 로그에서 나온 두 축이다)"
      역할: 주장
    - metric: db.signal_reach.chain_input_source.stale_pct
      expect: "수기 판정(대가) — **판정 무변경.** 종전 지표의 정의를 안 건드렸으므로 이 값이 새 코드에서도 같은 방식으로 나오는가. 정의를 바꾸면 08-11 이후 전 이력과의 비교가 끊긴다"
      역할: 대가
  주의: |
    **규약 J — 주장 지표는 이 항목에서 몇 단계인가: 「직접」**(이 항목이 만드는 값 자체다).
    ⛔ **기존 지표를 대체하지 않는다 — 옆에 세운다.** `chain_input_source`의 정의를 완화하는
    안(P1-5의 (a))은 **채택하지 않았다**: 그 순간 08-11 이후 전 이력과의 비교가 끊긴다.
    ⚠ **036 미적용 날은 `available: False`다** — 0이나 빈 값을 내면 09-02 이전 이력이
    「체인이 항상 최신이었다」로 보인다(규약 C).
    ⚠ **`cycles.congested`의 창(10~14시)은 레버에서 읽어오지 않는다.** 레버가 09시를 얻는
    날 지표의 정의가 함께 바뀌면 전후 비교가 끊긴다 — 창은 상수로 두고 산출물에 함께 인쇄한다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표) — **확인.**
    `chain_newest_age_seconds.behind_minutes` 히스토그램이 실재하고 **여러 칸**으로 나뉘었다
    (0분 441 · 1~4분 각 1). 08-18 이후 매일 상한(98~100%)에 붙어 안 움직이던 이산 지표
    (`stale_pct`)와 달리 **연속값은 초 단위로 움직인 것이 보였다** — 이 항목의 요점 그대로다.
    대가(정의 무변경)도 유지: `stale_pct` 0.8%는 정의를 안 건드린 채 나왔다.
  상태: confirmed

- id: "2026-09-03-p2-3-watchdog-cites-recovery-history"
  구현일: 2026-09-03
  검증예정일: 2026-09-04
  가설: |
    `no_ingest` DEGRADED 경보가 **과거 표본의 회복 소요시간과 회복 시각대**를 참고 문구로 함께
    싣는다 — 사람이 「지금 재기동할 것인가」를 판단할 근거가 경보 안에 있게 된다.
  근거: |
    09-03 §1-9 / 제4부 P2-3. 절벽 표본이 넷이 됐고 그중 **회복 시각이 관측된 셋**
    (08-26 · 09-01 · 09-03)이 전부 **15:25~15:26**(정규장 마감 +5~6분)에 사람 손 없이 풀렸다.
    소요는 45~85분이다. 이 사실은 지금 `cliff_episodes.md`와 사람 머릿속에만 있고
    **경보 문구에는 없다** — 오늘 워치독은 DEGRADED를 45회 내면서 한 번도 그 말을 안 했다.
  예측:
    - metric: watchdog.degraded_checks
      expect: "수기 판정(주장) — 다음 `no_ingest` 에피소드의 **첫 줄**에 회복 이력 참고 문구가 실리는가. 에피소드가 없는 날은 「실측 없음」이지 반증이 아니다"
      역할: 주장
    - metric: watchdog.degraded_checks
      expect: "수기 판정(대가) — **판정 무변경.** 문구를 줄 끝에 덧붙이기만 했으므로 `watchdog_metrics`가 `DEGRADED`로 시작하는 줄을 세는 집계는 종전과 같은 값을 내는가"
      역할: 대가
    - metric: watchdog.recovered_episodes
      expect: "수기 판정(대가) — 종료 줄(`RECOVERED`)은 한 글자도 안 바뀐다. 이 값이 사건 수를 계속 정확히 세는가"
      역할: 대가
  주의: |
    ⛔ **자동 조치를 추가하는 것이 아니다.** 재기동 임계도 경보 조건도 안 건드린다 — 사람이
    읽을 문장 하나를 덧붙일 뿐이다. 자동 재기동은 08-26에 **켜지 않은 것이 옳았다**로
    증명됐다(재기동했다면 15:26에 저절로 풀렸을 회복을 자기가 고친 것으로 오해했을 것이다).
    ⚠ **억제를 함께 넣는다** — 오늘 DEGRADED는 45줄이었다. 참고 문구를 매 줄에 붙이면 45줄이
    통째로 길어진다. **에피소드 첫 분 + 이후 30분마다 한 번**만 붙인다(하루 최대 3~4회).
    ⚠ **표본 수를 문구에 박는다.** 「3건 중 3건」이라고 적어야 다섯 번째 표본이 나왔을 때 이
    문구가 낡았다는 것이 보인다 — 숫자 없이 「대체로」라고 쓰면 영원히 안 늙는다.
  상태: pending

- id: "2026-09-03-p1-b-dropout-cross-checks-the-cycle-log"
  구현일: 2026-09-03
  검증예정일: 2026-09-04
  가설: |
    앙상블 멤버 이탈 적신호가 「형태가 안 바뀐 것」과 「판단이 멈춘 것」을 **갈라서** 낸다 —
    같은 구간에 판단 사이클 로그가 계속 찍혔으면 그것은 사건이 아니라 정상 지속이다.
  근거: |
    09-03 §1-6(12:30 회차가 낸 정정). 자동 §12 적신호 5~8번이 「63분째 미관측」을 냈는데
    실제로는 **축이 죽은 것이 아니라 판단 형태가 안 바뀌어 로그가 조용했던 것**이었다.
    `member_last_seen`은 「판단 형태 전이」 줄에서만 갱신되는데 그 줄은 **형태가 바뀔 때만**
    찍힌다 — 안정된 시간대일수록 이 적신호가 잘 뜬다. 오탐이 진짜 정지를 덮는다.
  예측:
    - metric: qualitative.member_axis_exit
      expect: "수기 판정(주장) — 다음 실행에서 §12 이탈 적신호가 「형태 무변화(정상 지속)」와 「진짜 미관측(사건)」을 다른 문구로 내는가. 판별에 쓰는 것은 같은 구간의 `옵션체인 사이클 소요 분해` 분(`scan.cycle_minutes`)이다"
      역할: 주장
    - metric: qualitative.member_axis_exit
      expect: "수기 판정(대가) — **판정 무변경.** 판단 사이클 로그까지 끊긴 구간(=진짜 사건)에서는 적신호 문구가 종전과 같아야 한다. 이 항목은 적신호를 없애는 것이 아니라 **둘로 가르는** 것이다"
      역할: 대가
  주의: |
    ⛔ **임계를 손대지 않는다.** `MEMBER_DROPOUT_ALERT_MIN = 30`은 그대로다 — 바꾸는 것은
    임계가 아니라 **「무엇을 재는가」**(마지막 관측 시각만 → 마지막 관측 시각 + 같은 구간의
    판단 사이클 생존)다.
    ⚠ **적신호를 지우지 않는다.** 「형태 무변화」로 판별된 경우도 §5-2 본문에 남긴다 —
    사라지면 규약 C의 「안 셌다」와 구별이 안 된다.
    ⚠ **B등급이다 — 「판정 무변경」 회귀 테스트 없이는 커밋하지 않는다.**
  상태: pending

- id: "2026-09-03-adv3-cliff-day-flags-the-hypothesis-table"
  구현일: 2026-09-03
  검증예정일: 2026-09-04
  가설: |
    자동 리포트가 **그날이 절벽일인지를 스스로 알고**(rows=0 연속 20분 이상), 절벽일이면
    §0-1 가설 검정 표 위에 「대가 지표 해석 주의」 플래그를 병기한다.
  근거: |
    09-03 §1-1 / 제5부 고도화 3. 오늘 실제로 두 가설의 지표가 절벽에 오염됐다.
    `2026-08-12-eE-on-congested-hours`의 대가 축 `gex_input_missing_minutes`가 50분
    (기준선 4분)이었는데 그 대부분이 절벽 구간과 겹치고, `2026-09-02-fix10-phase-offset-55s`의
    주장 축 `chain_newest_age_seconds.p50` 57.4초도 같은 이유로 순수하게 못 읽는다.
    **오염을 사람이 매번 기억해서 발라내야 하는 상태**이고, 그 기억이 빠지는 날 규약 E가
    막으려는 것(대가를 다른 사건의 값으로 재는 것)이 그대로 일어난다.
  # ===== 착수 중 정정 (2026-09-03, 등재 당일) — **새 축을 만들려다 이미 있는 것을 찾았다.** =====
  #
  # 위 예측을 처음 적을 때 지목한 경로는 `cycles.zero_row_longest_run_minutes`(로그 쪽에
  # 신설할 축)였다. 착수 직전 확인에서 **같은 것을 재는 축이 08-14 Fix#3으로 이미 있었다** —
  # `db.chain_minute_coverage.zero_row_longest_run.length`이고, 09-03 실측이 **53분
  # (14:31~15:23)**으로 이 회차가 손으로 센 값과 정확히 같다. 임계도 이미
  # `db_metrics.ZERO_ROW_RUN_ALERT_MINUTES = 20`으로 정해져 있었다.
  #
  # 그래서 **축을 만들지 않고 있는 축을 읽는다.** 경로만 실재하는 쪽으로 옮긴다 —
  # 주장의 내용도 방향도 안 바뀌었고, **숫자를 보고 기대치를 고친 것이 아니다**(기대치는
  # 그대로고 가리키는 자리가 틀렸던 것이다). 09-02 P2-B가 `2026-08-31-p2-3`의 metric을
  # 같은 이유로 정정한 전례를 따른다.
  #
  # ⚠ **덤으로 임계를 새로 만들 뻔한 것을 면했다** — 20분을 이 항목이 정했다면 그것은
  # 「표본을 보고 임계를 만드는 것」이었다. 지금은 저장소가 08-14에 이미 정한 값을 인용한다.
  예측:
    - metric: db.chain_minute_coverage.zero_row_longest_run.length
      expect: ">= 0"
      역할: 참고
    - metric: db.chain_minute_coverage.zero_row_longest_run.length
      expect: "수기 판정(주장) — 이 값이 `ZERO_ROW_RUN_ALERT_MINUTES`(20분) 이상인 날에만 §0-1 표 **위에** 오염 주의 플래그가 뜨는가. 절벽이 없던 날에는 한 줄도 안 뜨는가"
      역할: 주장
    - metric: db.chain_minute_coverage.zero_row_longest_run.length
      expect: "수기 판정(대가) — **판정 무변경.** 표의 `판정` 열은 한 글자도 안 바뀐다. 플래그가 뜬 날에도 `hypotheses.evaluate`의 verdict가 종전과 같은가"
      역할: 대가
    - metric: db.chain_minute_coverage.zero_row_count
      expect: "수기 판정(대가) — 종전 축(총 0행 분 수)은 정의도 값도 안 건드렸다. §4의 「최장 연속 0행 구간」 줄도 그대로인가"
      역할: 대가
  주의: |
    ⛔ **가설 판정 로직을 안 건드린다.** `hypotheses.evaluate`의 `verdict`는 한 글자도 안
    바뀐다 — 플래그는 표 **위의 한 줄**이고, 사람이 그 표를 읽는 방식만 바꾼다. 자동으로
    판정을 무르면 그것이야말로 「숫자를 보고 기준을 고치는 것」이다.
    ⛔ **20분은 임계 완화가 아니다.** `cliff_episodes.md`가 절벽을 정의한 문구
    (「수십 분 연속 rows=0」)를 코드가 처음으로 숫자로 적는 것이고, 이 값으로 무엇을
    합격시키거나 탈락시키지 않는다 — 문장 하나를 띄울 뿐이다.
    ⚠ **DB 집계가 없는 날(`use_db` 미사용·구버전)은 플래그가 안 뜬다.** 그것이 맞다 —
    없는 근거로 주의를 띄우는 것이 소음이다. 규약 C의 「측정 불가」 구분은 §4의
    `_render_zero_row_run`이 이미 그 자리에서 말하고 있다.
    ⚠ **B등급이다 — 「판정 무변경」 회귀 테스트 없이는 커밋하지 않는다.**
  상태: pending

- id: "2026-09-04-p2-b-isolated-zero-row-count"
  구현일: 2026-09-04
  검증예정일: 2026-09-05
  가설: |
    「연속 절벽」과 「단발 완전실패」를 **서로 다른 축으로 센다.** 지금은 최장 연속 구간
    (`zero_row_longest_run`)만 있어서, 연속되지 않은 `rows=0` 분이 몇 번 났는지는
    어디에도 안 남는다 — 그래서 그 추세가 나빠지는지 좋아지는지 **다음 날 비교할 기준이
    없다.** 두 축을 나란히 두면 09-03형(한 번에 53분)과 09-04형(1분씩 세 번)이 같은 날로
    보이지 않는다.
  근거: |
    09-04 §1-7 — 오늘 ERROR는 3건이 전부이고 셋 다 「옵션체인 이번 분 전멸」이다
    (14:34:34 · 14:51:32 · 15:06:52). 세 번 다 다음 분에 회복돼 **연속되지 않았다.**
    당일 실측: `db.chain_minute_coverage.zero_row_minutes = ["14:34","14:51","15:06"]` ·
    `zero_row_count = 3` · `zero_row_longest_run.length = 1`(임계 20분).
    비교 표본: 09-03은 **53분 연속**(14:31~15:23)이고 단발은 0건, 09-02는 ERROR 자체가 0건.
    즉 오늘 같은 날은 최장 연속 축에서 **1분짜리 평범한 날**로 접히고, 세 번의 완전실패는
    어느 축에도 안 남는다.
  예측:
    - metric: db.chain_minute_coverage.zero_row_isolated_count
      expect: ">= 0"
      역할: 참고
    - metric: db.chain_minute_coverage.zero_row_isolated_count
      expect: "수기 판정(주장) — 이 키가 **존재하는가**(규약 C: 0건인 날도 실린다). 그리고 09-04 로그·DB 재집계에서 **3**(14:34·14:51·15:06), 09-03 재집계에서 **0**(그날은 처음부터 연속 절벽이라 고립 분이 없다)이 나오는가"
      역할: 주장
    - metric: db.chain_minute_coverage.zero_row_longest_run.length
      expect: "수기 판정(대가) — **판정 무변경.** 종전 축(최장 연속 구간)은 정의도 값도 임계도 안 건드렸다. 09-04는 1분, 09-03은 53분 그대로인가. §4의 그 줄과 절벽일 플래그(`_cliff_run_minutes`)의 동작이 한 글자도 안 바뀌었는가"
      역할: 대가
    - metric: db.chain_minute_coverage.zero_row_count
      expect: "수기 판정(대가) — 총 0행 분 수도 그대로인가(09-04는 3). **고립 + 연속구간 소속 분의 합이 이 값과 같아야 한다** — 어긋나면 새 축이 잘못 센 것이다"
      역할: 대가
  검정: |
    (비워 둔다 — 검증일에 사람이 채운다)
  주의: |
    ⛔ **임계를 만들지 않는다.** 이 축에는 경보선이 없다 — 며칠치 표본이 쌓이기 전에
    「단발 N건 이상이면 경고」를 정하면 08-16이 하루로 지표를 정했다가 뒤집힌 것과 같은
    실수가 된다. 지금 하는 일은 **세는 것뿐**이다.
    ⛔ **기존 판정 로직을 안 건드린다.** `zero_row_longest_run`·`ZERO_ROW_RUN_ALERT_MINUTES`·
    절벽일 플래그는 전부 그대로다. 새 축은 어느 것도 합격/탈락시키지 않는다.
    ⚠ **규약 C** — 0건인 날에도 키가 실려야 「단발이 없었다」와 「안 셌다」가 갈린다.
    DB 집계가 없는 날(`available: False`)에는 키 자체가 없고, 소비측(§4·§1)이 그때
    「측정 불가」라고 말한다.
    ⚠ **B등급이다 — 「판정 무변경」 회귀 테스트 없이는 커밋하지 않는다.**
  상태: pending
