# ===== 2026-08-07 검증분 — 08-06 운영점검 §5 고도화 5종 =====
#
# fix가 "고장난 것을 고친다"라면 고도화는 "보이지 않던 것을 보이게 한다"에 가깝다.
# 그래서 아래 다섯 중 셋(#2·#3·#5)의 주장 지표는 **"존재한다"** 이지 "좋아진다"가 아니다
# (README 규약 — 예측은 존재에서 시작한다).

- id: "2026-08-06-e1-monthly-leg-retry"
  구현일: 2026-08-06
  검증예정일: 2026-08-07
  가설: "놓친 먼슬리 레그를 예산 안에서 한 번 더 부르면 설계 미만 분(27.1%)이 줄어든다"
  근거: |
    08-06 보고서 §5-1은 "레그 큐를 먼슬리 우선으로 정렬한다"고 적었는데, 구현 직전 실측에서
    **그 순서는 이미 그렇게 돼 있었다**(`test_collect_option_chain_cycle_visits_the_monthly_
    book_first`가 08-05부터 지킨다). 원인을 다시 쟀다:
      먼슬리 10레그 미만        128분(9레그 82 / 8레그 33 / 7레그 8 / 6레그 5)
      예산 컷이 먼슬리에 닿은 분  3분(rows<10인 사이클)
      옵션체인 레그 실패        119건 중 111건이 ReadTimeout
    즉 먼슬리를 얇게 만든 것은 예산 컷이 아니라 **레그 단위 타임아웃**이다. 순서를 다시 고치는
    것은 아무것도 바꾸지 않고, 실패한 레그를 **다시 부르는 것**이 유일한 길이다.
  대가: "재시도 콜만큼 REST 총수요가 는다 — 08-06에 겨우 되돌린 EGW00201/백오프를 다시 밀 수 있다"
  예측:
    - metric: db.monthly_leg_completeness.below_design_pct
      expect: "<= 20"
      역할: 주장
    - metric: priority_retry.recovered
      expect: ">= 1"
      역할: 주장
    - metric: qualitative.egw00201
      expect: "<= 40"
      역할: 대가
    - metric: rest.calls_per_second
      expect: "<= 0.46"
      역할: 대가
  주의: |
    **`recovered`가 0이면 주장 지표가 성립하지 않는다** — 재시도가 안 돌았거나(예산 없음)
    KIS가 재시도에도 계속 느렸다는 뜻이고, 둘은 `priority_retry.attempted`로 갈린다
    (시도 0 = 예산 없음 / 시도>0·회복 0 = KIS).

    27.1% → 20%의 근거: 08-06 128분 중 9레그가 82분(64%)이다. 한 레그만 살려도 그 분들이
    설계값에 닿으므로, 재시도가 절반만 성공해도 27.1%의 3분의 1이 사라진다. 20%는 그보다
    보수적인 선이다.

    대가 임계 40건의 근거: 08-06 EGW00201은 18건이었고 페이서 fix 이전인 08-05는 57건이었다.
    재시도로 40건을 넘으면 **되돌린 것을 다시 잃은 것**이므로 그때는 재시도를 끄거나
    `OPTION_CHAIN_PRIORITY_RETRY_MAX_LEGS`를 줄인다.

    되돌리려면: `poll_option_chain`의 `_retry_priority_legs` 호출 블록만 지우면 된다
    (`_collect_option_chain_cycle`의 4번째 반환값은 남아도 무해하다).
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 먼슬리 레그 회복 219레그(08-10 137). 재시도 경로가 실제로 두께를 만들었다.
  상태: confirmed
