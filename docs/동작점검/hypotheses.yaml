  검증예정일: 2026-08-05
  가설: "orderflow 배선(Fix#2) + 감마월 폴백(Fix#3) + Charm 배선(Fix#4)으로 앙상블 가용 멤버가 2 → 4가 된다"
  근거: "08-04 §2-4/§2-5 — market_raw_1m.ofi는 선물 410분 전부 채워져 있는데 _build_signal_inputs()가
        ofi=None으로 하드코딩했고, options_flow는 진입로 둘(감마플립 경로/Charm 경로)이 모두
        끊겨 있었다(charm 컬럼은 9,288행 전부 NULL, charm_active는 미배선).
        하루 판단 494건의 available_member_count는 1(75건)/2(419건)뿐이었다."
  예측:
    - metric: db.signal_reach.member_count_max
      expect: ">= 4"
  주의: "**감마플립 산출률은 이 가설의 지표가 아니다** — 08-04 §2-3에서 이 북은 감마플립이
        구조적으로 안 나온다는 것이 확정됐다(광폭 25행사가 실측). options_flow는 감마 월
        폴백으로 사는 것이지 flip이 살아나서가 아니다.
        14:00 이전에는 Charm 경로가 꺼져 있으므로(v6 §13.2) **오전에 3, 오후에 4**가 정상 모양이다.
