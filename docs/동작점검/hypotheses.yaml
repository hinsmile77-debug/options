- id: "2026-08-25-fix-abort-count-is-captured-at-the-trigger"
  구현일: 2026-08-25
  검증예정일: 2026-08-26
  가설: |
    조기 포기 로그의 「연속 타임아웃 N회」가 **발동 시점 값**으로 실리고, 그 뒤에
    `(리셋=예|아니오)`가 붙는다 — 「0회」에서 코드 분기를 역산하는 일이 없어진다.
  대가: |
    파서 계약이 안 깨진다 — `timeout_abort.count`가 옛 줄(꼬리표 없음)과 새 줄을 **같은 축**으로
    센다. 로그는 이틀치만 남으므로, 옛 줄을 못 읽게 되면 꼬리표의 대가가 지표 손실이 된다.
  근거: |
    08-25 §1-5 — 하루 14건 중 12건이 「0회」였고, 그 값에서 분기를 역산한 설명이 하루에 두 번
    반증됐다(12:30 「구조적으로 항상 0」 → 14:30:35의 「3회」 · 14:30 「1단계 컷이면 0」 →
    15:15:39의 「2회」). 원인은 `_trigger()`의 1단계 리셋과 성공 레그의 리셋이 로그(루프 종료
    후)보다 먼저 오는 것 — 값이 틀린 게 아니라 **다른 시점의 값**이 실리고 있었다.
    ⛔ **「1단계/2단계」 라벨은 붙이지 않았다** — 오늘 반증된 가정을 로그 문자열에 굳히지
    않는다. `리셋=예/아니오`는 코드가 아는 사실이다.
  예측:
    - metric: timeout_abort.count
      expect: ">= 0"
      역할: 주장
    - metric: timeout_abort.count
      expect: "수기 판정(대가) — 꼬리표가 붙은 날에도 옛 이틀치 줄과 같은 축으로 세어지는가(파서가 선택 그룹으로 받는다)"
      역할: 대가
  주의: |
    ⚠ `>= 0`은 경로 생존 확인이다(규약 F가 통과시키는 형태) — 건수 자체는 그날 KIS 상태에
    비례한다(규약 G). 조기 포기가 0건인 날은 새 꼬리표를 볼 줄 자체가 없다 — 그날은 수기 판정
    불가이고, 그것은 반증이 아니다(규약 C).
    ⚠ **리셋 분기의 정의(코드를 읽고 적는다 — 08-25 §1-5의 요구)**: `consecutive_timeouts`는
    ① 1단계 접기(`_trigger`가 위클리를 버리고 먼슬리에 새 예산을 줄 때, main.py `_trigger`) ②
    레그 성공 시(성공하면 연속이 끊긴다) 0이 된다. 로그의 `리셋=예`는 **①만** 뜻한다 —
    ②가 있었다는 사실은 같은 줄의 `적재 N행`이 이미 말한다.
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-08-26 확정 · **근거 강화** — 조기 포기 **161건**(12:30 시점 8건에서 20배로 늘었다) 전부가 `연속 타임아웃 N회(리셋=예)` 형식을 유지했다. **표본이 20배가 돼도 형식이 안 깨졌다.**
    대가(파서 계약)도 성립했다 — `timeout_abort.count`가 꼬리표 없는 옛 줄과 새 줄을 **같은 축으로** 셌다(선택 그룹이 받는다).
  상태: confirmed

- id: "2026-08-25-fix3-no-candidate-minutes-say-why-intraday"
  구현일: 2026-08-25
  검증예정일: 2026-08-26
  가설: |
    진입 판단은 섰는데(ENTER) 후보 종목이 0건인 분에 **사유가 담긴 INFO 한 줄**이 남는다 —
    「사고 싶다 336번 중 왜 313번은 살 것을 못 골랐는가」를 DB를 열지 않고 장중에 읽는다.
  대가: |
    그 줄이 **억제된다** — 사유 전환 시 + 같은 사유는 5분에 한 번. 억제가 없으면 08-24 기준
    하루 313줄이고, 그 줄들이 진짜 사건을 덮는다(08-15 `ALERT_ONLY` 94줄의 형태).
    따라서 이 카운트는 「그 상태였던 분 수」가 아니다 — 분 수의 정본은 DB 축
    (`selected_instruments.reason` · `strategy_rejected`)이다.
  근거: |
    08-24 §1-6 / Fix#3 — ENTER 336분 중 후보 23분. 나머지 313분의 사유(`no_strike_match` 325 ·
    `no_entry_strategy` 136)는 매분 DB에 남고 있었는데 로그에 없어서, 장중 두 회차가 이것을
    신규 P1로 오인했다 — 답은 08-18부터 열려 있던 미결 결정이었다(§3-2). 없던 것은 기록이
    아니라 **장중 가시성**이다.
  예측:
    - metric: qualitative.entry_no_candidate
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.entry_no_candidate
      expect: "<= 100"
      역할: 대가
  주의: |
    ⚠ 대가 상한 100은 「사유가 계속 바뀌는 최악의 날」을 여유로 잡은 값이다 — 같은 사유가
    이어지는 날(08-24 형태)은 관측 480분 / 5분 = 최대 96줄보다 훨씬 적게 나온다.
    ⚠ ENTER가 0건이거나 매분 후보가 골라진 날은 이 값이 0이다 — `_QUALITATIVE_ALWAYS_PRESENT`에
    등록해 **0이 인쇄된다**(「고르는 데 실패가 없던 하루」와 「그 줄이 없던 버전」을 가른다, 규약 C).
    ⚠ 억제기는 `WarningThrottle`이 아니다 — 저쪽은 카테고리별 창이라 사유가 A→B→A로 되돌아올
    때 전환이 삼켜진다. 규칙은 「전환은 항상, 지속은 5분마다」(`_log_no_candidate_entry`).
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다.
  검정: |
    2026-08-26 확정 — `qualitative.entry_no_candidate` **11건**(주장 `>= 0` 확인 · 대가 `<= 100` 확인). 진입 판단 300건 중 후보가 0건인 분에 사유가 남았다.
  상태: confirmed

- id: "2026-08-25-p1-2-censoring-is-printed-regardless-of-p50"
  구현일: 2026-08-25
  검증예정일: 2026-08-26
  가설: |
    증거 §5-1이 하루 검열 건수(타임아웃에 잘린 호출)를 **p50 상태와 무관하게 항상** 인쇄한다 —
    p50이 안전한 날의 「✅ 검열되지 않았다」가 잘린 꼬리 186건을 다시는 가리지 않는다.
  근거: |
    08-25 §1-8 / P1-2 — `window_censored_counts()`가 186건/9,433건(1.97%)을 다 셌고 TSV에도
    썼는데, 본문은 `floored`(p50이 눌린 창)가 비어서 「✅ 오늘 p50은 검열되지 않았다」만
    인쇄했다. 20종목 순차 수집에서는 「절반이 느려진다」보다 「5%가 완전히 막힌다」가 먼저
    오는데 우리는 앞의 것만 보고 있었다. `floored` 분기는 그대로 뒀다 — 그것은 「p50 값
    자체를 하한으로 읽으라」는 다른 경고다.
  예측:
    - metric: slow_calls.count
      expect: "수기 판정 — 다음 거래일 증거 §5-1에 「하루 검열 N건 / M건」 줄이 p50 상태와 무관하게 실리는가. 느린 호출 줄이 0건인 날은 「안 셌다」로 인쇄되는가(규약 C)"
      역할: 주장
  주의: |
    ⚠ **이 fix는 일별 지표로 자동 검정되지 않는다** — 수집기 인쇄물은 사이드카에 안 실린다.
    진짜 계약은 계약 테스트다(`tests/test_evidence_collector_p95.py::
    test_daily_censoring_is_counted_even_when_p50_is_healthy`). 08-25 재집계 스모크에서
    「186건 / 9,433건(1.97%) · 검열 창 58/98」이 실제로 인쇄됨을 확인했다.
    ⚠ **대가를 `대가:` 필드로 선언하지 않았다** — 표시만 늘고 재는 일별 경로가 없다
    (`2026-08-24-fix1-2-adv4` · `2026-08-19-fix10`과 같은 자리). 대가는 문장으로:
    검열이 0건인 날에도 한 줄이 늘 뿐이고, `censored_measured=False`인 날은 「0%」가 아니라
    「안 셌다」로 인쇄한다(그 분기가 이미 있었고 재사용했다).
  검정: |
    2026-08-26 확정 · **근거 보강** — 증거 §5-1이 「하루 검열 **1,076건 / 8,053건(13.36%)** · 검열 창 70/98」을 **p50 상태와 무관하게** 인쇄했다. p50이 0.01배로 안전했던 07·08시 창에도 검열 열이 찍혔고, **1.18배였던 14:34 창에도** 찍혔다 — **양쪽 극단에서 확인됐다.**
  상태: confirmed

