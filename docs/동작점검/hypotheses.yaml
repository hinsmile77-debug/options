    ⚠ **E와 같은 날 켜지 않는다.** 둘 다 판단 출력을 움직이므로 귀속이 안 갈린다.
    E를 08-13으로 미뤘으므로 F는 08-12에 단독으로 켤 수 있다 — **그것이 미룬 이유의 절반이다.**
    켜는 방법: `strategy_params.yaml`의 `use_effective_member_count: true`.
    ⚠ 규약 G — `effective_mean`에 하한을 걸지 않는다. 그 값은 그날 시장이 무엇이었는가의 함수다.
  판정근거: |
    ⚠ **2026-08-12: 검정 미실행 — 레버가 안 켜진 채 하루가 갔다.**

    그날의 「켤 것 — 오늘 단 하나만」이 이것이었는데 `strategy_params.yaml`에 키가 없었고
    커밋도 0건이었다(`fusion/engine.py`가 기본값 `False`로 읽는다). 그런데 자동 지표는 켜진
    전제로 판정해 「HIGH_CONVICTION이 34건보다 줄어야 한다」 옆에 실측 **91건**을 찍었다 —
    표만 보면 분모 전환이 반대로 작동한 것처럼 보인다. **그 91건은 이 가설과 무관하다.**

    확인도 반증도 아니므로 `pending`을 유지하고 검증예정일만 옮긴다. 08-13은 레버 E(혼잡
    시간대 위클리 격분화)의 날이고 **둘 다 판단 출력을 움직이므로 같은 날 금지**이므로 08-14다.

    이 항목에 `전제레버`를 달았다 — 이제 레버가 꺼진 날에는 자동 판정이 **「미실행」**으로 나온다
    (규약 H / `2026-08-12-fix6-lever-state-convention-h`). **이 사고가 그 규약을 만들었다.**

    ⚠ **2026-08-14: 네 번째 미실행.** `use_effective_member_count` 키가 없어 레버는 꺼진 채였고
    관측 루프 재기동도 0회였다(설정은 기동 시 로드되므로 창은 07:31에 닫혔다). 규약 H에 따라
    자동 §0-1도 「미실행」으로 인쇄했다 — 이 건은 자동 판정이 맞다.

    **08-12 선례와 같이 `pending`을 유지하고 검증예정일만 옮긴다** — 확인도 반증도 아니고,
    닫아 버리면 레버를 켜는 날 검정할 항목이 없어진다. 새 예정일은 발동일(08-25)의 다음
    거래일이다. 2026-08-16에 이 항목의 **예측 부호를 정정**했다(위 「대가」 참고) —
    확신도는 오르기만 하므로 종전 「HIGH_CONVICTION이 줄어야 한다」는 산술적으로 틀렸다.


    ===== 2026-08-23 — **켰다(선택지 A).** 유예는 네 번으로 끝났다 =====

    08-21 장후 보고서 「사용자 조치 6」이 A/B/C 셋을 손익으로 제시했고 사람이 **A**를 골랐다.
    `mahdi/config/strategy_params.yaml`에 `use_effective_member_count: true`를 적었다.

    **효력은 다음 07:30 기동부터다** — 이 파일은 프로세스당 1회만 읽힌다(`@lru_cache`).
    08-23은 일요일이므로 이 레버가 실제로 도는 첫 날은 **2026-08-24(월)**이고,
    그래서 검증예정일을 08-26에서 **08-24**로 당긴다(무조건발동일 08-25보다 앞선다 —
    기한보다 이틀 일찍 켠 것이다).

    **레버 E와 같은 날이 아니다**: E는 같은 날 2026-09-01로 유예했다(그 항목 참고).
    「하루에 변수 하나」가 지켜진다 — 08-24에 판단 출력을 움직이는 변경은 이것 하나뿐이다.

    ⚠ **읽는 법(위 「대가」의 정정이 여기 걸린다)**: 확신도는 **오른다**. HIGH_CONVICTION이
    늘고 ENTER가 늘면 그것은 회귀가 아니라 **예측대로**다. 줄었으면 레버가 실제로 안 켜졌거나
    그날 중립 축이 없었던 것이다. 그리고 이 레버는 `short_gamma_requires`를 통해
    **프리미엄 매도 계열의 문을 연다** — 그 계열 진입 건수를 대가로 함께 읽는다.
  전제레버: use_effective_member_count
  검정: |
    2026-08-24 확정 — **규약 H 통과**: 그날 `use_effective_member_count`가 `true`로 실제 돌았다(레버 표 ON, 08-24가 첫날).
    주장 `db.decisions.conviction`의 HIGH_CONVICTION **207건** >> 08-11 기준선 34건 — 예측대로 늘었다.
    **대가도 함께 쟀다(규약 E)**: `db.decisions.decision.ENTER` **336건** vs 08-11 기준선 281건 → 진입도 함께 늘었다.
    그것이 이 레버의 대가이고 예측 문구가 그렇게 적어 둔 그대로다. 참고 `effective_mean` 2.35(기준선 2.36 — 규약 G상 시장 따라감).
    ⚠ **두 번째 대가 지표는 확인되지 않았다**: 「프리미엄 매도 계열이 새로 열리는가」 → `entry_strategies`에 `limited_premium_sell` 계열 **0건**.
    문이 열리지 않았다. 이 한 칸은 「확인 안 됨」이고, 따라서 이 confirmed는 **주장 축에 대해서만**이다.
  상태: confirmed

