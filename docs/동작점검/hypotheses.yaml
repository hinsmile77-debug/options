- id: "2026-08-12-fix4-abort-scope-book-priority"
  가설: |
    조기 포기를 두 단계(비우선 북 → 전부)로 나누면, 위클리가 남아 있는데 먼슬리부터 잘리는 일이
    사라진다.
  대가: |
    1단계로 살아난 먼슬리 폴링이 **확정 실패 호출을 더 쏠 수 있다** — Fix#1이 줄이려던 바로 그것이다.
    시간 예산(50초)이 여전히 상한이므로 사이클은 길어지지 않지만, 콜 수는 늘 수 있다.
  검증예정일: 2026-08-13
  근거: |
    08-12 실측 — 조기 포기 50회 **전부**가 컷당한북에 `regular`를 담았고 26회는 `regular` 단독,
    30회가 적재 0행이었다. 대조군인 시간 예산 컷은 74회 중 먼슬리에 닿은 것이 **2회**뿐이다.
    즉 순서는 예산 경로에만 있었고 조기 포기 경로에는 없었다.
  예측:
    - metric: timeout_abort.priority_before_others_minutes
      expect: "== 0"
      역할: 주장
    - metric: budget_exceeded.priority_before_others_minutes
      expect: "수기 판정(참고) — 예산 컷은 **시계**이지 스코프가 아니라 Fix#4가 못 막는다. 0이 아니어도 Fix#4의 반증이 아니다"
      역할: 참고
    - metric: db.monthly_leg_completeness.below_design_pct
      expect: "수기 판정(주장) — 08-12 기준선 **10.7%**. 먼슬리가 덜 잘리면 이 값이 좋아져야 한다"
      역할: 주장
    - metric: overrun.count
      expect: "== 0"
      역할: 대가
    - metric: rest.total_calls
      expect: "수기 판정(대가) — 08-12 기준선 9,331건. 1단계로 살아난 먼슬리가 확정 실패 호출을 더 쏠 수 있다. 크게 늘면 1단계의 실패 예산 재부여가 과한 것이다"
      역할: 대가
  주의: |
    ⚠ **홀수분(먼슬리 단독 사이클)은 종전과 똑같이 즉시 접는다.** 08-12의 「`regular` 단독 26회」가
    그 형태이고 **그 26회는 위반이 아니다** — 자를 것이 먼슬리밖에 없는 사이클에서 먼슬리를
    자르는 것은 순서 문제가 아니다. 거기서 두 번째 기회를 주면 Fix#1이 08-11 실측으로 포기한
    것을 하루 만에 되돌리게 된다.
    ⚠ 그래서 **`timeout_abort.priority_cut_minutes`(구 지표)는 이 fix로 안 내려간다.**
    26 근처를 유지하는 것이 정상이다 — 그 값으로 반증하지 말 것(판정은 `_before_others`로 한다).
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: `priority_before_others_minutes` 0 · `below_design_pct` **18.4%**(08-12 기준선 10.7%)
    · `overrun` 0 · REST 9,803건.
    주장 지표 둘이 갈린다. **`below_design_pct` 악화는 이 fix의 반증이 아니다** —
    그날 14:00~15:23에 KIS `inquire-price` 지연이 read timeout을 넘어 옵션체인이 84분 연속
    0행이었고(§2-1·§2-2), 먼슬리 레그 미달은 그 결과다. 교란이 너무 커서 이 fix의 효과를
    분리할 수 없다 — **다음 정상일로 미룬다.**
  상태: inconclusive

- id: "2026-08-12-fix5-ordering-breach-not-tail-cut"
  가설: |
    우선순위 위반을 「먼슬리가 잘렸다」가 아니라 「아직 안 부른 위클리를 두고 먼슬리를 잘랐다」로
    재정의하면, 성립할 수 없는 분에서 불변식이 거짓 위반을 내지 않는다.
  검증예정일: 2026-08-13
  근거: |
    08-12에 `budget_exceeded.priority_cut_minutes = 2`가 불변식 위반으로 보고됐다. 실측하니
    둘 다(12:49:53 / 13:51:53) **홀수분의 꼬리 컷**이었다 — 그 분에는 위클리가 애초에 due가
    아니라 사이클 전체가 먼슬리였고, 50초 예산 끝에서 남은 2~3레그가 잘린 것이다.
    **자를 것이 먼슬리밖에 없는 분에서 먼슬리를 자르는 것은 순서 문제가 아니다.**
    규약 G가 막는 것과 같은 형태의 오류였다 — 성립할 수 없는 상황에 무조건부 임계를 걸었다.
    판정을 **로그를 내는 쪽**으로 옮긴 이유: 그 시점에만 "아직 안 부른 비우선 레그가 남아
    있었는가"를 알 수 있고, 파서는 사후에 복원할 수 없다(그 분에 위클리가 due였는지는
    `OPTION_CHAIN_SLOW_SERIES_PHASE`에 달렸고 그 설정은 바뀐다).
  예측:
    - metric: budget_exceeded.priority_before_others_minutes
      expect: "수기 판정(주장) — 이 키가 **존재하고 `None`이 아닌가**(존재부터 예측한다 — README 규약). 08-12 로그에는 라벨이 없어 `None`이 정상이다"
      역할: 주장
    - metric: budget_exceeded.priority_cut_minutes
      expect: "수기 판정(참고) — 구 지표는 그대로 둔다. 두 값이 **갈리는 날**이 이 fix가 실제로 일한 날이다"
      역할: 참고
  주의: |
    ⚠ 규약 C — 라벨이 없는 08-11 이전 로그에서 이 값은 `None`이어야 한다. 0을 내면
