      expect: "수기 판정 — 08-06의 9,241건 수준(레버가 내려져 있으므로)"
      역할: 대가
  주의: |
    **레버가 내려져 있는지 확인하는 것이 이 항목의 전부다.** 위클리 커버리지가 25% 근처로
    떨어졌다면 누군가 `OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS`를 채웠다는 뜻이고,
    그렇다면 **그 자리에서 새 가설을 세웠어야 한다**(주장: 그 시간대 p95 하락 / 대가: 위클리
    커버리지 하락). 예측 없이 켜면 08-05 `p2`의 반복이다.

    켜기로 결정할 때의 판단 재료: 고도화#1의 `db.monthly_leg_completeness.below_design_pct`가
    20% 밑으로 내려왔는가. 내려왔으면 감축은 불필요하다.
  판정근거: |
    (2026-08-11 확정) **레버가 한 번도 발동되지 않았다**(`OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS` 빈 dict). 08-11에 유예 근거가 또 바뀌었다 — 오늘 먼슬리는 예산 컷에 한 번도 안 닿았으므로 레버의 이득이 08-10 추정보다 작다(08-11 §5-E). 재등재 대상.
  상태: inconclusive
