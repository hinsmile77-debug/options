    08-07 §B-2 — 5분 신선도 창(`db.CHAIN_SNAPSHOT_MAX_AGE_MINUTES`) 안에 ATM 롤로 생긴 **다른
    행사가 창**이 겹쳐 쌓이고 있었다. `DISTINCT ON`이 창 밖으로 빠져 더 이상 폴링되지 않는
    행사가의 마지막 값을 창 만료까지 붙들기 때문이다.

      스냅샷 레그   분(장중)   최고령 평균
         10(설계)      45        62초
         12            88       185초
         14            45       191초
         16            20       229초
         18             3       250초

    **장중 202분 중 157분(78%)이 두 개 이상의 창을 섞어 GEX를 냈다.** GEX는 OI 가중 합이라
    행사가가 늘면 |GEX|가 부풀고, 그 값이 v6 §11.4 프리미엄 매도 게이트의 입력이다.
    08-07 GEX는 전 구간 음수(평균 -1.4e10)였고 `short_gamma_requires_not_met` 49건이 거기서 나왔다.

    후보 3안을 08-07 실데이터 327분으로 리플레이해 **범위안**을 골랐다(집합안은 그 사이클에서
    ReadTimeout으로 빠진 레그를 이월로 못 살려 327분 중 1분이 설계 미만으로 떨어졌다):

      후보                     중앙 레그  최대  설계 미만 분  최고령 중앙/최대
      현행(5분 창 전체)            12      20      0분        120초 / 300초
      최신 사이클의 행사가 집합     10      10    **1분**       0초 /   0초
      최신 사이클의 행사가 범위     10      10      0분          0초 /  60초   ← 채택
  예측:
