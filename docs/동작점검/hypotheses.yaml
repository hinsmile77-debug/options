- id: "2026-08-07-e4-hmm-nonconvergence-guard"
  구현일: 2026-08-07
  검증예정일: 2026-08-10
  가설: "수렴하지 않은 HMM은 저장을 거부하는 것이 저장하는 것보다 안전하다"
