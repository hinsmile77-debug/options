      실력이 같은데도 그만한 격차가 난 비율  8.2%  →  약 12번에 한 번은 우연만으로 나온다

    통상 기준(5%)을 못 넘는다. 게다가 **지평이 3개이고 매일 본다** — 순전히 우연으로 격차가
    한 번이라도 나올 확률이 하루 23%, 영업일 5일이면 **72%** 다. 일주일이면 의미 없는 「격차」
    하나쯤은 거의 확실히 나오므로, **그것을 발견으로 읽으면 틀린 결론에 도달한다.**

    표본이 왜 202 vs 97로 비대칭인가(두 필터가 구조적으로 REJECT만 깎는다):
      방향 0    REJECT −75건(`meta_label:no_trade` 75건과 정확히 일치). ENTER는 0건 탈락
      시간대    REJECT는 08시·15시에 몰리는데 그 시간대 ENTER는 컷오프 때문에 구조적으로 0건

    **판정은 하루의 크기가 아니라 며칠간 부호의 고착으로 한다.**

    부호가 음수로 고착되면 그것은 "팔레트가 거르는 기준이 방향 예측력과 반대로 걸려 있다"는
    가설의 첫 증거다 — 그러나 그 결론에 도달하기 전에 (a) 표본 시간대 (b) 무변동 제외 규칙
    (c) 진입 컷오프로 인한 구조적 비대칭을 전부 확인해야 한다.

    (c)는 시(hour) 단위 매칭으로 **제거되지 않는다**: 같은 14시라도 ENTER는 14:50 이전에만
    있고 REJECT는 그 이후에도 있다(08-07 `entry_cutoff` 46건). 매칭 단위를 분 또는 컷오프
    이전으로 좁히면 없앨 수 있으나 표본이 더 줄어든다 — **며칠 쌓인 뒤에 한다.**

    **이 값으로 가중치를 바꾸지 않는다** — 평가이지 되먹임이 아니다(v6 §11.3 Thompson
    Sampling은 Phase 3).
  판정근거: |
    (2026-08-11 확정) 08-11 실측 — 대조군 213건 / `shared_hours` 6개로 비교 성립. **지표는 작동한다.** 부호 판정은 별건이고 오늘 3일 만에 뒤집혔다(+1.7/−2.7/+8.7pt) — 며칠 더 쌓는다.
  상태: confirmed
