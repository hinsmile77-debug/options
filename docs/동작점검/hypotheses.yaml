- id: "2026-08-14-fix6-p50-over-read-timeout"
  가설: |
    `inquire-price`의 p50을 **read timeout과 같은 줄에** 놓고 그 비율을 인쇄하면, 08-14 같은
    절벽이 무너지기 전에 보인다.
  # 2026-08-16 정정 — 08-17은 **광복절 대체휴일(휴장)** 이다. 그날은 프로세스가 안 뜨므로
  # 검증이 성립하지 않는다(그대로 두면 다음 거래일에 「예정일 경과」로 잘못 뜬다).
  검증예정일: 2026-08-18
  근거: |
    08-14 14:00~15:23 옵션체인 84분 전멸의 원인은 p50이 **4.05초**로 전역 read timeout
    **4.0초**를 추월한 것이다. 중앙값 호출이 타임아웃되면 20레그 순차 수집의 기대 성공 수가
    0에 수렴하고, 재시도도 같은 벽에 부딪힌다.

    **p95 임계(2.5초)로는 예고할 수 없었다** — 그날 p95는 09시부터 종일 붉었고 그 상태로
    다섯 시간 아무 일도 없었다. 열화는 연속량이 아니라 **임계 현상**이고, 「예산 초과 건수」·
    「수집 소요」 같은 연속 지표는 절벽 직전까지 완만하게 오르다가 **절벽에서 오히려 좋아진다**
    (14시 REST수집 평균 49.9초로 13시 50.5초보다 낮았다 — 느려진 게 아니라 비어 있었다).

    비율 0.8의 근거: 08-14 13:36 창의 p50이 3.08초 = 타임아웃의 **0.77배**였고 24분 뒤 절벽이
    왔다. 0.8은 「중앙값 호출이 타임아웃 한 뼘 앞」이라는 뜻이다.
  예측:
    - metric: rest_latency.p50_by_hour
      expect: "수기 판정(주장) — 이 격자가 **존재하고 `inquire-price` 행을 갖는가**(존재부터). 08-14 재집계 기준선: 14시 4.21초(가중), 비율 1.05"
      역할: 주장
    - metric: rest_latency.warnings
      expect: "수기 판정(참고) — p95 축. **두 축이 같은 날 다른 말을 하는지**가 이 fix의 요점이다(08-14: p95는 09시부터 붉었고 p50 비율은 14시에야 넘었다)"
      역할: 참고
    - metric: cycles.by_hour
      expect: "수기 판정(참고) — 전일 같은 시간대와 나란히 인쇄되는가. 08-14의 열화는 어제와 겹쳐 읽어야만 보였다(12시 47.2초 vs 08-13 29.2초)"
      역할: 참고
  주의: |
    ⚠ **임계는 「그날 실제로 걸려 있던 타임아웃」이어야 한다.** 레버
    `OPTION_CHAIN_READ_TIMEOUT_SECONDS`를 켠 날 전역값(4.0초)으로 비교하면 이 표가 통째로
    거짓말을 한다 — 그래서 값을 `levers`에서 읽는다.
    ⚠ **이 지표는 KIS 귀속이다.** 우리가 콜을 줄여도 그들의 p50은 안 바뀐다(08-14에 REST 수요가
    전일의 80%였는데도 무너졌다). 이 값으로 우리 쪽 fix를 판정하지 말 것.
    ⚠ 비율이 1.0을 넘는 날이 다시 안 올 수도 있다 — 그때 이 가설은 **반증이 아니라 「그날
    KIS가 한가했다」**이다. 존재 예측만 주장 축에 둔 이유다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-18에서 사흘 지남, 소급 적용 금지).**

    **선행 관계는 08-21에 다시 재현됐다**: 10:05 경고선(p50/timeout 0.82) → 11:10 위험선(1.00)
    → 12시부터 적재 0행 급증(18분 → 43분). 그러나 같은 날 **이 지표의 대가가 드러났다** —
    08-21의 p50 4.03~4.05초는 **타임아웃(4.0초)에 검열된 값**이라 실제 응답시간이 아니다.
    그 사실이 표기되지 않아 세 회차가 「4.03초」를 실제 응답시간처럼 읽었다(08-21 §1-14).
    검열 표기는 후속 항목 `2026-08-21-fix3-censored-p50-is-printed-as-a-floor`가 받는다.
  상태: inconclusive

