- id: "2026-08-21-fix1-ingest-watch-covers-closing-auction"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    적재 감시창을 **단일가 매매 종료(15:30)** 까지 넓히면, 20분을 넘는 빈손 구간이 **끝까지**
    DEGRADED로 잡힌다 — 08-21 15:20·15:30에 찍힌 「OK — 정상」 두 줄이 사라진다.
  대가: |
    창을 넓히면 그 15분에서 오경보가 늘 수 있다. 그 구간은 폴링이 자연스럽게 잦아드는 시간대이고,
    `INGEST_WATCH_END` 위 주석이 경고한 「매일 오경보」가 정확히 그 자리다. 그래서 대가를 숫자로 건다.
  근거: |
    08-21 §1-13 — 당일 최장 빈손 **26분(15:05~15:30)** 이 임계 20분을 처음 넘겼는데, 그 절반은
    **아무도 안 보고 있었다.** `liveness.INGEST_WATCH_END`가 **15:15**이라 15:15 이후는 창 밖이고,
    15:20:01과 15:30:02의 판정은 `OK — 정상`으로 인쇄됐다(`liveness.py:632`). 그때 프로그램은
    26분째 빈손이었다.

    ⚠ **08-20 §4 Fix#1의 지시(`session.CLOSING_AUCTION_START` = 15:20)로는 부족하다** —
    그 값으로 옮기면 오늘 구멍의 **10분(15:20~15:30)이 그대로 남는다.** 그래서 15:30이다.
    15:30~15:45(종료 배치까지)는 **넓히지 않는다.**
  예측:
    - metric: watchdog.degraded_checks
      expect: |
        수기 판정(주장) — 08-21 실측 **16건**이고 그 16건에 **15:15 이후가 하나도 없다**
        (감시창이 15:15에 닫혔다). 15:15~15:30에 적재 0분이 있는 날, 그 분들이 이 값에
        들어오는지를 본다. 절대 건수라 그날 KIS 상태에 비례하므로 수기로 읽는다(규약 F).
      역할: 주장
    - metric: watchdog.degraded_checks
      expect: "<= 24"
      역할: 대가
  주의: |
    ⚠ **같은 지표가 주장과 대가에 함께 놓여 있다 — 의도한 것이다.** 이 fix가 바꾸는 것은
    「그 축이 무엇을 보는가」이고, 이득(15:15~15:30이 보인다)과 대가(오경보가 는다)가
    **같은 카운터 위에서 반대 방향으로** 나타난다. 두 축을 억지로 갈라 놓으면 그 사실이 흐려진다.
    상한 24는 08-21 실측 16건의 1.5배다 — 넘으면 창을 넓힌 대가로 오경보를 산 것이다.
    ⚠ **`ACTION_OK`를 `ACTION_IDLE`로 바꾸지 않는다.** `watchdog_observation_loop.py`가 IDLE을
    「기록 안 함」으로 처리하므로, 바꾸면 그 구간이 로그에서 통째로 사라진다 —
    **「모른다」를 「없다」로 바꾸는 것은 지금보다 나쁘다.**
    ⚠ 같은 커밋에 DEGRADED 판정 detail의 **「연속 N분째」** 카운터가 함께 들어간다(08-20 지시의
    나머지 절반). 08-21 13:39~14:02에 같은 문구가 14줄 반복돼 사람이 손으로 세었다.
  검정: |
    2026-08-24 판정 불가 — 주장 `watchdog.degraded_checks` = **0**. 그러나 그 0의 이유는 감시창이 넓어져서가 아니라
    **그날 적재가 한 번도 안 멈췄기 때문**이다(결손 0분 · `rows=0` 0개). **잡을 것이 없었던 날을 「잡았다」로 세지 않는다**(규약 C).
    코드는 확인됐다 — `liveness.py:221` `INGEST_WATCH_END = session.EQUITY_CLOSING_AUCTION_END`(15:30).
    08-25 실측이 근거를 보탰다: 감시창이 15:20을 **덮는다**(15:20:02 줄이 창 안 판정). 그러나 `degraded_checks`는 여전히 0이고
    08-25도 적재 0분이 없었다. **적재가 실제로 15:15~15:30에 멈추는 날에 판정한다.**
  상태: inconclusive


- id: "2026-08-21-fix2-out-of-window-is-not-ok"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    적재 감시창 **밖**의 판정은 「정상」이 아니라 **「적재 상태 모름」**으로 인쇄된다 —
    「모른다」가 「괜찮다」로 안 읽힌다.
  대가: |
    워치독 1회 판정이 늘어난 문자열 조립 때문에 밀리면 안 된다. 밀리면 08-12의 실패
    (감시자가 감시를 못 함)를 우리 손으로 재현하는 것이다.
  근거: |
    08-21 §1-13 — 15:32~15:44에 적재는 정상으로 돌아왔지만, 그 이전 15:20·15:30의
    「OK — 정상 — 마지막 박동 N초 전」은 **박동만 보고 한 말**이었다. 그 문구는 적재에 대해
    아무것도 모르면서 적재가 괜찮다는 인상을 준다. 규약 C(「없었다」와 「셀 수 없었다」는 다르다)를
    판정 문구에 적용하는 것이다.
  예측:
    - metric: watchdog.checks
      expect: |
        수기 판정(주장) — `logs/watchdog.log`의 감시창 밖(15:30 이후) `OK` 줄 detail에
        **「적재 감시 창 밖(적재 상태 모름)」**이 들어 있는가. 08-21에는 15:20·15:30·15:40이
        전부 「정상 — 마지막 박동 N초 전」이었다. 창 **안**에서 적재가 정상이면 종전 문구 그대로다.
      역할: 주장
    - metric: watchdog.max_silence_minutes
      expect: "<= 20.0"
      역할: 대가
  주의: |
    ⚠ 대가를 `watchdog.checks`가 아니라 `max_silence_minutes`로 잡은 이유: 판정이 실제로
    느려지면 **판정 사이의 침묵**이 먼저 늘어난다. 08-21 실측 10.0분(정상 주기 10분).
  검정: |
    2026-08-24 확정 — 주장은 「감시창 **밖**의 판정이 「정상」이 아니라 「적재 상태 모름」으로 인쇄되는가」다.
    실물: 장전 워치독 3행이 전부 `박동 정상 · 적재 감시 창 밖(적재 상태 모름) — 마지막 박동 23초 전`이고,
    종료 후 상태 파일도 `{"action":"idle","detail":"감시 창 밖"}`이다. 08-21에는 같은 자리가 「정상 — 마지막 박동 N초 전」이었다.
    대가 `watchdog.max_silence_minutes` **10.0** <= 20.0 충족.
    **08-25 재확인** — 15:30:02·15:40:02 워치독 줄이 `OK — 박동 정상 · 적재 감시 창 밖(적재 상태 모름)`. 이틀 연속 같은 문구다.
  상태: confirmed


- id: "2026-08-21-p1-latency-recovers-with-the-session"
  구현일: 2026-08-23
  # 「지연이 있는 다음 날」에만 갈린다 — 날짜가 아니라 **사건**이 조건이다. 잠정으로 적는다.
  검증예정일: 2026-09-01
  가설: |
    KIS 응답 지연은 **장 시간 경계에 붙어 끝난다** — 지연이 있던 날의 회복 시각이
    15:30(단일가 종료) ±5분 안에 든다.
  근거: |
    08-21 §1-14 — 그날 절벽이 **15:31에 저절로 끝났다.** `inquire-price` p50이 4.05초에서
    **0.02초**로 돌아왔고(약 200배), 같은 경계에서 사이클 소요도 45.00초 → 19.55초로 복귀했다.
    **그 시각 우리 쪽 변경은 0이다** — 재기동 0 · 커밋 0 · 레버 6개 전부 OFF 유지.
    우리 쪽 압력도 애초에 낮았다(총 REST 7,616건 / 전일 9,079건, 페이서 용량 대비 25.7%).

    이 관측이 값진 이유는 **처방의 방향을 바꾸기 때문이다**: 상대가 안 보내고 있었다면
    「더 기다린다」(read timeout 6초)는 듣지 않고, 처방은 **「부르는 시각」** 쪽으로 옮겨간다.
    그러나 하루 표본으로는 우연과 규칙을 못 가른다 — 며칠 쌓아야 한다.
  예측:
    - metric: rest_latency.p50_max_by_hour
      expect: |
        수기 판정(주장) — 지연이 있던 날, `inquire-price`의 p50/timeout이 1.00을 넘었다가
        **15:20~15:35 안에** 0.1 이하로 돌아오는가. 08-21 실측: 첫 돌파 11:10 · 복귀 15:31
        (단일가 종료 +1분).
      역할: 주장
  주의: |
    ⚠ **관측 전용이다 — 대가가 없다.** 이 항목은 무엇을 고치지 않는다. 그래서 「대가」 절도 없다.
    ⚠ **정상일에는 아무 일도 안 일어난다.** 지연이 없던 날의 「갈리지 않음」은 반증이 아니다 —
    갈릴 조건 자체가 없었던 날이다(규약 C).
    ⚠ 회복 시각을 사람이 `지연창.tsv` 꼬리를 눈으로 훑어 찾았다(08-21 §5 고도화#2). 그 자동화는
    별건이고, 그때까지는 이 항목의 실측도 수기다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표) — **확인.** 오늘 지연이 위험선(1.0배)을
    **14:35**에 넘었고, 회복(**15:25~15:26**)이 예측 범위(단일가 종료 15:30 ±5분,
    즉 15:25~15:35) **안**에 들었다. 절벽 4호(14:31~15:23)가 그 실측의 무대였다.
  상태: confirmed


- id: "2026-08-21-fix3-censored-p50-is-printed-as-a-floor"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    p50이 타임아웃에 눌린 창은 `4.03초`가 아니라 **`≥4.0초(검열 N%)`**로 인쇄된다 —
    「4.03」을 실제 응답시간으로 읽는 일이 없어진다.
  대가: |
    검열이 없는 날 표기가 바뀌지 않는다(회귀 없음). 검열 0%인 창은 종전과 한 글자도 같아야 한다.
  근거: |
    08-21 §1-14 / §5 고도화#1 — 그날 지연창 98개 중 상당수가 p50 **4.03~4.05초**를 냈고,
    타임아웃이 **4.0초**이므로 그 값은 실제 중앙값이 아니라 **타임아웃 벽에 눌린 값**(우측 검열)이다.
    그런데 리포트는 그것을 「4.03초」라고 평범하게 인쇄했고 **세 회차가 그 숫자를 실제
    응답시간처럼 읽었다.**

    그 오독의 대가가 구체적이다: 08-20·08-21 세 회차가 손익표에 올린 「read timeout 4.0 → 6.0초」는
    「조금만 더 기다리면 온다」를 전제하는데, **6초로 늘렸을 때 몇 %가 더 들어오는지를 오늘
    데이터로는 구할 수 없다.** 재료가 애초에 없었다. 레버보다 계측이 먼저다.
  예측:
    - metric: rest_latency.censored_window_count
      expect: ">= 0"
      역할: 주장
    - metric: rest_latency.censored_windows
      expect: |
        수기 판정(참고) — 검열된 창의 목록(창시각 · 엔드포인트 · 호출 수 · p50 · 검열 %).
        08-21을 다시 돌리면 98창 중 상당수가 여기 들어와야 한다.
      역할: 참고
    - metric: rest_latency.p50_max_by_hour
      expect: |
        수기 판정(대가) — 검열이 없는 시간대(08-21이면 07~08시 · 15:32 이후)의 값과 표기가
        종전과 **한 글자도** 달라지지 않는다.
      역할: 대가
  주의: |
    ⚠ **`>= 0`은 경로 생존 확인이다**(규약 F가 통과시키는 형태). 검열 건수 자체에 임계를 걸지
    않는다 — 그 값은 **그날 KIS가 어땠는가**에 비례한다(규약 G).
    ⚠ **검열 비율을 재는 것과 타임아웃을 올리는 것은 다른 결정이다.** 잘린 호출의 실제 소요를
    알려면 타임아웃을 크게 두고 하루를 관측해야 하고, 그것 자체가 레버 결정이다.
    **먼저 검열 비율만 재고, 그 숫자가 나온 뒤에 사람이 정한다**(08-21 사용자 조치 7).
  검정: |
    2026-08-24 판정 불가 — 주장 `rest_latency.censored_window_count` = **0** · `censored_windows` = `[]`.
    그날은 p50이 타임아웃에 눌린 창이 하나도 없었다(창 최대 0.50배). 즉 **새 인쇄 경로가 한 번도 안 탔다** —
    확인도 반증도 아니다(규약 C·H의 같은 자리). 대가 지표(검열 없는 시간대의 표기가 한 글자도 안 바뀐다)는 충족 — 15시대 표기가 종전 형식 그대로다.
    ⚠ **08-25도 같은 자리다**: `censored_measured=True`로 잘린 호출 186건/9,433건(1.97%)을 셌는데도 `floored`가 비어 이 경로는 또 안 탔다.
    그 사실 자체가 08-25 §1-8 / 제4부 P1-2의 이상점이 됐다. **08-21처럼 p50이 4.0초에 눌리는 날에 판정한다.**
  상태: inconclusive


- id: "2026-08-21-fix4-intentional-stop-is-not-an-unexplained-death"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    사람이 일부러 내린 정지는 「사유 없이 끝난 기동」에서 **빠지고**, 대신 「사람이 일부러 내린
    정지 N회」가 별도 줄로 인쇄된다.
  대가: |
    진짜로 설명 안 되는 죽음이 있는 날에는 **여전히 떠야 한다.** 표식을 보는 판정으로 바꾸면서
    「표식이 없는 죽음」까지 조용해지면, 이 fix는 경보를 고친 것이 아니라 끈 것이다.
  근거: |
    08-21 §1-17 — 지표 §11-1-1이 `기동 횟수 − 정상 종료 횟수`로 「사유 없는 죽음」을 세는데,
    그날 **12:18 수동 정지**가 그 1건으로 잡혔다. 그 정지에는 표식이 둘이나 있었다:
    `logs/.intentional_stop` 파일과 `premarket_startup.log`의
    `===== Mahdi 수동 정지 시작 (사람이 일부러 내림) =====` 줄. **워치독은 그것을 정확히 읽었고**
    (재기동 시도 0회), 지표만 몰랐다.

    `collect_evidence`의 크래시 mtime 오탐(08-20·08-21 이틀 연속 4회씩, 합 8회)과 **같은 병**이다 —
    판정이 표식을 안 보고 숫자 하나만 본다.
  예측:
    - metric: crash.unexplained_deaths
      expect: |
        수기 판정(주장) — 사람이 일부러 내린 정지가 있는 날 이 값이 **0**이고, 그 정지는
        `crash.intentional_stops`에 따로 잡힌다. 08-21 실측: 지표가 12:18 수동 정지 1건을
        「사유 없이 끝난 기동」으로 셌다.
      역할: 주장
    - metric: crash.intentional_stops
      expect: ">= 0"
      역할: 참고
    - metric: crash.unexplained_deaths
      expect: |
        수기 판정(대가) — 표식 없이 사라진 죽음에는 **여전히 뜬다.** 08-19 10:32 형태
        (표식 없이 사라진 뒤 워치독이 3분 만에 되살림)를 `tests/test_ops_crash_metrics.py`가
        재현으로 고정한다 — 그 테스트가 통과하는 것이 이 대가의 실측이다.
      역할: 대가
  검정: |
    2026-08-24 **부분 반증으로 닫는다** — 주장 지표 `crash.unexplained_deaths`가 **1**이다.
    그날은 사람의 수동 정지가 없었으므로 주장 축(수동 정지가 있는 날 0이 되는가)은 판정 불가이지만,
    **같은 계산식이 장마감 자동 종료를 「사유 없이 끝난 기동」으로 센다는 것이 그날 실측으로 드러났다**(08-24 §3-3).
    원인은 코드가 아니라 **종료 배치의 순서**였다 — 「같은 병의 다른 얼굴」이므로 `inconclusive`로 조용히 넘기지 않는다.
    **후속 가설은 이미 등재돼 있다**: `2026-08-24-fix5-shutdown-marker-precedes-the-metric`(「종료 표식이 지표보다 먼저 찍히는가」).
    그리고 그 후속이 **08-25에 `confirmed`로 닫혔다** — 완료 줄 15:45:03.37이 지표 계산 15:45:15보다 12초 앞섰다.
    즉 이 항목은 반증으로 닫히고, 그 자리를 후속이 이어받아 확인됐다.
  상태: refuted


- id: "2026-08-21-fix5-monthly-legs-are-reserved-first"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    사이클 시작 시 먼슬리 **핵심 6레그(ATM±1 × Call/Put)** 를 레그 순서의 맨 앞으로 떼어 놓으면,
    예산 컷과 조기 포기가 그 여섯을 못 자른다 — 잘리는 쪽은 항상 먼슬리 바깥 행사가와 위클리다.
  대가: |
    위클리 두 북의 적재가 줄 수 있다. 위클리 만기일에는 그 시간대가 핀 리스크의 관측 창이므로
    만기일 판정은 이 값과 함께 읽어야 한다.
  근거: |
    08-21 §1-9 / §4 Fix#2 — **사흘째 이월된 fix이고 그날 결과가 확정됐다.**
    먼슬리 절대 커버리지 **90.1% → 76.1%**(▼14%p) · 먼슬리 레그 회복 128 → 114레그 ·
    「컷당한북 = `regular,weekly_thu`」 20건 + 「`regular,weekly_mon`」 11건 ·
    먼슬리 우선 재시도 92사이클 중 상당수가 0개 회복.

    **북 순서는 이미 먼슬리 우선이었다.** 그런데도 먼슬리가 잘린 이유는 북 **안**에 순서가
    없었기 때문이다 — `sorted(strikes)`는 행사가 오름차순이라 ATM이 10레그 중 5~6번째에 온다.
    컷이 4번째에서 걸리면 **먼 외가는 받아 놓고 ATM을 잃는다.** 예산을 「떼어 놓는다」는 것은
    이 순서를 바로잡는 것이다(순서가 앞이면 예산 배분은 자동으로 따라온다).
  예측:
    - metric: db.monthly_leg_completeness.below_flip_minimum_count
      expect: |
        수기 판정(주장) — 08-20·08-21 **이틀 연속 69분**(그 고정 자체가 08-21 §1-15의 이상점이다).
        핵심 6레그가 먼저 채워지면 이 값이 내려간다. 절대 건수라 그날 KIS 상태에 비례하므로
        수기로 읽는다(규약 F).
      역할: 주장
    - metric: timeout_abort.priority_cut_minutes
      expect: |
        수기 판정(주장) — 08-21 실측 **267분**(먼슬리가 잘린 분). 이 값이 0이 되지는 않는다 —
        핵심 6레그 뒤의 먼슬리 외가는 여전히 잘린다. 내려가는 방향이면 된다.
      역할: 주장
    - metric: db.book_coverage
      expect: |
        수기 판정(대가) — 위클리 두 북의 커버리지가 08-21 실측(weekly_mon **33.0%** ·
        weekly_thu **36.4%**)에서 **20% 넘게 줄지 않는다.**
      역할: 대가
  주의: |
    ⚠ **핵심 6레그의 기준은 `subscription_manager.current_atm`이다** — `desired_strikes`의
    정렬 중앙이 아니다. 상장 안 된 행사가가 섞이면 중앙이 어긋나고, 그 어긋남이 이 fix를
    조용히 무력화한다(`RollingSubscriptionManager._current_atm` 주석이 같은 이유를 적어 뒀다).
    ⚠ **예산(50초) 자체는 안 늘린다.** 최악의 사이클 길이는 종전과 같다.
  검정: |
    2026-08-24 확정 — **그날 가장 크게 확인된 가설이다.**
    주장 ① `db.monthly_leg_completeness.below_flip_minimum_count` **69 → 0**(08-20·08-21 이틀 연속 69분이던 값).
    주장 ② `timeout_abort.priority_cut_minutes` **267분 → 0분**(예측 문구는 「0이 되지는 않는다, 내려가는 방향이면 된다」였는데 0까지 갔다).
    대가(규약 E) `db.book_coverage` — 위클리 두 북이 **줄지 않고 오히려 늘었다**: `weekly_mon` 33.0 → **48.4%**, `weekly_thu` 36.4 → **50.0%**
    (예측은 「20% 넘게 줄지 않는다」였다). 먼슬리는 **100.0%**.
    ⚠ 규약 F 확인 — `timeout_abort.count`가 328 → 8로 준 것은 그날 KIS 상태에 비례하므로 **이 판정의 근거로 쓰지 않았다.**
    위 세 지표는 전부 「무엇이 먼저 잘리는가」라는 **구조 축**이라 그날 상태에 안 비례한다.
  상태: confirmed


- id: "2026-08-21-fix6-expiry-burst-leaves-a-success-line"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    만기유동성 첫 바퀴(북 3개를 한 번씩 도는 08:31~08:35)가 끝나면 **성공 줄 한 줄**이 남는다 —
    「그 버스트가 돌았는가」를 로그로 물을 수 있게 된다.
  대가: |
    그 줄이 **기동 1회당 1건**을 넘지 않는다. 사이클마다 찍으면 하루 80줄이고, 그것은
    08-04 §2-2에서 고친 로그 폭증을 우리 손으로 재현하는 것이다.
  근거: |
    08-21 §1-8 / §3-3 — 만기유동성 폴러는 **실패했을 때만** 찍는다. 그날 26+22+16건이 전부
    실패 경고였고 **성공 줄은 0행**이었다. 그래서 장후 회차가 「08:30 버스트가 돌았는가」에
    답하려고 **HTTP 호출 축으로 우회**해야 했다(`inquire-asking-price` 콜 수를 세어 역산).
    같은 사실이 로그에 한 줄이면 그 우회가 없어진다.
  예측:
    - metric: qualitative.expiry_burst_done
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.expiry_burst_done
      expect: "<= 3"
      역할: 대가
  주의: |
    ⚠ **「버스트」는 사이클이 아니라 첫 바퀴다.** `_expiry_liquidity_books_due`는 300초 주기로
    슬롯(minute % 10 ∈ {1,3,5})에 맞는 북 하나씩만 돌려주므로, 사이클마다 줄을 남기면 하루
    80줄이 된다. 세 북이 **각자 한 번씩** 돌면 그때 한 줄이다.
    ⚠ 상한 3은 「하루 기동 3회」를 여유로 잡은 값이다 — 재기동이 있는 날 그 바퀴가 다시 돈다.
    08-21은 기동 2회였다.
  검정: |
    2026-08-24 확정 — 주장 `qualitative.expiry_burst_done` = **1**(`>= 0` 충족, 실제로 1건 남았다) · 대가 `<= 3` 충족.
    앵커 표의 08:30 창 관측 11분과 함께 「그 버스트가 돌았는가」가 로그로 답해졌다.
  상태: confirmed


- id: "2026-08-21-fix7-member-exit-is-an-event"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    판단 축이 빠지거나 돌아온 분에 **사건 줄**이 남는다 — 두 줄을 겹쳐 보지 않아도
    「언제 무엇이 빠졌나」를 로그 한 줄로 읽을 수 있다.
  대가: |
    그 줄이 하루 **20건**을 넘지 않아야 한다. 매분 찍으면 08-15 `ALERT_ONLY` 94줄의 재현이다.
  근거: |
    08-21 §1-10 — `options_flow` 이탈 **6회**(10:47 · 12:04 · 13:05 · 13:34 · 13:49 · 15:09) /
    복귀 5회. **어제 2회 → 오늘 6회**인데 여섯 번 다 사람이 로그를 겹쳐 세어 찾았다.
    지금 줄은 매분 `가용멤버 [...](4/6, 비영 3)`를 찍고, **축이 빠진 것은 직전 줄과 비교해야만**
    보인다. 값은 이미 그 줄 안에 있다 — 없는 것은 **차이를 말하는 문장**이다.
  예측:
    - metric: qualitative.member_axis_exit
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.member_axis_exit
      expect: "<= 20"
      역할: 대가
  주의: |
    ⚠ **전이 줄(`판단 형태 전이`)을 없애지 않는다.** 그 줄은 「지금 형태가 무엇인가」를 말하고,
    새 줄은 「무엇이 바뀌었나」를 말한다. 08-19 Fix#6이 전자에 비영 수를 실은 것과 같은 계열이다.
    ⚠ 08-21 실측 기준 이탈 6 + 복귀 5 = **11줄**이면 충분하다.
  검정: |
    2026-08-24 확정 — 주장 `qualitative.member_axis_exit` = **2** · 복귀 3건. 대가 `<= 20` 충족(2건).
    실물 두 줄이 설계가 요구한 정보를 전부 담았다:
    `15:24:09 판단 축 이탈: options_flow (가용 4→3, 비영 3→2) · 직전 편입 09:01:00 · 383분 유지`
    `15:36:09 판단 축 이탈: orderflow_ofi_vpin (가용 3→2, 비영 2→1) · 직전 편입 08:46:00 · 410분 유지`
    「두 줄을 겹쳐 보지 않아도 언제 무엇이 빠졌는지 한 줄로 읽는다」가 성립한다.
    ⚠ **08-25가 이 축의 한계를 하나 드러냈다**: 이 로그는 **전이만** 찍으므로 「비영이 2 이하였던 분」의 개수를 세지 못한다.
    08-25 정규장 실측은 로그 전이 **13분** vs DB **28분**이다(08-25 사용자 조치 5 실측).
    그것은 이 fix의 반증이 아니라 **다른 축(분 단위 계수)의 부재**다 — 섞어서 읽지 않는다.
  상태: confirmed


- id: "2026-08-21-fix8-degraded-episode-gets-a-closing-line"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    DEGRADED가 OK로 돌아가는 분에 **종료 줄**이 남는다 — 사건의 시작과 끝이 로그에 있다.
  대가: |
    워치독 자신이 느려지지 않는다(`watchdog.checks`가 63에서 줄지 않는다).
  근거: |
    08-21 §1-11 / §4 Fix#4 — 그날 DEGRADED 세 구간(13:39~14:02 · 14:44 · 15:14)이 **전부**
    종료 줄 없이 「정상」에 덮여 사라졌다. 사후에 사건 수를 세려면 비-OK 16행을 손으로 묶어야 한다.
    24분 동안 워치독이 「수집이 멈췄다」를 14번 외쳤고, 아무도 듣지 않았고, **조용히 닫혔다.**

    ⛔ **Slack을 제안하지 않는다** — `NEXT_TODO.md`에 2026-08-01 보류 확정으로 등재돼 있다.
    필요한 것은 알림 채널이 아니라 **로그에 남는 종료 줄**이다.
  예측:
    - metric: watchdog.recovered_episodes
      expect: ">= 0"
      역할: 주장
    - metric: watchdog.checks
      expect: |
        수기 판정(대가) — 08-21 실측 **63**. 종료 줄 하나가 느니 이 값은 안 움직여야 한다.
        줄면 감시자 자신이 느려진 것이고, 그때는 08-12의 실패를 재현한 것이다.
      역할: 대가
  주의: |
    ⚠ 워치독은 **1분마다 새 프로세스**로 뜬다(작업 스케줄러). 직전 판정을 기억하려면 상태 파일이
    필요한데, `liveness.next_state()`는 매번 새 dict를 만들어 세 키만 남긴다 — 거기 얹은 값은
    조용히 사라진다(`_MISSING_CHECK_STATE`가 별도 파일인 것과 같은 이유). **별도 파일에 적는다.**
  검정: |
    2026-08-24 판정 불가 — 주장 `watchdog.recovered_episodes` = **0**. 그런데 그날은 **DEGRADED 자체가 0건**이라 닫을 사건이 없었다 —
    경로가 안 돌았다(규약 C). 대가 `watchdog.checks` 63 → 49는 **위반이 아니다**(08-24 §3-1: 창이 같고 무판정 최대 10.0분 = 주기와 동일).
    **적재가 실제로 멈췄다 회복되는 날에 판정한다.**
    ⚠ **대가 지표 교체 제안이 열려 있다**(08-24 §3-5 · 08-25 제4부 P2-5): 건수 축 `watchdog.checks` → 비율 축 `watchdog.silence_over_cadence_ratio`.
    08-25 실측 **1.0**(`max_silence_minutes` 10.0 · `checks` 49)로 비율 축이 건수 축보다 읽기 쉽다는 것이 다시 확인됐다.
    **그 교체는 08-25 「사용자 조치」의 범위 밖이라 이 회차에서 하지 않았다** — 별건으로 남긴다.
  상태: inconclusive


- id: "2026-08-21-fix9-warmup-end-is-logged"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    레짐이 `warmup_fallback`에서 `predict`로 넘어가는 **그 분에** 로그 한 줄이 남는다 —
    「다시 켜면 몇 분을 잃는가」를 **장중에** 볼 수 있다.
  대가: |
    그 줄이 **기동 1회당 1건**을 넘지 않는다.
  근거: |
    08-21 §1-12 — `레짐 전이` 줄은 **상태가 바뀔 때만** 찍힌다. warmup이 끝나도 레짐이 같으면
    줄이 없다. 그래서 그날 12:19 재기동의 warmup 종료 시각을 **로그로는 상한 74분까지만** 좁혔고,
    정답 **29분**은 15:46 지표(`db.regime.warmup_restart_minutes`)에서야 나왔다.

    「재기동 1회 = 레짐 warmup 29분」은 **장중 재기동 결정의 유일한 손익 재료**인데, 정작 그
    판단이 필요한 시각(12:19)에는 그 값을 볼 수 없다. 08-19와 08-21 두 날 모두 29분이었다.
  예측:
    - metric: qualitative.regime_warmup_end
      expect: ">= 0"
      역할: 주장
    - metric: qualitative.regime_warmup_end
      expect: "<= 5"
      역할: 대가
  주의: |
    ⚠ 이 줄은 **로그 축**이고, 정본은 여전히 DB(`db.regime.warmup_restart_minutes`)다.
    두 축이 갈리면 DB가 맞다 — 08-21이 그 판정을 이미 냈다(§1-12).
    ⚠ 상한 5는 하루 재기동 상한을 여유로 잡은 값이다.
  검정: |
    2026-08-24 확정 — 주장 `qualitative.regime_warmup_end` = **1** · 대가 `<= 5` 충족(1건).
    실물: `09:15:00 레짐 warmup 종료: 기동 2026-08-24 07:30:37 이후 103분 · 예측창 30봉 · 임계 30봉 · 모델=predict`.
    「다시 켜면 몇 분을 잃는가」를 **장중에** 볼 수 있다가 성립했고, 08-24 두 회차가 재시동 손익을 계산할 때 실제로 이 값을 썼다.
    **08-25에도 같은 값이 실제 판단 재료로 쓰였다** — 12:30 회차가 「재기동 1회의 대가 = 레짐 warmup 103분」을 근거로
    P1-3 착수를 장후로 미뤘다. 로그 한 줄이 그날의 의사결정을 실제로 바꿨다는 뜻이다.
  상태: confirmed

- id: "2026-08-23-wiring1-ledger-runs-silent-until-a-position-exists"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    포지션 원장 대사가 **매 잔고 조회마다 돌고, 포지션이 0인 동안 아무 줄도 안 남긴다.**
    즉 ②~⑤가 붙기 전에 이 경로를 켜 두는 대가가 **0**이다.
  대가: |
    KIS 호출이 **한 건도 늘지 않는다** — 대사는 같은 사이클의 `get_balance()` 응답을 다시 쓴다.
    로그 줄도 0이다(개시·종료·수량변경·고아 중 아무것도 없으므로).
  근거: |
    실행 배선 ①. `execution/*` 전체를 막고 있던 선행 조건이 「포지션 생애주기 추적 부재」였다
    (2026-08-06 `docs/동작흐름과상태` §2). 주문이 아직 안 나가므로 08-24에는 포지션이 0일
    것이고, 그렇다면 이 경로는 **조용해야 한다.**

    조용하지 않다면 둘 중 하나다: (a) 사람이 HTS로 낸 포지션이 있다 — 그러면 `고아` 경고가
    뜨고 그것이 이 fix의 첫 실측이다. (b) 우리 코드가 없는 포지션을 만들어 냈다 — 그것은
    회귀이고 즉시 잡아야 한다. **어느 쪽인지는 로그 문구가 가른다.**
  예측:
    - metric: qualitative.position_opened
      expect: "== 0"
      역할: 주장
    - metric: qualitative.position_closed
      expect: "== 0"
      역할: 주장
    - metric: db.ledger.open_now
      expect: "== 0"
      역할: 대가
  주의: |
    ⚠ **이 예측이 틀리기를 바라는 날이 온다.** ③이 배선되면 같은 지표가 0이 아니어야 하고,
    그때 이 가설은 `superseded`로 닫고 「주문이 나간 날 원장이 그것을 잡는가」로 다시 적는다.
    ⚠ 사람이 08-24에 HTS로 직접 거래하면 (a)로 깨진다 — 그것은 실패가 아니라 실측이다.
  검정: |
    2026-08-24 판정 불가 — 주장 `qualitative.position_opened` **0** · `position_closed` **0** · 대가 `db.ledger.open_now` **0**. 전부 예측대로다.
    **그러나 그날 포지션이 0이었다**(자동 지표 §16-2 「그날 원장 사건이 없다」). 가설 본문 주의가 「지킬 것이 없었던 날을 「지켰다」로 세지 않는다」를 요구한다.
    ⚠ **한 가지는 실증됐다**: 원장 대사가 매 잔고 조회마다 돌면서 **로그를 한 줄도 안 남겼다**(당일 원장 관련 줄 0).
    즉 「켜 두는 대가가 0」은 확인됐다 — **주장의 절반은 성립하고, 나머지 절반은 포지션이 생기는 날에 판정한다.**
    08-25도 주문 0건·포지션 0건이라 같은 자리에 머문다.
  상태: inconclusive

- id: "2026-08-23-wiring1-restart-keeps-the-entry-time"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    프로세스를 재기동해도 **열려 있던 포지션의 진입 시각이 유지된다** — 원장이 DB에 있고
    `load_open_entries()`가 그것을 되살리기 때문이다.
  대가: |
    원장이 **행을 흘리지 않는다** — 열린 행 수가 동일방향 한도(3) × 양방향 = **6을 넘지 않는다.**

    이것이 DB 원장의 진짜 위험이다: 대사가 틀리면 닫혀야 할 행이 안 닫히고, 그 행은
    **영원히 열린 채로 남는다**(메모리 원장은 재기동이 청소해 주지만 DB는 안 그렇다).
    한도를 넘는 열린 행은 곧 「원장이 새고 있다」이고, 그 상태로 ④가 배선되면 존재하지 않는
    포지션에 대해 청산 주문을 낸다.
  근거: |
    이것이 원장을 프로세스 메모리가 아니라 DB에 둔 유일한 이유다. 08-21에 장중 재기동이
    실제로 있었고(12:18 정지 → 12:19 기동), 원장이 메모리였다면 그 순간 열려 있던 모든
    포지션의 진입 시각이 사라져 **타임스톱이 통째로 리셋**됐을 것이다. 그것도 조용히.

    같은 재기동이 레짐 warmup 29분을 실제로 지웠다는 실측이 있다(08-19·08-21 §1-12) —
    재기동은 이 시스템에서 드문 사건이 아니다.
  예측:
    - metric: db.ledger.unknown_entry_time
      expect: "== 0"
      역할: 주장
    - metric: db.ledger.open_now
      expect: "<= 6"
      역할: 대가
  주의: |
    ⚠ 08-24에 포지션이 0이면 이 가설은 **`inconclusive`로 닫는다** — 지킬 것이 없었던 날을
    「지켰다」로 세면 안 된다(규약 C). 검증은 첫 포지션이 생긴 날로 이월한다.
    ⚠ 이 예측은 **재기동 전에 열린 포지션이 있었을 때만** 의미가 있다.
  검정: |
    2026-08-24 판정 불가 — 주장 `db.ledger.unknown_entry_time` **0** · 대가 `open_now` **0**.
    그날 **재기동 0회 · 포지션 0건**이라 「다시 켜도 진입 시각이 유지되는가」를 시험할 재료가 아예 없었다.
    가설 본문이 **「08-24에 포지션이 0이면 `inconclusive`로 닫는다」를 미리 적어 두었다** — 그 조건이 그대로 성립했다.
    08-25도 재기동 0회 · 포지션 0건이다.
  상태: inconclusive

- id: "2026-08-23-wiring2-notice-stream-says-why-it-is-silent"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    체결통보 스트림이 **왜 조용한지를 로그가 말한다.** `KIS_HTS_ID`가 비어 있는 동안에는
    「구독하지 않는다」 경고가 **기동당 정확히 한 번** 나오고, 그 뒤로는 조용하다.
  대가: |
    그 경고가 **하루 5건을 넘지 않는다**(기동 1회당 1건 + 재기동 여유).

    이것이 이 fix의 진짜 위험이다: 미설정 상태에서 재연결 루프가 돌면 같은 경고를 매초
    찍는다. 08-15 `ALERT_ONLY` 94줄과 08-21 DEGRADED 14줄이 같은 형태였고, 그 줄들이
    정작 봐야 할 사건을 덮었다. 그래서 미설정은 **재연결 루프에 들어가기 전에** 끝낸다.
  근거: |
    실행 배선 ②. `mahdi/broker/order_notice.py`는 08-16에 만들어졌지만 **호출부가 0건**이었다 —
    즉 저장소는 자기 주문이 체결됐다는 사실을 실시간으로 알 방법이 없었다. 이 증분이 그
    연결(시세와 별개의 두 번째 WS)을 붙인다.

    다만 `KIS_HTS_ID`가 `.env`에 없다. 그 값은 사람이 넣어야 하고, 08-24에는 비어 있을
    것이다. 그러면 **통보 0건**인데 그 0이 「체결이 없었다」인지 「안 붙었다」인지 DB만
    봐서는 못 가린다(둘 다 0행이다). 08-03에 H0UNMKO0 수신 0건을 두고 같은 질문에 답 못
    했던 것이 `SubscriptionAck`을 만든 이유다 — 같은 실수를 반복하지 않는다.
  예측:
    - metric: qualitative.order_notice_not_configured
      expect: ">= 1"
      역할: 주장
    - metric: qualitative.order_notice_not_configured
      expect: "<= 5"
      역할: 대가
    - metric: db.order_notices.notices
      expect: "== 0"
      역할: 참고
  주의: |
    ⚠ **`KIS_HTS_ID`를 채우면 이 예측이 뒤집힌다** — 그때는 `not_configured`가 0이고
    `order_notice_subscribed`가 1 이상이어야 한다. 이 가설은 `superseded`로 닫고
    「구독이 성립하는가」로 다시 적는다.
    ⚠ 첫 통보가 오는 날 봐야 할 것은 `db.order_notices.field_count_distribution`이다 —
    22가 아니면 `_NOTICE_FIELDS`가 틀린 것이고, 그 상태에서 파싱 컬럼을 믿으면 체결수량
    자리에서 체결단가를 읽는다. 그때는 `plaintext`로 복원한다.
  검정: |
    2026-08-24 확정 — 주장 `qualitative.order_notice_not_configured` = **1**(`>= 1`) · 대가 **1** <= 5 · 참고 `db.order_notices.notices` = **0**.
    실물 `07:30:38 체결통보를 구독하지 않는다 — KIS_HTS_ID가 비어 있다…`가 **기동당 정확히 한 번**, 8시간 15분 동안 반복 0건.
    08-03에 「수신 0건」이 「체결이 없었다」인지 「안 붙었다」인지 못 갈랐던 문제를 이 한 줄이 없앴다.
    **08-25 재확인** — 경고는 07:30:53 **1건뿐**이고 그 뒤 재발 0건. 「기동당 정확히 한 번」이 이틀 연속 성립했다.
    ⚠ **사람이 `.env`에 `KIS_HTS_ID`를 채우는 날 이 가설은 `superseded`로 닫고 「구독이 성립하는가」로 다시 적는다.**
    가설 본문이 그 절차를 이미 적어 두었다. **2026-08-25 현재 `.env`에 그 키가 아직 없다**(이틀 연속 미이행) —
    그날이 오기 전까지 이 항목은 `confirmed`로 둔다.

    ===== 2026-08-26 07:4x — **그날이 왔다. `superseded`로 닫는다** =====
    사람이 `.env`에 `KIS_HTS_ID`를 채웠다(08-26 장전, 사용자 조치 2 — 사흘째 만의 이행).
    판정 자체는 위 그대로 유효하다(미설정 상태의 주장은 이틀 확인됐다). 후속은
    `2026-08-26-wiring2-v2-notice-subscription-holds` — 본문 절차 그대로 「구독이 성립하는가」다.
  상태: superseded

- id: "2026-08-23-wiring3-code-is-wired-but-config-still-blocks"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    주문 제출 경로가 코드로는 배선됐는데 **주문은 한 건도 안 나간다.** 막는 것은 코드가 아니라
    **사람이 고쳐야 할 설정 둘**이고, 그 사실이 사유별로 기록에 남는다.

    ENTER가 나온 분마다 `signal_decisions.risk_gate_state.execution_engine.
    submission_blockers`에 `mode_not_auto_submit`과 `reentry_cooldown_not_configured`가
    **둘 다** 들어 있다.
  대가: |
    그날 나간 주문이 **0건**이다(`db.orders.submitted == 0`).

    이것이 이 증분의 유일한 위험이다. `_ORDER_PATH_WIRED`를 True로 바꾸면서
    `effective_mode()`의 ADVISORY 클램프가 풀렸다 — 08-17부터 그 클램프가 «설정을 올려도
    주문은 안 나간다»를 보장하고 있었고, 이제 그 보장이 `submission_blockers()`로 옮겨 갔다.
    **보장이 옮겨 가는 순간이 가장 위험한 순간이다.** 0이 아니면 그 이전이 되고, 그날은
    설정을 안 고쳤는데 주문이 나간 날이다.
  근거: |
    실행 배선 ③. 08-17에 `_ORDER_PATH_WIRED` 주석이 *"호출부를 이 파일에 실제로 넣는 것이 그
    작업이고, **그때 이 상수도 함께 바꾼다**"*라고 적었고, 08-23에 그 호출부가 생겼다.

    그런데 `strategy_params.yaml`의 `reentry_cooldown_minutes` 주석은 *"**실주문 배선 전에**
    켠다"*고 지시했고 그 값은 아직 0이다. 쿨다운을 대신 켜지 않는 이유는 그것이 판단 출력을
    움직이는 결정이고 08-23에 켠 레버 F와 같은 날이면 귀속이 안 갈리기 때문이다(레버 E를
    09-01로 미룬 것과 같은 이유). 대신 **코드가 막는다** — 주석은 실행되지 않지만 전제는
    실행된다.

    08-11 실측이 그 전제의 근거다: ENTER 281건/494분(56.9%), 09:03~09:19 **16분 연속.**
    ADVISORY라 무해했지만 실주문이었다면 16분 연속 진입이고, 레버 F는 그 빈도를 올린다.
  예측:
    - metric: db.orders.submitted
      expect: "== 0"
      역할: 주장
    - metric: db.orders.rejected
      expect: "== 0"
      역할: 대가
  주의: |
    ⚠ **이 예측이 참인 것이 목표가 아니다.** 이것은 「배선이 안전하게 들어갔다」의 확인이고,
    설정 둘을 고치는 날 이 가설은 `superseded`로 닫고 「주문이 나가고 체결이 잡히는가」로
    다시 적는다.
    ⚠ ENTER가 하루 종일 0건이면 `submission_blockers`도 안 남는다 — 그날은 이 가설이
    `inconclusive`다(막을 것이 없었던 날을 「막았다」로 세면 안 된다, 규약 C).
  검정: |
    2026-08-24 확정 — 주장 `db.orders.submitted` = **0** · 대가 `db.orders.rejected` = **0**.
    가설 본문의 `inconclusive` 조건은 「ENTER가 하루 종일 0건이면」인데 그날 ENTER는 **336건**이었고
    `submission_blockers`도 **23분에 걸쳐 실제로 남았다** — **조건에 걸리지 않는다.**
    사유도 예측 그대로 둘 다 들어 있다(`mode_not_auto_submit` · `reentry_cooldown_not_configured`).
    ⚠ **예상 못 한 세 번째 사유 `no_entry_plan`이 함께 있고**, 그것은 `_ENTRY_PLAN_BLOCKED_NO_PRICE`(가격 미수집)로
    **모드를 올려도 안 풀리는 제약**이다(`mahdi/main.py` `_ENTRY_PLAN_BLOCKED_NO_PRICE` 주석). 이 사실을 확정 문구에 남긴다.
    **08-25가 그 표본을 4건에서 34건으로 늘렸다**(§1-6) — 그래서 08-25 사용자 조치 14의 「오늘 할 수 있는 것」이
    그 사유를 로그에 싣는 일(제4부 P1-4)이 됐고, 그 fix는 `2026-08-25-fix-entry-plan-block-reason-is-logged`로 등재됐다.
  상태: confirmed

- id: "2026-08-23-wiring45-defence-runs-even-in-advisory"
  구현일: 2026-08-23
  검증예정일: 2026-08-24
  가설: |
    청산 루프가 **매 분 돌고, 열린 포지션이 0인 동안 아무 줄도 안 남긴다.** 그리고 15:10을
    지나면 청산할 것이 없어도 자기검증 줄을 **하루 한 번** 남긴다 — 「청산할 게 없었다」와
    「루프가 안 돌았다」를 가르는 유일한 증거다.
  대가: |
    청산 판정 줄이 **하루 0건**이다(열린 포지션이 없으므로).

    이것이 이 증분의 위험 지점이다: 포지션이 0인데 청산 판정이 나오면 원장이 유령 행을
    들고 있다는 뜻이고, 그 상태로 방어 레이어가 돌면 **존재하지 않는 포지션에 대해 시장가
    주문**을 낸다. 진입은 설정이 막지만 **방어는 설정이 안 막는다**(v6 §13.1) — 즉 이
    경로는 ADVISORY에서도 실제로 주문을 낼 수 있다.
  근거: |
    실행 배선 ④·⑤. `evaluate_exit_stack()`·`forced_flat`은 07-21부터 구현돼 있었고
    **프로덕션 호출부가 0건**이었다 — 즉 시스템은 포지션을 열 줄만 알고 닫을 줄 몰랐다.

    오늘 실제로 도는 레이어는 셋이다(1 하드스톱·5 타임스톱·6 강제청산). 나머지 셋은 재료가
    없어 **평가하지 않는다**: 레이어 4는 EV 입력(`trade_history` 0행), 레이어 2는 보유 옵션
    단위 VWAP/POC, 레이어 3은 기초자산 플로우를 옵션 방향으로 옮기는 규칙이 스펙에 없다.
    지어내지 않고 끄는 쪽을 골랐다 — 중립값으로 채우면 EV가 0이 되고 그것이 악화 1건으로
    세어져 **지어낸 숫자가 부분청산 주문이 된다.**
  예측:
    - metric: qualitative.forced_flat_verified
      expect: ">= 1"
      역할: 주장
    - metric: qualitative.exit_triggered
      expect: "== 0"
      역할: 대가
    - metric: qualitative.exit_price_missing
      expect: "== 0"
      역할: 참고
  주의: |
    ⚠ **`exit_price_missing`이 0이 아닌 날은 하드스톱이 그만큼 안 걸린 날이다.** 그때
    「하드스톱 0건」을 「손실이 없었다」로 읽으면 안 된다 — 「평가하지 못했다」다(규약 C).
    ⚠ 주장 지표가 「하루 1건 이상」인 이유: 15:10 자기검증은 포지션이 0이어도 남는다.
    0이면 루프가 그 시각에 안 돌았다는 뜻이고 그것이 곧 회귀다.
    ⚠ 08-24에 포지션이 생기면 대가 지표가 0이 아닐 수 있다 — 그때는 실패가 아니라 실측이고,
    `superseded`로 닫고 「청산이 실제로 체결되는가」로 다시 적는다.
  검정: |
    2026-08-24 확정 — 주장 `qualitative.forced_flat_verified` = **1**(`>= 1`) · 대가 `qualitative.exit_triggered` = **0**(`== 0`) ·
    참고 `exit_price_missing` = **0**.
    실물 `15:10:24 15:10 강제청산 자기검증: 대상 0건 · 미확인 0건 — 청산할 포지션이 없었다`, **하루 정확히 한 번**.
    가설 본문이 「주장 지표가 「하루 1건 이상」인 이유: 15:10 자기검증은 **포지션이 0이어도 남는다**」고 미리 적어 뒀으므로
    **포지션 0이 이 가설의 `inconclusive` 사유가 되지 않는다.**
    그리고 이것이 그날 가장 중요한 확인이다 — **방어 경로가 처음 실운영에 붙은 날, 그 경로가 돌았고 유령 포지션에 주문을 내지 않았다.**
  상태: confirmed

- id: "2026-08-24-fix5-shutdown-marker-precedes-the-metric"
  구현일: 2026-08-24
  검증예정일: 2026-08-25
  가설: |
    종료 배치가 「장마감 자동 종료 완료」 줄을 **taskkill 직후**에 찍으면, 그 뒤에 도는 지표가
    자기 근거로 삼을 줄을 이미 읽을 수 있다 — 08-24의 「사유 없이 끝난 기동 1건」이 사라진다.
  대가: |
    완료 줄이 앞으로 오면 **지표·증거 생성이 실패한 날에도 「완료」가 찍힌다.** 그래서 문구를
    `(프로세스 정지 · 후처리 진행)`으로 바꾸고, 표식을 **줄이는 것이 아니라 늘리는** 쪽으로
    `.last_marketclose_stop.txt`를 보조 표식으로 함께 읽는다.

    ⚠ 진짜 대가는 「표식 없이 사라진 기동」이 여전히 잡히는가이다 — 08-19 10:32이 그 형태였고
    `tests/test_ops_crash_metrics.py`가 그 하루를 재현으로 고정한다. 경보를 끄는 것이 아니라
    고치는 것이다(08-21 Fix#7 주석).
  근거: |
    08-24 실측 — `.intentional_stop`(15:45:00.93)도 `.last_marketclose_stop.txt`(15:45:03)도
    있었고 완료 줄도 있었는데 **15:46:09.97**에 찍혔다. 지표는 15:45:14~15:46:06에 돌았다.
    즉 자기 근거가 찍히기 **3.9초 전**에 그것을 찾았다. `crash_metrics`의 계산은 맞았다 —
    틀린 것은 그 계산이 읽는 줄이 아직 없었다는 사실 하나다.
  예측:
    - metric: crash.clean_shutdowns
      expect: "== 1"
      역할: 주장
    - metric: crash.unexplained_deaths
      expect: "== 0"
      역할: 주장
    - metric: crash.starts
      expect: "== 1"
      역할: 대가
    - metric: crash.unattributed
      expect: "== 3"
      역할: 대가
  주의: |
    ⚠ **재기동이 있는 날에는 이 예측이 다르게 나온다** — `starts`가 2 이상인 날은
    `inconclusive`로 닫는다(규약 C). 표식을 옮겼다고 기동 수가 달라지면 안 되고,
    `unattributed` 3은 08-19 이전에 쌓인 날짜 미상 트레이스백이라 움직이면 그것이 회귀다.
  검정: |
    2026-08-25 확정 — **네 예측치가 전부 정확히 일치했다**: `clean_shutdowns=1` · `unexplained_deaths=0` · `starts=1` · `unattributed=3`.
    `clean_shutdown_source='로그줄'`. 완료 줄(**15:45:03.37**)이 지표 계산(**15:45:15**)보다 **12초 앞섰다** —
    이 fix가 고치려던 순서가 그대로 성립했다.
    **재기동 0회**라 가설 본문의 `inconclusive` 조건(`starts >= 2`)에 걸리지 않는다.
    규약 H 확인 — 이 fix는 레버가 아니라 **배치 스크립트**라 「꺼져 있었다」가 성립하지 않는다.
    이 확인으로 `2026-08-21-fix4-intentional-stop-is-not-an-unexplained-death`가 반증으로 닫히며 남긴 자리가 채워진다.
  상태: confirmed

- id: "2026-08-24-fix1-2-adv4-the-collector-stops-crying-wolf"
  구현일: 2026-08-24
  검증예정일: 2026-08-25
  가설: |
    증거 수집기의 헛경보 둘이 사라지고, **열려 있는 결정 목록**이 눈앞에 놓인다.
    ① §9의 「전일 지표 없음 ⚠」이 월요일마다 뜨지 않는다(직전 거래일을 찾는다).
    ② §8-1의 「미등재」 건수가 실제 부재 건수와 같아진다(개명을 따라간다).
    ③ §8-3이 「사람이 고르기로 하고 미뤄 둔 것」을 §8-2와 나란히 인쇄한다.
  근거: |
    08-24 실측 — §9가 08-23(토) 사이드카를 기대해 「없음 ⚠」을 냈고, §8-1이 개명된 가설
    13건을 「미등재」로 올렸다(적신호). 그리고 장중 두 회차가 「후보 0건」의 정체를 찾느라
    로그 대조를 네 번 하고 P1을 올렸는데, **그 답은 `NEXT_TODO.md`의 「⚠ 남은 결정 하나 —
    사람이 골라야 한다」에 (a)/(b)/(c) 체크박스와 함께 엿새째 열려 있었다**(§3-2).

    §8-2는 「다시 올리지 마라」를 말하고 §8-3은 「아직 안 정했다」를 말한다 — **둘은 반대
    방향의 실수를 막는다.** 08-19는 닫힌 것을 되살렸고, 08-24는 열린 것을 새것으로 착각했다.
    지금 수집기는 전자만 막는다.
  예측:
    - metric: delta_baseline.date
      expect: "수기 판정 — 다음 월요일(2026-08-31) 증거 §9가 직전 거래일 사이드카를 찾아 인쇄하고 「없음 ⚠」이 사라지는가"
      역할: 주장
  주의: |
    ⚠ **이 fix는 일별 지표로 검정되지 않는다** — 증거 수집기의 인쇄물은 사이드카에 안 실린다.
    `2026-08-19-fix10-evidence-collector-cannot-lock-the-repo`와 같은 형태이고, 같은 이유로
    **진짜 계약은 계약 테스트**다: `tests/test_evidence_collector_prev_sidecar.py`(금요일
    자료만 있는 월요일 · 5일 내내 없는 날)와 `tests/test_evidence_collector_pending_decisions.py`.
    위 `delta_baseline.date`는 「직전 거래일이 무엇이었나」를 자동 지표 쪽에서 함께 읽는
    **참고 축**이다 — 수집기와 리포트가 같은 날을 가리키는지 사람이 눈으로 대조한다.

    ⚠ **대가를 `대가:` 필드로 선언하지 않았다.** 재는 일별 경로가 없기 때문이고, 있는 척
    아무 경로나 붙이면 그것이 가짜 지표다(08-19 fix10의 주의와 같은 자리). 대가는 문장으로
    남긴다 — (a) §8-1이 인쇄하는 줄 수는 **줄지 않는다**(정보를 지워 조용해지는 것이 아님을
    보장한다) (b) §9는 최대 5일까지만 거슬러 오르고, 그 안에 없으면 **진짜 부재로 적신호를
    낸다** (c) 슬러그 일치는 「개명 후보」로만 인쇄하고 **판정하지 않는다** — 서로 다른 두
    가설이 같은 슬러그를 가지면 잘못 이어 붙일 수 있기 때문이다(완전일치 우선).

    ⚠ **§8-3은 판정을 하지 않는다** — §8-2와 같은 규약이다. 목록을 눈앞에 두는 것이 전부이고,
    08-24 사고는 그것으로 막혔을 것이다.
  검정: |
    2026-08-25 판정 불가 — **세 항이 서로 다른 이유로 못 닫힌다.**
    ① **예정일 미도래**: 「월요일마다 뜨던 헛경보가 사라지는가」는 **다음 월요일 2026-08-31**에만 검정된다.
       08-25는 화요일이라 직전 거래일이 진짜 어제이고, 이 경로는 안 탔다(`delta_baseline.date=2026-08-24`).
    ② **예측 문구가 구현 결정과 어긋난다**: 예측은 「미등재 건수가 **실제 부재 건수와 같아진다**」(= 7)인데
       실측은 **9**다(실제 부재 7 + 슬러그 개명 2). 그런데 **08-24 커밋 `7c9741a`가 「슬러그까지 바뀐 건은 억지로 잇지 않는다」를
       명시적으로 결정했다**(`NEXT_TODO.md` 「계획에서 바꾼 것 둘」). **즉 실측 9는 구현대로이고, 틀린 것은 예측 문구다.**
       소급해서 고치면 규약의 뿌리가 무너지므로 여기서 닫고, 문구를 고친
       **`2026-08-25-adv4-renamed-slugs-are-excluded-from-unregistered`**로 재등재했다.
    ③ **이미 통과**: §8-3이 델타 밴드 (a)/(b)/(c)를 실었다.
    ⚠ 이 fix의 진짜 계약은 여전히 계약 테스트다 —
    `tests/test_evidence_collector_prev_sidecar.py` · `tests/test_evidence_collector_pending_decisions.py`.
  상태: inconclusive

- id: "2026-08-24-fix6-backoff-and-balance-failure-share-one-line"
  구현일: 2026-08-24
  검증예정일: 2026-08-25
  가설: |
    잔고 폴링 실패 줄이 **그 순간의 상태 셋**(이번/직전 예외 유형 · 페이서 배율 · 마지막 성공
    폴 시각)을 함께 실으면, 「백오프 확대가 잔고 폴링을 떨어뜨렸는가」를 파일 두 개를 밀리초로
    맞춰 보지 않고 **한 줄에서** 읽는다. 그리고 증거 §5-1-1이 그 두 축을 같은 표에 낸다.
  대가: |
    **줄 수는 안 는다 — 내용만 는다.** 08-24 값으로 하루 2줄이고, 그 2줄이 길어질 뿐이다.
    `qualitative.balance_poll_failed`가 새로 세어지므로 그 값이 0인 날에도 키가 인쇄된다
    (「실패가 없던 하루」와 「그 줄이 없던 버전」을 가르기 위해서다 — 규약 C).
  근거: |
    08-24 12:34:32에 계좌 잔고 조회가 한 사이클 통째로 빠졌다(당일 첫 사례, 하루 2건).
    그 인과를 **하루에 세 번 뒤집었다**: 장중 ①이 「지연 상승이 떨어뜨린 첫 지점」, 장중 ②가
    「7번 중 1번짜리 우연」, 장후가 「확대→실패는 2/21이지만 실패→확대는 2/2」.
    **세 번 다 서로 다른 파일의 줄을 밀리초로 맞춰 보고 내린 결론이다.**

    값은 셋 다 이미 메모리에 있었다(`rate_limit_backoff_multiplier` · 예외 유형 ·
    `previous_balance_poll_at`). 없던 것은 그것을 한 줄에 적는 문장이다.
  예측:
    - metric: qualitative.balance_poll_failed
      expect: "수기 판정 — 그 줄 전부에 백오프 배율이 실려 있고, 같은 초의 `레이트리밋 백오프 확대` 기록과 어긋나지 않는가"
      역할: 주장
    - metric: log_volume.by_level.WARNING
      expect: "수기 판정 — 08-24 실측 323줄 대비 증가분이 0줄인가(줄 수는 안 늘고 내용만 는다)"
      역할: 대가
  주의: |
    ⚠ **잔고 폴링 실패가 0건인 날에는 판정 불가** — `inconclusive`로 닫는다(규약 C).
    막을 것이 없었던 날을 「막았다」로 세면 안 된다.

    ⚠ **「킬스위치 조건평가=건너뜀」이라고 적지 않았다.** 계획 초안의 그 문구는 틀린 문장이다 —
    `_build_account_state_for_candidate`는 DB의 **가장 최근** 스냅샷을 읽으므로 이번 사이클이
    빠져도 킬스위치는 직전 스냅샷으로 계속 평가된다. 대신 **마지막 성공 폴 시각**을 싣는다:
    킬스위치가 지금 무엇을 보고 있는지가 그 값이다. 안 일어난 일을 매번 인쇄하는 것이
    08-21에 고친 병(표식을 안 보고 추정하는 판정)의 문장판이다.
  검정: |
    2026-08-25 **주장은 확정, 대가 지표는 오염돼 별도 항목으로 교체 재등재했다.**
    주장 성립 — `qualitative.balance_poll_failed` = **1**(`14:19:30`)이고 그 한 줄에 네 칸이 다 있다:
    `유형=HTTPStatusError · 직전 실패 유형=없음 · 백오프 1.50배 · 마지막 성공 폴=14:14:00`.
    같은 시각대의 백오프 확대 기록과 어긋나지 않는다.
    ⚠ **대가 지표는 검정하지 못했다**: 예측은 `log_volume.by_level.WARNING` 「증가분 0줄」인데 실측은 **+8줄**이다.
    그러나 그 +8 중 2줄은 **같은 커밋의 `fix4`가 INFO→WARNING으로 승격시킨 「되살리기 실패」**이고, 나머지는 그날 KIS 상태에 비례한다(**규약 F**).
    **`log_volume.by_level.WARNING`은 두 fix가 공유하는 축이라 어느 쪽도 검정하지 못한다**(규약 E·F).
    → 대가 축을 그 줄 자체의 수로 좁힌 **`2026-08-25-fix6-balance-line-cost-is-its-own-line-count`**로 재등재했다.
    이 항목은 **주장 축에 대해서만** `confirmed`다.
  상태: confirmed

- id: "2026-08-24-fix4-a-failed-revival-is-not-a-tight-budget"
  구현일: 2026-08-24
  검증예정일: 2026-08-25
  가설: |
    먼슬리 레그 되살리기가 **실패한 사이클**(회복 < 대상)은 WARNING으로 올라오고, 성공했지만
    남은 예산이 3.0초 미만인 사이클은 INFO를 유지하되 문구가 다르다. 두 사건이 갈라지면
    「선할당이 바닥났다」가 「먼슬리가 비었다」를 덮지 않는다.
  대가: |
    WARNING 증가분은 **하루 10줄 이하**다(08-24 값 환산 1줄 — 15:10:50). 08-15~16의
    `ALERT_ONLY` 94·113줄 같은 폭주가 아니다. 오늘 WARNING 323줄 대비 0.3%.
  근거: |
    08-24 실측 — 재시도가 오후에 3배 잦아졌고(하루 48회) 남은 예산이 **0.0초**까지 내려갔다.
    그리고 15:10:50에 「3개 중 **0개** 회복」이 났다 — 되살리기가 실제로 실패한 첫 사례다.
    전부 INFO였고 회복률(하루 96.1%)은 그 1건을 평균 안에 접어 없앴다. 사람이 하루치 로그를
    훑어서 찾았다.

    ⚠ **파서를 먼저 넓혔다**: `log_metrics._PRIORITY_RETRY_RE`가 `INFO|WARNING`을 함께 받는다.
    08-04에 레벨 강등으로 정규식이 눈이 멀어 362건이 0건으로 보고된 그 순서를 뒤집지 않는다.
  예측:
    - metric: priority_retry.failed_cycles
      expect: "수기 판정 — WARNING으로 올라온 「되살리기 실패」 줄 수와 정확히 일치하는가"
      역할: 주장
    - metric: log_volume.by_level.WARNING
      expect: "수기 판정 — 08-24 실측 323줄 대비 증가분이 10줄 이하인가"
      역할: 대가
    - metric: priority_retry.recovery_pct
      expect: "0 ~ 100"
      역할: 참고
  주의: |
    ⚠ **재시도가 5건 미만인 날은 `inconclusive`**(규약 C) — 사건이 거의 없던 날의 0은
    문턱이 동작했다는 증거가 아니다.
    ⚠ `failed_cycles`는 **그날 KIS 상태에 비례하는 건수**다(규약 F) — 이 값의 절대 크기로
    fix를 판정하지 않는다. 판정하는 것은 「그 사건이 WARNING으로 보이는가」 하나다.
  검정: |
    2026-08-25 확정 — 주장 `priority_retry.failed_cycles` = **2**(`failed_minutes=['13:41','15:15']`)이고
    WARNING 「되살리기 실패」 줄이 **정확히 2건**이다. 주장 지표와 로그 줄 수가 일치한다.
    문구도 설계대로 갈렸다 — 성공은 INFO에 「선할당이 바닥났다」/「판단 주입력의 두께다」,
    실패는 WARNING에 「되살리기 실패(판단 주입력이 이번 분에 얇아졌다)」.
    `inconclusive` 조건(재시도 5건 미만)은 **55사이클**이라 해당 없음(96레그 중 94 회복, 97.9%).
    **대가 충족**: WARNING 총 **331줄**, 08-24 실측 323줄 대비 **+8줄 <= 10줄** ✅.
  상태: confirmed
- id: "2026-08-25-adv4-renamed-slugs-are-excluded-from-unregistered"
  구현일: 2026-08-24
  검증예정일: 2026-08-26
  가설: |
    증거 §8-1의 「미등재」는 **개명 후보로 따로 인쇄되는 건을 뺀 수**이고, 그 수가 실제 부재 건수와 같아진다.
  근거: |
    **이것은 새 fix가 아니라 문구의 정정이다.** 원 가설 `2026-08-24-fix1-2-adv4-the-collector-stops-crying-wolf` ②항은
    「미등재 건수가 **실제 부재 건수와 같아진다**」(= 7)라고 예측했는데 08-25 실측은 **9**였다(실제 부재 7 + 슬러그 개명 2).

    그런데 **08-24 커밋 `7c9741a`가 「슬러그까지 바뀐 건은 억지로 잇지 않는다」를 명시적으로 결정했다**
    (`NEXT_TODO.md` 「계획에서 바꾼 것 둘」). 즉 **실측 9는 구현대로이고, 틀린 것은 예측 문구다.**

    ⚠ **원 항목의 예측을 소급해서 고치지 않았다** — 그러면 규약의 뿌리(예측을 숫자 보기 전에 적는다)가 무너진다.
    원 항목은 `inconclusive`로 닫고 여기서 문구를 바로잡아 다시 연다. 08-19 §8-2가 막으려던 「닫힌 것을 되살리기」가
    아니다 — 저쪽은 폐기된 진단이고 이쪽은 **살아 있는 예측의 표현 오류**다.
  예측:
    - metric: qualitative.evidence_unregistered_count
      expect: "수기 판정 — 증거 §8-1의 「미등재 N건」이 **개명 후보를 뺀 수**이고, 그 N이 그날 실제 부재 건수와 같은가"
      역할: 주장
  주의: |
    ⚠ **이 항목도 일별 지표로 검정되지 않는다** — 증거 수집기의 인쇄물은 사이드카에 안 실린다.
    원 항목과 같은 형태이고(`2026-08-19-fix10`도 같다), **진짜 계약은 계약 테스트**다.
    위 `metric` 경로는 **아직 없는 경로다** — 「수기 판정」으로 두는 이유가 그것이고, 없는 경로에
    자동 판정을 붙이면 그것이 가짜 지표다(`2026-08-19-lint-dead-metric-paths`가 그 자리를 지킨다).

    ⚠ **원 항목 ①항(월요일 헛경보)은 여기로 옮기지 않았다.** 그것은 **2026-08-31(월)**에만 검정되고
    문구에 오류가 없다 — 옮기면 예정일이 뒤섞인다. 원 항목의 `검정:`에 그 사실을 적어 뒀다.
  검정: |
    2026-08-26 확정 — 증거 §8-1의 「미등재」가 **10건**(개명 후보 제외 후)이고, 08:01·08:58·12:34·14:39·15:46 **다섯 회차 전부 10건**이다. 나열된 id 10개가 실제로 이 파일에 없다 — 「개명 후보를 뺀 수 = 실제 부재 건수」가 성립했다.
  상태: confirmed

- id: "2026-08-25-fix6-balance-line-cost-is-its-own-line-count"
  구현일: 2026-08-24
  검증예정일: 2026-08-26
  가설: |
    잔고 폴링 실패 줄의 **대가는 그 줄 자체의 수**로 잰다 — 하루 WARNING 총량이 아니라.
  대가: |
    `qualitative.balance_poll_failed`가 **하루 10줄 이하**다. 그 값이 0인 날에도 키는 인쇄된다
    (「실패가 없던 하루」와 「그 줄이 없던 버전」을 가르기 위해서다 — 규약 C).
  근거: |
    **이것은 새 fix가 아니라 대가 지표의 교체다.** 원 가설 `2026-08-24-fix6-backoff-and-balance-failure-share-one-line`의
    주장은 08-25에 성립했다(그 한 줄에 네 칸이 다 있었다). **그러나 대가 축이 검정 불가였다.**

    원 예측의 대가는 `log_volume.by_level.WARNING` 「증가분 0줄」인데 실측은 **+8줄**(323 → 331)이었다.
    그 +8 중 **2줄은 같은 커밋의 `fix4`가 INFO→WARNING으로 승격시킨 「되살리기 실패」**이고,
    나머지는 그날 KIS 상태에 비례한다(**규약 F**).

    **`log_volume.by_level.WARNING`은 두 fix가 공유하는 축이라 어느 쪽도 검정하지 못한다**(규약 E·F).
    한 축을 둘이 나눠 쓰면 값이 움직여도 누구 탓인지 못 가리고, 안 움직여도 상쇄인지 무변화인지 못 가린다.
  예측:
    - metric: qualitative.balance_poll_failed
      expect: "0 ~ 10"
      역할: 대가
    - metric: qualitative.balance_poll_failed
      expect: "수기 판정 — 그 줄 전부에 네 칸(이번/직전 예외 유형 · 백오프 배율 · 마지막 성공 폴)이 실려 있는가"
      역할: 주장
  주의: |
    ⚠ **잔고 폴링 실패가 0건인 날은 주장 축이 판정 불가**다(규약 C) — 막을 것이 없었던 날을 「막았다」로 세지 않는다.
    다만 **대가 축은 0건인 날에도 성립한다**(0 <= 10). 두 축의 판정 조건이 다르다는 것을 섞지 말 것.
    ⚠ 상한 10은 08-25 실측 1건에 여유를 준 값이다. 이 값이 10을 넘는 날은 대가가 아니라 **사고**다 —
    잔고 조회가 그만큼 실패했다는 뜻이고, 그때 봐야 하는 것은 이 fix가 아니라 KIS 연결이다.
  검정: |
    2026-08-26 확정(주장) — 잔고 폴링 실패 줄 **15건 전부**가 네 칸(유형=ReadTimeout · 직전 실패 유형 · 백오프 N배 · 마지막 성공 폴)을 실었다.
    ⚠ **대가 축은 초과했다** — `qualitative.balance_poll_failed` **18건**(예측 0~10). 자동 판정만 보면 「반증」이지만 **규약 G로 거른다**: 18건 중 **15건이 14:04~15:24 절벽 구간**이고, 이 축은 그날 KIS 상태에 비례한다. **fix가 소음을 만든 것이 아니다.**
    → 임계 0~10을 「하루 건수」가 아니라 정규화 축으로 다시 정할 것(장후 결정 15). 다만 표본이 오늘 하루뿐이라 지금 정하지 않는다.
  상태: confirmed

- id: "2026-08-25-p5-rule-holds-for-one-more-day"
  구현일: 2026-08-25
  검증예정일: 2026-08-26
  가설: |
    **사전 대응 규칙 `2026-08-04-p5`의 발동 조건이 08-25에 성립했다. 이 회차는 (B) 「하루 더 본다」를 고른다.**
    그리고 **2026-08-26에도 같은 시간대에서 조건이 성립하면 그날 발동한다** — 이 문장을 숫자를 보기 전에 적는다.
  근거: |
    08-25 실측 — `inquire-price` p95가 임계 2.5초를 넘은 시간대가 **11·12·13·14시** 넷,
    `inquire-balance`가 **11·13시** 둘, 합 **6개 구간**에서 「이틀 연속 같은 시간대」가 성립했다
    (자동 지표 `rest_latency.warnings` · `p95_by_hour`).

    **(B)를 고른 근거 셋**(08-25 장후 사용자 조치 11):
      ① 그날 `rows=0`이 **0분**이라 열화가 실제로 망가뜨린 것이 없다.
      ② 그날은 지수가 **+5.5%** 오른 이례적인 장이라 KIS 혼잡이 시장 탓일 가능성이 크고,
         그것을 구조로 오인하면 **위클리 커버리지만 잃는다**(08-25 `weekly_mon` 48.4% · `weekly_thu` 48.8%).
      ③ 규칙은 08-04에 만들어진 뒤 **한 번도 발동한 적이 없다** — 첫 발동을 큰 장 하루로 하는 것은 아깝다.

    ⚠ **(C) 「발동하지 않는다」가 아니다.** 규칙을 만들어 두고 조건이 성립했는데 안 따르면
    그 규칙은 다음에도 안 따르게 된다. **(B)는 유예이지 기각이 아니고, 그 차이를 이 항목이 붙든다.**
  예측:
    - metric: rest_latency.warnings
      expect: "수기 판정 — 2026-08-26에도 `inquire-price` p95 > 2.5초인 시간대가 08-25와 겹치는가(11·12·13·14시 중 하나라도)"
      역할: 주장
    - metric: db.book_coverage
      expect: "수기 판정(대가) — 발동하지 않은 채 하루를 더 보내는 대가. 08-25 기준선 weekly_mon 48.4% · weekly_thu 48.8%"
      역할: 대가
  주의: |
    ⛔ **미리 정한 조치(숫자를 보기 전에 적는다)**:
      2026-08-26 지표에서 `inquire-price` p95가 2.5초를 넘는 시간대가 **08-25와 겹치면 그날 규칙을 발동한다** —
      그 시간대에 한해 위클리 폴링을 2분 → 4분 격분으로. **먼슬리는 건드리지 않는다**(판단 주입력이다).
      겹치지 않으면 「시장 탓」이 확인된 것이므로 이 항목을 `refuted`로 닫고 규칙은 08-04 상태로 되돌린다.

    ⚠ **자동 발동은 여전히 하지 않는다.** 2026-07-08에 페이서를 나눴다가 500 폭주로 **203분**을 잃었다.
    발동은 사람이 한다 — 이 항목이 바꾸는 것은 「언제 물어보는가」이지 「누가 누르는가」가 아니다.

    ⚠ **08-26이 「하루 더」의 마지막이다.** 사흘째도 (B)를 고르면 그것은 유예가 아니라 (C)를 말 안 하고 고른 것이다.
    이 항목을 만든 이유가 정확히 그것을 막기 위해서다.

    ⚠ **장중에는 이 조건을 볼 수 없다** — 지표 파일이 15:46에 생긴다. 그 경로를 고치는 것이
    `2026-08-25-fix-p95-reaches-the-intraday-round`이고, 08-25 사용자 조치 12가 「한다」로 권고했다.
  검정: |
    2026-08-26 확정 — **조건이 오늘도 성립했다.** p95 > 2.5초가 **이틀 연속 같은 시간대 11구간**(오늘 22구간)이다. 이 항목이 「내일도 성립하면 그날 발동한다」를 숫자 보기 전에 적어 뒀고, 그 조건이 찼다.
    **대가도 실측됐다** — `weekly_mon` **45.9%** · `weekly_thu` **46.4%**(08-25 기준선 48.4% · 48.8%). 발동 안 하고 하루를 더 보낸 대가가 커버리지 2.5pt 하락이다.
    ⚠ **발동 의무가 발생했으나 당일 발동은 구조적으로 불가능하다**(1-8 — 조건을 아는 시각이 장후 지표 15:46이고, 그 시간대는 그때 언제나 과거다). 그래서 발동 창을 **다음 거래일 장전**으로 옮긴다 — `2026-08-26-p1-3-preemptive-rule-fires-at-premarket`이 그 자리를 이어받는다. **(C) 기각이 아니라 창의 이동이다.**
  상태: confirmed

- id: "2026-08-25-fix-p95-reaches-the-intraday-round"
  구현일: 2026-08-25
  검증예정일: 2026-08-26
  가설: |
    증거 §5-1이 p50 옆에 **p95를 함께 인쇄**하고, **직전 거래일 사이드카의 `rest_latency.p95_by_hour`를 읽어
    「이틀 연속」 판정을 장중에 미리 낸다.** 장중 회차가 꼬리 지연을 **그날 안에** 본다.
  근거: |
    08-25에 12:30·14:30 두 회차가 「p95(느린 쪽 5%)를 아무도 안 본다」를 **신규 P1으로 올렸다.**
    하루가 끝나고 보니 `daily_ops_report`가 **시간대별 p95 표 · 임계 2.5초 · 초과 12건 목록 · 이틀 연속 판정 6구간 ·
    미리 정해 둔 조치까지 전부 인쇄하고 있었다**(`rest_latency.p95_by_hour` · `p95_warn_threshold` · `warnings`).

    **없던 것은 계측이 아니라 경로다.** 그 파일은 **15:46에 생긴다.** 장중 회차가 읽는 것은 `collect_evidence`의 §5-1이고
    거기엔 **p50만** 있다. `LATENCY_ITEM_RE`는 p50/p95/p99/max 네 값을 다 잡아 놓고 **p50만 `latency_p50`에 넣는다.**

    **08-19 §8-2와 같은 형태다 — 정보는 리포 안에 있었는데 경로가 닿지 않았다.** 그때는 폐기 목록이었고 이번은 지표 파일이다.
    그리고 08-24 Fix#6이 「값은 로그에 다 있었다 — 없던 것은 문턱과, 분자와 분모를 나란히 둔 표다」로 고친 것과 **정확히 같은 자리**다.
  예측:
    - metric: rest_latency.p95_by_hour
      expect: "수기 판정 — 적용 다음 거래일 장중 회차의 증거 §5-1에 p95 줄이 실리고, 그 값이 같은 날 지표 사이드카의 `p95_by_hour`와 어긋나지 않는가"
      역할: 주장
    - metric: rest_latency.p95_warn_threshold
      expect: "== 2.5"
      역할: 참고
  주의: |
    ⚠ **「p95 없음」과 「p95=0」을 반드시 다른 문구로 인쇄해야 한다**(규약 C).
    08-04에 WARNING→INFO 강등으로 362건이 0건이 된 그 자리이고, 이 파일이 `member_nonzero`·`censored_measured`에서
    이미 두 번 지킨 규약이다. **이 한 칸이 틀리면 이 fix는 헛경보 생성기가 된다.**

    ⚠ **임계 2.5초는 `daily_ops_report`와 같은 값을 써야 한다**(`log_metrics.REST_LATENCY_P95_WARN_SECONDS`).
    두 곳이 갈리면 장중 판정과 장후 판정이 어긋나고, 그때 사람은 어느 쪽을 믿을지 모른다.
    ⚠ `collect_evidence.py`는 **stdlib 전용**이라 그 상수를 임포트할 수 없다 — 복제본을 두되
    **원천이 무엇인지 주석에 적는다**(`CHAIN_ENDPOINT`·`P50_CENSORED_FLOOR_RATIO`가 이미 그 규약이다).

    ⚠ **「이틀 연속」 판정은 새 입력을 만들지 않는다** — 08-24 Fix#1이 만든 `previous_metric_sidecar()`를 재사용한다.
    직전 거래일 사이드카가 없으면 **「이틀 연속 판정 못 함」으로 인쇄한다. 「이틀 연속 아님」이 아니다**(규약 C).

    ⛔ **자동으로 발동하지 않는다.** 이 fix가 하는 일은 사람 앞에 놓는 것까지다 —
    발동 결정은 `2026-08-25-p5-rule-holds-for-one-more-day`가 붙든다(2026-07-08 페이서 분리 500 폭주 203분).

    ⚠ **이 fix도 일별 지표로 자동 검정되지 않는다** — 증거 수집기의 인쇄물은 사이드카에 안 실린다.
    진짜 계약은 계약 테스트다(`tests/test_evidence_collector_latency.py`가 이미 이 함수들을 잡고 있다).

    ⚠ **대가를 `대가:` 필드로 선언하지 않았다.** 재는 일별 경로가 없기 때문이고, 있는 척 아무 경로나 붙이면
    그것이 가짜 지표다(`2026-08-24-fix1-2-adv4`와 `2026-08-19-fix10`이 같은 자리에서 같은 결정을 했다).
    **`rest_latency.warnings`의 길이를 대가로 쓰고 싶은 유혹이 있는데 그것은 규약 F 위반이다** —
    그 값은 그날 KIS 상태에 비례하지 이 fix가 움직이는 값이 아니다.

    대가는 문장으로 남긴다 — **장중 회차가 매번 이 줄을 보게 된다. 조건이 자주 성립하면 무시된다**
    (08-15~16 `ALERT_ONLY` 94·113줄의 형태). 그래서 **성립한 구간 수와 「이틀 연속」 여부를 함께** 찍어
    「오늘만 나쁨」과 「이틀째 나쁨」을 가른다. 그 두 칸이 없으면 이 줄은 한 주 안에 배경 소음이 된다.
  검정: |
    2026-08-26 확정 — 증거 §5-1의 시간대 표에 `p95 최대` 열이 실렸고(09시 4.02초 ~ 14시 6.81초), **12:30·14:30 두 장중 회차가 그날 안에 그것을 읽었다.** `p95_warn_threshold` 2.5초가 `daily_ops_report`와 같은 값으로 공유됨을 지표 §0-1이 확인했다.
    ⚠ **단서 — 창 단위 TSV에는 여전히 p95가 없다**(1-10). 이 fix의 ①만 완료이고 **②는 P2-5로 남아 있다**(`2026-08-26-p2-5-latency-window-tsv-carries-p95`). 그 대가를 이 회차가 세 번째로 치렀다 — 절벽이 풀린 15:26을 p95로는 창 단위로 못 짚었다.
  상태: confirmed

- id: "2026-08-25-fix-entry-plan-block-reason-is-logged"
  구현일: 2026-08-25
  검증예정일: 2026-08-26
  가설: |
    「주문 미제출」 줄이 `no_entry_plan` 뒤에 **왜 계획이 안 섰는지**(`entry_plan_blocked_by`)를 함께 싣는다.
    「진입 계획이 없다」와 「왜 없는지」가 한 줄에서 읽힌다 — DB를 열지 않고.
  대가: |
    **줄 수는 안 는다 — 내용만 는다.** `qualitative.order_blocked`가 08-25 실측 **34건**에서
    구조적으로 달라지지 않는다(08-24 실측은 23건 — 이 값은 그날 후보 수에 비례한다, 규약 F).
    꼬리표만 사유 전환 시 + 5분 재확인으로 억제한다.
  근거: |
    08-25 §1-6 — **그날 처음으로 진입 후보가 나왔다**(하루 34분). 그런데 로그는 「계획이 없다」(`no_entry_plan`)까지만 말하고
    **왜 없는지는 DB(`signal_decisions.risk_gate_state.execution_engine.entry_plan_blocked_by`)에만 있다.**

    그리고 이 항목은 **실행 모드 상향의 선결 조건 ②로 이미 지목돼 있다**(08-25 사용자 조치 14 · 장전 사용자 조치 5):
    「②(가격이 언제 수집되는가 = `no_entry_plan` / `_ENTRY_PLAN_BLOCKED_NO_PRICE`)는 하루면 끝나는 코드 확인 작업」.
    정해 둔 순서가 **② → ① → 모드**이므로, 이것이 열려 있는 동안 모드는 못 올라간다.
    08-24에 표본이 4건이었고 08-25에 **34건**으로 늘었는데 **답은 그대로 없다.**

    ⚠ **`Fix#3`과 다른 자리다.** Fix#3은 *후보가 없는 분*에 사유를 남기는 것이고, 이것은
    *후보가 있었는데 계획이 안 선 분*이다. `NEXT_TODO.md` 폐기·종결 6건과 대조했고 여기 해당 항목은 없다 — 되살린 것이 아니다.
  예측:
    - metric: qualitative.order_blocked
      expect: "수기 판정 — 그 줄 전부가 `no_entry_plan`인 분에 한해 계획 미수립 사유를 함께 싣는가"
      역할: 주장
    - metric: qualitative.order_blocked
      expect: "수기 판정(대가) — 줄 수가 억제 때문에 **줄지 않는가**. 08-25 실측 34건 · 08-24 실측 23건이 기준선이다"
      역할: 대가
    - metric: db.orders.submitted
      expect: "== 0"
      역할: 참고
  주의: |
    ⛔ **억제하는 것은 「줄」이 아니라 「꼬리표」다.** 줄 자체를 억제하면 `qualitative.order_blocked`가 깨진다 —
    그 지표는 `mahdi/ops/report.py`가 **「주문 0건이 신호 부재인가 막힘인가」를 가르는 데 실제로 쓰는 축**이고
    (`execution_logs`는 둘 다 0행이라 답 못 한다), 08-04에 레벨 강등으로 362건이 0건으로 보고된 그 자리와 같은 형태다.
    → 줄은 매분 그대로 찍고, 사유 꼬리표만 **사유 전환 시 + 5분 재확인**으로 붙인다. **줄 수 불변 → 지표 회귀 0.**

    ⚠ **규약 C — 세 상태를 뭉뚱그리지 말 것.** `no_entry_plan`이 blockers에 있어도 `entry_plan_blocked_by`는 None일 수 있다:
      (a) `entry_plan_blocked_by` 값 있음 → **그 분에 옵션 가격이 없었다**(`option_price_missing_this_minute`)
      (b) `no_entry_plan`인데 값 없음 → **가격은 있었는데 ADVISORY라 계획을 아예 안 만들었다** — 모드를 올리면 풀린다
      (c) `no_entry_plan`이 blockers에 없음 → **해당 없음**
    (a)와 (b)는 **조치가 정반대다**(전자는 수집을 고쳐야 하고 후자는 모드를 올리면 된다). 같은 글자로 찍으면
    이 fix는 그날 답해야 할 질문을 오히려 덮는다.

    ⚠ **파서를 깨지 말 것** — `log_metrics`의 `order_blocked`는 부분문자열 `"주문 미제출"`로 센다.
    꼬리표는 기존 포맷 `(종목=... 수량=... 모드=...)` **뒤에** 붙인다(08-25 P1-3이 같은 주의를 적어 뒀다).

    ⚠ **이 fix는 주문을 한 건도 더 내보내지 않는다.** 잠금 셋(`hybrid_mode.default=ADVISORY` ·
    `reentry_cooldown_minutes=0` · 종목·지정가·수량)은 그대로다. 참고 지표 `db.orders.submitted == 0`이 그 확인이다.
    ⚠ **재기동이 필요하다** — 다음 거래일 07:30 기동에 실린다. 장중에 넣지 않는다(레짐 warmup 103분).
  검정: |
    2026-08-26 확정 — `13:55:09` 「주문 미제출 — … · **계획미수립사유=plan_not_built_in_advisory**」. 커밋 `b7d98aa`의 **첫 실전이고 성공이다.** 규약 C가 요구한 (a)/(b) 구분에서 오늘 것은 (b)다 — 가격은 있었고 ADVISORY라 계획을 아예 안 만들었다. **실행 모드 상향의 선결 조건 ②가 이것으로 닫혔다.**
    ⚠ **대가 축은 못 갈랐다** — `qualitative.order_blocked` **263건**(08-25 34건 · 08-24 23건의 **7.7배**). 억제가 안 걸린 것인지 판단 자체가 늘어난 것인지는 오늘 로그로 못 가른다(진입 판단 300건인데 어제 분모가 사이드카에 없다).
    → **관측 이월 B.** 다음 거래일 장후가 진입 판단 수와 나란히 놓고 비율로 본다. 비율이 같으면 판단이 는 것이고, 비율이 뛰었으면 억제가 안 걸린 것이다.
  상태: confirmed

