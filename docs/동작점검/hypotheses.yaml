- id: "2026-08-26-wiring2-v2-notice-subscription-holds"
  구현일: 2026-08-26
  검증예정일: 2026-08-27
  가설: |
    `KIS_HTS_ID`가 채워졌으므로 체결통보 스트림이 **구독에 성립하고, 조용히 유지된다** —
    「구독하지 않는다」 경고가 사라지고 구독 성립 줄이 기동당 한 번 남는다.
    (`2026-08-23-wiring2`의 후속 — 그 본문이 미리 적어 둔 재등재다.)
  대가: |
    재연결이 폭주하지 않는다. 끊김 줄이 하루 5건을 넘으면 지수 백오프가 일을 안 하는 것이고,
    08-12 밤의 재연결 폭주(레이트리밋 소진)를 두 번째 WS에서 재현하는 것이다.
  근거: |
    2026-08-26 장전에 사람이 `.env`에 `KIS_HTS_ID`를 넣고 재기동했다(08-24 권고 A · 08-25
    사용자 조치 2 — 사흘째 만의 이행). 주문이 0건인 동안 통보는 0건이 정상이므로, 이 가설이
    재는 것은 수신이 아니라 **채널의 성립**이다 — 첫 실주문 날에 검증 안 된 통로를 처음 쓰는
    것(선택지 B의 실질)을 피하는 것이 이 이행의 목적이었다.
  예측:
    - metric: qualitative.order_notice_subscribed
      expect: ">= 1"
      역할: 주장
    - metric: qualitative.order_notice_not_configured
      expect: "== 0"
      역할: 주장
    - metric: qualitative.order_notice_stream_down
      expect: "<= 5"
      역할: 대가
    - metric: db.order_notices.notices
      expect: "== 0"
      역할: 참고
  주의: |
    ⚠ **참고 지표 0의 뜻**: 주문이 0건인 동안 통보 0건은 정상이다. 0이 아니면 사람이 HTS로
    직접 낸 주문이 있었다는 뜻이고, 그것은 실패가 아니라 실측이다.
    ⚠ **첫 통보가 오는 날** `db.order_notices.field_count_distribution`이 **22**인지 반드시
    본다 — 22가 아니면 `_NOTICE_FIELDS`가 틀린 것이라 체결수량 자리에서 체결단가를 읽는다.
    그때는 `plaintext`로 복원한다(원 가설 주의 승계).
    ⚠ 구독 성립 줄이 0건이고 `stream_down`도 0건이면 — 접속 자체가 안 된 것이다. 그날은
    반증이 아니라 **원인 조사**다(HTS_ID 값이 틀렸을 가능성 포함 — 모의투자(vps) 환경에서
    통보 TR이 다른지도 함께 본다).
  검정: |
    2026-08-31 — **주장 확인 · 대가 반증. 그래서 닫고 새 축으로 재등재한다**
    (08-31 장후 §3-6 판정 제안 그대로).

    **주장 축은 전부 확인됐다** — `qualitative.order_notice_subscribed = 9` (>= 1) ·
    `order_notice_not_configured = 0` (== 0). 통로는 성립했고 조용히 유지됐다.

    **대가 축이 반증이다** — `order_notice_stream_down = 8`인데 예측은 `<= 5`였다.

    ⚠ **그런데 틀린 것은 코드가 아니라 예측의 축이다.** 08-31 §1-7이 밝혔듯 그 8회는
    **전부 매시 정각 1회이고 정각 외는 0회**이며 매번 2초에 재연결됐다(08~15시 8회).
    이 축이 재려던 것은 *「지수 백오프가 일을 안 해 재연결이 폭주하는가」*(08-12 밤의 형태)인데,
    **매시 정각 1회는 폭주가 아니라 KIS 쪽의 규칙적인 세션 경계**다. 「하루 N회」로 세면
    정상 동작이 매일 반증으로 찍힌다.

    ⛔ **이것은 임계 완화가 아니다** — 5를 8로 올리는 것이 아니라 **「무엇을 세는가」를
    바꾼다**(「하루 N회」 → 「정각 외 끊김 건수」). 숫자를 보고 임계를 올리는 것은 이 체계가
    가장 경계하는 형태이고, 그래서 상한을 손대지 않고 **축을 갈아 재등재**한다.
    후속: `2026-08-31-wiring2-v3-stream-down-is-off-the-hour`.
  상태: refuted

