    - metric: db.decisions.entry_strategies
      expect: |
        수기 판정(대가) — **프리미엄 매도 계열(`limited_premium_sell` /
        `highly_limited_premium_sell`)이 새로 열리는지 본다.** 팔레트의 `short_gamma_requires`는
        `highest_confidence`(= HIGH_CONVICTION)를 **필수 조건**으로 요구하므로, 확신도를 올리는
        이 레버는 **숏감마 전략의 문을 여는 레버이기도 하다.** 08-11까지 이 계열의 진입은 0건이다.
