  검정: |
    2026-08-26 확정 — 증거 §5-1-1의 `회복실패` 열이 08·09·11시에 `0`으로, 15시에 `0`으로 찍혔다(`—`가 아니다).
    **그리고 이 fix 덕분에 오늘 새 이상점(1-20)을 찾았다** — 어제 2건 / 오늘 9건의 날짜 간 비교가 처음 가능해졌고, 그것이 P2-7(먼슬리 되살리기 실패를 전일 대비로)로 이어졌다. **0을 인쇄하는 것이 실제로 새 사실을 만들어 낸 첫 사례다.**
  상태: confirmed

- id: "2026-08-25-p2-2-rejections-share-the-invariant-row"
  구현일: 2026-08-25
  검증예정일: 2026-08-26
  가설: |
    지표 §14의 「수집 행사가 범위 밖」 행이 **기각 로그 건수를 함께** 싣는다 —
    「적재분 N건 · 기각 로그 M건」. 구조적으로 0인 칸이 「감시하고 있다」로 읽히던 것이 끝난다.
  대가: |
    적재분 불변식은 **그대로 남는다** — 기각 가드(08-05 Fix#1)가 뚫리면 이 값이 0이 아니게
    되고, 그날은 여전히 경고가 뜬다. 두 축은 서로를 대체하지 못한다: 적재분은 「가드가
    뚫렸는가」, 기각 로그는 「가드가 일했는가」다.
  근거: |
    08-25 §1-12 / P2-2 — §14가 「범위 밖 0건(불변식)」을 인쇄한 같은 날 로그엔 기각 4건
    (전일 11건)이 있었다. 기각된 flip은 적재되지 않으므로 **분자에 못 든다** — 값이 0인 것이
    아니라 셀 자리에 사건이 안 오는 것이다(§5-1의 「✅ 검열되지 않았다」와 같은 형태의 눈멂).
    ⚠ **「GEX 광폭 체인」을 되살리는 것이 아니다**(08-04 폐기 유지) — 계측 표기만 고쳤다.
    기각 카운터를 `_QUALITATIVE_ALWAYS_PRESENT`에 올려 0건인 날도 키가 실린다(규약 C).
  예측:
    - metric: qualitative.gamma_flip_out_of_leg_range
      expect: ">= 0"
      역할: 주장
    - metric: db.signal_reach.gamma_flip_out_of_range_count
      expect: "== 0"
      역할: 대가
  주의: |
    ⚠ 주장 `>= 0`은 경로 생존 확인이다(규약 F) — 건수는 그날 시장/스팟 위치에 비례한다(규약 G).
    수기로 볼 것은 **§14 그 행에 「기각 로그 M건」이 실제로 실리고, 기각 0건인 날 「셈 없음」이
    아니라 「0건」으로 인쇄되는가**다. 계약 테스트: `tests/test_ops_report.py`의 P2-2 절 3건.
    ⚠ 이 fix는 리포트·파서만 바꾼다 — 관측 루프 재기동이 필요 없다(리포트는 매 실행 새 프로세스).
  검정: |
    2026-08-26 확정 — 지표 §14가 「그중 수집 행사가 범위 밖 — **적재분 0건 · 기각 로그 19건**」으로 두 수를 함께 실었다. 구조적으로 0인 칸이 「감시하고 있다」로 읽히던 것이 끝났다.
  상태: confirmed

- id: "2026-08-25-fix8-v2-watchdog-cost-is-cadence-not-count"
  구현일: 2026-08-25
  # 「DEGRADED가 실제로 났다 회복되는 날」에만 갈린다 — 날짜가 아니라 사건이 조건이다.
  # `2026-08-21-p1`과 같은 형태로 잠정 날짜를 적는다.
  검증예정일: 2026-09-01
  가설: |
    DEGRADED가 OK로 돌아가는 분에 **종료 줄**이 남는다(`2026-08-21-fix8`의 주장 그대로) —
    다만 대가 지표를 `watchdog.checks` 절대값에서 **`watchdog.silence_over_cadence_ratio`**로
    바꿔 다시 적는다.
  대가: |
    워치독 자신이 느려지지 않는다 — **판정 사이 최장 침묵이 정상 주기를 크게 넘지 않는다.**
    절대 건수(`checks`)는 그날 DEGRADED 빈도에 비례해(08-21 63행 vs 08-24 49행) 대가 축이
    못 된다(규약 F). 「주기를 지켰는가」가 이 대가가 실제로 묻는 것이다.
  근거: |
    08-24 §3-5 #9 / 08-25 §3-3 — 원 가설의 대가 문구(「checks가 63에서 줄지 않는다」)가
    08-24에 63 → 49로 깨진 것처럼 보였는데 위반이 아니었다: 감시 창은 두 날 똑같이
    07:40~15:40이고 `max_silence_minutes` 10.0분 = 정상 주기(`silence_over_cadence_ratio`
    정확히 1.0, 08-25도 1.0). 63행이었던 것은 그날 DEGRADED 16건이 판정 주기를 촘촘하게
    만들었기 때문이다. **자동 판정을 그대로 옮겨 적었으면 오보가 됐을 자리다.**
    원 항목은 inconclusive로 닫혔다(DEGRADED 0건 — 경로가 안 돌았다, 규약 C).
  예측:
    - metric: watchdog.recovered_episodes
      expect: ">= 0"
      역할: 주장
    - metric: watchdog.silence_over_cadence_ratio
      expect: "<= 1.5"
      역할: 대가
  주의: |
    ⚠ 주장 `>= 0`은 경로 생존 확인이다(규약 F가 통과시키는 형태) — 진짜 판정은 **적재가
    실제로 멈췄다 회복되는 날** 종료 줄이 남는가이고, 그날 수기로 확정한다(원 항목의 조건 승계).
    ⚠ 대가 상한 1.5는 「10분 주기에 15분 침묵」이다 — 08-12의 실패(감시자가 감시를 못 함)는
    이 축에서 수 배로 나타난다. 08-21·08-24·08-25 실측이 전부 1.0이다.
    ⚠ DEGRADED가 0건인 날의 `recovered_episodes=0`은 확인이 아니다(규약 C) — 원 항목이
    정확히 그 이유로 inconclusive였다.
  검정: |
    2026-09-03 확정(09-03 「가설 판정 제안」 표) — **확인.**
    `watchdog.recovered_episodes` = **1**로 오늘 실제 사건 1회와 일치했다
    (`[15:25:01] RECOVERED — 적재 정지 45분 지속 후 회복(14:40~15:24)`).
    `watchdog.silence_over_cadence_ratio` = **1.01**(<= 1.5 통과) —
    45분짜리 사건이 있던 날에도 대가는 **건수가 아니라 주기**를 따랐다.
  상태: confirmed

