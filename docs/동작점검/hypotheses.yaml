    08-05 `p1`(VRP 배선)이 팔레트를 연 뒤 ENTER가 0 → **62건**이 됐는데 **그 62건이 옳았는지
    재는 지표가 하나도 없었다.** ADVISORY 전용이라 손익은 없지만 진입 시점의 기초자산과 이후
    궤적은 이미 `underlying_spot_1m`에 있다. ADVISORY라는 이유로 미루면 전환 시점에 비교할
    것이 없다(§14-3 주석: "진입이 없어도 잴 수 있는 지표다").

