# ===================================================================================

- id: "2026-08-12-fix1-watchdog-restart-does-not-block-itself"
  가설: |
    재기동 호출에서 표준 출력 캡처를 없애면, 워치독이 자기 재기동에 묶여 감시를 멈추는 일이
    사라진다.
  대가: |
    기동 스크립트의 stdout/stderr를 워치독이 못 본다 — **이미 못 보고 있었다**(`result.stdout`은
    어디서도 안 쓰인다). 판정 근거는 `logs/premarket_startup.log` 그대로다.
  검증예정일: 2026-08-13
  근거: |
    08-12 10:14:01에 워치독이 정확히 판정하고 정확히 되살렸는데, `subprocess.run(capture_output=True)`가
    만든 파이프를 `start`로 띄운 손자(COCKPIT/관측 루프)가 상속해 EOF가 안 왔다. 기동 스크립트는
    10:14:12에 **10초 만에** 끝났지만(`premarket_startup.log`) 워치독은 「300초 안에 끝나지 않음」을
    기록했고, `TimeoutExpired` 처리의 재-`communicate()`에서 다시 막혀 **15:45:02까지** 살아 있었다
    (`watchdog.log`/`.watchdog_state.json`의 mtime이 증거다).
    `MultipleInstances=IgnoreNew`라 그동안 매분 실행이 전부 무시됐다 — 10:20~15:40 `OK` 줄 0개.
    같은 PC 재현: `capture_output=True`는 `timeout=8`을 주고도 **350.1초**, `False`는 **0.1초**.
  예측:
    - metric: watchdog.silence_over_cadence_ratio
      expect: "<= 2.0"
      역할: 주장
    - metric: watchdog.restart_failures
      expect: "== 0"
      역할: 주장
    - metric: watchdog.max_silence_minutes
      expect: "수기 판정(참고) — 위 배수의 원값. **부등식은 여기 걸지 않는다**(규약 F: 감시 창 길이와 기록 주기에 비례한다). 08-12 실측 331분"
      역할: 참고
    - metric: watchdog.checks
      expect: "수기 판정(대가) — 캡처를 없앤 대가로 기동 스크립트의 출력을 워치독이 못 본다. 그 손실이 판정 자체를 줄이지는 않아야 한다 — 08-12 실측 18줄 근처를 유지하는가"
      역할: 대가
  주의: |
    ⚠ **재기동이 없는 날에는 이 fix가 도는 경로 자체가 없다.** `max_silence_minutes <= 20`은
    그날 워치독이 정상 주기로 돌기만 하면 성립하므로, 이 예측은 **재기동이 실제로 일어난 날에만**
    fix를 검정한다. 며칠 안에 재기동이 안 나면 검정은 `tests/test_watchdog_observation_loop.py`의
    재현 테스트가 대신 진다(그쪽은 실제 `subprocess.run`으로 실제 bat을 돌린다).
    ⚠ OS 쪽 백스톱(`ExecutionTimeLimit = PT10M`)은 저장소가 아니라 PC에 있다 — 새 PC에서는
    `CURRENT_STATE.md`의 절차를 다시 밟아야 이 예측이 성립한다.
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: 무판정비율 1.0 · 재기동 실패 0 · 판정 49건 · 최장 무판정 **10분**.
    08-12의 331분 침묵이 10분으로 내려왔다 — `capture_output` 제거가 일했다.
  상태: confirmed

- id: "2026-08-12-fix2-reconnect-path-rest-isolation"
  가설: |
    관측 루프 진입부의 스팟 조회를 HTTP 오류에서 격리하면, 재연결이 잦은 날에도 프로세스가
    KIS의 일과성 500 하나로 죽지 않는다.
  대가: |
    스팟 조회가 실패한 재연결에서 ATM 창이 **한 봉 늦게** 따라간다(다음 선물봉의 재롤링이 회복).
  검증예정일: 2026-08-13
  근거: |
    08-12 10:10:06, `main.py:1146`의 `get_quote`가 500을 받았고 `run_observation_loop_forever`가
    `_WS_DISCONNECT_ERRORS`만 잡으므로 `asyncio.gather`까지 전파돼 전 폴러가 함께 죽었다(결손 5분).
    KIS의 500은 그날 24건(0.26%)으로 정상 범위다 — 치명이 된 것은 500이 아니라 **노출 횟수**다.
    WS가 09:13~10:10에 31회 끊겼고 재연결마다 이 진입부가 다시 돌았다.
  예측:
    - metric: process_starts
      expect: "수기 판정(주장) — 그날 프로세스 기동이 **1회**여야 한다(08-12는 2회). 워치독 재기동이 다른 이유로 일어난 날은 이 지표로 판정하지 않는다"
      역할: 주장
    - metric: cycles.missing.count
      expect: "수기 판정(주장) — 「관측 루프 미가동」 분이 0이어야 한다(08-12는 5분)"
      역할: 주장
    - metric: db.tables.underlying_spot_1m.rows
      expect: "수기 판정(대가) — 롤링 1분 지연의 흔적. 08-12 기준선 364분. **줄어도 이 fix의 반증이 아니다**(그 분에 KIS가 느렸다는 뜻)"
      역할: 대가
  주의: |
    ⚠ **`except Exception`으로 넓히지 말 것.** 07-19가 지키려던 것(코드/설정 오류는 사람이 본다)이
    그대로 남아야 한다 — `tests/test_main.py::test_a_non_http_error_on_the_opening_quote_still_propagates`가
    그 경계를 지킨다.
    ⚠ WS가 안 끊긴 날에는 이 경로가 하루 1번만 돈다. **0건으로 반증하지 말 것.**
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: `process_starts` **1회** · 관측 루프 미가동 **0분**.
    ⚠ **조건부 확인이다** — 그날 **WS 단절이 0회**여서 재연결 경로가 한 번도 안 돌았다.
    즉 이것은 「조용한 날의 통과」이고, 재연결이 실제로 일어나는 날 다시 봐야 한다.
  상태: confirmed

