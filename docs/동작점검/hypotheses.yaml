- id: "2026-08-19-fix5-deadline-cut-label-says-what-it-measures"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "`우선순위위반` 라벨의 이름을 실제 측정 대상으로 바꿔도 그 축의 계측값은 그대로다"
  근거: |
    08-18 §2-4가 `우선순위위반=예` 3건(전부 `budget_exceeded`)을 「불변식이 처음 깨졌다」로 읽었다.
    **코드 검증 결과 그 읽기가 틀렸다.** `books[0]`이 먼슬리이고(`main.py:4478`) 위클리는 언제나
    뒤에 오므로, 벽시계 데드라인이 먼슬리 구간에서 끝나면 `non_priority_ahead[index+1]`은
    **구조적으로 항상 True**다. 그 세 사이클에서 위클리 레그는 **한 건도 호출되지 않았다** —
    먼슬리가 50초 예산 100%를 썼고, 그것은 우선순위가 지켜진 결과다.
    실제 손상은 순서가 아니라 **두께**다(15:01:52 먼슬리 6/10레그) — §2-5의 지연 축이다.
  대가: "라벨 문구가 바뀌므로 `log_metrics` 파서가 옛 로그를 못 읽으면 과거 지표가 사라진다"
  예측:
    - metric: budget_exceeded.priority_before_others_minutes
      expect: "수기 판정"
      역할: 주장
    - metric: timeout_abort.priority_before_others_minutes
      expect: "0"
      역할: 대가
  주의: |
    **코드 동작은 한 줄도 안 바꾼다.** `time.monotonic() >= deadline`이 참이 된 뒤에는 위클리를
    «먼저 소거»하든 말든 호출이 0건이므로, 보고서 Fix#1 원안은 라벨만 영구히 `아니오`로 만들고
    이득이 없다(음수다 — 08-12 Fix#5가 만든 계측을 무력화한다).
    바꾸는 것은 **로그 문구와 열화 게이지의 표시 자리**뿐이다: `우선순위위반` →
    `데드라인이_먼슬리에서_끝남`. `timeout_abort` 경로의 `0`을 대가로 함께 읽는 이유는
    **그쪽은 진짜 순서 축**이기 때문이다 — 파서를 고치다 그 축까지 망가뜨리면 여기서 드러난다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    08-21 사이드카에서 `budget_exceeded.labelled` 128 / `timeout_abort.labelled` 328로
    라벨 경로는 살아 있었다. 그러나 라벨이 「무엇을 재는지 말하는가」를 사람이 그날
    직접 대조하지 않았다. 판정하지 못한 것이다.
  상태: inconclusive

# ===== 2026-08-19 2차 — 08-19 EOD 점검이 낸 세 조치 =====

- id: "2026-08-19-fix7-censored-phase-is-a-ratio-not-a-verdict"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "검열 위상은 **배수**로 인쇄되고, 리포트가 그것을 판정어로 단정하지 않는다"
  근거: |
    08-19 실측 점유율 22.4%(균등선 13.3%의 **1.68배**)가 리포트에 «균등선 근처다 — 특정 분에
    몰린 것이 아니다»로 인쇄됐다. 13.3%의 1.68배는 「근처」가 아니다. 임계(`>= 2배`) 하나로
    연속량을 이분한 결과이고, **경계 근처의 날마다 그 문장이 틀린다.**
    이틀 실측이 그 위험을 그대로 보여 준다: 08-18 **2.54배** → 08-19 **1.68배**.
    같은 축이 이틀 만에 크게 움직였으므로 하루치로는 위상 문제라고도 아니라고도 못 한다.
  예측:
    - metric: slow_calls.censored.phase_ratio
      expect: ">= 0"
      역할: 주장
    - metric: slow_calls.censored.phase_concentration
      expect: "수기 판정"
      역할: 참고
  주의: |
    주장은 **경로 생존**이다(키가 없으면 「실측 없음」). 배수 자체에 임계를 걸면 방금 지운
    그 판정을 지표 쪽에 다시 만드는 것이다 — 규약 G(시장 상태에 비례하는 값에 무조건부 하한을
    걸지 않는다)에 정면으로 걸린다. 이 값은 **그날 KIS가 어땠는가**에 비례한다.
    판정은 `NEXT_TODO`의 레버 E 「해제 조건 v2」가 이틀 연속으로 한다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    배수 인쇄 경로(`slow_calls.censored.phase_ratio`)는 살아 있다. 다만 이 항목의 판정은
    「레버 E 해제 조건 v2가 이틀 연속으로 한다」였는데, 레버 E는 08-23에 아홉 번째 유예로
    2026-09-01까지 밀렸다(`2026-08-12-eE-on-congested-hours`). 조건 자체가 아직 안 왔다.
  상태: inconclusive

- id: "2026-08-19-fix8-crash-reason-reaches-a-metric"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "관측 루프가 죽은 **사유**가 리포트에 뜬다"
  근거: |
    08-19에 워치독이 두 번 재기동했고(09:54:01 · 10:36:01) 리포트는 그 사실까지만 말했다.
    첫 번째 사유는 `psycopg.OperationalError`였다 — DB 컨테이너가 **09:50:56에 재시작**됐고
    (`docker inspect` StartedAt) 6초 뒤 `handle_message`의 `db.get_connection()`이 그것을 맞았다.
    **그 사유는 `logs/observation_loop_crash.log`에만 있었다.** `observation_loop.log`에는
    `OperationalError`가 **0건**이다(예외가 로깅을 거치지 않고 프로세스를 끝냈다).
    그리고 그 파일을 읽는 코드가 저장소에 하나도 없었다 — 08-18 §3-2와 같은 계열이다.
    게다가 그 파일은 `2>>` append이면서 **타임스탬프가 없어** 07-19부터 트레이스백 셋이
    날짜 없이 쌓여 있었다. `start_mahdi_premarket.bat`에 기동 표식을 넣은 것이 그 경계다.
  대가: "표식 한 줄이 기동 경로에 들어간다 — 기동이 느려지거나 실패하면 안 된다"
  예측:
    - metric: crash.marker_present
      expect: "1"
      역할: 주장
    - metric: crash.starts
      expect: ">= 0"
      역할: 주장
    - metric: crash.unattributed
      expect: "수기 판정"
      역할: 참고
    - metric: watchdog.checks
      expect: "수기 판정"
      역할: 대가
  주의: |
    **`marker_present == 1`은 08-20 07:30 기동부터만 참이다** — bat 변경은 다음 기동에 실린다.
    08-19 리포트에서는 이 값이 `False`이고, 그때 그 절은 「크래시가 없었다」가 아니라
    **「셀 수 없었다」**로 인쇄된다(규약 C). 그것이 이 fix가 만든 첫 정직한 문장이다.
    `crash.crashes`에 하한을 걸지 않는 이유: 죽지 않는 것이 정상이고, 건수 하한은
    **크래시를 요구하는 예측**이 된다(규약 G).
    ⚠ **예외 정책은 안 바꿨다.** `main._WS_DISCONNECT_ERRORS`와 `run_observation_loop_forever`
    docstring이 «DB 예외는 전파해 사람이 보게 한다»를 두 곳에 명시했고, 그 결정을 하루치로
    뒤집는 것은 08-18 보고서가 Fix#1에서 한 실수와 같다. 그날 설계는 의도대로 작동했다 —
    루프가 크게 죽었고, 워치독이 3분 만에 되살렸고, 크래시 로그가 원인을 정확히 적었다.
    **없던 것은 회복이 아니라 그 원인을 읽는 눈이다.**
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    08-21 실측 `crash` = starts 2 · crashes 0 · unattributed 3 · marker_present true.
    **경로는 살아 있으나 그날 사유가 남은 죽음이 0건**이라 「사유가 지표에 닿는가」를
    이 날 숫자로는 못 가른다(규약 C). 게다가 같은 날 이 절의 **다른 결함**이 드러났다 —
    사람이 일부러 내린 정지가 「사유 없이 끝난 기동」으로 세어졌다(08-21 §1-17).
    그 축은 `2026-08-21-fix4-intentional-stop-is-not-an-unexplained-death`가 받는다.
  상태: inconclusive

- id: "2026-08-19-fix9-abandoned-git-lock-is-opened"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "버려진 `.git/index.lock`을 워치독이 그날 안에 열고, 그 사실이 지표에 남는다"
  근거: |
    0바이트 `.git/index.lock`이 이틀 연속 남아 다음 git 작업을 전부 막았다 —
    **2026-08-18 16:20**(EOD 자동 점검 세션이 보고서를 쓴 그 분, CreationTime 16:20:53)과
    **2026-08-19 12:41**(장중 점검 세션이 `_점검_intra.md`를 쓴 그 분). 두 번 다 git 프로세스는
    하나도 살아 있지 않았고, 08-19 것은 발견까지 **4시간 18분** 방치됐다.

    원인을 실측으로 확정했다: 인덱스를 쓰는 git 명령은 락을 먼저 만들고 내용은 마지막에 쓴다
    (이 저장소 실측 — `git add` 문서 12개는 총 147ms 중 **101ms(69%)를 0바이트 락으로** 보유,
    `git status`는 끝부분 ~3ms). 그 구간에 **TerminateProcess(트리 킬)** 로 죽으면 atexit 정리가
    안 돌아 락이 남는다. 정상 실패(`die()`)로는 안 남고, 래퍼(`cmd\git.exe`)만 죽여도 안 남는다
    — 실자식(`mingw64\bin\git.exe`)이 완주하기 때문이다.
    **스크래치 클론에서 실바이너리를 `git add` 45ms 지점에 킬해 동일한 0바이트 잔재를 재현했고**,
    이어서 「잔재 → git 차단(rc=128) → 어린 락 보호 → 청소 → git 복구」를 종단으로 확인했다.

    즉 0바이트 `index.lock`은 **트리 킬의 지문**이고, 이 PC에서 그것을 하는 주체는 자동 점검
    세션의 종료다. 같은 teardown이 남긴 고아 `git log --oneline -10` 쌍(08-18 14:28부터 3시간+)이
    형제 증거다.
  대가: "판정 경로에 파일 stat 하나가 앞선다 — 워치독 판정 횟수와 침묵 구간이 나빠지면 안 된다"
  예측:
    - metric: watchdog.stale_lock_sweeps
      expect: ">= 0"
      역할: 주장
    - metric: watchdog.checks
      expect: "수기 판정"
      역할: 대가
    - metric: watchdog.max_silence_minutes
      expect: "수기 판정"
      역할: 대가
  주의: |
    주장은 **경로 생존**이다(키가 없으면 「실측 없음」). 건수에 하한을 걸 수 없는 이유는
    **락이 안 남는 것이 정상**이기 때문이다 — 하한을 걸면 「세션이 git을 죽여야 통과하는 예측」이
    된다(규약 G와 같은 형태). 반대로 **이 값이 자라는 것 자체가 신호**다: 청소가 잦아지면
    고칠 것은 청소가 아니라 teardown이다.

    대가 지표 둘을 둔 이유: 청소는 `main()` 맨 앞, **모든 게이트보다 먼저** 돈다(락 #1이 16:20,
    즉 감시 창 밖에서 생겼기 때문이다 — 창에 가두면 그 락은 영영 안 열린다). 그 자리에 stat이
    하나 앞서므로 판정 경로가 느려지면 `checks`가 줄거나 `max_silence_minutes`가 는다.
    08-19 기준선은 `checks = 53` · `max_silence = 10.1`이다.
    비싼 프로세스 조회(`tasklist`)는 **크기·나이가 이미 걸러진 뒤에만** 돈다 —
    `test_the_expensive_probe_does_not_run_on_a_quiet_day`가 그 순서를 고정한다.

    ⚠ **삭제하는 청소부라 안전 조건 셋을 전부 요구한다**: 0바이트 · 나이 ≥10분 · git.exe 부재.
    셋째가 `None`(조회 실패)이면 **지우지 않는다** — 「없다」와 「모른다」를 가르는 그 한 줄이
    없으면 조회가 실패한 순간 이 청소부가 가장 위험해진다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    08-21 실측 `watchdog.stale_lock_sweeps` **0건** — 그날 버려진 락이 **하나도 안 생겼다.**
    「쓸어냈다」와 「쓸 것이 없었다」는 다르고(규약 C), 0으로는 이 fix를 확정할 수 없다.
    락이 실제로 남는 날 **새 id**로 재등재한다.
  상태: inconclusive

- id: "2026-08-19-fix10-evidence-collector-cannot-lock-the-repo"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: "증거 수집기가 저장소를 잠글 수 없다 — 인덱스 락을 **만들지 않는다**"
  근거: |
    `.git/index.lock` 0바이트 잔재가 이틀 연속 저장소를 막았다(08-18 16:20 · 08-19 12:41).
    원인은 트리 킬로 확정했고(`mahdi/git_lock.py` 참고), **락을 쥐는 쪽이 누구인지**를
    08-19에 특정했다: `docs/동작점검/tools/collect_evidence.py`의 `run_git()`이다.
    §1 「코드·커밋 상태」에서 git을 5회 부르는데 그중 `status --porcelain` 하나가 인덱스
    캐시를 갱신하려 락을 쥔다(실측 5~6ms · 0바이트). 두 락 모두 그 세션이 마지막 산출물을
    쓴 그 분에 생겼다.

    실측(343개 touch 후 = 최악 조건, 3회 반복):
      기본                       262~343ms · index.lock 관측 **5~6회(매번)**
      GIT_OPTIONAL_LOCKS=0       371~395ms · index.lock 관측 **0회** · 출력 동일

    **락을 못 만들면 트리 킬이 락을 남길 수 없다** — 청소(Fix#9)보다 앞선 자리의 조치다.
  예측:
    - metric: watchdog.stale_lock_sweeps
      expect: "수기 판정"
      역할: 주장
  주의: |
    ⚠ **대가는 실재하지만 `대가:` 필드로 선언하지 않았다.** 규약 E는 대가를 선언하면 `역할: 대가`
    지표를 함께 등록하라고 요구하는데, 이 대가(수집기 실행 시간 +30%: status 262~343 →
    371~395ms)를 재는 **일별 지표 경로가 없다.** 있는 척 아무 경로나 붙이면 그것이 가짜 지표이고,
    08-18 §3-2가 겪은 「경로가 실재를 안 가리키는」 결함을 우리 손으로 만드는 것이다.
    그래서 대가를 여기 문장으로 남긴다 — **하루 3~4회 도는 수집기에서 100ms대 증가는 사람이
    체감하지 않고, 얻는 것은 「저장소가 잠길 수 없음」이다.** 등가교환이 명백해 판정이 필요 없다.

    ⚠ **이 fix는 일별 지표로 검정되지 않는다.** 주장 지표에 `== 0`을 걸 수 없는 이유가 둘이다:
      (1) 락을 만드는 경로가 이 수집기만이 아닐 수 있다 — 사람이 돌리는 git, IDE, 다른 도구.
          0을 주장하면 **남이 만든 락이 이 fix의 반증으로 찍힌다**(규약 F/G와 같은 형태).
      (2) 락이 남으려면 **세션이 하필 그 순간 죽어야 한다.** 우리가 못 정하는 조건이고,
          안 죽은 날의 0은 이 fix의 증명이 아니다(규약 C — 라벨 0이면 count 0은 증명이 아니다).

    **그래서 이 fix의 진짜 계약은 계약 테스트다** — `tests/test_evidence_collector_git.py`가
    `run_git()`이 `GIT_OPTIONAL_LOCKS=0`을 넘기는지, 그리고 그 설정으로 실제 저장소에서
    락이 안 생기는지를 고정한다. 지표는 **사람이 읽는 참고**로만 둔다:
    `stale_lock_sweeps`가 앞으로도 자라면 원인이 이 수집기 밖에 있다는 뜻이다.

    ⚠ **고아 git 프로세스는 이 fix가 안 고친다.** `capture_output=True`가 파이프를 손자
    (`cmd\git.exe` 래퍼가 스폰하는 실바이너리)에 상속시키는 구조가 원인이고, 08-12에 워치독
    `_restart`가 겪은 것과 같은 함정이다. `--no-pager`도 시험했으나 pager 가설은 재현되지
    않아(250ms 안에 종료) 근거 없는 수정은 하지 않았다.
    다만 **두 문제는 맞물린다**: 고아가 살아 있으면 Fix#9의 청소가 「git.exe 부재」 조건에
    걸려 락을 안 지운다. 그래서 «락을 애초에 안 만드는» 이쪽이 더 중요하다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    08-21에 증거 수집기가 네 번 돌았고 리포지터리 락 사고는 0건이었다. 그러나 위
    `fix9`와 같은 형태다 — **사고가 안 난 날의 0은 이 fix의 확인이 아니다.**
  상태: inconclusive

- id: "2026-08-19-lint-dead-metric-paths"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: |
    가설 지표의 **잎 부재**를 기계가 잡으면, 「부모는 있고 잎이 영원히 없는 경로」가 다음 날
    「실측 없음」의 소음에 묻히지 않는다.
  대가: |
    카운터 dict(`db.decisions.reject_reason.<사유>` 등)에 대한 **오탐**. 거짓 경보가 몇 번
    나면 §0의 「경로 없음」 열 전체가 무시되고, 그러면 08-06이 겪은 사고가 그대로 재현된다.
    그래서 부모가 list·스칼라이거나 **값이 전부 스칼라인 dict**면 판정을 보류한다(미탐 선택).
  근거: |
    08-19 pending 가설의 예측 경로 전수에 잎 부재 검사를 돌려 **3건**을 찾았다. 셋 다
    `path_exists()`를 통과하고 있었다 — 부모 절이 실재하기 때문이다.

      db.decisions.strategies              레버 F의 **대가** 지표. 실재 키는 `entry_strategies`.
                                           무조건발동일 2026-08-25 — 대가를 못 재는 채로 켤 뻔했다.
      db.regime.warmup_minutes             그 잎은 **미구현**이었다(경로가 틀린 게 아니었다).
      db.signal_reach.member_availability  실재 경로는 `db.member_availability.members.<멤버>`.

    08-18 보고서가 이 결함을 **이틀에 두 번** 각각 다른 사고로 적었다(`c1`의
    `db.tables.execution_logs` §3-2 · `2026-08-16-fix1` §7-3). **한 구멍이다.**
  예측:
    - metric: db.decisions.entry_strategies
      expect: "수기 판정(주장) — 08-20 §0에서 이 항목의 실측이 「실측 없음」이 **아닐 것**. 08-19 기준선 {straddle_accumulate: 169, small_strangle_buy: 46}"
      역할: 주장
    - metric: db.member_availability.members.options_flow.available_minutes
      expect: "수기 판정(주장) — non-null. 08-19 기준선 369분(구조적 미가용 110분)"
      역할: 주장
    - metric: db.decisions.total
      expect: "수기 판정(대가) — 08-20 §0의 「경로 없음」 표시 건수. 지금 0이다. **오탐이 생기면 이 값이 아니라 그 열이 부푼다** — 이 경로는 표가 실제로 채워졌음을 보이는 앵커다"
      역할: 대가
  주의: |
    ⚠ **이 정정은 소급이 아니다.** `expect`의 부등식은 한 글자도 안 바꿨고, 세 항목 다 정정
    전 실측이 `None`이라 **어떤 판정도 이 수정으로 뒤집히지 않는다.**
    ⚠ 회귀는 `tests/test_ops_hypotheses.py`가 지킨다 — 저장소의 pending 가설 전건을 **가장
    최근 사이드카**에 대고 돌린다. 등재 시점 검사만으로는 부족하다: 등재할 땐 살아 있던 경로가
    나중에 옮겨지는 형태(`c1`의 `db.tables.execution_logs`)를 못 잡는다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    린트는 08-21에도 통과했다(죽은 잎 0건). 다만 그것은 **그날 죽은 경로가 없었다**는
    뜻이지 린트가 죽은 경로를 잡는다는 확인이 아니다 — 그 확인은 이미 단위 테스트
    (`test_the_2026_08_05_dead_paths_would_now_be_caught`)가 하고 있고, 하루치 실측이
    거기에 더할 것이 없다. 예정일이 지났으므로 닫는다.
  상태: inconclusive

- id: "2026-08-19-regime-warmup-is-measurable"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: |
    재기동이 레짐을 warmup으로 되돌린 분 수를 기계가 세면, 그 대가를 사람이 로그를 훑지 않고
    본다. **레버 `REGIME_RESTORE_SESSION_WINDOW`의 OFF 기준선이 그 값이다.**
  근거: |
    `2026-08-12-fix7`의 주장 지표가 `db.regime.warmup_minutes`인데 그 잎이 없었다. 재료는
    08-05부터 DB에 있었다(마이그레이션 025의 `regime_state.is_warmup`).

    **총합만으로는 그 가설을 판정할 수 없다**는 것이 구현 중에 드러났다: 08-19 총합은 87분인데
    보고서가 손으로 구한 값은 58분이다. 87 = 29 × **3**이고 첫 29분은 정상 기동의 warmup이라
    재기동과 무관하다. 그래서 `warmup_runs`와 **첫 구간을 뺀** `warmup_restart_minutes`를
    함께 낸다.
  예측:
    - metric: db.regime.warmup_restart_minutes
      expect: "수기 판정(주장) — 재기동이 **없는** 날 이 값이 **0**인가(08-18 실측 0 · 08-19 실측 58 = 29×2). 0이 아니면 구간 분리가 틀린 것이다"
      역할: 주장
    - metric: db.regime.warmup_unknown_minutes
      expect: "<= 0"
      역할: 참고
  주의: |
    ⚠ **`NULL`을 0으로 접지 않는다.** 마이그레이션 025 이전 행은 `is_warmup`이 `NULL`이고
    그것은 「warmup이 아니었다」가 아니라 「안 적었다」다. `warmup_unknown_minutes`가 그날
    총 분 수와 같으면 이 지표는 판정에 못 쓴다.
    ⚠ 이 항목은 **레버와 무관하다** — 재는 것은 「대가가 얼마인가」이고, 레버를 켠 뒤 그 값이
    줄어드는지는 `2026-08-12-fix7`이 맡는다(그쪽에 `전제레버`가 달려 있다).
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남, 소급 적용 금지).**

    **주장 자체는 08-21에 충족됐다**: `db.regime` = warmup_minutes **58** · warmup_runs **2** ·
    **warmup_restart_minutes 29** · warmup_unknown_minutes **0**. 재기동이 **있는** 날의 값이
    처음 나왔고 08-19(29분)와 정확히 같다 — 이틀치 표본이다.
    (「재기동 없는 날 0인가」는 08-18 실측 0으로 이미 확인돼 있었다.)
    예정일이 지났으므로 소급 확정하지 않는다. 「29분이 다음 재기동에서도 재현되는가」로
    축을 바꾼 재등재가 남는다.
  상태: inconclusive

- id: "2026-08-19-fix6-shape-log-carries-nonzero-members"
  구현일: 2026-08-19
  검증예정일: 2026-08-20
  가설: |
    「판단 형태 전이」 줄이 **비영 멤버 수**를 함께 실으면, 장중 회차가 「가용 4/6」을 축
    가용성 ✅로 읽는 일이 없어진다.
  대가: |
    로그 문구가 바뀐다 — 08-04에 문구가 움직이며 정규식이 눈이 멀어 **362건이 0건으로**
    보고된 전례가 있다. 그래서 파서를 **먼저** 이중화했고 옛·새 문구를 한 정규식이 받는다.
    대가 지표는 그 파서가 계속 값을 내는가다.
  근거: |
    08-19 장중 회차가 이 줄의 `4/6`을 보고 ✅로 읽었고, 장후 DB 축이 같은 날 실질 **2.36**을
    냈다(가용 3.43 · 죽은 축 1.07 — `regime_hmm` 410분 전량 중립).
    **0점은 중립이지 의견이 아닌데**(`fusion/ensemble.EnsembleResult`) 0점 멤버도 「가용멤버」
    목록에는 남는다. 값은 이미 있었다 — `decision.effective_member_count`가 08-06부터
    계산돼 `signal_decisions.risk_gate_state`에 적재된다. **로그에만 없었다.**
  예측:
    - metric: db.decisions.member_count.effective_mean
      expect: "수기 판정(주장) — 08-20 증거 §5-2의 「비영 멤버 최소~최대」가 이 DB 축 평균과 **같은 범위**를 말하는가. 08-19 기준선 2.36(가용 3.43). 두 축이 갈리면 한쪽이 틀린 것이고, 그 판별이 이 fix의 값이다"
      역할: 주장
    - metric: db.decisions.member_count.available_mean
      expect: "수기 판정(대가) — 08-20 증거 §5-2의 「형태 분포」가 여전히 채워지는가(파서가 새 문구에서 눈멀지 않았는가). 08-19 기준선: 전이 192건 · 4/6 ×167"
      역할: 대가
  주의: |
    ⚠ **다음 기동부터 실린다.** `fusion/engine.py`는 관측 루프 프로세스가 읽으므로 08-19
    장중 로그는 옛 문구 그대로다. 08-20 증거에서 §5-2가 「안 셌다」로 인쇄되면 그것은
    **기동이 안 됐다는 뜻**이지 비영이 0이라는 뜻이 아니다.
    ⚠ 로그 축 지표(`logs.signal_shape.…`)는 **만들지 않았다.** 08-19 보고서가 그 경로를
    예측치로 적었는데 `log_metrics.py`에는 형태 전이 파서가 **애초에 없다** — 지어내면
    그것이 바로 같은 날 §5 고도화 3이 잡으라고 한 「죽은 경로」다.
    필요해지면 `log_metrics`에 파서를 신설하고 `crosscheck`가 두 축을 대조하게 한다.
  판정근거: |

    ⚠ **2026-08-23 종결 — `inconclusive`(예정일 08-20에서 사흘 지남).**

    **문구는 08-21에 살아 있었다** — 판단 형태 전이 줄이 「가용멤버 [...](4/6, 비영 3)」
    형태로 비영 수를 실었다. 그러나 같은 날 이 줄의 **다음 결함**이 드러났다: 축이 빠진
    분을 알려면 여전히 **두 줄을 겹쳐 봐야** 하고, `options_flow` 이탈 6회를 여섯 번 다
    사람이 눈으로 찾았다(08-21 §1-10). 그 축은
    `2026-08-21-fix7-member-exit-is-an-event`가 받는다.
  상태: inconclusive

- id: "2026-08-20-daily-check-is-one-file-per-day"
  구현일: 2026-08-20
  검증예정일: 2026-08-21
  가설: |
    점검 산출물을 **하루 한 파일**(`{날짜}_마흐디_일일점검.md`)로 바꾸면서 그 이름을 아는
    곳을 **전부 같이** 옮기면, 이름이 바뀐 다음 날에도 「장전 점검 미발화」 오보가 울리지 않는다.
  대가: |
    파일명 규약이 바뀌므로 **옛 이름을 찾던 경로 전부가 조용히 눈이 먼다.** 가장 위험한 것은
    `latest_report_before()`의 `_REPORT_GLOB`이다 — 옛 이름만 찾으면 §8-1 「전일 보고서 대조」가
    전환일 이후 **영구히** 빈다. 그래서 신·구 두 패턴을 함께 찾도록 고쳤고, 대가 지표는
    워치독 자신의 판정 주기가 이 변경으로 밀리지 않는가다.
  근거: |
    2026-08-20 장전 §1-4가 같은 계열의 실패를 실측했다: 08-19에 `start_mahdi_premarket.bat`이
    크래시 로그에 기동 표식을 넣자 `collect_evidence.py:1352`의 mtime 판정이 **매일 뜨는 오탐**이
    됐다. **한쪽만 옮기면 다른 쪽이 눈이 멀거나 헛것을 본다.**

    이번 전환에서 이름을 아는 곳은 다섯이다 — `watchdog._CHECK_DOC_PATTERN` ·
    `collect_evidence` 산출물 목록 · 같은 파일의 `_REPORT_GLOB` · `test_watchdog_observation_loop`
    · `phases.md` 회차 표. **다섯을 한 커밋에 함께 옮긴다.**
  예측:
    - metric: watchdog.missing_check_alerts
      expect: "== 0"
      역할: 주장
    - metric: watchdog.checks
      expect: "수기 판정(대가) — 08-20 실측 **57**. 파일 존재 확인 한 번이 늘 뿐이라 이 값은 안 움직여야 한다. 줄면 워치독 자신이 느려진 것이고, 그때는 08-12의 실패(감시자가 감시를 못 함)를 재현한 것이다"
      역할: 대가
  주의: |
    ⚠ **08-20 값으로는 판정할 수 없다.** 오늘은 옛 이름(`{날짜}_점검_pre.md`)이 실재하므로
    워치독이 고쳐졌든 안 고쳐졌든 `missing_check_alerts`는 0이다. **판정이 갈리는 날은
    새 이름만 존재하는 첫 날(2026-08-21)이다** — 그날 1이면 워치독이 옛 이름을 보고 있는 것이다.
    ⚠ **기계가 못 재는 두 가지는 사람이 눈으로 본다**(지표 경로를 지어내지 않는다 —
    그것이 08-19 §5 고도화 3이 잡으라고 한 「죽은 경로」다):
      1. 증거 §9 산출물 표에 `_점검_pre/intra/intra_1430` 「없음 ⚠」 3줄이 **사라졌는가**
      2. 증거 §8-1이 직전 보고서를 **찾았는가**(「못 찾았다」로 인쇄되면 glob이 좁은 것이다)
    ⚠ **Claude 앱 예약 3종의 프롬프트는 리포 밖이다.** 그것이 옛 파일명을 지시하는 한
    이 커밋만으로는 전환이 끝나지 않는다 — 사용자 조치 항목이다.
  판정근거: |

    ✅ **2026-08-23 확정 — `confirmed`(검증예정일 2026-08-21의 실측으로).**

    근거 셋이 전부 맞았다.
      1. 08-21 `docs/동작점검/`에 생긴 파일은 **`2026-08-21_마흐디_일일점검.md` 하나뿐**이고
         옛 이름(`_점검_pre/intra/intra_1430.md`)은 네 회차 어디서도 안 생겼다.
      2. **주장** `watchdog.missing_check_alerts` = **0** (예측 `== 0`). 09:00 이후 전량 grep.
      3. **대가** `watchdog.checks` = **63** (08-20 실측 57 근처, 줄면 안 된다) — 오히려 +6.
         워치독 자신은 안 느려졌다.

    ⚠ **`_CHECK_DOC_LEGACY_PATTERNS`(옛 이름 폴백)는 아직 비우지 않는다.** 하루 표본으로
    폴백을 지우는 것은 08-20 DECISION_LOG 결정 3의 조건에 못 미친다 — 월요일(2026-08-24)
    장전이 한 번 더 통과하는 것을 보고 비운다.
  상태: confirmed

