# 마흐디 가설 검정 파일 — "예측 → 실측" 대조를 자동화한다 (운영점검보고서 2026-07-31 §5-1).
#
# 규약: **fix를 구현하는 세션은 그 자리에서 여기에 예측치를 적는다.**
#       다음 거래일 `scripts/daily_ops_report.py`가 자동으로 실측과 대조해 리포트 §0에 낸다.
#       예측치를 못 적겠으면 그 fix는 아직 근거가 부족한 것이다 — 07-30의 "밀린 데이터는
#       어차피 유실"이라는 추론이 예측치 형태로 강제됐다면 그날 바로 걸렀을 것이다.
#
# 필드:
#   id            고유 식별자(날짜-항목)
#   구현일/검증예정일  검증예정일이 지난 pending 항목은 확정될 때까지 계속 표에 남는다
#   가설          한 문장
#   예측[].metric 지표 경로. 로그 지표는 그대로, DB 지표는 `db.` 접두사
#                 (사용 가능한 경로는 docs/동작점검/auto/YYYY-MM-DD_지표.json 참고)
#   예측[].expect "<= 5" / ">= 95" / "0 ~ 10" 만 자동 판정한다. 그 외는 "수기 판정"으로 남는다
#   상태          pending | confirmed | refuted | inconclusive | untested
#                 untested = 그날 프로세스에 fix가 안 실려 검증 자체가 성립 안 됨
#                 (2026-08-04 p4: fix 커밋 07:45, 관측 루프 기동 07:30 — 15분 차이로 하루를 잃었다.
#                  '반증'으로 적으면 멀쩡한 fix를 되돌리게 된다. 반드시 구분할 것)
#                 **자동으로 바뀌지 않는다** — 사람이 보고서를 쓰면서 손으로 확정한다
#                 (자동 판정이 틀렸을 때 조용히 덮이는 것을 막기 위함)

- id: "2026-08-01-p1-expiry-burst"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "만기유동성 30레그 버스트를 북별 홀수분 슬롯(1/3/5)으로 나누면 mod10=2 충돌이 사라진다"
  근거: "07-31 실측 — 버스트 점유 중앙 55.5초(최대 109초)가 2분대 짝수분 사이클을 덮어 밀림 17건"
  예측:
    - metric: bursts.만기유동성.occupancy_seconds.median
      expect: "<= 20"
    - metric: bursts.만기유동성.calls_per_burst_median
      expect: "<= 12"
  검정: |
    2026-08-03 확정 — 점유 중앙 55.5 → 11.47초, 콜/버스트 중앙 10. 북별 timestamp도 1/3/5분대로 갈렸다(regular 08:31 / weekly_mon 08:33 / weekly_thu 08:35). mod10=2 밀림 17 → 4건.
  상태: confirmed

- id: "2026-08-01-p2-catchup"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "밀린 분을 먼슬리 10레그로 회수하면 먼슬리 커버리지가 95% 이상으로 돌아온다"
  근거: "07-31 실측 — Fix#3(격자 스냅) 이후 밀림 1회 = 결손 1분 확정, 커버리지 95.0%→90.3%"
  예측:
    - metric: db.monthly_coverage.coverage_pct
      expect: ">= 95"
    - metric: rest.calls_per_second
      expect: "<= 0.46"
  주의: "회수 로그가 적게 나오는 건 실패가 아니라 성공 신호다(우선순위 1이 밀림 자체를 줄이면
        발동 횟수도 준다) — 밀림 건수와 회수 건수를 함께 읽을 것."
  검정: |
    2026-08-03 확정 — 먼슬리 커버리지 90.5 → 98.8%, 초당 0.451건. 다만 회수 35회 × 10레그 = +350건이 총수요 증가분(12,947 → 13,364)의 대부분이며, 밀린 직후 페이서가 붐빌 때 10콜을 더 밀어넣는 구조라 EGW00201 비율 악화(0.49 → 0.65%)에 기여했을 가능성이 있다(보고서 §2-5).
  상태: confirmed

- id: "2026-08-01-p3-slow-call-attribution"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "느린 호출을 페이서대기/HTTP로 나눠 재면 mod10=0 구간의 8~9초 정체 원인이 특정된다"
  근거: "07-31 실측 — 연속 지연 에피소드 7건이 전부 mod10=0, 페이서 배율(최대 1.82배)로 설명 불가"
  예측:
    - metric: slow_calls.count
      expect: ">= 1"
  주의: "이 항목은 '고친다'가 아니라 '원인을 특정한다'가 목표다. 페이서대기 우세면 예약 큐 경합,
        HTTP 우세면 KIS 서버/커넥션 풀, 둘 다 작으면 이벤트 루프·스레드풀 블로킹.
        RemoteProtocolError 8건(07-31)이 같은 시각대에 있었던 것도 함께 볼 것."
  검정: |
    2026-08-03 확정 — 933건 수집. 우세 분류는 페이서 450 / HTTP 483으로 반반이나 극단값은 전부 HTTP 쪽이고, 최대 10.00초는 httpx.Client(timeout=10.0) 천장이다(read_timeout 1건). RemoteProtocolError 8건과 함께 원인을 커넥션 풀 재사용 실패로 특정했다(보고서 §2-0 p3 → §4 우선순위 3).
  상태: confirmed

- id: "2026-08-01-p4-cb-heartbeat"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "하트비트를 메시지 핸들러에서 분리하면 updated_at이 장마감까지 300초마다 갱신된다"
  근거: "07-31 실측 — H0UNMKO0은 세션 전이 시에만 오고(하루 2건) updated_at이 09:00:05에 멈췄다"
  예측:
    - metric: db.market_halt.updated_at
      expect: "15:4x (수기 확인)"
  주의: "last_message_at은 09:00 부근에서 멈춰 있어도 정상이다 — 여기에 임계를 두면 상시 오경보."
  검정: |
    2026-08-03 확정 — updated_at 15:41:06(장마감 4분 전)까지 300초 주기 갱신. 단 오늘 H0UNMKO0 수신이 0건이었고(last_message_at NULL) 하트비트가 그 사실을 가렸다 — 예측 자체는 맞았으나 새 문제가 드러났다(보고서 §2-4 → §4 우선순위 4).
  상태: confirmed

- id: "2026-08-01-p5-wall-clock-phase"
  구현일: 2026-08-01
  검증예정일: 2026-08-03
  가설: "폴러 위상을 벽시계 자정 격자에 앵커하면 설계 표대로 실현된다"
  근거: "07-31 실측 — 설계 35/155/275초가 실측 95/198/305초로 어긋나 있었다(기동 시각 앵커)"
