- id: "2026-08-03-p5-rv-ratio-activation"
  구현일: 2026-08-03
  검증예정일: 2026-08-04
  가설: "유효 종가가 21일째가 되는 08-04에 rv_ratio가 중립값 1.0을 처음 벗어난다"
  근거: "08-03 실측 — underlying_daily_closes()의 정규장 기준 유효 종가가 정확히 20일
        (07-06~08-03). regime_features.rv_ratio()는 21개 미만이면 중립값 1.0을 반환한다."
  예측:
    - metric: db.feature_store.non_neutral_pct.rv_ratio
      expect: "> 0"
  주의: "이건 fix가 아니라 **자연 해소**다(07-30 Fix#5의 예상 시점). 08-04에도 0%면 그때는
        underlying_spot_1m의 정규장 필터나 일자 카운트 쪽을 의심해야 한다.
        로그에 `피처 활성화: rv_ratio가 중립값(1.0)을 처음 벗어났다` 한 줄이 남는지도 함께 볼 것
        (§5-2 전이 로깅) — 줄이 안 나오면 그 자체가 이상 신호다."
  상태: confirmed

