# 2026-08-10 — HMM 재학습 시도가 드러낸 것들. 레짐 엔진을 처음 켜려다 **네 겹의 결함**을 찾았다.
# 넉 달간 WARMUP 폴백이라 아무도 몰랐고, 켜는 순간 전부 한꺼번에 나왔다.
# ==========================================================================================

- id: "2026-08-10-r1r3-session-aware-hmm"
  구현일: 2026-08-10
  검증예정일: 2026-08-11
  가설: "세션별로 학습하고 세션 누적 창으로 예측하면, 레짐이 처음으로 시장을 따라간다"
  근거: |
    08-10 첫 재학습은 게이트를 통과하고 저장까지 됐는데 **라이브에서 상수 출력**이었다.

      startprob_ = [0, 0, 0, 0, 0, 1.0, 0, 0]   # 7개가 부동소수 정확히 0.0

    원인이 둘이고 둘 다 필요했다:
      R1  `fit()`이 `lengths=` 없이 25세션을 **한 시퀀스**로 학습 → EM이 startprob을 관측된
          시작점 1개에서 추정 → one-hot 붕괴.
      R3  `step()`이 `predict(np.array([features]))`로 **길이 1**을 넘김 → 길이 1의 사후확률은
          `normalize(startprob ⊙ emission)`이라 **전이행렬이 통째로 안 쓰임** → startprob이 답을
          지배 → 전 이력 8,241분이 전부 TREND_UP_STRONG.

    같은 모델을 전 구간 한 시퀀스로 Viterbi하면 6종이 나온다 — **모델에는 정보가 있었고
    호출 방식이 그것을 버렸다.**

    어느 하나만 고쳐도 안 되는 이유(전 이력 리플레이 실측):
      현행(원시퀀스 + 길이1)  방문 1/8   전이 0%/분
      B만(격리모델 + 창)      방문 8/8   — 단 모든 세션이 TREND_UP_STRONG에서 강제 출발
      A만(lengths + 길이1)    방문 5/8   — **startprob 비영 5종 밖으로 구조적 도달 불가**
                                          (장중 발생 CRISIS_DEFENSE는 영원히 관측 못 함)
      A+B                     방문 8/8   일별 2종 이상 15/21일
  예측:
    - metric: db.regime
      expect: |
        수기 판정 — `is_warmup=false`인 분이 **존재하는가**. 25영업일 연속 WARMUP이었으므로
        이 값이 0이면 모델이 안 실린 것이다(존재부터 예측한다 — README 규약)
      역할: 주장
    - metric: db.regime
      expect: |
        수기 판정 — 하루 방문 레짐이 **2종 이상**인가. 재학습 모델을 RegimeStateMachine에
        직접 태운 최근 5영업일 재생에서 전부 2종이었다. 조용한 날 1종은 정상이므로
        하루로 반증하지 않는다(며칠 중 2일 이상이면 확인)
      역할: 주장
    - metric: db.decisions.member_count.dead_axis_mean
      expect: |
        수기 판정 — **임계를 철회했다(2026-08-11 Fix#5).** 종전 `< 1.02`는 08-11에 1.06으로
        반증이 찍혔는데, 그 1.06의 정체는 `regime_hmm`이 419분 전량 중립이었던 것이고
        **그것은 결함이 아니라 설계**다: `signal_layer._TREND_DIRECTION`은 TREND_UP/DOWN_STRONG
        에만 방향을 주고, 그날 방문한 셋(VOL_COMPRESSION/RANGE_BALANCED/RANGE_BREAK_PREP)은
        전부 방향이 없다(v6 §7).

        즉 이 값은 **그날 시장이 추세였는가의 함수**이고, 무조건부 하한을 걸면 조용한 날마다
        멀쩡한 엔진이 반증으로 찍힌다. 판정은 `db.regime.trend_minutes`와 함께 읽고,
        분해는 `db.decisions.member_count.dead_axis_by_member`가 인쇄한다.
      역할: 참고
    - metric: db.regime.trend_minutes
      expect: |
        수기 판정 — **`regime_hmm` 판정의 전제 조건**이다(2026-08-11 Fix#4). 이 값이 0이면
        그날 시장이 추세가 아니었다는 뜻이고, 그때 §14-3의 `regime_hmm` 중립 100%는
        **정상이며 「판정 불가」**다. 0보다 크면 그 분들에서 비영 점수가 나와야 하고,
        안 나오면 그것이 진짜 결함이다.
        08-11 실측 0분(VOL_COMPRESSION 372 / RANGE_BALANCED 29 / RANGE_BREAK_PREP 9).
      역할: 참고
    - metric: qualitative
      expect: |
        수기 판정(대가) — 레짐 전이 로그가 **하루 2~20회** 범위인가. 25영업일간 1회였다.
        재생 실측 전이율은 0.5~5.0%/분(08-04 0.8 / 08-05 1.6 / 08-06 5.0 / 08-07 0.5 / 08-10 0.5).
        **100회를 넘으면 채터링 회귀**이므로 그때는 08-10에 격리한 모델과 같은 병이다
      역할: 대가
  주의: |
    **`stability_flag`는 이 사고를 못 잡는다** — 08-10 격리 모델은 매분 **확률 1.000으로 확신하며**
    뒤집혔다. `_UNSTABLE_PROB_THRESHOLD = 0.40`은 최대확률만 보므로 "확신하며 채터링"이 통과한다.
    재생에서도 REGIME_UNSTABLE은 5일 내내 0분이었다. **임계를 지금 바꾸지 않는다** — 정상 변동폭을
    모르는 상태에서 임계를 먼저 정하면 그 임계가 곧 결론이 된다(08-05 스팟 괴리율의 교훈).
    며칠 쌓아 「확신도 분포가 어떻게 생겼는가」부터 본 뒤에 정한다.

    **확신도 분모 레버(고도화#3)는 이 검증 다음 영업일 이후다** — 원계획의 기준일이 08-10이
    아니라 08-11이 됐으므로 빨라야 08-12. 같은 날 켜면 확신도 변화의 귀속이 불가능해진다.
  판정근거: |
    (2026-08-12 확정 · **08-11 실측**으로 판정한다 — 이 항목의 예정일이 08-11이다)

    세 축이 전부 성립했다. 25영업일 연속 WARMUP + RANGE_BALANCED이던 레짐이 처음 의견을 냈다.

      is_warmup=false 존재     09:14부터 **372분** (0이면 모델이 안 실린 것이다)
      모델=predict 실주행       09:14:59, 창 30분
      하루 방문 레짐            **3종** — VOL_COMPRESSION 372 / RANGE_BALANCED 29 / RANGE_BREAK_PREP 9
      레짐 전이                 **2회** (예측 범위 2~20). 08-10에 격리한 모델은 분당 99.2%였다
      stability_flag            predict 구간 전량 True

    08-10 재생에서 08-07/08-10 지배 상태가 VOL_COMPRESSION이었으므로 **재생과 라이브가 일치한다.**

    ⚠ 사후확률 100%는 08-10에 문제였던 「확률 1.000으로 확신하며 뒤집힘」과 **형태가 같다.**
    구분 기준은 확률이 아니라 **전이율**이고, 그것이 이 확정의 핵심 근거다.

    ⚠ 참고 지표 둘은 판정에 안 썼다: `dead_axis_mean`(1.06)은 08-11 Fix#5로 임계를 철회했고,
    `trend_minutes`는 그날 아직 없던 지표라 `실측 없음`이다(그 전제 조건 자체가 08-11에 생겼다).
  상태: confirmed

- id: "2026-08-10-r6-monthly-only-atm-iv"
  구현일: 2026-08-10
  검증예정일: 2026-08-11
  가설: "ATM IV를 먼슬리 북 하나에서만 재면 iv_chg의 분 단위 구형파가 사라진다"
  근거: |
    R1·R3을 고친 뒤 재학습한 모델은 게이트 3겹을 **전부 통과**했는데, `RegimeStateMachine`에
    직접 태워 08-10을 재생하니 **분당 99.2%가 레짐 전이**였다(381분 중 378회).

    원인은 모델이 아니라 피처였다. `_update_atm_iv()`가 `rows` 전체에서 ATM 행사가를 고른 뒤
    **그 행사가를 가진 모든 북의 IV를 평균**하는데, 위클리는 `_books_due_this_cycle()`로
    **격분에만** 조회된다:

      짝수분  위클리(08-10) + 먼슬리(08-13) 평균   IV 0.5285
      홀수분  먼슬리 단독                          IV 0.7387

    → `iv_chg` 차분 lag1 자기상관 **−0.900**(완벽한 구형파). 그 진동을 학습한 HMM이
    **"짝수분=TREND_UP_STRONG / 홀수분=VOL_COMPRESSION"을 94% 일치**로 재현했다.
    레짐이 시장이 아니라 **폴링 격자**를 따라간 것이다.

    `_books_due_this_cycle()` docstring은 이미 *"먼슬리를 먼저 조회해 ATM IV가 항상 주력 북
    기준으로 잡히도록"* 이라고 적고 있었다 — **의도는 맞았고 구현이 안 지켰다.** 조회 순서로는
    못 지킨다(필터가 strike 기준이라 뒤에 온 위클리가 같은 행사가면 그대로 섞인다).
    2026-08-06 Fix#4가 체인 나이 지표에서 고친 것과 **같은 계열**이고 이 함수만 빠져 있었다.

    수정 후 실측(전 이력 10,923분 재구성): 홀짝 평균 격차 **0.0300 → 0.0001**.
  예측:
    - metric: qualitative
      expect: |
        수기 판정(주장) — 08-11 `feature_store`의 `iv_chg`를 분 홀짝으로 나눈 평균 격차가
        **0.01 미만**인가. 08-10 DB 실측은 짝수분 −0.26420 / 홀수분 +0.30419 (격차 0.568)
      역할: 주장
    - metric: qualitative
      expect: |
        수기 판정(주장) — 같은 날 `iv_chg` 차분 lag1 자기상관이 **−0.6보다 위**인가.
        08-10 실측 −0.900. 재구성 실측 −0.459이고 그 값은 **잡음의 이론적 하한**(−0.5)
        근처라 정상이다 — 0을 기대하면 안 된다
      역할: 주장
    - metric: db.tables.feature_store.rows
      expect: ">= 300"
      역할: 대가
  주의: |
    **`feature_store`의 과거 행은 고치지 않는다**(2026-08-10 사용자 결정). 그날 실제로 계산된
    값이 무엇이었는지는 기록으로 남아야 한다. 학습은 `reconstruct_iv_chg()`가 원본 체인에서
    다시 만든 값을 **학습 입력에서만** 쓰고, 그 사실은 로그·모델 `metadata`·리포트 §13
    세 곳에 남는다.

    따라서 **08-11 이후의 DB 값과 08-10 이전의 DB 값은 모집단이 다르다** — `iv_chg` 시계열을
    이 경계를 넘어 직접 비교하지 말 것(08-07 Fix#1의 GEX와 같은 상황이다).

    라이브(`main._update_atm_iv`)와 오프라인 재계산이 **같은 함수**(`options_intel.monthly_atm_iv`)
    를 쓴다. 두 곳에 같은 로직을 적으면 한쪽만 바뀌어도 학습과 라이브가 갈리는데, 그것이 곧
    이 사고의 구조다.
  판정근거: |
    (2026-08-12 확정 · 08-11 실측)

    구형파는 돌아오지 않았다. 종일 n=410.

      홀짝 평균 격차        08-10 **0.568** → 08-11 **0.00506**  (합격선 < 0.01)  ✅
      격차 / 표준편차        —                 **0.041**                            ✅
      차분 lag1 자기상관     08-10 **−0.900** → **−0.348**       (합격선 > −0.60)  ✅
      feature_store 행       **410** (>= 300)                                       ✅

    ⚠ 장중 09:22 시점엔 격차가 0.0121로 합격선을 살짝 넘었는데 **표본(n=33) 부족이 원인**이었다.
    종일 표본에서 0.00506으로 들어왔다 — **장중 지표로 합격 판정을 내리지 말 것**의 사례로 남긴다.
  상태: confirmed

- id: "2026-08-10-r4r7-save-gates"
  구현일: 2026-08-10
  검증예정일: 2026-08-11
  가설: "저장 게이트를 라이브 축으로 재구축하면, 나쁜 모델이 조용히 배포되지 않는다"
  근거: |
    08-10에 가드 **둘이 둘 다 다른 것을 재고 있었다**:
      방문 상태 검사  전 이력을 한 시퀀스로 배치 Viterbi → "8/8 방문". 같은 모델을 라이브 축
                     (길이 1 호출)으로 재면 **1/8**. 규약 F 위반의 코드판.
      수렴 가드      `monitor_.converged`는 `iter == n_iter`(반복 소진=비수렴)와 음수 delta
                     (발산)에서 **정확히 True**를 낸다. → `2026-08-07-e4` 확정 참고.

    재구축한 게이트 3겹과 **각자 지키는 것**(음성 대조로 확인):
      check_convergence      history에서 직접 판정(0 <= delta < tol 그리고 iter < n_iter)
      check_startprob        학습 결함(lengths 누락) — 08-10 붕괴 모델을 **여기서** 잡았다
      check_live_diversity   라이브 호출 경로 회귀 — 붕괴 모델도 window=120이면 8종이라 통과하고,
                             window=1(R3 회귀)이면 1종이라 거부한다

    **어느 하나로 다른 쪽을 대신할 수 없다.** 대신하려 들면 "한 축만 재고 통과"가 다시 생긴다.

    R7이 추가로 필요했다: 재계산 피처로 학습하니 `fit()`의 승자가 **delta=−0.32로 발산한
    후보**였다(점수만 보고 골랐다 — 발산 중이면 마지막 로그우도가 우연히 높을 수 있다).
    저장 게이트가 런 전체를 거부했다 — 멀쩡한 후보가 9개 있었는데도. 이제 `fit()`이
    **수렴한 후보 중에서** 최고점을 고른다.
  예측:
    - metric: qualitative
      expect: |
        수기 판정(주장) — 이 게이트들이 **거부한 적이 있는가**. 도입 당일 이미 두 번 일했다:
        (1) `check_startprob`가 붕괴 모델 거부 (2) `check_convergence`가 발산 승자 거부.
        "한 번도 안 걸렸다"는 게이트가 좋다는 뜻이 아니라 **안 재고 있다**는 뜻일 수 있다
      역할: 주장
    - metric: qualitative
      expect: |
        수기 판정(대가) — 게이트 때문에 **정상 모델이 막힌 적이 있는가**. 0이 목표.
        1건 이상이면 어느 게이트가 과하게 조였는지 적고 임계를 재검토한다
      역할: 대가
  주의: |
    **게이트 통과가 배포 승인이 아니다.** 08-10에 게이트 3겹을 전부 통과한 모델이 재생에서
    99.2% 채터링이었다(R6). 저장 뒤에는 반드시 `RegimeStateMachine`에 **직접 태워** 며칠을
    재생하고 전이율을 본다 — 그것이 게이트가 아직 못 재는 축이다.

    이 "재생 검사"를 게이트로 승격하지 않은 이유: 무엇이 정상 전이율인지 아직 모른다.
    실측 0.5~5.0%/분이 전부이고 5영업일치다. **정상 범위를 모르는 상태에서 임계를 먼저
    정하면 그 임계가 곧 결론이 된다.** 며칠 쌓아 사람이 정한 뒤에 승격한다.
  판정근거: |
    (2026-08-12 확정 · 근거는 **도입 당일(08-10)** 실측이다 — 아래 ⚠ 참고)

    주장 「이 게이트들이 거부한 적이 있는가」는 **도입 당일 이미 두 번 답이 나왔다**:
    `check_startprob`가 붕괴 모델을 거부했고, `check_convergence`가 발산 승자를 거부했다.
    대가 「정상 모델이 막힌 적이 있는가」는 **0건**이다.

    ⚠ **표본은 아직 그 하루뿐이다.** 08-10 이후 재학습이 없다(08-12 리포트 §13: 레짐 모델 학습
    시각이 여전히 `2026-08-10T16:56:34`). 즉 예정일 08-11에도, 그다음 날에도 게이트는 **한 번도
    안 돌았다.** 그런데도 pending으로 더 끌지 않는 이유: 이 가설이 묻는 것은 「거부한 적이
    있는가」이고 그 답은 이미 나왔으며 되돌릴 수 없다. **다음 재학습 때 대가 축(정상 모델 차단)을
    다시 볼 것** — 그때 1건이라도 나오면 어느 게이트가 과하게 조였는지 새 항목으로 연다.

    ⚠ 위 `주의`가 여전히 유효하다: **게이트 통과는 배포 승인이 아니다.** 3겹을 전부 통과한 모델이
    재생에서 99.2% 채터링이었다.
  상태: confirmed

# ==========================================================================================
# 2026-08-10 저녁 2차 — 종일 완결 분석이 드러낸 계측 실명. 파서가 "가장 나쁜 사이클"에서만
# 눈이 멀고 있었다.
# ==========================================================================================

- id: "2026-08-10-w1w2-cycle-parser-blindness"
  구현일: 2026-08-10
  검증예정일: 2026-08-11
  가설: "재시도 사이클을 읽고 결손을 라벨 축으로 재면, 로그축 결손이 DB축을 넘지 않는다"
  근거: |
    08-10 종일 완결에서 리포트가 「인프라 결손 3분(11:09, 15:15, 15:21)」을 냈다.
    494개 사이클을 전수 검산하니 **셋 다 허위**였고 원인이 둘이었다.

    (a) **정규식이 `, 재시도함` 변형을 못 읽는다.**
        포맷  `(rows=%d, 밀림=%.1f초%s, 타폴러…)`   ← 재시도함이 밀림 뒤
        정규식 `\(rows=(\d+)(?:, 재시도함)?, 밀림=…`  ← rows 뒤로 기대
        포맷은 07-28(`e85e65d`), 정규식은 08-01(`6f15e84`) — **옮겨 적을 때부터 틀렸다.**
        10일 잠복 후 08-10 15:15에 첫 발현: 그날 유일한 재시도 사이클이 사라져
        사이클 494→493, 그 분이 「결손」으로 오분류. **하필 그 분이 옵션체인 전멸(rows=0)이라
        그날 가장 중요한 사이클이었다.** `rows_distribution`(08-04 Fix#8의 검증 지표)에서도
        빠져 있었다.

    (b) **결손 축이 파생 start(종료 − 소요 합)를 쓴다.** 소요가 소수점 2자리로 반올림돼
        분 경계보다 몇 ms 앞에 떨어진다:
            11:09 → 파생 11:08:59.996 (4ms)
            15:21 → 파생 15:20:59.999 (1ms)
        08-07 Fix#3이 `분=` 라벨이라는 진실 소스를 만들었는데 이 지표만 옛 축에 남아 있었다.

    **계약 테스트가 있었는데도 못 잡은 이유**: 기존 테스트가 재시도 자리에 **`""`만** 넣었다.
    포맷은 검사했지만 **포맷의 변형**은 안 했다. 조건부 조각은 상황이 나쁠 때만 채워지므로,
    안 재면 파서는 정확히 가장 나쁜 순간에만 눈이 먼다.

    수정 후 08-10 재집계 실측:
        사이클        493 → 494
        결손 분         3 → 0
        인프라 결손      3 → 0
        rows=0 사이클  없음 → 1   (전멸 사이클이 이제 분포에 보인다)
        REST수집 평균  22.83 → 22.89초 (49.56초 사이클이 평균에 들어왔다)
  예측:
    - metric: cycles.missing.count
      expect: "== 0"
      역할: 주장
    - metric: cycles.duplicate_poll_minutes.labelled
      expect: |
        수기 판정 — **그날 사이클 수와 같아야 한다**(규약 C). 이 둘이 어긋나면 라벨이 없는
        사이클이 있다는 뜻이고, 그때 `missing.count == 0`은 「결손이 없었다」가 아니라
        「못 쟀다」이다
      역할: 주장
    - metric: qualitative
      expect: |
        수기 판정(불변식) — 리포트 §4에서 **로그축 결손 <= DB축 0행 분**인가.
        사이클이 돌고도 행이 0일 수는 있지만 그 반대는 계측 결함이다.
        08-10에 로그 3분 > DB 1분이었고 그것이 이 fix를 부른 신호였다
      역할: 주장
  주의: |
    **이 fix는 손실을 줄이는 게 아니라 보이게 하는 것이다.** 08-10의 결손은 원래부터 0분이었고,
    바뀐 것은 리포트가 그것을 정직하게 말하게 된 것뿐이다. 「결손 3분 → 0분」을 **개선으로 읽으면
    안 된다** — 08-04에 `slow_calls` 0건을 개선으로 읽은 것과 같은 실수가 된다.

    반대로 **`rows=0` 사이클이 1건 보이기 시작한 것은 나빠진 게 아니라 원래 있던 것이다.**
    08-10 15:15의 옵션체인 전멸은 실재했고, 그 분은 GEX/감마플립 입력이 없었다.

    `cycles.count`가 08-07(494)과 08-10(494)이 같은 것은 우연이다 — 관측 분 수가 비슷했을 뿐
    비교 대상이 아니다.
  판정근거: |
    (2026-08-12 확정 · 08-11 실측)

      cycles.missing.count                      **0**  (예측 == 0)                    ✅
      cycles.duplicate_poll_minutes.labelled    **494** == 그날 사이클 494 (규약 C)    ✅
      불변식 로그축 결손 <= DB축 0행 분          **0 <= 27**                            ✅

    08-10에 이 자리가 「로그 3분 > DB 1분」을 냈고 그것이 계측 결함의 신호였다. 라벨이 그날
    사이클 수와 정확히 같으므로 `missing.count == 0`은 **「없었다」이지 「못 쟀다」가 아니다** —
    그 구분이 이 fix의 전부다.
  상태: confirmed

- id: "2026-08-10-x1x3-cause-split-and-structural-vars"
  구현일: 2026-08-10
  검증예정일: 2026-08-11
  가설: "0행 분을 원인별로 가르고 구조 변수를 값 옆에 인쇄하면, 멀쩡한 fix가 반증으로 찍히지 않는다"
  근거: |
    08-10 종일 완결에서 같은 형태의 오판정이 **둘** 나왔다.

    (1) `zero_row_count == 0`(08-07 Fix#3의 불변식)이 반증으로 찍혔는데, 그 1건(15:15)은
        그 fix가 겨냥한 「이웃 분 적재」가 아니라 **「수집 전멸」**(KIS 지연으로 50초 예산 소진)
        이었다. 원인 셋이 한 칸에서 만나 **원인을 주장하는 fix를 검정할 수 없었다.**

    (2) `rest.by_group.옵션체인 <= 9,500`(08-07 e1의 대가 지표)이 확인으로 찍혔는데,
        실측을 보니 북 수가 이미 바뀐 뒤였다:
            08-06  북 3개  9,241
            08-07  북 2개  7,388   ← fix가 실린 날. 이미 임계 아래다
            08-10  북 2개  7,333
        **fix가 실리기도 전에 충족돼 있던 경계**를 fix의 공로로 읽을 뻔했다.

    구현 후 실측: §4 원인 표가 15:15을 `수집 전멸`로 정확히 분류했고, §5가
    「오늘 북 2개(전일과 같다)」를 인쇄한다.
  예측:
    - metric: db.chain_minute_coverage.zero_row_by_cause
      expect: |
        수기 판정(주장) — 이 키가 **존재하는가**(존재부터 예측한다). 그리고 세 원인의 합이
        `zero_row_count`와 같은가. 08-10 재집계에서 수집전멸 1 / 사이클없음 0 / 이웃분 0
      역할: 주장
    - metric: db.signal_reach.gex_input_missing_minutes
      expect: "== 0"
      역할: 주장
    - metric: qualitative
      expect: |
        수기 판정(주장) — §5에 「오늘 북 N개」 줄이 있고, 북 수가 전일과 다른 날에
        **「바뀌었다」 경고**가 뜨는가. 08-11은 08-10과 같은 2북일 것이므로 그날은
        「전일과 같다」가 정상이다 — **경고가 안 뜨는 것으로 이 fix를 반증하지 말 것**
      역할: 주장
    - metric: db.chain_minute_coverage.zero_row_count
      expect: ">= 0"
      역할: 대가
  주의: |
    **`gex_input_missing_minutes == 0`을 "전멸이 무해했다"로 읽으면 안 된다.**
    08-10 15:15에 체인 적재는 0행이었지만 판단은 `option_chain_as_of()`의 **신선도 창**이
    실어 준 직전 스냅샷 10레그로 GEX를 냈다. 신선도 창이 흡수할 수 있는 것은 짧은 결손뿐이고,
    그 창이 얼마나 버티는지는 **별개 문제**다(연속 전멸이 창을 넘기면 이 값이 0이 아니게 된다).

    그 실측이 `LOG_CHAIN_CYCLE_EMPTY`의 종전 문구(*"이 분은 GEX/감마플립 입력이 없다"*)가
    **자기가 아는 것보다 넓게 말하고 있었다**는 것을 드러냈다 — 그 줄은 폴링 루프에서 나오므로
    그 분의 **적재**만 알고 판단이 무엇을 봤는지는 모른다. 문구를 정정했다.

    원인 분해는 로그 축에 `분=` 라벨이 있어야 정확하다. 없으면(08-07 이전) `labelled: false`가
    붙고, 그때 분해는 파생 start 기반이라 **경계 근처 1분이 옆으로 밀릴 수 있다.**
  판정근거: |
    (2026-08-12 확정 · 08-11 실측 · **예측 하나는 잘못 걸었다 — 아래 ⚠**)

      zero_row_by_cause 키 존재      ✅  그리고 세 원인의 합이 정확히 맞는다:
                                       수집 전멸 27 + 사이클 없음 0 + 이웃 분 0 = **27** == zero_row_count
      §5 「오늘 북 N개」 줄            ✅  08-11은 08-10과 같은 2북이라 「전일과 같다」가 정상
      zero_row_count >= 0 (대가)      ✅  27

    ⚠ **`gex_input_missing_minutes == 0`은 19로 반증됐다. 그러나 그것은 이 fix의 반증이 아니다.**
    이 항목의 `주의`가 **그 결과를 미리 적어 뒀다**: *"신선도 창이 흡수할 수 있는 것은 짧은
    결손뿐이고 … 연속 전멸이 창을 넘기면 이 값이 0이 아니게 된다."* 08-11 15:01~15:22에 22분
    연속 전멸이 있었고 창이 그것을 못 버텼다.

    즉 이 값은 이 가설이 주장하는 것(원인 분해가 작동하는가)이 아니라 **그날 KIS가 얼마나 오래
    연속으로 죽었는가의 함수**다. 무조건부 `== 0`을 건 것이 잘못이다.

    ⚠ **규약 G를 확장해도 이것은 안 잡힌다 — 확인했다.** `violates_market_state_rule()`은
    **0이 아닌 하한**(`>` / `>= x>0`)만 막고 `== 0`은 일부러 통과시킨다(불변식·경로 생존 확인이
    그 형태다). 이 지표를 `_MARKET_STATE_DEPENDENT_METRICS`에 넣어도 `== 0`은 그대로 지나간다.

    남는 것은 **사람이 하는 구분**이다: 같은 `== 0`이라도
      · **구조 불변식**  우리 코드가 보장한다(예: `chain_leg_over_design_minutes == 0` —
                        ATM 롤 잔상은 우리가 안 만들면 안 생긴다). 걸어도 된다.
      · **바라는 결과**  시장·KIS가 정한다(이 지표). **걸면 안 된다.**
    이 예측은 후자를 전자처럼 적었다. 규칙으로 기계화할 수 없는 자리이므로 **사례로 남긴다** —
    `== 0`을 쓸 때 「이 0을 누가 보장하는가」를 한 번 묻는 것이 이 항목이 남기는 전부다.

    이 지표는 **버리지 않는다.** 「판단이 감마 지형을 못 본 분」은 계속 봐야 할 값이고, 다만
    불변식이 아니라 **연속 전멸의 종속 변수**로 읽는다(08-12 실측 4분).
  상태: confirmed

- id: "2026-08-11-fix1-timeout-abort"
  가설: |
    연속 read 타임아웃에서 사이클을 조기에 접으면, KIS가 4초 천장에 닿은 분에 확정 실패
    호출을 그만 쏘고 다음 분이 정시에 시작한다.
  대가: |
    조기 포기해도 **그 분의 행은 여전히 0이다** — 이 fix는 데이터를 늘리지 않는다.
    얻는 것은 (1) 다음 분 정시 시작 (2) 확정 실패 호출 제거 (3) 원인이 지표로 갈리는 것이다.
  검증예정일: 2026-08-12
  근거: |
    08-11 15:01~15:22, 22분 연속 적재 0행. 느린 호출 줄의 HTTP 성분이 4.03~4.06초에 못 박혀
    있었고(= read 타임아웃 4.0초에 닿아 끊긴 시각) 페이서 배율은 내내 1.00배였다.
      레그당 = 페이서 1초 + 타임아웃 4초 = 5초  ->  50초 예산에 10레그  ->  전부 실패
    **실패가 성공과 같은 예산을 먹으므로 사이클이 스스로 못 빠져나온다.**
  예측:
    - metric: timeout_abort.count
      expect: ">= 0"
      역할: 주장
    - metric: qualitative
      expect: |
        수기 판정(주장) — `timeout_abort`가 발생한 분에서 `budget_exceeded`가 **함께 세어지지
        않는가**(원인이 갈렸는가). 08-11에는 둘이 한 줄이었다. 전멸이 없던 날에는 둘 다 0이
        정상이므로 **0건으로 이 fix를 반증하지 말 것** — 그날 KIS가 안 느렸다는 뜻이다.
      역할: 주장
    - metric: db.chain_minute_coverage.zero_row_count
      expect: "수기 판정(대가) — 08-11 기준선 27분. 조기 포기는 이 값을 줄이지 않는다(같거나 늘 수 있다)"
      역할: 대가
  주의: |
    **이 fix의 성공을 「전멸 분 감소」로 읽으면 안 된다.** 조기에 접어도 그 분은 0행이다.
    주장 지표는 «원인이 갈렸는가»이지 «데이터가 늘었는가»가 아니다.
    타임아웃 값 자체(Fix#3 레버)는 **오늘 안 건드렸다** — 같은 날 두 변수를 움직이면 08-12
    실측에서 귀속이 안 갈린다.
  판정근거: |
    (2026-08-12 확정 · 08-12 실측 — 이 fix가 처음 실린 날)

      timeout_abort.count            **50회** 발동 (>= 0)                              ✅
      원인이 갈렸는가                 timeout_abort 50 / budget_exceeded 74 /
                                     failure_budget_abort 1 — **셋이 서로 다른 줄**     ✅
      대가 zero_row_count            08-11 **27분** → 08-12 **16분** (줄지 않을 것으로 봤는데 줄었다)

    함께 개선됐다: 먼슬리 절대 커버리지 94.3% → **96.8%**, 레그 미달 12.4% → **10.7%**,
    BS 최소 미달 17분 → **5분**, 백오프 최대 2.25배 → **1.50배**.

    ⚠ **그러나 이 fix는 새 결함을 하나 만들었고 같은 날 고쳤다**: 조기 포기에 북 우선순위가 없어
    50회 **전부**가 컷당한북에 `regular`(먼슬리)를 담았다(26회는 먼슬리 단독). 예산 컷은 74회 중
    2회뿐이다 — 순서는 예산 경로에만 있었다. → `2026-08-12-fix4-abort-scope-book-priority`.
  상태: confirmed

- id: "2026-08-11-fix2-cut-book-attribution"
  가설: |
    예산 컷이 **어느 북에 닿았는지**를 로그에 남기면, 「먼슬리가 잘린 분」이 지표가 된다.
  검증예정일: 2026-08-12
  근거: |
    08-06이 이 값을 손으로 세어(그때 3분) *"먼슬리를 얇게 만든 것은 예산 컷이 아니라 레그
    단위 타임아웃"* 이라는 결론을 냈고 그것이 고도화#1(먼슬리 재시도)의 방향을 정했다.
    **그 실측이 지표로는 없었다.**
  예측:
    - metric: budget_exceeded.priority_cut_minutes
      expect: "== 0"
      역할: 주장
    - metric: budget_exceeded.labelled
      expect: ">= 0"
      역할: 참고
  주의: |
    **규약 C** — `labelled`를 반드시 함께 읽는다. 라벨이 0이면 `priority_cut_minutes`는
    `None`이고, 그것은 「컷이 없었다」가 아니라 「못 쟀다」이다.
    먼슬리 우선 순서상 컷은 뒤쪽 북부터 닿으므로 **0이 정상이고, 0이 아니면 그 자체가 사건**이다.
  판정근거: |
    (2026-08-12 확정 · 08-12 실측 · **예측 `== 0`은 철회한다 — 아래 ⚠**)

    주장은 「컷이 어느 북에 닿았는지가 **지표가 되는가**」였고 그것은 성립했다:

      budget_exceeded.labelled       **74 / 74** — 규약 C 통과. 08-11에는 라벨이 없어
                                     `priority_cut_minutes`가 `None`(「못 쟀다」)이었다
      timeout_abort / failure_budget  같은 라벨이 실린다(50 / 1)

    이 라벨이 없었으면 08-12의 §2-6(조기 포기가 먼슬리부터 자른다)을 **찾을 수 없었다.**

    ⚠ **`priority_cut_minutes == 0`은 2로 반증됐지만 그 예측이 틀린 것이다.** 08-12에 그 2건을
    실측하니 둘 다(12:49:53 / 13:51:53) **홀수분의 꼬리 컷**이었다 — 그 분에는 위클리가 애초에
    due가 아니라 사이클 전체가 먼슬리였고, :53은 사이클 시작(:03)+50초 = 정확히 데드라인이다.
    **자를 것이 먼슬리밖에 없는 분에서 먼슬리를 자르는 것은 순서 문제가 아니다.**

    x1x3과 **같은 형태의 오류**다(규약 G — 성립할 수 없는 상황에 무조건부 임계). 불변식을
    「먼슬리가 잘렸다」에서 **「먼슬리가 위클리보다 먼저 잘렸다」**로 옮겼다:
    후속 지표는 `priority_before_others_minutes`(`2026-08-12-fix5-ordering-breach-not-tail-cut`).
    구 지표는 참고값으로 남긴다 — **두 값이 갈리는 날이 그 fix가 일한 날이다.**
  상태: confirmed

- id: "2026-08-11-eA-failure-budget"
  가설: |
    누적 실패 예산을 시간 예산과 별도로 두면, 성공/실패가 섞여 절반이 죽는 분을 조기에 접는다.
  대가: |
    실패 예산에 걸린 분은 **시간 예산이 남아 있어도 끝난다** — "조금 더 기다렸으면 성공했을
    레그"를 포기할 수 있다.
  검증예정일: 2026-08-12
  근거: |
    08-11 14시대: 예산 초과 20건인데 전멸은 1건뿐(14:31)이었다. 나머지 19분은 **섞여서
    얇아진** 분이고, Fix#1의 **연속** 카운터는 성공 하나에 0으로 돌아가므로 이 패턴을 못 본다.
    그 19분이 먼슬리 레그 완전성 12.4% 미달의 본체다.
  예측:
    - metric: failure_budget_abort.count
      expect: ">= 0"
      역할: 주장
    - metric: db.monthly_leg_completeness.below_design_pct
      expect: "수기 판정(대가) — 08-11 기준선 12.4%. **나빠지면 예산이 너무 빡빡한 것**이다"
      역할: 대가
  주의: |
    임계 6건의 근거는 설계 20레그의 30%이고, 08-11 정상 사이클의 레그 실패가 분당 0~2건
    (180건/494분)이라 그 3배다. **며칠 실측 전에는 이 값으로 결론 내지 않는다.**
  판정근거: |
    (2026-08-12 확정 · 08-12 실측)

      failure_budget_abort.count             **1회** (>= 0)                    ✅
      연속 타임아웃과 갈렸는가                timeout_abort 50 / 이쪽 1 — 별개 줄  ✅
      대가 monthly below_design_pct          08-11 12.4% → 08-12 **10.7%**      ✅ (예산이 빡빡하지 않았다)

    그 1건(14:58:54)의 로그가 설계를 그대로 보여준다: *"남은 8레그를 포기 … **시간 예산은 0.0초
    남아 있었다**"* — 시간이 아니라 **성과**로 먼저 끊긴 것이고, 그것이 이 고도화가 시간 예산과
    별도로 존재하는 이유다. 컷당한북도 `weekly_mon`으로 순서를 지켰다.

    ⚠ 1건은 **표본이 아니다.** 08-11 14시대(예산 초과 20건 중 전멸 1건)처럼 「섞여서 얇아진」
    패턴이 다시 오는 날 이 값이 커져야 하고, 그때 below_design_pct가 나빠지면 6건이 너무 빡빡한 것이다.
  상태: confirmed

- id: "2026-08-11-eB-chain-input-source"
  가설: |
    판단이 **그 분** 체인을 봤는지를 DB에 남기면, 짝수분 staleness가 지표로 보인다.
  검증예정일: 2026-08-12
  근거: |
    08-11 실측(09:00 이후): 홀수분 체인 나이 평균 28.0초 / 짝수분 70.0초.
    `poll_option_chain`이 :00에 시작해 20레그에 19.3초가 걸리는데 판단 위상이 :10초다 —
    짝수분에는 신선도 창이 **직전 분 스냅샷**을 실어 준다. `signal_decisions.gex`가 짝수분마다
    직전 값을 반복한 것이 그 증거다. **그 사실이 어떤 지표에도 없었다.**
  예측:
    - metric: db.signal_reach.chain_input_source.available
      expect: "수기 판정(주장) — True여야 한다(마이그레이션 029가 적용되고 기록이 시작됐다)"
      역할: 주장
    - metric: db.signal_reach.chain_input_source.stale_pct
      expect: "수기 판정(참고) — 08-11 추정 약 50%. **임계를 걸지 않는다** — 위상 레버(Fix#10)를 켜기 전에는 이 값이 높은 것이 정상이다"
      역할: 참고
  주의: |
    `chain_age_seconds_max`(초 단위 연속값)로는 «이 분 것인가»라는 **이산** 질문에 답할 수 없다.
    08-06 §2-4가 같은 함정에 빠졌다(격분 설계상수 130초를 신선도로 착각).
    **`stale_pct`가 높다고 Fix#10을 바로 켜지 말 것** — 두 변수를 같은 날 움직이면 안 된다.
  판정근거: |
    (2026-08-12 확정 · 08-12 실측)

      chain_input_source.available     **True** — 마이그레이션 029 적용, 기록 시작  ✅
      stale_pct                        **84.7%** (임계 없이 인쇄만)

    **이 지표가 없었으면 08-12 §2-5를 못 찾았다.** `chain_age_seconds_max` 하나로는 「느려졌다」만
    알 수 있고 「몇 분이 늙은 값을 봤는가」는 못 센다 — 그것이 이 항목이 생긴 이유였고, 실제로
    정규장(09:00~15:20)을 분 홀짝으로 가르니 **짝수분 188분 전량 stale, 홀수분도 current 18분뿐**
    이었다. 어제 진단(짝수분만 약 50%)에서 홀수분까지 무너진 것이 하루 만에 보였다.

    ⚠ **임계는 여전히 안 건다.** 위상 레버(Fix#10)를 켜기 전에는 높은 것이 정상이다.
    그 레버를 켤 근거가 이 값으로 확정됐고, 순서는 08-13 레버 E → 08-14 판정 → 그다음이다.
  상태: confirmed

- id: "2026-08-11-eC-absolute-move-axis"
  가설: |
    사후 평가에 **|이동폭|**(방향 무관)을 함께 내면, 방향 중립 전략을 맞는 축으로 읽을 수 있다.
  검증예정일: 2026-08-12
  근거: |
    08-11 ENTER 281건이 전부 `straddle_accumulate`(방향 중립)였는데, `hit`은
    `direction x 이동`의 부호라 **방향성 전략을 전제**한다. 스트래들은 어느 쪽으로든 크게
    움직이면 이긴다 — 그날 적중률 열(5m 48.2% / 15m 43.3% / 30m 57.0%)은 틀린 질문에 답했다.
  예측:
    - metric: db.decision_outcomes.horizons
      expect: "수기 판정(주장) — 각 지평에 `abs_move_pct` 키가 **존재하는가**(존재부터 예측한다)"
      역할: 주장
  주의: |
    **임계를 걸지 않는다** — 정상 이동폭 분포를 모르고, 모르는 채 임계를 정하면 그 임계가 곧
    결론이 된다(08-05 스팟 괴리율의 교훈). 며칠 쌓아 사람이 「무엇을 성과로 볼 것인가」부터 정한다.
    이 값도 **되먹임이 아니다**(v6 §11.3 Thompson Sampling은 Phase 3).
  판정근거: |
    (2026-08-12 확정 · 08-12 실측)

    세 지평 전부에 `abs_move_pct` 키가 존재한다(존재부터 예측한다 — README 규약):

      5m   표본 261  적중률 54.8%  |이동폭| **0.194%**
      15m  표본 260  적중률 62.3%  |이동폭| **0.359%**
      30m  표본 259  적중률 59.8%  |이동폭| **0.538%**

    08-11에 허용된 전략은 `straddle_accumulate`(방향 중립)였고 그날 적중률 열은 **틀린 질문에
    답했다** — 스트래들은 어느 쪽으로든 크게 움직이면 이긴다. 이제 맞는 축이 함께 인쇄된다.

    ⚠ **`|이동폭|`에 임계를 걸지 않는다** — 정상 분포를 모르고, 모르는 채 임계를 정하면 그 임계가
    곧 결론이 된다(08-05 스팟 괴리율에서 한 실수).
  상태: confirmed

- id: "2026-08-11-eD-reentry-cooldown"
  가설: |
    동일 전략 재진입 쿨다운을 만들어 두면, 실주문 배선일에 그 코드를 처음 짜지 않아도 된다.
  검증예정일: 2026-08-12
  근거: |
    08-11 ENTER 281건 / 494분(56.9%)이 분 단위로 연속했다(09:03~09:19에 09:05만 빼고 전부).
    하루 상한은 **가짓수**를 막고 같은 전략의 연속 사용은 `continuing`으로 의도적으로 면제하므로
    이 패턴을 못 막는다. `CURRENT_STATE`의 *"재진입 방지 로직 부재 — 배선 전 선행 해결"* 이
    그날 구체적 형태를 얻었다.
  예측:
    - metric: db.decisions.decision.ENTER
      expect: "수기 판정(주장) — **레버가 0(OFF)이므로 08-12 ENTER 건수가 08-11 대비 이 fix 때문에 바뀌면 안 된다**(바뀌면 OFF가 OFF가 아니다)"
      역할: 주장
  주의: |
    **기본값 0(OFF)으로 실린다.** 켜면 그날 ENTER 계열이 통째로 바뀌는데, 08-11은 레짐 엔진이
    처음 라이브로 돈 날이라 정상 진입 빈도의 기준선이 하루치뿐이다. 모르는 채 임계를 정하면
    그 임계가 곧 결론이 된다.
    켤 조건과 권고값(15분)은 `strategy_palette.enforce_reentry_cooldown` 위 주석에 있다.
    이 항목의 주장 지표가 **"아무것도 안 바뀐다"** 인 것이 요점이다 — 레버를 만든 날의 검정은
    "동작이 안 바뀌었는가"여야 한다(워치독이 08-06에 만들어져 08-11까지 안 돈 것과 반대 방향의 위험).
  판정근거: |
    (2026-08-12 확정 · 08-12 실측 — **OFF가 OFF임을 확인한 것**이다)

      strategy_gates.reentry_cooldown_minutes   **0** (레버 OFF, 종전과 같은 동작)
      ENTER                                     08-11 281건 → 08-12 **269건**

    ENTER가 −12건이지만 **이 fix로 설명되지 않는다**: 쿨다운이 0이면 그 코드 경로가 아예 안 탄다.
    분모를 맞추면(사이클 494 → 489분) 56.9% → **55.0%**로 사실상 같다. 나머지는 그날 시장과
    5분 결손(재기동 구간)의 몫이다.

    ⚠ **이 확정은 「쿨다운이 좋다」가 아니라 「레버가 실제로 내려가 있다」이다.** 실주문 배선 전에
    켤 것이고, 그 전에 며칠치 ENTER 빈도 분포를 본다 — 그때 새 항목으로 예측을 다시 적는다.
  상태: confirmed

- id: "2026-08-11-eE-kis-latency-lever-deferred"
  가설: |
    KIS 지연 레버(혼잡 시간대 위클리 폴링 감축)의 이득이 08-10 추정보다 **작다** — 그래서
    08-13으로 한 번 더 미룬다.
  검증예정일: 2026-08-13
  근거: |
    레버는 *혼잡 시간대에 위클리 폴링 주기를 늘려 옵션체인 호출을 줄이는 것*이고, 그 목적은
    **먼슬리(판단 주입력)를 지키는 것**이다. 그런데 08-11 실측에서 **먼슬리는 예산 컷에 한 번도
    안 닿았다**(§12 먼슬리 커버리지 94.3%, 예산 초과 87건에서 잘린 것은 전부 위클리).
    즉 지킬 대상이 이미 지켜지고 있다.

    그리고 22분 전멸의 원인은 **호출 총량이 아니라 타임아웃 상호작용**이었다(egw00201·백오프는
    3영업일 연속 증가 추세라 별개 문제다). 총량을 줄여도 KIS가 4초를 넘기는 분에는 같은 일이 난다.
    오늘 실린 Fix#1이 그 경로를 직접 막으므로 **먼저 그 효과를 본다.**
  예측:
    - metric: budget_exceeded.priority_cut_minutes
      expect: "== 0"
      역할: 주장
    - metric: db.book_coverage
      expect: "수기 판정(참고) — 레버 미발동이므로 위클리 커버리지가 50% 근처로 유지돼야 한다(25%로 떨어졌으면 레버가 실수로 켜진 것)"
      역할: 참고
  주의: |
    ⚠ **이것이 네 번째 유예다**(08-06 / 08-07 / 08-10 / 08-11). 유예가 표류하지 않도록 못 박는다:
    **08-13에 새 유예 사유가 없으면 켠다.** 유예하려면 그날 새로 실린 변경을 명시할 것.
    켤 값은 08-10에 실측으로 정해져 있다:
      OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS = {10: 4, 11: 4, 12: 4, 13: 4, 14: 4}
    **먼슬리는 어느 시간대에도 안 건드린다 — 판단 입력이다.**
  판정근거: |
    ⚠ **2026-08-16 확정** — 판정과 근거는 `docs/동작점검/2026-08-14_마흐디_운영점검보고서.md` §6
    (자동 §0-1 판정을 규약 E·F·H로 걸러 사람이 제안한 것)을 그대로 옮긴 것이다.
    새 판정을 만들지 않았다 — 숫자를 보고 예측을 고치는 것이 금지이므로 제안도 고치지 않는다.

    실측: `priority_cut_minutes` 38 (예측은 `== 0`) · 위클리 커버리지 45.0 / 44.7%.
    자동 판정은 「반증」을 냈지만 **축이 어긋나 있다**(규약 F): 이 항목은 *"레버의 이득이
    추정보다 작다"* 는 **유예 사유**이고, `priority_cut_minutes == 0`은 그 주장을 검정하지
    않는다. 위클리 커버리지 45%는 「레버 미발동」과 정합한다 — 반증할 것이 없다.
  상태: inconclusive

- id: "2026-08-11-eF-effective-member-denominator"
  가설: |
    확신도의 분모를 `available_member_count`에서 `effective_member_count`로 바꾸면, 매분 0점을
    내는 축이 확신도를 부풀리던 것이 사라진다.
  대가: |
    확신도 시계열이 레버를 켠 날을 경계로 **모집단이 달라진다** — 경계를 넘어 직접 비교하면 안 된다.

    ⚠ **2026-08-16 정정 — 이 항목의 방향이 반대로 적혀 있었다.** 종전 문구는 *"HIGH_CONVICTION
    건수가 줄 수 있고, 그것은 회귀가 아니라 정정이다"* 였다. **확신도는 오르기만 한다.**

    증명(측정이 아니라 산술이다 — 그래서 이 정정은 「숫자를 보고 예측을 고치는 것」이 아니다):
      `conflict_resolution.resolve_conflicts()`는 **0점 멤버를 동조·반대 어느 쪽에도 세지 않는다**
      (`if member_sign == 0.0: continue`). 따라서 `effective = 동조 + 반대`이고
      `available = effective + 중립`이다. 확신도의 base는 `동조 / 분모`이므로
        분모 available:  A / (A + D + N)
        분모 effective:  A / (A + D)      ← N ≥ 0 이므로 **항상 크거나 같다**
      중립 축이 있는 날(= 대부분의 날, `regime_hmm`이 전량 중립이므로) 확신도는 **반드시 오른다.**
      `tests/test_fusion_engine.py::test_effective_member_count_lever_changes_the_confidence_denominator_when_raised`
      가 같은 날 이미 `on.conviction_score > off.conviction_score`를 단언하고 있었다 —
      **테스트와 가설이 서로 반대를 말하고 있었고, 맞는 쪽은 테스트다.**

    이 오류가 왜 위험했나: 이대로 레버를 켜면 HIGH_CONVICTION이 **늘고**, 자동 판정은
    「34건보다 줄어야 한다」에 대해 **반증**을 찍는다. 그러면 다음 세션이 멀쩡한 레버를
    되돌리거나(08-04 p4가 경고한 그것) 「분모 전환이 반대로 작동한다」는 틀린 결론을 남긴다.
    실제로 08-12 자동 지표가 실측 91건을 이 예측 옆에 찍었고(아래 판정근거), 그날 레버가
    켜져 있었다면 그 91건은 **반증이 아니라 확인**이었다.
  검증예정일: 2026-08-24
  전제레버: use_effective_member_count
  # 08-12·08-13·08-14 **세 번** 「오늘 켤 것」으로 지정되고 세 번 다 안 켜졌다. 세 번 다
  # 유예 사유도 안 적혔다 — 즉 이 유예는 결정된 적이 없고 **잊힌 것**이다.
