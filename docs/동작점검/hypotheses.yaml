        **이것이 이 레버의 진짜 대가다** — 종전 문구는 이 자리를 "줄어도 회귀가 아니다"로 적어
        대가를 이득처럼 설명하고 있었다.
      역할: 대가
    # 2026-08-19 장후 경로 정정 — `db.decisions.strategies`는 **부모는 있고 잎이 영원히 없는** 경로였다
    # (`hypotheses.leaf_absent()`가 그날 처음 기계로 잡았다). 실재 키는 `entry_strategies`다. 이 항목은 레버 F의 **대가** 지표이고 무조건발동일이
    # 2026-08-25다 — 안 고쳤으면 대가를 못 재는 채로 켰다(규약 E 정면 위반).
    # **소급이 아니다**: `expect`의 부등식은 한 글자도 안 바꿨고, 정정 전 실측이 `None`이라
