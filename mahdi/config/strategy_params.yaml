# 마흐디 전략 파라미터 (v6 §11.3~11.4) — Phase1은 관측 전용이므로 앙상블 학습/전략
# 실행에는 연결되지 않지만, Fusion/Execution Engine(Phase2)이 동일 파일을 로드한다.
version: "1"

underlying: "KOSPI200_OPTIONS"

hybrid_mode:
  default: "ADVISORY"           # ADVISORY → CONFIRM → AUTO 순으로 순차 개방
  always_automatic:             # 모드와 무관하게 항상 자동
    - "hard_stop"
    - "circuit_breaker"
    - "forced_flat_15_10"

ensemble:
  regime_hmm:          { base_w: 0.20 }
  xgboost_tabular:      { base_w: 0.20 }
  lstm_temporal:        { base_w: 0.15 }
  options_flow:         { base_w: 0.20 }   # GEX/Vanna/Charm/VRP
  orderflow_ofi_vpin:   { base_w: 0.15 }
  flow_position:        { base_w: 0.10 }   # 수급 주체
# 고정 가중치 금지 — E9(Phase3)가 최근 성과 기반 Thompson Sampling으로 매일 재배분

strategy_gates:
  max_priority_strategies_per_regime_day: 2
  # 2026-08-11 고도화 D — 동일 전략 재진입 쿨다운(분). **0 = OFF**, 종전과 같은 동작이다.
  #
  # 위 상한은 **가짓수**(하루에 몇 개 전략을 벌이는가)를 막고, 이 값은 **빈도**(같은 전략에
  # 얼마나 자주 들어가는가)를 막는다. 08-11에 ENTER가 281건/494분(56.9%)이었고 09:03~09:19에
  # 분 단위로 연속했다 — ADVISORY라 무해했지만 실주문이었다면 16분 연속 진입이다.
  #
  # 켤 조건과 예측치는 `mahdi/fusion/strategy_palette.enforce_reentry_cooldown` 위 주석에 있다.
  # 요약: **실주문 배선 전에** 켜고, 그 전에 며칠치 ENTER 빈도 분포를 본다. 권고 시작값 15분
  # (v6 §13.3 청산 레이어의 최단 시간 스케일 — 그보다 짧으면 직전 진입의 청산 판단이 안 끝난다).
  reentry_cooldown_minutes: 0
  short_gamma_requires:
    - "highest_confidence_level"
    - "positive_gex"
    - "stable_regime"

# v6 §11.5 Instrument Selection — 전략명이 실제 종목이 되는 지점(2026-08-17 신설).
#
# **임계값이 비어 있는 것이 현재의 설계다.** 전부 null/false면 유동성 필터가 하나도 안 걸린다
# (레버 OFF와 같은 상태). 모의투자 실측 분포를 본 뒤에 채운다 — 모르는 채 임계를 정하면
# 그 임계가 곧 결론이 된다(2026-08-05 스팟 괴리율에서 한 실수).
#
# 채울 때 볼 것: `signal_decisions.selected_instruments`의 후보들에 실린 `oi`/`volume`/
# `spread_state` 분포. 며칠치가 쌓이기 전에 값을 넣지 말 것.
instrument_selection:
  liquidity:
    min_oi: null                 # 미결제약정 하한(계약). null = 안 거름
    max_spread_state: null       # 호가 스프레드 상태 상한. null = 안 거름
    require_traded_today: false  # true면 당일 거래량 0인 행사가를 후보에서 제외

weekly_0dte:
  size_cap_pct_of_normal: 0.50
  time_stop_pct_of_normal: 0.50
  charm_drift_priority_after: "14:00"

# Signal Fusion 메타 라벨링(v6 §11.2) 결정론적 프록시 임계값 — 학습된 분류기가
# 생기기 전까지(Phase 3) conviction_score를 TradePermission으로 매핑하는 데 쓴다.
# ===== 2026-08-23 — 확신도의 분모를 **실질 멤버 수**로 바꾼다 (레버 F, 다섯 번째 만에 켰다) =====
#
# `fusion/engine.py`가 `MetaLabelInputs.available_member_count`에 무엇을 넣을지 고르는 스위치다.
# `false`(기본)면 **가용 멤버 수**, `true`면 **비영 점수를 낸 멤버 수**(effective)다.
#
# ## 왜 지금 켜는가
#
# 08-11에 등재된 `2026-08-11-eF-effective-member-denominator`가 **네 번 유예**됐고
# (08-12 · 08-13 · 08-14 · 08-16), 그중 앞 세 번은 사유조차 안 적혔다. 무조건발동일 08-25를
# 이틀 앞두고 08-21 보고서가 A/B/C를 손익으로 제시했으며 사람이 **A(켠다)** 를 골랐다.
#
# ## 이 값이 무엇을 바꾸는가 — **확신도는 오른다**
#
# `resolve_conflicts()`는 0점 멤버를 동조·반대 어느 쪽에도 안 센다. 따라서
# `available = effective + 중립`이고, 확신도 base(`동조 / 분모`)는 분모가 작아지는 쪽에서
# **항상 크거나 같다.** 중립 축이 있는 날(= `regime_hmm`이 전량 중립인 대부분의 날)에는
# 반드시 오른다. **HIGH_CONVICTION과 ENTER가 느는 것은 회귀가 아니라 예측대로다.**
#
# ⚠ 그리고 이 레버는 `strategy_palette.short_gamma_requires`를 통해 **프리미엄 매도(숏감마)
# 계열의 문을 연다** — HIGH_CONVICTION이 그 계열의 필수 조건이기 때문이다. 그 계열 진입
# 건수가 이 레버의 진짜 대가이고, `hypotheses.yaml`의 같은 항목이 그것을 대가 지표로 든다.
#
# ⚠ **효력은 다음 07:30 기동부터다** — 이 파일은 프로세스당 1회만 읽힌다(`@lru_cache`).
# ⚠ **레버 E와 같은 날이 아니다.** E(`OPTION_CHAIN_SLOW_SERIES_CONGESTED_HOURS`)는 같은 날
#   2026-09-01로 유예했다. 둘 다 판단 출력을 움직이므로 같은 날 켜면 귀속이 안 갈린다.
use_effective_member_count: true

meta_label_thresholds:
  no_trade_max: 0.15       # score < 이 값 -> NO_TRADE
  small_test_max: 0.35     # 이 값 미만 -> SMALL_TEST
  standard_max: 0.65       # 이 값 미만 -> STANDARD, 이상 -> HIGH_CONVICTION
  slippage_penalty_factor: 0.7        # 최근 슬리피지 악화 시 score 배율
  gamma_regime_penalty_factor: 0.85   # 감마 레짐 불리 시 score 배율
  foreign_flow_penalty_factor: 0.8    # 외국인 수급 방향 불일치 시 score 배율
  event_proximity_penalty_minutes: 15 # 다음 이벤트까지 이 분 미만이면 아래 배율 적용
  event_proximity_penalty_factor: 0.5

# Execution Engine 6-Layer Exit(v6 §13.5) 레짐별 파라미터 — trailing/profit_target/stop은
# 진입가 대비 비율, time_stop은 분 단위.
exit_rules:
  TREND_STRONG:
    trailing: 0.015
    profit_target: null
    time_stop: 120
  RANGE_TIGHT:
    profit_target: 0.015
    stop: -0.008
    time_stop: 30
    theta_exit: true
  VOL_EXPANSION:
    stop: -0.010
    gamma_scalping: true
    time_stop: 45
  EXPIRY_DAY_0DTE:
    stop: -0.008
    time_stop: 15
    size_cap: 0.5
