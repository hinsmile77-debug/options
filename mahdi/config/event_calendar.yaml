# 마흐디 매크로 이벤트 캘린더 (v6 §11.2 메타 라벨 입력 `event_proximity_minutes`)
#
# ============================ 이 파일은 사람이 채운다 ============================
#
# `mahdi/fusion/meta_label.py`의 `classify()`는 다음 이벤트까지 남은 시간이
# `event_proximity_penalty_minutes`(기본 15분)보다 짧으면 확신도에 x0.5 페널티를 건다.
# 2026-08-05까지 이 입력은 **항상 None**이었다 — 캘린더 소스가 프로젝트에 없어서,
# FOMC·옵션만기·고용지표 직전에도 페널티가 한 번도 걸린 적이 없다.
#
# **`covered_through`가 이 방식의 핵심이다.** 수기 테이블의 실패 모드는 "안 채우는 것"이
# 아니라 **"안 채운 걸 아무도 모르는 것"** 이다. 그냥 비워두면 `events`가 빈 것과
# "오늘 이벤트가 없다"가 구분되지 않고, 시스템은 2026-08-05 이전 상태(페널티 없음)로
# 조용히 되돌아간다. 그래서 **사람이 어디까지 확인했는지를 명시적으로 선언**하고,
# 그 날짜가 지나면 관측 루프가 매일 WARNING을 남긴다(자동 리포트 §11 정성 항목에도 잡힌다).
#
# 채우는 법:
#   1. `events`에 항목을 추가한다. `when`은 **KST 로컬 시각**(`db.local_now()`와 같은 기준).
#   2. 확인을 끝낸 마지막 날짜로 `covered_through`를 옮긴다.
#   3. 관측 루프를 재시작한다 — 이 파일은 `@lru_cache`로 프로세스당 1회만 읽는다
#      (`strategy_params.yaml`과 같은 방식). 장전 07:30 기동에 자연히 반영된다.
#
# 알려진 한계(2026-08-05):
#   - `event_proximity_minutes`는 v6 정의대로 **"다음 이벤트까지 남은 분"** 이다.
#     이벤트가 **지난 직후**(가장 변동성이 큰 구간일 때가 많다)에는 페널티가 걸리지 않는다.
#     사후 구간까지 덮으려면 필드 의미를 바꿔야 하므로 별건으로 남겼다([[NEXT_TODO]]).
#
# ==============================================================================

version: "1"

# 사람이 여기까지는 확인해서 채웠다는 선언. 이 날짜가 지나면 "미기입"으로 경고한다.
# **이벤트를 추가할 때 이 값도 함께 옮길 것** — 안 옮기면 채워도 경고가 계속 뜬다.
# 2026-08-17 갱신. **매크로 일정은 확인하지 않았으므로 내일까지만 선언한다** — 아래 만기
# 3건은 실측으로 확정됐지만 `covered_through`는 만기만이 아니라 **이벤트 전체의 완전성**을
# 선언하는 값이다. 08-19 아침에 다시 경고가 뜨는 것이 정상이다(그때 매크로를 확인해서 옮긴다).
#
# ===== 2026-08-23 갱신 — 만료 **5거래일**을 끝낸다 (08-21 §1-1 / 사용자 조치 2) =====
#
# 08-19에 다시 뜬 그 경고가 **닷새를 갔다**(08-19 · 08-20 · 08-21 …). 08-21 하루에만
# `이벤트 캘린더 미기입` WARNING이 **시간당 한 번씩 아홉 번** 울렸고, 그동안 확신도의
# 이벤트 페널티(×0.5)는 **한 번도 걸리지 않았다** — 08-05 이전(배선 자체가 없던 상태)과
# 결과가 같다. 그것이 이 값을 안 옮겼을 때의 실질이다.
#
# **날짜는 사람이 정했다**(2026-08-23, 08-28까지 확인 선언). 기계가 이 값을 옮기면
# 「확인했다」를 기계가 대신 말하는 것이고, 그 순간 이 파일이 존재하는 이유가 사라진다 —
# `scripts/suggest_event_calendar.py`의 docstring이 같은 말을 적어 뒀다.
#
# ===== 2026-08-31 장후 자동조치 — **이 값을 옮기지 않았다. 옮길 자격이 없다** =====
#
# 08-31 제4부 P2-1이 「9월분으로 연장한다」를 지시했고, 그 지시가 함께 못 박은 조건이
# ⛔ **「날짜만 미는 것은 금지 — 9월 금통위 · FOMC · 미국 CPI · 고용지표를 실제로 확인해
# 항목으로 넣은 뒤 그 마지막 확인일로 옮긴다」** 였다.
#
# **자동 회차는 그 확인을 할 수 없다.** 저장소 안에 매크로 일정 소스가 없고, 밖에서 가져온
# 날짜는 이 파일이 두 곳에서 금지한 것이다:
#   · 「**날짜를 추측해서 넣지 말 것** — 틀린 시각은 페널티를 엉뚱한 분에 거는 것이고,
#     그것은 안 거는 것보다 나쁘다」(아래 events 말미)
#   · 「기계가 이 값을 옮기면 「확인했다」를 기계가 대신 말하는 것이고, **그 순간 이 파일이
#     존재하는 이유가 사라진다**」(위 08-23 절)
#
# 그래서 이 회차가 한 것은 **실측 만기 1건 추가**(2026-09-03, 아래)까지다.
# `covered_through`는 **08-28 그대로 두고, 경고가 계속 울리게 남긴다** — 그 경고가
# 「아직 사람이 확인 안 했다」는 사실이고, 지금 그것을 끄는 것이 이 파일의 실패 모드다.
#
# ⏰ **사람 몫**: 9월 금통위 · FOMC · 미국 CPI · 고용지표를 확인해 항목으로 넣고,
# 그때 이 값을 옮길 것. 그 전까지 확신도의 이벤트 페널티(x0.5)는 계속 안 걸린다
# (08-31 하루에만 「이벤트 캘린더 미기입」이 9건 울렸다).
#
# ⚠ **효력은 다음 07:30 기동부터다**(`@lru_cache`로 프로세스당 1회 로드).
covered_through: "2026-08-28"

events:
  # 아래 세 건은 2026-08-05 `option_analysis_1m`에 실제로 적재된 만기다(추정이 아니라 실측).
  # 시각 15:35는 종가 단일가 시작(`dashboard/data_source.py:_CLOSING_AUCTION_START`) —
  # 만기 Pinning(v6 §A3)이 가장 강해지는 구간의 시작점으로 잡았다.
  - when: "2026-08-06 15:35"
    name: "위클리(목) 옵션 만기"
    kind: "expiry"
  - when: "2026-08-10 15:35"
    name: "위클리(월) 옵션 만기"
    kind: "expiry"
  - when: "2026-08-13 15:35"
    name: "먼슬리 옵션 만기(8월물)"
    kind: "expiry"

  # ↓ 2026-08-17 추가. 출처는 위와 같다 — `option_analysis_1m.expiry` 실측이며 추정이 아니다.
  #   `uv run python scripts/suggest_event_calendar.py`가 이 블록을 만들어 준다.
  #
  #   **08-18이 화요일인 것이 이 파일이 수기인 이유다.** 08-15 광복절이 토요일이라 08-17(월)이
  #   대체공휴일이 되면서 위클리(월) 만기가 하루 밀렸다. "매주 월·목"이라는 주기 규칙으로는
  #   절대 나오지 않는 날짜이고, 이 저장소는 같은 형태로 이미 다쳤다(2026-08-11 북 선택 역전,
  #   `features/options_intel.py` "위클리는 늘 먼슬리보다 가깝다"는 전제가 깨진 사건).
  - when: "2026-08-18 15:35"
    name: "위클리(월→화, 대체공휴일 이월) 옵션 만기"
    kind: "expiry"
  - when: "2026-08-20 15:35"
    name: "위클리(목) 옵션 만기"
    kind: "expiry"
  # ↓ 2026-08-23 추가. 출처는 위와 같다 — **추정이 아니라 실측**이다.
  #   2026-08-21 사이드카(`auto/2026-08-21_지표.json`)의 `db.book_coverage`가 그날 실제로
  #   폴링한 세 북의 만기를 그대로 적어 뒀다:
  #
  #       regular      2026-09-10   (아래 이미 등재돼 있다)
  #       weekly_mon   2026-08-24
  #       weekly_thu   2026-08-27
  #
  #   즉 두 위클리 만기는 08-21에 이미 브로커가 알려준 값이고, 주기 규칙으로 지어낸 날짜가
  #   아니다. 08-18이 화요일이었던 것(대체공휴일 이월)이 이 구분이 중요한 이유다.
  - when: "2026-08-24 15:35"
    name: "위클리(월) 옵션 만기"
    kind: "expiry"
  - when: "2026-08-27 15:35"
    name: "위클리(목) 옵션 만기"
    kind: "expiry"

  # `covered_through`(08-28)보다 뒤에 있어도 된다 — 목록의 끝과 신뢰의 끝은 다르다.
  - when: "2026-09-10 15:35"
    name: "먼슬리 옵션 만기(9월물)"
    kind: "expiry"

  # ===== 2026-08-31 추가 (08-31 §1-4 / 제4부 P2-1) — **실측분만 넣는다** =====
  #
  # 출처는 위 08-23 블록과 같다 — 08-31 사이드카(`auto/2026-08-31_지표.json`)의
  # `db.book_coverage`가 그날 실제로 폴링한 세 북의 만기를 그대로 적어 뒀다:
  #
  #     regular      2026-09-10   (위에 이미 등재돼 있다)
  #     weekly_mon   2026-08-31   (오늘 만기 — 지났다)
  #     weekly_thu   2026-09-03   ← 아래
  #
  # **추정이 아니라 브로커가 알려준 값이다.** 08-18이 화요일이었던 것(대체공휴일 이월)이
  # 「매주 월·목」 주기 규칙을 못 믿는 이유이고, 그래서 실측만 넣는다.
  #
  # ⚠ **위클리(월)의 다음 만기는 아직 안 넣었다** — 08-31 만기가 오늘 끝나 북이 롤오버되므로
  # 그 값은 **다음 거래일 사이드카에 처음 나타난다.** 지금 넣으면 그것이 곧 추측이다.
  - when: "2026-09-03 15:35"
    name: "위클리(목) 옵션 만기"
    kind: "expiry"

  # ↓ 여기에 매크로 이벤트를 추가할 것. **날짜를 추측해서 넣지 말 것** —
  #   틀린 시각은 페널티를 엉뚱한 분에 거는 것이고, 그것은 안 거는 것보다 나쁘다.
  #   예시 형식(실제 일정 확인 후 사용):
  #   - when: "2026-08-19 03:00"
  #     name: "FOMC 성명"
  #     kind: "fomc"
  #   - when: "2026-09-01 08:00"
  #     name: "미 고용지표"
  #     kind: "us_macro"
