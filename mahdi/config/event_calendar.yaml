# 마흐디 매크로 이벤트 캘린더 (v6 §11.2 메타 라벨 입력 `event_proximity_minutes`)
#
# ============================ 이 파일은 사람이 채운다 ============================
#
# `mahdi/fusion/meta_label.py`의 `classify()`는 다음 이벤트까지 남은 시간이
# `event_proximity_penalty_minutes`(기본 15분)보다 짧으면 확신도에 x0.5 페널티를 건다.
# 2026-08-05까지 이 입력은 **항상 None**이었다 — 캘린더 소스가 프로젝트에 없어서,
# FOMC·옵션만기·고용지표 직전에도 페널티가 한 번도 걸린 적이 없다.
#
# **`covered_through`가 이 방식의 핵심이다.** 수기 테이블의 실패 모드는 "안 채우는 것"이
# 아니라 **"안 채운 걸 아무도 모르는 것"** 이다. 그냥 비워두면 `events`가 빈 것과
# "오늘 이벤트가 없다"가 구분되지 않고, 시스템은 2026-08-05 이전 상태(페널티 없음)로
# 조용히 되돌아간다. 그래서 **사람이 어디까지 확인했는지를 명시적으로 선언**하고,
# 그 날짜가 지나면 관측 루프가 매일 WARNING을 남긴다(자동 리포트 §11 정성 항목에도 잡힌다).
#
# 채우는 법:
#   1. `events`에 항목을 추가한다. `when`은 **KST 로컬 시각**(`db.local_now()`와 같은 기준).
#   2. 확인을 끝낸 마지막 날짜로 `covered_through`를 옮긴다.
#   3. 관측 루프를 재시작한다 — 이 파일은 `@lru_cache`로 프로세스당 1회만 읽는다
#      (`strategy_params.yaml`과 같은 방식). 장전 07:30 기동에 자연히 반영된다.
#
# 알려진 한계(2026-08-05):
#   - `event_proximity_minutes`는 v6 정의대로 **"다음 이벤트까지 남은 분"** 이다.
#     이벤트가 **지난 직후**(가장 변동성이 큰 구간일 때가 많다)에는 페널티가 걸리지 않는다.
#     사후 구간까지 덮으려면 필드 의미를 바꿔야 하므로 별건으로 남겼다([[NEXT_TODO]]).
#
# ==============================================================================

version: "1"

# 사람이 여기까지는 확인해서 채웠다는 선언. 이 날짜가 지나면 "미기입"으로 경고한다.
# **이벤트를 추가할 때 이 값도 함께 옮길 것** — 안 옮기면 채워도 경고가 계속 뜬다.
covered_through: "2026-08-13"

events:
  # 아래 세 건은 2026-08-05 `option_analysis_1m`에 실제로 적재된 만기다(추정이 아니라 실측).
  # 시각 15:35는 종가 단일가 시작(`dashboard/data_source.py:_CLOSING_AUCTION_START`) —
  # 만기 Pinning(v6 §A3)이 가장 강해지는 구간의 시작점으로 잡았다.
  - when: "2026-08-06 15:35"
    name: "위클리(목) 옵션 만기"
    kind: "expiry"
  - when: "2026-08-10 15:35"
    name: "위클리(월) 옵션 만기"
    kind: "expiry"
  - when: "2026-08-13 15:35"
    name: "먼슬리 옵션 만기(8월물)"
    kind: "expiry"

  # ↓ 여기에 매크로 이벤트를 추가할 것. **날짜를 추측해서 넣지 말 것** —
  #   틀린 시각은 페널티를 엉뚱한 분에 거는 것이고, 그것은 안 거는 것보다 나쁘다.
  #   예시 형식(실제 일정 확인 후 사용):
  #   - when: "2026-08-19 03:00"
  #     name: "FOMC 성명"
  #     kind: "fomc"
  #   - when: "2026-09-01 08:00"
  #     name: "미 고용지표"
  #     kind: "us_macro"
