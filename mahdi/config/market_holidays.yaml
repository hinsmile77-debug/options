# 마흐디 휴장일 달력 — "오늘 시장이 열리는가" (2026-08-17 2차 신설)
#
# ============================ 이 파일은 사람이 채운다 ============================
#
# ## 왜 생겼는가
#
# 2026-08-15(토) 07:40:02, 워치독이 `missing`을 보고 **토요일에 시스템 전체를 부팅했다.**
# 장전 기동 작업은 월~금 트리거라 안 떴는데, 워치독의 감시 창(`liveness.in_watch_window`)이
# **시각만 보고 요일도 휴장일도 몰라서** 대신 띄운 것이다. 08-16(일)에도 같은 일이 반복됐고,
# 두 날 모두 재기동 상한 3회를 채운 뒤 `ALERT_ONLY`를 각각 94줄·113줄 쏟았다.
#
# 08-17(광복절 대체공휴일)은 더 조용하게 나빴다 — 장전 기동이 **정상적으로** 떠서 종일 돌았다.
#
# 대가는 재기동이 아니라 **DB 오염**이었다(`option_analysis_1m` 기준):
#
#     2026-08-13 목(영업)  9,194행  IV 고유값 3,040
#     2026-08-17 월(휴장)  9,640행  IV 고유값    30   ← 값이 얼어붙은 하루가 영업일보다 많다
#
# 행 수로는 구분이 안 된다. 학습·백테스트가 이 하루를 거래일로 읽는다.
#
# ## 주말은 여기 안 적는다
#
# `market_calendar.is_weekend()`가 계산으로 판정한다. 이 파일은 **평일인데 안 여는 날**만 담는다.
# 주말을 여기 적기 시작하면 매년 104줄이 늘고, 그 줄을 안 채운 해가 조용히 생긴다.
#
# ## `covered_through`가 이 방식의 핵심이다 (event_calendar.yaml과 같은 규약)
#
# 수기 테이블의 실패 모드는 "안 채우는 것"이 아니라 **"안 채운 걸 아무도 모르는 것"** 이다.
# 그래서 사람이 어디까지 확인했는지를 선언하고, 그 날짜가 지나면 장전 기동이 매일 크게 경고한다
# (`scripts/check_trading_day.py`).
#
# ## 미등재는 「거래일」로 본다 — 이 방향이 규약이다
#
# 오류의 비용이 **비대칭**이기 때문이다:
#
#   빠뜨린 휴장일  → 휴장일에 시스템이 뜬다. 오늘까지의 상태와 같고, 다음날 데이터로 잡힌다.
#   잘못 넣은 날짜 → **거래일에 시스템이 안 뜬다.** 그날 데이터가 통째로 없고 워치독도 조용하다.
#
# 후자가 훨씬 비싸다. 그래서 **확신이 없는 날짜는 넣지 않는다** — 아래 후보 목록처럼 주석으로
# 남겨두고, KRX 공식 휴장일 안내로 확인한 뒤에만 `holidays`로 옮긴다.
#
# 잘못 넣은 날짜가 조용하지 않도록 세 곳이 함께 말한다: 장전 기동 콘솔, `watchdog.log`(10분에
# 한 줄), COCKPIT "워치독 판정 신선도" 배지.
#
# 채우는 법:
#   1. KRX 공식 휴장일 안내로 확인한다(추측 금지 — 대체공휴일 규칙과 음력 명절은 매년 다르다).
#   2. `holidays`에 `date`/`name`을 추가한다.
#   3. 확인을 끝낸 마지막 날짜로 `covered_through`를 옮긴다.
#
# ==============================================================================

version: "1"

# 사람이 여기까지는 확인해서 채웠다는 선언. 이 날짜를 지나면 장전 기동이 경고한다.
#
# **2026-08-17까지만 선언한다.** 아래 확정 1건은 이 저장소가 자체 실측으로 확인한 날짜지만
# (`config/event_calendar.yaml`, `data/db.py`, `features/options_intel.py`가 모두 이 대체공휴일을
# 근거로 만기 이월을 기록하고 있다), 그 뒤의 휴장일은 **아직 사람이 확인하지 않았다.**
# 08-18 아침부터 경고가 뜨는 것이 정상이다 — 그때 KRX 안내로 확인해서 옮긴다.
covered_through: "2026-08-17"

holidays:
  # 제헌절은 **매년 07-17**에 돌아온다 — 위 08-17 같은 대체공휴일과 달리 날짜가 고정이다.
  # 내년 달력을 채울 때 이 줄을 빠뜨리지 말 것(2008년에 공휴일에서 빠졌다가 되살아난 날이라
  # 오래된 기억이나 옛 달력을 따라가면 그대로 놓친다 — 2026-08-17에 실제로 그렇게 놓쳤다).
  - date: "2026-07-17"
    name: "제헌절"

  # 2026-08-15 광복절이 **토요일**이라 08-17(월)이 대체공휴일이 됐다. 이 저장소가 그 사실을
  # 이미 네 곳에 적고 있다(위클리(월) 만기가 08-18 화요일로 밀린 근거) — 추정이 아니다.
  - date: "2026-08-17"
    name: "광복절 대체공휴일"

# ===== 미확인 후보 — KRX 공식 안내로 확인한 뒤 위 `holidays`로 옮길 것 =====
#
# ⚠ 아래는 **확인되지 않았다.** 그대로 옮기지 말 것 — 하루라도 틀리면 그날 데이터가 통째로
#   사라진다(위 "미등재는 거래일로 본다" 절의 비대칭). 대체공휴일 지정과 음력 명절은 해마다
#   관보로 확정되고, 임시공휴일은 연중에 추가된다.
#
#   - "2026-09-24" 추석 연휴
#   - "2026-09-25" 추석
#   - "2026-09-26" 추석 연휴          ← 토요일일 수 있다(그러면 등재 불필요)
#   - "2026-10-05" 개천절 대체공휴일   ← 10-03이 토요일인 경우
#   - "2026-10-09" 한글날
#   - "2026-12-25" 성탄절
#   - "2026-12-31" 연말 휴장일        ← KRX 고유(공휴일이 아니라 거래소 휴장)
#
# ⚠ 근로자의날(05-01)은 공휴일이 아니지만 **KRX는 휴장한다.** 내년 달력을 채울 때 빠뜨리기 쉽다.
#
# ===== 데이터가 못 잡는 휴장일이 있다 (2026-08-17 3차에서 실제로 겪음) =====
#
# 07-17(제헌절)은 `option_analysis_1m`의 「IV 고유값이 얼어 있는 날」 스캔으로 **못 잡았다.**
# 그날은 수집기가 08:00에 멈춰 장중 데이터가 아예 없었고(209행 전부 장전), 장전에는 거래일에도
# IV가 거의 안 움직이므로 휴장일 신호와 구분되지 않는다.
#
# **관측이 짧았던 날은 데이터로 판정할 수 없다.** 달력을 사후에 데이터로 검산하려 들지 말고,
# 그 반대로 — 달력이 먼저고 데이터는 그 결과다.
